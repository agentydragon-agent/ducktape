[project]
name = "editor-agent-runtime"
version = "0.1.0"
description = "Container-side utilities for editor agent"
requires-python = ">=3.12"
dependencies = [
    "agent-pkg-runtime",
    "cli-util",
    "typer>=0.9",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
mypy_path = "mcp_utils/src:cli_util/src:agent_pkg/runtime/src"
