[project]
name = "editor-agent-runtime"
version = "0.1.0"
description = "Container-side utilities for editor agent"
requires-python = ">=3.13"
dependencies = [
    "agent-pkg-runtime",
    "cli-util",
    "typer>=0.9",
]

[tool.uv.sources]
agent-pkg-runtime = { workspace = true }
cli-util = { workspace = true }

[project.scripts]
editor-submit = "editor_agent_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_agent_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/editor_agent_runtime/docs" = "editor_agent_runtime/docs"
