[project]
name = "editor-agent"
version = "0.1.0"
description = "Host-side orchestration for editor agent"
requires-python = ">=3.13"
dependencies = [
    "editor-agent-runtime",
    "agent-pkg-host",
    "agent-core",
    "mcp-infra",
    "net-util",
    "openai-utils",
    "aiodocker",
    "typer>=0.9",
    "cli-util",
]

[project.optional-dependencies]
dev = [
    "agent-core-testing",
]

[tool.uv.sources]
editor-agent-runtime = { workspace = true }
agent-pkg-host = { workspace = true }
agent-core = { workspace = true }
agent-core-testing = { workspace = true }
mcp-infra = { workspace = true }
net-util = { workspace = true }
openai-utils = { workspace = true }
cli-util = { workspace = true }

[project.scripts]
adgn-editor-docker = "editor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/editor_agent/definition" = "editor_agent/definition"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
check_untyped_defs = true
mypy_path = "editor_agent/runtime/src:mcp_utils/src:cli_util/src:agent_pkg/runtime/src:mcp_infra/src:agent_core/src:openai_utils/src:agent_pkg/host/src"
