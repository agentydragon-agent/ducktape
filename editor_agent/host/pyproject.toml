[project]
name = "editor-agent"
version = "0.1.0"
description = "Host-side orchestration for editor agent"
requires-python = ">=3.12"
dependencies = [
    "editor-agent-runtime",
    "agent-pkg-host",
    "agent-core",
    "mcp-infra",
    "net-util",
    "openai-utils",
    "aiodocker",
    "typer>=0.9",
    "cli-util",
]

[project.scripts]
adgn-editor-docker = "editor_agent.cli:main"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
mypy_path = "editor_agent/runtime/src:mcp_utils/src:cli_util/src:agent_pkg/runtime/src:mcp_infra/src:agent_core/src:openai_utils/src:agent_pkg/host/src"
