[project]
name = "editor-agent"
version = "0.1.0"
description = "Host-side orchestration for editor agent"
requires-python = ">=3.13"
dependencies = [
    "editor-agent-runtime",
    "agent-pkg-host",
    "agent-core",
    "mcp-infra",
    "net-util",
    "openai-utils",
    "aiodocker",
    "typer>=0.9",
    "cli-util",
]

[project.scripts]
adgn-editor-docker = "editor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/editor_agent/definition" = "editor_agent/definition"
