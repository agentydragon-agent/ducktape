{{- if .Values.secretGenerator.harbor.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" . }}-harbor-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-ducktape.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "vault-ducktape.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-generator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "vault-ducktape.serviceAccountName" . }}-secret-generator
      containers:
      - name: generate-harbor-secret
        image: hashicorp/vault:1.17.2
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Checking if Harbor secrets exist..."
          
          # Check if client secret already exists
          CLIENT_SECRET_EXISTS=$(vault kv get -field=client-secret kv/harbor 2>/dev/null || echo "")
          ADMIN_PASSWORD_EXISTS=$(vault kv get -field=admin-password kv/harbor 2>/dev/null || echo "")
          
          # Generate client secret if not exists
          if [ -z "$CLIENT_SECRET_EXISTS" ]; then
            echo "Generating new Harbor OIDC client secret..."
            CLIENT_SECRET=$(head -c {{ .Values.secretGenerator.harbor.secretLength | default 32 }} /dev/urandom | base64 | tr -d '/+' | tr -d '=')
          else
            echo "Harbor OIDC client secret already exists"
            CLIENT_SECRET="$CLIENT_SECRET_EXISTS"
          fi
          
          # Generate admin password if not exists
          if [ -z "$ADMIN_PASSWORD_EXISTS" ]; then
            echo "Generating new Harbor admin password..."
            ADMIN_PASSWORD=$(head -c {{ .Values.secretGenerator.harbor.secretLength | default 32 }} /dev/urandom | base64 | tr -d '/+' | tr -d '=')
          else
            echo "Harbor admin password already exists"
            ADMIN_PASSWORD="$ADMIN_PASSWORD_EXISTS"
          fi
          
          # Store both secrets in Vault
          vault kv put kv/harbor client-secret="$CLIENT_SECRET" admin-password="$ADMIN_PASSWORD"
          
          echo "Harbor secrets generated and stored in Vault"
        env:
        - name: VAULT_ADDR
          value: "https://{{ include "common.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8200"
        - name: VAULT_CACERT
          value: "/etc/vault-tls/ca.crt"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "common.fullname" . }}-root-token
              key: root-token
        volumeMounts:
        - name: vault-tls
          mountPath: /etc/vault-tls
          readOnly: true
      volumes:
      - name: vault-tls
        secret:
          secretName: {{ include "common.fullname" . }}-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vault-ducktape.serviceAccountName" . }}-secret-generator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault-ducktape.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
{{- end }}