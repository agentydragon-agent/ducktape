# TODO: This job only runs on Helm install/upgrade, not when secrets change in Vault.
# Future improvements:
# 1. ArgoCD/Flux to trigger reconciliation when ESO updates secrets
# 2. Kyverno to create job when Secret changes  
# 3. CronJob for periodic reconciliation
# 4. Webhook receiver that ESO calls after sync
# For now: Run `helm upgrade harbor-setup k8s/helm/harbor-setup/` after Vault changes
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: harbor
    component: harbor-config
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300  # 5 minute timeout
  template:
    metadata:
      labels:
        app: harbor
        component: harbor-config
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-database
        image: postgres:15
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h harbor-database -p 5432 -U postgres; do
            echo "PostgreSQL is not ready yet..."
            sleep 5
          done
          echo "PostgreSQL is ready"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-database
              key: POSTGRES_PASSWORD
      containers:
      - name: configure-harbor
        image: python:3.12-slim
        command: ["/bin/sh", "/scripts/configure-harbor.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-database
              key: POSTGRES_PASSWORD
        - name: HARBOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: HARBOR_ADMIN_PASSWORD
        - name: HARBOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: OIDC_CLIENT_SECRET
      volumes:
      - name: scripts
        configMap:
          name: harbor-config-scripts
          defaultMode: 0755