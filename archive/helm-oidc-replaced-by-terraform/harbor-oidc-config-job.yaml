{{- if .Values.oidc.useExternalSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "harbor.fullname" . }}-oidc-config
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "harbor.labels" . | indent 4 }}
    app.kubernetes.io/component: oidc-config
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        app: "harbor"
        app.kubernetes.io/component: oidc-config
    spec:
      restartPolicy: OnFailure
      containers:
      - name: configure-oidc
        image: curlimages/curl:8.5.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Harbor to be ready..."
          
          # Wait for Harbor core to be ready
          for i in $(seq 1 60); do
            if curl -f -s http://{{ include "harbor.core" . }}:8080/api/v2.0/ping >/dev/null; then
              echo "Harbor is ready"
              break
            fi
            echo "Waiting for Harbor... ($i/60)"
            sleep 10
          done
          
          echo "Configuring Harbor OIDC settings..."
          
          # Configure OIDC settings
          curl -X PUT -H "Content-Type: application/json" \
            -u admin:{{ .Values.harborAdminPassword }} \
            -d '{
              "auth_mode": "oidc_auth",
              "oidc_name": "{{ .Values.oidc.name }}",
              "oidc_endpoint": "{{ .Values.oidc.endpoint }}",
              "oidc_client_id": "{{ .Values.oidc.clientId }}",
              "oidc_client_secret": "'"$HARBOR_CLIENT_SECRET"'",
              "oidc_groups_claim": "{{ .Values.oidc.groupsClaim }}",
              "oidc_admin_group": "{{ .Values.oidc.adminGroup }}",
              "oidc_scope": "{{ .Values.oidc.scope }}",
              "oidc_user_claim": "{{ .Values.oidc.userClaim }}",
              "oidc_verify_cert": {{ .Values.oidc.verifySignature }},
              "oidc_auto_onboard": true
            }' \
            http://{{ include "harbor.core" . }}:8080/api/v2.0/configurations
          
          echo "Harbor OIDC configuration completed successfully"
        env:
        - name: HARBOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.oidc.externalSecretName }}
              key: {{ .Values.oidc.externalSecretKey }}
{{- end }}