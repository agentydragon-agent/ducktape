# Prettier configuration
# https://prettier.io/docs/en/options.html

printWidth: 120
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: es5
bracketSpacing: true

# Svelte-specific
plugins:
  - prettier-plugin-svelte

overrides:
  - files: "*.svelte"
    options:
      parser: svelte
