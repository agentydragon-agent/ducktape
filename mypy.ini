[mypy]
python_version = 3.13
# Allow missing imports from external packages
# Bazel's rules_mypy may not have all transitive deps available
ignore_missing_imports = True
# Disabled - causes noise from third-party packages returning Any
warn_return_any = False
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
# Only report errors in explicitly passed files, not transitively checked modules
# This prevents noise from external packages in Bazel builds
follow_imports = silent

# Source paths for workspace packages (used for non-Bazel runs)
# Bazel's rules_mypy sets MYPYPATH automatically from target deps
mypy_path = adgn/src:adgn:openai_utils/src:agent_core/src:agent_server/src:cli_util/src:net_util/src:mcp_infra/src:mcp_utils/src:props/src:agent_pkg/host/src:agent_pkg/runtime/src:editor_agent/host/src:editor_agent/runtime/src:agent_runtimes/critic_util/src:agent_runtimes/clustering_util/src:agent_runtimes/grader_util/src:agent_runtimes/props_agent_util/src:git_commit_ai/src

# SQLAlchemy plugin disabled - requires complex mypy_cli setup with rules_mypy
# Enable for local non-Bazel mypy runs if needed
# plugins = sqlalchemy.ext.mypy.plugin

# Exclude only test fixtures and testdata within packages
# Also exclude Alembic migrations (auto-generated boilerplate)
exclude = /third_party/|/testdata/|/fixtures/|/vendor/|/migrations/

# Per-module overrides for test data
[mypy-tests.agent.testdata.approval_policy.*]
ignore_errors = True

[mypy-*.testdata.*]
ignore_errors = True

[mypy-adgn.third_party.*]
ignore_errors = True

# Ignore type errors in external pip packages (checked via Bazel)
[mypy-pygments.*]
ignore_errors = True

[mypy-rich.*]
ignore_errors = True

[mypy-structlog.*]
ignore_errors = True

[mypy-colorama.*]
ignore_errors = True

[mypy-IPython.*]
ignore_errors = True

[mypy-ipywidgets.*]
ignore_errors = True

[mypy-attr.*]
ignore_errors = True

[mypy-twisted.*]
ignore_errors = True

[mypy-zope.*]
ignore_errors = True

[mypy-better_exceptions.*]
ignore_errors = True

[mypy-aiodocker.*]
ignore_errors = True

[mypy-aiohttp.*]
ignore_errors = True

[mypy-rpds.*]
ignore_errors = True

# statsmodels has "duplicate module" issues - skip entirely
[mypy-statsmodels.*]
ignore_errors = True
follow_imports = skip

# numpy stubs have overload-overlap issues
[mypy-numpy.*]
ignore_errors = True

# pandas stubs have enum membership issues
[mypy-pandas.*]
ignore_errors = True
