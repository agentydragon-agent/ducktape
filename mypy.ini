[mypy]
python_version = 3.12
ignore_missing_imports = False
warn_return_any = True
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True

# Source paths for workspace packages
mypy_path = adgn/src:adgn:openai_utils/src:agent_core/src:agent_server/src:cli_util/src:net_util/src:mcp_infra/src:props/src:agent_runtimes/agent_container_util/src:agent_runtimes/critic_util/src:agent_runtimes/editor_util/src:agent_runtimes/clustering_util/src:agent_runtimes/critic_dev_util/src:agent_runtimes/grader_util/src:agent_runtimes/props_agent_util/src
plugins = sqlalchemy.ext.mypy.plugin

# Exclude only test fixtures and testdata within packages
# Also exclude Alembic migrations (auto-generated boilerplate)
exclude = /third_party/|/testdata/|/fixtures/|/vendor/|/migrations/

# Per-module overrides for test data
[mypy-tests.agent.testdata.approval_policy.*]
ignore_errors = True

[mypy-*.testdata.*]
ignore_errors = True

[mypy-adgn.third_party.*]
ignore_errors = True
