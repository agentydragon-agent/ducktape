[mypy]
python_version = 3.12
warn_return_any = true
check_untyped_defs = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# All package src directories for import resolution
mypy_path = adgn/src:agent_core/src:agent_pkg/host/src:agent_pkg/runtime/src:agent_server/src:cli_util/src:difftree/src:editor_agent/host/src:editor_agent/runtime/src:ember/src:git_commit_ai/src:gnome-terminal-profile-switcher/src:mcp_infra/src:mcp_utils/src:net_util/src:openai_utils/src:props/backend/src:props/core/src:py_detectors/src:rspcache/src:sandboxed_jupyter/src:tana/src:wt/src

# Experimental packages - relaxed checking
[mypy-cotrl.*]
ignore_missing_imports = true

[mypy-claude_history.*]
ignore_missing_imports = true

# Test fixtures - ignore errors
[mypy-tests.detectors.fixtures.*]
ignore_errors = true
