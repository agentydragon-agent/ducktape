[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = True
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True

# Source path for adgn package (primary focus)
# Include adgn (not adgn/tests) so that "from tests.support..." resolves correctly
mypy_path = adgn/src:adgn
plugins = sqlalchemy.ext.mypy.plugin

# Exclude only test fixtures, specimens, and testdata within packages
exclude = /props/specimens/|/third_party/|/testdata/|/fixtures/|/vendor/

# Per-module overrides for test data
[mypy-tests.agent.testdata.approval_policy.*]
ignore_errors = True

[mypy-*.testdata.*]
ignore_errors = True

[mypy-adgn.third_party.*]
ignore_errors = True
