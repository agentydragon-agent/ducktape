namespace:
  create: true
  name: ember-objectstore

image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-10-02T08-27-29Z
  pullPolicy: IfNotPresent

console:
  enabled: false
  servicePort: 9001

service:
  type: ClusterIP
  port: 9000
  annotations: {}

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: homelab-ca-issuer
  host: objectstore.k3s.agentydragon.com
  tlsSecret: objectstore-tls

persistence:
  enabled: true
  existingClaim: ""
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 20Gi

credentials:
  rootSecretName: minio-ember-root
  rootUserKey: root-user
  rootPasswordKey: root-password

tenant:
  bucketName: ""
  policyName: ""
  accessSecretName: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key
  secretNamespace: ember

bucketJob:
  enabled: true
  image:
    repository: quay.io/minio/mc
    tag: RELEASE.2024-10-02T08-27-29Z
    pullPolicy: IfNotPresent
  backoffLimit: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
affinity: {}
tolerations: []

sealedSecrets:
  root:
    enabled: false
    name: minio-ember-root
    encryptedData: {}
  accessPrimary:
    enabled: false
    name: ember-objectstore-credentials
    namespace: ember-objectstore
    encryptedData: {}
