apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minio-ember.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "minio-ember.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "minio-ember.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio-ember.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "minio-ember.serviceAccountName" . }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.console.servicePort }}"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_VOLUMES
              value: /data
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.rootSecretName }}
                  key: {{ .Values.credentials.rootUserKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.rootSecretName }}
                  key: {{ .Values.credentials.rootPasswordKey }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "minio-ember.fullname" . }}-data{{ end }}
{{- else }}
          emptyDir: {}
{{- end }}
