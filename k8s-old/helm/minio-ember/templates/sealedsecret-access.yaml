{{- if and .Values.sealedSecrets.accessPrimary.enabled (gt (len .Values.sealedSecrets.accessPrimary.encryptedData) 0) }}
{{- $annotations := dict -}}
{{- $targetNs := .Values.tenant.secretNamespace | default "" -}}
{{- if $targetNs }}
{{- $_ := set $annotations "reflector.v1.k8s.emberstack.com/reflection-allowed" "true" -}}
{{- $_ := set $annotations "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces" $targetNs -}}
{{- $_ := set $annotations "reflector.v1.k8s.emberstack.com/reflection-auto-enabled" "true" -}}
{{- end }}
{{ include "common.sealedSecret" (dict
  "context" .
  "namespace" (.Values.sealedSecrets.accessPrimary.namespace | default .Values.namespace.name)
  "name" (.Values.sealedSecrets.accessPrimary.name | default (include "minio-ember.accessSecretName" .))
  "encryptedData" .Values.sealedSecrets.accessPrimary.encryptedData
  "component" "storage"
  "annotations" $annotations
) }}
{{- end }}
