local_regulation_by_location:
  san_francisco_ca:
    property_tax_regime: san_francisco_secured_property_tax
    default_tax_regimes:
      - california_prop13
      - california_transfer_tax
      - federal_mortgage_interest
      - federal_capital_gains
      - california_income_tax
      - san_francisco_secured_property_tax
      - san_francisco_transfer_tax
    property_tax_annual_pct: 1.18
    local_transfer_tax_pct: 0
    special_assessment_annual_usd: 0
    notes: San Francisco secured property-tax default used by the consolidated house model.
  vallejo_ca:
    property_tax_regime: vallejo_property_tax
    default_tax_regimes:
      - california_prop13
      - california_transfer_tax
      - federal_mortgage_interest
      - federal_capital_gains
      - california_income_tax
      - vallejo_property_tax
    property_tax_annual_pct: 1.1
    local_transfer_tax_pct: 0
    special_assessment_annual_usd: 0
    notes: Vallejo mainland property-tax default around 1.1%.
  mare_island_vallejo_ca:
    property_tax_regime: mare_island_special_assessments
    default_tax_regimes:
      - california_prop13
      - california_transfer_tax
      - federal_mortgage_interest
      - federal_capital_gains
      - california_income_tax
      - mare_island_special_assessments
    property_tax_annual_pct: 2.4
    local_transfer_tax_pct: 0
    special_assessment_annual_usd: 0
    notes: Mare Island default includes high local special assessments at roughly 2.4%.
