provider_config_path: fixture_exogenous_provider.yaml
horizon_months: 12
rollout_seed_start: 1301
rollout_count: 512
required_level_series:
  - inflation
  - sp500
required_private_equity_issuers:
  - private_company_a
level_checks:
  - series_id: inflation
    initial_value: 330.0
    ratio_percentile_ranges:
      - month: 12
        lower_percentile: 1
        upper_percentile: 99
        lower: 0.99
        upper: 1.06
  - series_id: sp500
    initial_value: 7000.0
    ratio_percentile_ranges:
      - month: 12
        lower_percentile: 1
        upper_percentile: 99
        lower: 0.72
        upper: 1.5
event_checks:
  - issuer_id: private_company_a
    active_count_percentile_ranges:
      - lower_percentile: 50
        upper_percentile: 99
        lower: 1
        upper: 5
private_equity_protocol_checks:
  - issuer_id: private_company_a
    allowed_regime_codes: [1]
    allowed_event_kind_codes: [0, 1]
