[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgn"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.18.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  'click',
  'GitPython',
  'psutil',
  'platformdirs',
  'colorama',
  'pydantic',
  'PyYAML',
  'PyGithub>=1.77',
  'pygit2>=1.9.0',
  'tabulate',
  'watchdog',
  'pluggy>=1.3.0',
  'punq>=0.6.2',
]

[project.optional-dependencies]
# Developer tools and test dependencies
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  'pytest-mock>=3.10.0',
  'pytest-env>=1.1.3',
  "ruff>=0.5",
  "click>=8.0",
  "pygit2>=1.9",
  "pre-commit>=3.5",
  'types-colorama',
  'types-psutil',
]
typing = [
    'types-colorama',
    'types-psutil',
]
# GNOME console script deps (install when needed)
gnome = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adgn*"]

[tool.setuptools.package-data]
"adgn.tana_export" = [
  "references/*",
  "references/**/*",
  "SEARCH_README.md",
]

[tool.pytest.ini_options]
# Default timeout (seconds) for all tests via pytest-timeout
timeout = 30
timeout_method = "thread"
# Run tests in parallel using xdist by default
addopts = [
    "-n8",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=25",
    "-n=auto"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "shell: marks tests that test shell integration",
    "asyncio: marks tests as async tests",
    "real_github: tests that talk to real GitHub/network"
]
# Ensure hermetic git by default via pytest-env plugin
# These are static-safe; dynamic HOME/XDG are set by autouse fixture
# TODO: ensure in code, not here
env = [
    "GIT_CONFIG_NOSYSTEM=1",
    "GIT_CONFIG_GLOBAL=/dev/null",
]
# Use modern asyncio auto mode
asyncio_mode = "auto"
# Discover tests under the top-level tests/ directory
testpaths = ["tests"]

[project.scripts]
switch_gnome_terminal_profile = "adgn.gnome.switch_gnome_terminal_profile:run"
rspcache = "adgn.rspcache.cli:main"
wt = "wt.cli:main"
wt-install = "wt.shell.install:main"

[project.entry-points."wt.plugins"]
wt_demo = "wt.demo_plugin"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
