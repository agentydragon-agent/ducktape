[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgn"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Developer tools and test dependencies
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "pre-commit>=3.5",
]
# GNOME console script deps (install when needed)
gnome = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adgn*"]

[tool.setuptools.package-data]
"adgn.tana_export" = [
  "references/*",
  "references/**/*",
  "SEARCH_README.md",
]

[tool.pytest.ini_options]
# Default timeout (seconds) for all tests via pytest-timeout
timeout = 10
# Use modern asyncio auto mode
asyncio_mode = "auto"
# Discover tests under the top-level tests/ directory
testpaths = ["tests"]

[project.scripts]
switch_gnome_terminal_profile = "adgn.gnome.switch_gnome_terminal_profile:run"
