[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgn"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.18.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
  "click",
  "psutil",
  "platformdirs",
  "aiohttp>=3.9.0",
  "colorama",
  "PyYAML",
  "PyGithub>=1.77",
  "pygit2>=1.9.0",
  "tabulate",
  "watchdog",
  "pluggy>=1.3.0",
  "punq>=0.6.2",
  # LLM stack (merged from former adgn-llm)
  "openai>=1.40.0",
  "tenacity>=8.2.0",
  "docker>=7.0.0",
  "pandas>=2.2.0",
  "tiktoken>=0.7.0",
  "plotnine>=0.13.0",
  "claude-code-sdk<=0.0.21",
  "ipykernel>=6",
  "jupyter-mcp-server>=0.11.0",
  "jupyter-server",
  "jupyter-core",
  "structlog",
  "anthropic",
  "numpy",
  "pathspec",
  "anyio>=4.4",
  "mcp[cli]>=1.13.1",
  "jsonnet>=0.20.0",
  "requests>=2.32.5",
  "aiolimiter>=1.1.0",
  "pyhamcrest>=2.1",
  "rich>=13.0.0",
  "textual>=0.60.0",
  "canonicaljson>=1.6.0",
  "asyncpg>=0.29.0",
]

[project.optional-dependencies]
# Developer tools and test dependencies
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  'pytest-mock>=3.10.0',
  'pytest-env>=1.1.3',
  "ruff>=0.5",
  "mypy>=1.11.0",
  "click>=8.0",
  "pygit2>=1.9",
  "pre-commit>=3.5",
  'types-colorama',
  'types-psutil',
]
typing = [
    'types-colorama',
    'types-psutil',
]
# GNOME console script deps (install when needed)
gnome = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adgn*"]

[tool.setuptools.package-data]
"adgn.tana_export" = [
  "references/*",
  "references/**/*",
  "SEARCH_README.md",
]
"adgn.llm.properties" = [
  "definitions/*.md",
  "definitions/**/*.md",
  "specimens/**",
  "prompts/*.j2",
  "prompts/**/*.j2",
  "prompts/*.j2.md",
  "prompts/**/*.j2.md",
]
"adgn.llm.mini_codex.ui" = [
  "static/*",
  "static/**/*",
]
"adgn.wt.shell" = [
  "wt.sh",
]

[tool.pytest.ini_options]
# Default timeout (seconds) for all tests via pytest-timeout
timeout = 30
timeout_method = "thread"
# Run tests in parallel using xdist by default
addopts = [
    "-n8",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=25",
    "-n=auto"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "shell: marks tests that test shell integration",
    "asyncio: marks tests as async tests",
    "real_github: tests that talk to real GitHub/network",
    "live_llm: live LLM tests requiring network/API keys",
    "macos: macOS-only tests",
]
# Ensure hermetic git by default via pytest-env plugin
# These are static-safe; dynamic HOME/XDG are set by autouse fixture
# TODO: ensure in code, not here
env = [
    "GIT_CONFIG_NOSYSTEM=1",
    "GIT_CONFIG_GLOBAL=/dev/null",
]
# Use modern asyncio auto mode
asyncio_mode = "auto"
# Discover tests under the top-level tests/ directory
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[project.scripts]
switch_gnome_terminal_profile = "adgn.gnome.switch_gnome_terminal_profile:run"
rspcache = "adgn.rspcache.cli:main"
wt = "adgn.wt.cli:main"
wt-install = "adgn.wt.shell.install:main"
# LLM console scripts
adgn-sysrw = "adgn.llm.sysrw.cli:app"
adgn-mini-codex = "adgn.llm.mini_codex.cli:main"
adgn-properties = "adgn.llm.properties.cli:main"
adgn-properties2 = "adgn.llm.properties.cli_app.main:app"
git-commit-ai = "adgn.llm.git_commit_ai.cli:main"
sandbox-jupyter-mcp = "adgn.llm.mcp.sandboxed_jupyter_mcp.wrapper:main"
adgn-sandboxer = "adgn.llm.sandboxer:main"
adgn-llm-edit = "adgn.llm.llm_edit:app"
adgn-openai-probe = "adgn.llm.openai_utils.probe:main"

[project.entry-points."wt.plugins"]
wt_demo = "adgn.wt.demo_plugin"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
# Exclude specimen code from type-checking (authoring data; not production code)
# Exclude specimen code from type-checking (authoring data; not production code)
# Use a broad regex that matches both "src/..." and "adgn/src/..." paths
exclude = "(^|/)(adgn/)?src/adgn/llm/properties/specimens/.*"

# Ruff configuration
[tool.ruff]
# Extend default excludes; add specimen paths
extend-exclude = [
  "src/adgn/llm/properties/specimens/**",
  "adgn/src/adgn/llm/properties/specimens/**",
]
