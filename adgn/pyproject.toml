[project]
name = "adgn"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.18.0",
  "typer>=0.12.0",
  "typer-di>=0.1.3",
  "uvicorn>=0.30.0",
  "platformdirs",
  "aiohttp>=3.9.0",
  "PyYAML",
  "pygit2>=1.18",
  "types-pygit2>=1.15.0",
  "openai>=1.40.0",
  "tenacity>=8.2.0",
  "docker>=7.0.0",
  "aiodocker>=0.22.0",
  "pandas>=2.2.0",
  "tiktoken>=0.7.0",
  "plotnine>=0.13.0",
  "claude-code-sdk>=0.0.21,<0.1",
  "structlog",
  "anthropic",
  "pathspec",
  "anyio>=4.4",
  "mcp[cli]>=1.13.1",
  "requests>=2.32.5",
  "rich>=13.0.0",
  "unidiff>=0.7.5",
  "fastmcp>=2.13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Developer tools and test dependencies
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  'pytest-mock>=3.10.0',
  'pytest-env>=1.1.3',
  'syrupy>=4.0',  # Snapshot testing
  # UI E2E (browser) testing
  'pytest-playwright>=0.5.0',
  'playwright>=1.45.0',
  "ruff>=0.5",
  # Pin to match .pre-commit-config.yaml (v1.18.2)
  # TODO: Ensure mypy versions stay consistent across all tool configs in the repo
  "mypy==1.18.2",
  "pre-commit>=3.5",
  'types-PyYAML',
  'types-requests',
  'types-docker',
  'pandas-stubs',
  'types-Jinja2',
]
typing = [
    'types-PyYAML',
    'types-requests',
    'types-docker',
    'pandas-stubs',
    'types-Jinja2',
]
# GNOME console script deps (install when needed)
gnome = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]
matrix = [
  "mautrix>=0.20.0",
]
gepa = [
  "gepa>=0.0.22",
  "litellm>=1.0.0",
  "nest-asyncio>=1.5.0",
]

[tool.adgn.trivial-patterns]
skip-globs = ["tests/detectors/fixtures/**"]
