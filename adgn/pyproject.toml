[project]
name = "adgn"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-core",
  "agent-pkg-host",
  "agent-pkg-runtime",
  "cli-util",
  "mcp-infra",
  "net-util",
  "openai-utils",
  "pydantic>=2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.18.0",
  "typer>=0.12.0",
  "typer-di>=0.1.3",
  "uvicorn>=0.30.0",
  "platformdirs",
  "aiohttp>=3.9.0",
  "PyYAML",
  "pygit2>=1.18",
  "types-pygit2>=1.15.0",
  "openai>=1.40.0",
  "tenacity>=8.2.0",
  "docker>=7.0.0",
  "aiodocker>=0.22.0",
  "pandas>=2.2.0",
  "tiktoken>=0.7.0",
  "plotnine>=0.13.0",
  "claude-code-sdk>=0.0.21,<0.1",
  "structlog",
  "anthropic",
  "pathspec",
  "anyio>=4.4",
  "mcp[cli]>=1.13.1",
  "requests>=2.32.5",
  "rich>=13.0.0",
  "unidiff>=0.7.5",
  "fastmcp>=2.13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Developer tools and test dependencies
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  'pytest-mock>=3.10.0',
  'pytest-env>=1.1.3',
  'syrupy>=4.0',  # Snapshot testing
  # UI E2E (browser) testing
  'pytest-playwright>=0.5.0',
  'playwright>=1.45.0',
  "ruff>=0.5",
  # Agent runtimes packages (for testing container utilities)
  "editor-agent-runtime",
  # Pin to match .pre-commit-config.yaml (v1.18.2)
  # TODO: Ensure mypy versions stay consistent across all tool configs in the repo
  "mypy==1.18.2",
  "pre-commit>=3.5",
  'types-PyYAML',
  'types-requests',
  'types-docker',
  'pandas-stubs',
  'types-Jinja2',
]
typing = [
    'types-PyYAML',
    'types-requests',
    'types-docker',
    'pandas-stubs',
    'types-Jinja2',
]
# GNOME console script deps (install when needed)
gnome = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]
matrix = [
  "mautrix>=0.20.0",
]
gepa = [
  "gepa>=0.0.22",
  "litellm>=1.0.0",
  "nest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
# Default timeout (seconds) for all tests via pytest-timeout
timeout = 30
timeout_method = "thread"
# Log format with timestamps (use --log-cli-level=DEBUG to see step execution)
log_cli_format = "%(asctime)s.%(msecs)03d %(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
# Run tests in parallel using xdist by default
# NOTE: Using -n=4 instead of higher parallelism (e.g., -n=16) to avoid Docker daemon
# resource exhaustion. With 16 workers, concurrent Docker client connections and container
# operations can overwhelm the daemon, causing container.start() to hang indefinitely.
addopts = [
    "-n=4",
    "--dist=loadscope",
    "-m",
    "not live_llm",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=25",
    "-p",
    "no:pytest_playwright",
    "-p",
    "no:playwright",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end UI tests using playwright",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "shell: marks tests that test shell integration",
    "real_github: tests that talk to real GitHub/network",
    "live_llm: live LLM tests requiring network/API keys",
    "macos: macOS-only tests",
    "requires_docker: tests that require Docker to run",
    "requires_sandbox_exec: tests that require local sandbox exec capabilities",
    "requires_postgres: tests that require PostgreSQL database to run",
    "requires_production_specimens: tests that sync production specimens (slow, use -m 'not requires_production_specimens' to skip)",
]
# Ensure hermetic git by default via pytest-env plugin
# These are static-safe; dynamic HOME/XDG are set by autouse fixture
# TODO: ensure in code, not here
env = [
    "GIT_CONFIG_NOSYSTEM=1",
    "GIT_CONFIG_GLOBAL=/dev/null",
]
# Use modern asyncio auto mode for compatibility across plugins
asyncio_mode = "auto"
# For pytest-asyncio 0.25+ ensure async fixtures get per-test event loops
# instead of session-level loops, and keep behavior compatible with anyio.
asyncio_default_fixture_loop_scope = "function"
# Discover tests under the top-level tests/ directory
testpaths = ["tests"]


[tool.adgn.trivial-patterns]
skip-globs = ["tests/detectors/fixtures/**"]

[[tool.mypy.overrides]]
module = ["tests.detectors.fixtures.*"]
ignore_errors = true
