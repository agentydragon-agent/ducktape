version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: props-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: props_admin_pass
      # Note: Creates 'postgres' database by default
      # Additional databases (eval_results, eval_results_test) created via init_db.sh
    ports:
      - "5433:5432"  # Map to 5433 on host to avoid conflicts
    volumes:
      - props_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  props_data:
    name: props_eval_results_data
