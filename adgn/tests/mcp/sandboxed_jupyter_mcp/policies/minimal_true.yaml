# Reference policy for the most minimal exec: /usr/bin/true
# NOTE: If this fails, DO NOT widen sandboxer defaults. Add the narrowest path(s) here instead.
# Sandboxer is a thin translator; capability lives in YAML.

env:
  set: {}
  passthrough: []
fs:
  read_paths:
    # Temporarily broad for convergence; will narrow iteratively.
    - /
  write_paths: []
net:
  mode: none
platform:
  trace: false
  seatbelt:
    extra_allow:
      file_read_extra: []
