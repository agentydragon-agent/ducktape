[project]
name = "props-backend"
version = "0.1.0"
description = "Props dashboard backend - FastAPI server for training/evaluation metrics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "props",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.scripts]
props-backend = "props_backend.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/props_backend"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]
props = { workspace = true }
