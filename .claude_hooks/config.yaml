# TODO: Integrate with settings.py (consolidate env-based and file-based config).
otel:
  endpoint: https://alloy-otlp.allegedly.works/v1/traces
  # bearer_token: read from DUCKTAPE_OTEL_BEARER_TOKEN env var (set by env scripts).
k8s:
  server: https://api.allegedly.works:16443
  service_account: claude-code-web
  service_account_namespace: default
  namespace: claude-sandbox

pre_commit:
  auto_apply_hooks:
    - ruff-format
    - buildifier
    - shfmt
    - prettier
    - nixfmt
    - gofumpt
    - trailing-whitespace
    - end-of-file-fixer

profiles:
  default:
    idle_watchdog: true
    write_kubeconfig: false
    env_exports: |
      export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
      export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
    env_script: devinfra/secrets/cli_env.sh
    bazel_remote_proxy:
      target: remote.buildbuddy.io:443
    bazel_bes_proxy:
      target: remote.buildbuddy.io:443
    background_commands:
      - name: bazel info
        command: bazelisk info
        timeout: 300
        after_env: true
  web:
    idle_watchdog: false
    install_mkcert: true
    setup_docker: true
    env_exports: |
      export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
      export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
    env_script: devinfra/secrets/web_env.sh
    bazel_remote_proxy:
      target: remote.buildbuddy.io:443
    bazel_bes_proxy:
      target: remote.buildbuddy.io:443
    background_commands:
      - name: apt package install
        command: |
          apt-get update -qq &&
          apt-get install -y -qq libgirepository-2.0-dev libcairo2-dev libdbus-1-dev
        timeout: 300
      - name: rootfs tuning
        command: /sbin/tune2fs -m 1 /dev/vda
        timeout: 30
      - name: pre-commit setup
        command: pre-commit install --install-hooks
        timeout: 300
      - name: bazel info
        command: bazelisk info
        timeout: 300
        after_env: true

default_profiles:
  cli: default
  web: web

# Secrets are now handled by env scripts (devinfra/secrets/*.sh), configured
# per-profile via env_script. The secrets: section is no longer needed.
