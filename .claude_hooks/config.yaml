# TODO: Integrate with settings.py (consolidate env-based and file-based config).
otel:
  endpoint: https://alloy-otlp.allegedly.works/v1/traces
  # bearer_token: populated from secrets.otel_bearer_token below.
  # Authentik service account token — see cluster/k8s/authentik/app/blueprints/alloy-otlp-sso.yaml.
k8s:
  server: https://api.allegedly.works:16443
  service_account: claude-code-web
  service_account_namespace: default
  namespace: claude-sandbox

pre_commit:
  auto_apply_hooks:
    - ruff-format
    - buildifier
    - shfmt
    - prettier
    - nixfmt
    - gofumpt
    - trailing-whitespace
    - end-of-file-fixer

profiles:
  default:
    write_kubeconfig: false
    bazel_warmup: info
    env_exports: |
      export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
      export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
    env_script: devinfra/ci_env.sh
    bazel_remote_proxy:
      target: remote.buildbuddy.io:443
    bazel_bes_proxy:
      target: remote.buildbuddy.io:443
  web:
    install_mkcert: true
    install_apt_packages: true
    setup_docker: true
    bazel_warmup: info
    env_exports: |
      export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
      export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
    env_script: devinfra/ci_env.sh
    bazel_remote_proxy:
      target: remote.buildbuddy.io:443
    bazel_bes_proxy:
      target: remote.buildbuddy.io:443

default_profiles:
  cli: default
  web: web

secrets:
  k8s_token:
    kind: sops
    sops_file: secrets/claude-web-k8s-token.yaml
    key: k8s_token
  buildbuddy_api_key:
    kind: sops
    sops_file: secrets/buildbuddy.yaml
    key: buildbuddy_api_key
  github_token:
    kind: sops
    sops_file: secrets/github-pat-agentydragon-agent.yaml
    key: github_token
  otel_bearer_token:
    kind: sops
    sops_file: secrets/alloy-otlp-bearer-token.yaml
    key: token
