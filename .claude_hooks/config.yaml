# TODO: Integrate with settings.py (consolidate env-based and file-based config).
otel:
  endpoint: https://alloy-otlp.allegedly.works/v1/traces
  # auth_token comes from DUCKTAPE_CLAUDE_HOOKS_OTEL_AUTH_TOKEN env var,
  # populated by k8s_secrets below (alloy-otlp-bearer-token secret).
  # Token is an Authentik service account token — see
  # cluster/k8s/authentik/blueprints/alloy-otlp-sso.yaml for the blueprint.
  # One-time Vault provisioning: see devinfra/claude/README.md.
k8s:
  server: https://api.allegedly.works:16443
  service_account: claude-code-web
  sa_namespace: default
  namespace: claude-sandbox

k8s_secrets:
  namespace: claude-sandbox
  secrets:
    - name: github-token
      data:
        token: GITHUB_TOKEN
    - name: alloy-otlp-bearer-token
      data:
        token: DUCKTAPE_CLAUDE_HOOKS_OTEL_AUTH_TOKEN
  buildbuddy_api_key:
    secret_name: buildbuddy-api-key
    data_key: api-key
