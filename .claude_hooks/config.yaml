# TODO: Integrate with settings.py (consolidate env-based and file-based config).
otel:
  endpoint: https://alloy-otlp.allegedly.works/v1/traces
  # bearer_token: populated from k8s_secrets.otel_bearer_token below.
  # Authentik service account token — see cluster/k8s/authentik/app/blueprints/alloy-otlp-sso.yaml.
k8s:
  server: https://api.allegedly.works:16443
  service_account: claude-code-web
  service_account_namespace: default
  namespace: claude-sandbox

pre_commit:
  auto_apply_hooks:
    - ruff-format
    - buildifier
    - shfmt
    - prettier
    - nixfmt
    - gofumpt
    - trailing-whitespace
    - end-of-file-fixer

extra_env_script: |
  # Enforce-bazel-tests requires a warm Bazel workspace (bazel-ducktape symlink).
  # Disabled in Claude Code sessions; CI enforces this instead.
  export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0

sops_secrets:
  files:
    - path: secrets/buildbuddy.yaml
      mapping:
        buildbuddy_api_key: BUILDBUDDY_API_KEY

k8s_secrets:
  namespace: claude-sandbox
  secrets:
    - name: github-token
      data:
        token: GITHUB_TOKEN
  buildbuddy_api_key:
    secret_name: buildbuddy-api-key
    data_key: api-key
  otel_bearer_token:
    secret_name: alloy-otlp-bearer-token
    data_key: token
