[project]
name = "inop"
version = "0.1.0"
description = "Instruction optimizer for LLM agent prompts"
requires-python = ">=3.13"
# Local workspace deps (agent-core, mcp-infra, openai-utils) handled by Bazel deps
dependencies = [
    "aiodocker",
    "claude-code-sdk",
    "docker",
    "fastmcp",
    "matplotlib",
    "pandas",
    "pathspec",
    "plotnine",
    "pydantic>=2.0",
    "pyyaml",
    "structlog",
    "tiktoken",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inop"]
