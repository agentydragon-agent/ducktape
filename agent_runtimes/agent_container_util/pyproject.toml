[project]
name = "agent-container-util"
version = "0.1.0"
description = "Thin utilities for agent init scripts in containers"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "jinja2>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_container_util"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_container_util/docs" = "agent_container_util/docs"

[project.optional-dependencies]
typing = ["types-Jinja2"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
