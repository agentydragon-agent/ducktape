[project]
name = "editor-util"
version = "0.1.0"
description = "Utilities for editor agents in containers"
requires-python = ">=3.12"
dependencies = [
    "agent-pkg-runtime",
    "typer>=0.9",
]

[tool.uv.sources]
agent-pkg-runtime = { workspace = true }

[project.scripts]
editor-submit = "editor_util.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_util"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
# Path to workspace packages (relative to repo root where pre-commit runs)
mypy_path = "agent_pkg_runtime/src"
