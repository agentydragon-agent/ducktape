[project]
name = "agent-pkg-host"
version = "0.1.0"
description = "Host-side agent package infrastructure: image building, init runner"
requires-python = ">=3.13"
dependencies = [
    "aiodocker>=0.23",
    "fastmcp>=2.0",
    "mcp-infra",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pkg_host"]
