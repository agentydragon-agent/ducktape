[project]
name = "agent-pkg"
version = "0.1.0"
description = "Host-side agent package infrastructure: image building, init runner"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.23",
    "fastmcp>=2.0",
    "mcp-infra",
]

[tool.uv.sources]
mcp-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pkg"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
# Paths relative to repo root (where pre-commit runs mypy from)
mypy_path = "agent_pkg/src:mcp_infra/src:mcp_utils/src"
