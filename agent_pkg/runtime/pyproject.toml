[project]
name = "agent-pkg-runtime"
version = "0.1.0"
description = "Container-side utilities for agent init scripts"
requires-python = ">=3.12"
dependencies = [
    "mcp-utils",
    "fastmcp>=2.0",  # TODO: make optional (slow import)
    "jinja2>=3.0",
]

[project.optional-dependencies]
typing = ["types-Jinja2"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
# Paths relative to repo root (where pre-commit runs mypy from)
mypy_path = "mcp_utils/src:agent_pkg/runtime/src"
