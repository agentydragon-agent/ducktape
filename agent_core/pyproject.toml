[project]
name = "agent-core"
version = "0.1.0"
description = "Core agent loop machinery for LLM agents with MCP tool wiring"
requires-python = ">=3.13"
# Local workspace deps (openai-utils, agent-pkg-host, mcp-infra) handled by Bazel deps
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "rich>=13.0",
    "structlog",
    "pyhamcrest>=2.1",
]

[project.optional-dependencies]
# NOTE: agent-core-testing, mcp-infra handled by Bazel deps
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
dev = [
    "agent-core[testing]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_core/compaction_prompt.md" = "agent_core/compaction_prompt.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
addopts = "-m 'not live_openai_api and not live_anthropic_api'"
markers = [
    "live_openai_api: tests requiring OPENAI_API_KEY",
    "live_anthropic_api: tests requiring ANTHROPIC_API_KEY",
]
