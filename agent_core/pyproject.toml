[project]
name = "agent-core"
version = "0.1.0"
description = "Core agent loop machinery for LLM agents with MCP tool wiring"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "rich>=13.0",
    "structlog",
    "pyhamcrest>=2.1",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
