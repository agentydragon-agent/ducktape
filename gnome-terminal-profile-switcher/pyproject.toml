[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-terminal-profile-switcher"
version = "0.1.0"
authors = [{name = "Rai"}]
requires-python = ">=3.12"
dependencies = [
  "absl-py>=1.0.0",
  "dbus-python>=1.3.0",
  "PyGObject>=3.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gnome_terminal_profile_switcher*"]

[project.scripts]
switch_gnome_terminal_profile = "gnome_terminal_profile_switcher:main"