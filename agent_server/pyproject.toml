[project]
name = "agent-server"
version = "0.1.0"
description = "Agent server - FastAPI backend, runtime, and MCP infrastructure for LLM agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cli-util",
    "net-util",
    "mcp-infra",
    "agent-core",
    "openai-utils",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiodocker>=0.22.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.18.0",
    "fastmcp>=2.13",
    "mautrix>=0.20",
    "mcp>=1.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "platformdirs>=3.0",
]

[project.scripts]
adgn-agent-serve = "agent_server.cli:main"
agent-server-matrix-bot = "agent_server.matrix_bot:main"
agent-server-generate-frontend-code = "agent_server.scripts.generate_frontend_code:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3.0",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
    "playwright>=1.40",
    "docker>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "requires_docker: tests that require Docker to run",
    "live_llm: tests that require a live LLM API",
]

[tool.uv.sources]
cli-util = { workspace = true }
net-util = { workspace = true }
mcp-infra = { workspace = true }
agent-core = { workspace = true }
openai-utils = { workspace = true }
