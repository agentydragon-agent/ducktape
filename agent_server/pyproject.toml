[project]
name = "agent-server"
version = "0.1.0"
description = "Agent server - FastAPI backend, runtime, and MCP infrastructure for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiodocker>=0.22.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.18.0",
    "fastmcp>=2.13",
    "mautrix>=0.20",
    "mcp>=1.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3.0",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
    "playwright>=1.40",
    "docker>=7.0",
]
