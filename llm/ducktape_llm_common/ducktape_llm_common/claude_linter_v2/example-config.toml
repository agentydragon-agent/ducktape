# Claude Linter v2 Configuration File
# This file shows all available configuration options with their defaults and descriptions

# Version of the configuration format (required)
version = "2.0"

# Maximum number of errors to display in hook responses
# When Claude triggers violations, only show this many to avoid overwhelming
max_errors_to_show = 3

# Logging configuration
log_level = "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
# log_file = "/path/to/logfile.log"  # Optional: write logs to file

# ===== Access Control Rules =====
# Define path-based access control rules that apply to all tools
# Rules are evaluated in order - first match wins

[[access_control]]
path_pattern = "/etc/**"
action = "deny"
message = "System configuration files are read-only"

[[access_control]]
path_pattern = "**/.env"
action = "warn"
message = "Environment files contain secrets - be careful"

[[access_control]]
path_pattern = "**/migrations/**"
action = "warn"
message = "Database migrations should be carefully reviewed"

# ===== Repository-wide Predicate Rules =====
# These rules apply across the entire session using predicate expressions

[[repo_rules]]
predicate = "Write('/tmp/**')"
action = "allow"
reason = "Temporary files are always allowed"

[[repo_rules]]
predicate = "Edit('**/*.py') and not Edit('**/migrations/**')"
action = "allow"
reason = "Python files can be edited except migrations"

[[repo_rules]]
predicate = "Bash('rm -rf *')"
action = "deny"
reason = "Destructive commands are not allowed"

# ===== Python-specific Configuration =====

# Python tools to use (modular format)
python.tools = ["ruff", "mypy"]

# Python-specific checks (modular format)
[python.bare_except]
enabled = true
message = "Bare except clauses hide errors"

[python.hasattr]
enabled = true
message = "hasattr() usage is discouraged"

[python.getattr]
enabled = true
message = "getattr() usage is discouraged"

[python.setattr]
enabled = true
message = "setattr() usage is discouraged"

[python.barrel_init]
enabled = true
message = "Barrel __init__.py files (with imports) are discouraged"

# ===== Ruff-specific Rules (modular format) =====
[ruff.E722]
enabled = true
autofix = false
description = "bare-except"

[ruff.BLE001]
enabled = true
autofix = false
description = "blind-except"

[ruff.B009]
enabled = true
autofix = false
description = "getattr-with-constant"

[ruff.B010]
enabled = true
autofix = false
description = "setattr-with-constant"

[ruff.S113]
enabled = true
severity = "error"
description = "request-without-timeout"

# ===== Hook Behaviors =====
# Configure behavior for each hook type

[hooks.pre]
# PreToolUse hook configuration
# PreTool hooks don't have configuration - they just block or allow

[hooks.post]
# PostToolUse hook configuration
auto_fix = true  # Apply autofix after tool execution
inject_permissions = true  # Show current permissions to Claude
# Categories of fixes to apply automatically
autofix_categories = ["formatting"]  # Options: "formatting", "imports", "all"

[hooks.stop]
# Stop hook configuration (when Claude wants to end its turn)
quality_gate = true  # Prevent Claude from stopping if errors remain
max_files_to_show = 5  # Maximum number of files to show in error message
max_violations_per_file = 3  # Maximum violations to show per file

[hooks.notification]
# Notification hook configuration
send_to_dbus = true
urgency = "normal"  # Options: "low", "normal", "critical"

[hooks.subagent_stop]
# SubagentStop hook configuration
# No special configuration needed currently

# ===== Pattern-Based File Rules =====
# Define rules that apply to files matching specific patterns

[[pattern_rules]]
name = "test_files"
patterns = [
    "**/test_*.py",
    "**/*_test.py",
    "**/tests/**",
    "**/testing/**",
    "**/fixtures/**"
]
relaxed_checks = ["python.bare_except", "ruff.E722"]  # Allow bare except in tests
custom_message = "Test files have relaxed error handling rules"
enabled = true

[[pattern_rules]]
name = "migrations"
patterns = ["**/migrations/*.py"]
enforced_checks = []  # No special enforcement
relaxed_checks = ["ruff.E402"]  # Allow imports not at top in migrations
custom_message = "Migration files have special import rules"
enabled = true

[[pattern_rules]]
name = "generated_code"
patterns = ["**/*_pb2.py", "**/*_pb2_grpc.py", "**/generated/**"]
relaxed_checks = ["ALL"]  # Special value to relax all checks
custom_message = "Generated code is not linted"
enabled = true

# ===== LLM Analysis Configuration =====
[llm_analysis]
enabled = false  # Enable LLM-powered code analysis
model = "gpt-4o-mini"  # Model to use for analysis
daily_cost_limit = 5.0  # Maximum cost in USD per day
cache_results = true  # Cache analysis results

# Optional: Customize LLM prompts
# [llm_analysis.prompts]
# full_file_analysis = """Your custom prompt for full file analysis...
# Must include {file_path} and {content} placeholders."""
# 
# edit_analysis = """Your custom prompt for single edit analysis...
# Must include {file_path}, {old_string}, {new_string}, and {context} placeholders."""
# 
# multi_edit_analysis = """Your custom prompt for multiple edits...
# Must include {file_path} and {edits_summary} placeholders."""

# ===== Task Profiles =====
# Pre-defined permission profiles for common tasks

[[profiles]]
name = "refactoring"
description = "Safe refactoring operations"
predicates = [
    "Edit('**/*.py')",
    "Bash('pytest')",
    "Bash('ruff check')",
    "Bash('mypy')"
]

[[profiles]]
name = "debugging"
description = "Debugging and analysis"
predicates = [
    "Read('**')",
    "Bash('grep -r')",
    "Bash('find')",
    "Bash('pytest -v')"
]

[[profiles]]
name = "documentation"
description = "Documentation updates only"
predicates = [
    "Edit('**/*.md')",
    "Edit('**/*.rst')",
    "Write('docs/**')"
]

# ===== Session-specific Overrides =====
# These would typically be set via CLI rather than config file
# Shown here for completeness

# [session]
# session_id = "12345"  # Usually auto-generated
