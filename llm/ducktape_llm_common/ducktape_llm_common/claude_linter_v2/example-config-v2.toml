# Claude Linter v2 Clean Configuration
# This shows the new simplified configuration format with no dynamic fields

version = "2.0"
max_errors_to_show = 3

# ===== Rules Configuration =====
# All rules use the same simple structure
# Rule keys are canonical names: category.code (e.g., "python.bare_except", "ruff.E722")

[rules."python.bare_except"]
enabled = true
# blocks_pre_hook = true  # Defaults from registry if not specified
# blocks_stop_hook = true  # Defaults from registry if not specified
# message = "..."  # Defaults from registry if not specified

[rules."python.hasattr"]
enabled = true

[rules."python.getattr"]
enabled = true

[rules."python.setattr"]
enabled = true

[rules."python.barrel_init"]
enabled = true

[rules."ruff.E722"]
enabled = true

[rules."ruff.BLE001"]
enabled = true

[rules."ruff.B009"]
enabled = true

[rules."ruff.B010"]
enabled = true

[rules."ruff.S113"]
enabled = true

[rules."ruff.B006"]
enabled = true

[rules."ruff.E501"]
enabled = true
blocks_pre_hook = false  # Override default - don't block writes for long lines
blocks_stop_hook = false  # Override default - don't block completion

[rules."ruff.E402"]
enabled = true
blocks_pre_hook = false
blocks_stop_hook = false

# Custom message example
[rules."ruff.B008"]
enabled = true
message = "Function calls in defaults can cause unexpected behavior"

# ===== Python Tools =====
python_tools = ["ruff", "mypy"]

# ===== Access Control =====
[[access_control]]
paths = ["/etc/**", "/usr/**"]
tools = ["Write", "Edit", "MultiEdit"]
action = "deny"
message = "System files are read-only"

# ===== Hook Behaviors =====
[hooks.pre]
enabled = true

[hooks.post]
auto_fix = true
autofix_categories = ["formatting"]
inject_permissions = true

[hooks.stop]
quality_gate = true
max_files_to_show = 5
max_violations_per_file = 3

[hooks.notification]
send_to_dbus = true
urgency = "normal"

# ===== Pattern-Based Rules =====
[[pattern_rules]]
name = "test_files"
patterns = ["**/test_*.py", "**/*_test.py", "**/tests/**"]
relaxed_checks = ["python.bare_except", "ruff.E722"]
custom_message = "Test files have relaxed error handling rules"

[[pattern_rules]]
name = "generated_code"
patterns = ["**/*_pb2.py", "**/generated/**"]
relaxed_checks = ["ALL"]
custom_message = "Generated code is not linted"

# ===== Logging =====
log_level = "INFO"
# log_file = "/path/to/logfile.log"