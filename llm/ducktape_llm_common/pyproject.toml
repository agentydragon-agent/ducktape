[project]
name = "ducktape-llm-common"
version = "0.1.0"
description = "Common utilities, linters, and prompts for LLM development workflows"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["linter", "pre-commit", "workflow", "llm", "ai", "automation"]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
    "humanize>=4.0.0",  # for human-readable time formatting
    "platformdirs>=3.0",
    "pydantic>=2.0",
    "pygit2>=1.18.0",
    "pytimeparse>=1.1.8",  # for parsing duration strings like "2h", "30m"
    "ruff>=0.1.0",  # actual prod dependency of linter
    "pre-commit>=3.0",  # for claude-linter CLI hook
    "tomli>=2.0.0",  # for reading TOML files
    "tomli-w>=1.0.0",  # for writing TOML files
]

[project.optional-dependencies]
notifications = [
    "dbus-python>=1.2.0",  # for desktop notifications (Linux only)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "PyHamcrest>=2.1",
]
