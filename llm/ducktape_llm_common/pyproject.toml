[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ducktape-llm-common"
version = "0.1.0"
description = "Common utilities, linters, and prompts for LLM development workflows"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["linter", "pre-commit", "workflow", "llm", "ai", "automation"]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
    "platformdirs>=3.0",
    "pydantic>=2.0",
    "pygit2>=1.13.0",
    "ruff>=0.1.0",  # actual prod dependency of linter
    "pre-commit>=3.0",  # for claude-linter CLI hook
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.scripts]
check-work-urls = "ducktape_llm_common.linters.check_work_urls:main"
check-task-metadata = "ducktape_llm_common.linters.check_task_metadata:main"
fix-newlines = "ducktape_llm_common.utils.fix_newlines:main"
ducktape-version = "ducktape_llm_common.cli.version_tool:main"
claude-linter = "ducktape_llm_common.linters.claude_linter.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["ducktape_llm_common"]

[tool.hatch.build]
include = [
    "ducktape_llm_common/**/*.py",
    "ducktape_llm_common/**/*.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ducktape_llm_common",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=ducktape_llm_common --cov-report=term-missing"
norecursedirs = ["__pycache__", "*.egg", "dist", "build", ".git"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "B027",  # empty method in abstract base class
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
