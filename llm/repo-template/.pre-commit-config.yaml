exclude: ".*/testdata/.*|references/.*"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: []

  # Local hooks using ducktape-llm-common tools
  - repo: local
    hooks:
      - id: fix-newlines
        name: Fix newlines with ducktape tool
        entry: fix-newlines
        language: system
        types: [text]
        pass_filenames: true
        description: Ensure files end with exactly one newline using ducktape-llm-common
        # Note: testdata/ and references/ are already excluded by top-level exclude

      - id: check-work-urls
        name: Check work URLs
        entry: check-work-urls
        language: system
        types: [markdown]
        pass_filenames: true
        description: Validate custom work URL formats

      - id: check-task-metadata
        name: Check task metadata
        entry: check-task-metadata
        language: system
        files: '(METADATA\.yaml|TASK_GRAPH\.md)$'
        pass_filenames: true
        description: Validate task metadata files
