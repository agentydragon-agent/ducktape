[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgn-llm"
version = "0.1.0"
description = "Rai's LLM tools: mini_codex, properties, instruction optimizer, git-commit-ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rai (agentydragon)" }]
dependencies = [
  "openai>=1.40.0",
  "tenacity>=8.2.0",
  "pydantic>=2.7.0",
  "docker>=7.0.0",
  "pandas>=2.2.0",
  "tiktoken>=0.7.0",
  "plotnine>=0.13.0",
  "claude-code-sdk",
  # jupyter stdio guard deps
  "ipykernel>=6",
  "jupyter-mcp-server>=0.11.0",
  "jupyter-server",
  "jupyter-core",
  "PyYAML>=6",
  "GitPython>=3.1.43",
  # instruction optimizer deps
  "structlog",
  "anthropic",
  "numpy",
  "pathspec",
  "anyio>=4.4",
  "mcp[cli]>=1.13.1",
  "platformdirs>=4.0.0",
  "jsonnet>=0.20.0",
]

[project.scripts]
adgn-mini-codex = "adgn_llm.mini_codex.cli:main"
adgn-codex-properties = "adgn_llm.properties.cli:main"
git-commit-ai = "adgn_llm.git_commit_ai.cli:main"
sandbox-jupyter-mcp = "adgn_llm.mcp.sandboxed_jupyter_mcp.wrapper:main"
adgn-sandboxer = "adgn_llm.sandboxer:main"
adgn-instruction-optimizer = "adgn_llm.instruction_optimizer.core.optimizer:main"
adgn-mcp-docker-exec = "adgn_llm.mcp.docker_exec.server:main"
adgn-llm-edit = "adgn_llm.llm_edit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["adgn_llm*"]

[tool.setuptools.package-data]
adgn_llm = [
  "properties/definitions/*.md",
  "properties/definitions/**/*.md",
  "properties/specimens/**",
]

[project.optional-dependencies]
# Test/developer extras (not required at runtime)
 test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]
 dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

# Ruff configuration
[tool.ruff]
# Using Ruff's formatter; keep linter compatible with formatter behavior.

[tool.ruff.lint]
# Avoid formatter↔linter churn on long strings that the formatter wraps
# into adjacent literals; we accept that style here.
extend-ignore = [
  "ISC001",  # Implicit string concatenation: ignore to prevent conflicts with the formatter's wrapping
]
