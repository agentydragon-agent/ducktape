[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgn-llm"
version = "0.1.0"
description = "Rai's LLM tools: mini_codex, properties, instruction optimizer, git-commit-ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rai (agentydragon)" }]
dependencies = [
  "openai>=1.40.0",
  "tenacity>=8.2.0",
  "pydantic>=2.7.0",
  "docker>=7.0.0",
  "pandas>=2.2.0",
  "tiktoken>=0.7.0",
  "plotnine>=0.13.0",
  "claude-code-sdk<=0.0.21",
  # jupyter stdio guard deps
  "ipykernel>=6",
  "jupyter-mcp-server>=0.11.0",
  "jupyter-server",
  "jupyter-core",
  "PyYAML>=6",
  "GitPython>=3.1.43",
  "pygit2>=1.13",
  # instruction optimizer deps
  "structlog",
  "anthropic",
  "numpy",
  "pathspec",
  "anyio>=4.4",
  "mcp[cli]>=1.13.1",
  "platformdirs>=4.0.0",
  "jsonnet>=0.20.0",
  "typer>=0.12.3",
  "requests>=2.32.5",
  "aiolimiter>=1.1.0",
  "pyhamcrest>=2.1",
  "rich>=13.0.0",
  "Jinja2>=3.1",
  "httpx>=0.27.0",
  "aiosqlite>=0.18.0",
  "canonicaljson>=1.6.0",
]

[project.scripts]
adgn-sysrw = "adgn_llm.sysrw.cli:app"
adgn-mini-codex = "adgn_llm.mini_codex.cli:main"
adgn-properties = "adgn_llm.properties.cli:main"
adgn-properties2 = "adgn_llm.properties.cli_app.main:app"
git-commit-ai = "adgn_llm.git_commit_ai.cli:main"
sandbox-jupyter-mcp = "adgn_llm.mcp.sandboxed_jupyter_mcp.wrapper:main"
adgn-sandboxer = "adgn_llm.sandboxer:main"
adgn-inop = "adgn_llm.inop.core.optimizer:main"
adgn-mcp-docker-exec = "adgn_llm.mcp.docker_exec.launcher:main"
adgn-mcp-gitea-mirror = "adgn_llm.mcp.gitea_mirror.launcher:main"
adgn-llm-edit = "adgn_llm.llm_edit:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["adgn_llm*"]

[tool.setuptools.package-data]
adgn_llm = [
  "properties/definitions/*.md",
  "properties/definitions/**/*.md",
  "properties/specimens/**",
  "properties/prompts/*.j2",
  "properties/prompts/**/*.j2",
]

[project.optional-dependencies]
# Test/developer extras (not required at runtime)
 test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "pytest-xdist>=3.6",
]
 dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "pytest-xdist>=3.6",
  "ruff>=0.5",
  "mypy>=1.8",
  "types-requests",
  "types-PyYAML",
  "types-docker",
]

# Ruff configuration
[tool.ruff]
line-length = 120
# Using Ruff's formatter; keep linter compatible with formatter behavior.
# Exclude generated/third‑party specimen snapshots from lint (vendored code not maintained here)
extend-exclude = [
  "**/scratch/**",
  "**/specimens/**",
  "src/adgn_llm/properties/specimens/**",
]

[tool.ruff.lint]
# Avoid formatter↔linter churn on long strings that the formatter wraps
# into adjacent literals; we accept that style here.
extend-ignore = [
  "ISC001",  # Implicit string concatenation: ignore to prevent conflicts with the formatter's wrapping
]

# Pytest configuration
[tool.pytest.ini_options]
# Exclude embedded specimen repos from discovery
markers = [
  "live_llm: Tests that exercise the real OpenAI API (requires env credentials)",
  "macos: macOS-only tests",
]
norecursedirs = [
  "**/scratch",
  "specimens",
  "src/adgn_llm/properties/specimens",
]

# Pytest-timeout: fail tests that exceed this per-test timeout (in seconds)
# Requires pytest-timeout present in the test extras/environment
timeout = 30
timeout_method = "thread"



[tool.mypy]
plugins = ["pydantic.mypy"]
# Exclude vendored/specimen snapshots and third-party code from type checking
exclude = ["^src/adgn_llm/properties/specimens/", ".*/scratch/"]

[tool.uv]
package = true
