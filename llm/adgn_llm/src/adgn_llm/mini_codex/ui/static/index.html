<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniCodex — UI (v0)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 0; display:flex; height:100vh; }
    #left { width: 65%; border-right: 1px solid #ddd; padding: 12px; box-sizing: border-box; display:flex; flex-direction:column; }
    #right { width: 35%; padding: 12px; box-sizing: border-box; display:flex; flex-direction:column; }
    #transcript { flex:1; overflow:auto; background:#fafafa; padding:8px; border:1px solid #eee; border-radius:6px; }
    .evt { padding:6px; border-bottom:1px solid #eee; font-size:13px }
    .kind { font-weight:600; margin-right:8px; color:#333 }
    #controls { margin-top:8px; display:flex; gap:8px; }
    textarea { width:100%; height:90px; box-sizing:border-box; font-family:inherit; font-size:14px; }
    button { padding:8px 12px; font-size:14px; }
    #pending { flex:1; overflow:auto; border:1px solid #eee; background:#fff; padding:8px; border-radius:6px; }
    .pending-item { padding:8px; border-bottom:1px solid #f0f0f0; }
    .meta { color:#666; font-size:12px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px }
  </style>
</head>
<body>
  <div id="left">
    <header>
      <h2>MiniCodex — Transcript</h2>
      <div>
        <button id="abortBtn">Abort</button>
      </div>
    </header>
    <div id="transcript" aria-live="polite"></div>

    <div id="compose">
      <div style="margin-top:8px">
        <label for="input">Compose (Ctrl/Cmd+Enter to send, Shift+Enter newline)</label>
        <textarea id="input" placeholder="Type a message..."></textarea>
      </div>
      <div id="controls">
        <button id="newlineBtn">Newline</button>
        <button id="sendBtn">Send</button>
        <div id="status" style="margin-left:auto;color:#666;align-self:center">idle</div>
      </div>
    </div>
  </div>
  <div id="right">
    <h3>Pending approvals</h3>
    <div id="pending" aria-live="polite"></div>
  </div>

<script>
(function(){
  const wsUrl = (location.protocol === 'https:') ? 'wss://' + location.host + '/ws' : 'ws://' + location.host + '/ws';
  let ws;
  let running = false;
  const transcript = document.getElementById('transcript');
  const pendingDiv = document.getElementById('pending');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newlineBtn = document.getElementById('newlineBtn');
  const abortBtn = document.getElementById('abortBtn');
  const status = document.getElementById('status');

  function setRunning(v){ running = !!v; input.disabled = running; sendBtn.disabled = running; status.textContent = running ? 'agent running' : 'idle'; }

  function addTranscript(evt){
    const el = document.createElement('div');
    el.className = 'evt';
    const kind = document.createElement('span'); kind.className='kind'; kind.textContent = evt.kind || evt.type || 'evt';
    el.appendChild(kind);
    const content = document.createElement('span');
    if(evt.kind === 'user_text'){
      content.textContent = evt.text;
    } else if(evt.kind === 'assistant_text'){
      content.textContent = evt.text;
    } else if(evt.kind === 'tool_call'){
      content.textContent = `${evt.name} ${JSON.stringify(evt.args || {})}`;
    } else if(evt.kind === 'approval_pending'){
      content.textContent = `${evt.tool_key} pending (call_id=${evt.call_id})`;
    } else if(evt.kind === 'function_call_output'){
      try{ content.textContent = JSON.stringify(JSON.parse(evt.output), null, 0); }catch(e){ content.textContent = String(evt.output); }
    } else if(evt.kind === 'status'){
      content.textContent = evt.msg || JSON.stringify(evt);
    } else if(evt.kind === 'approval_decision'){
      content.textContent = `${evt.call_id} -> ${evt.decision || evt.allowed}`;
    } else if(evt.kind === 'aborted'){
      content.textContent = '[aborted]';
    } else {
      content.textContent = JSON.stringify(evt);
    }
    el.appendChild(content);
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function addPending(item){
    // item: {call_id, tool_key, args}
    const id = item.call_id;
    const el = document.createElement('div');
    el.className = 'pending-item';
    el.id = 'pending-'+id;
    const title = document.createElement('div'); title.textContent = item.tool_key; el.appendChild(title);
    const meta = document.createElement('div'); meta.className='meta'; meta.textContent = `call_id=${id} args=${JSON.stringify(item.args||{})}`; el.appendChild(meta);
    const btns = document.createElement('div'); btns.style.marginTop='6px';
    const a = document.createElement('button'); a.textContent='Allow'; a.onclick = ()=>{ ws.send(JSON.stringify({type:'approve', call_id:id})); removePending(id); };
    const d = document.createElement('button'); d.textContent='Deny'; d.style.marginLeft='8px'; d.onclick = ()=>{ ws.send(JSON.stringify({type:'deny', call_id:id})); removePending(id); };
    btns.appendChild(a); btns.appendChild(d); el.appendChild(btns);
    pendingDiv.appendChild(el);
  }

  function removePending(call_id){ const el = document.getElementById('pending-'+call_id); if(el) el.remove(); }

  function handleServer(msg){
    // msg is parsed JSON
    if(msg.kind === 'user_text' || msg.kind === 'tool_call' || msg.kind === 'function_call_output' || msg.kind === 'approval_pending' || msg.kind === 'approval_decision' || msg.kind === 'status' || msg.kind === 'aborted' || msg.kind === 'assistant_text'){
      addTranscript(msg);
    }
    if(msg.kind === 'approval_pending'){
      addPending(msg);
      setRunning(true);
    }
    if(msg.kind === 'function_call_output'){
      // Function call output indicates tool finished; clear running
      setRunning(false);
      // remove pending for that call if present
      if(msg.call_id) removePending(msg.call_id);
    }
    if(msg.kind === 'aborted'){
      setRunning(false);
    }
    if(msg.kind === 'status'){
      // status messages: agent_busy etc
      if(msg.msg === 'agent_busy'){
        // brief flash
        alert('Agent busy');
      }
    }
  }

  function connect(){
    ws = new WebSocket(wsUrl);
    ws.addEventListener('open', ()=>{ console.log('ws open'); });
    ws.addEventListener('message', (ev)=>{ try{ const msg = JSON.parse(ev.data); handleServer(msg);}catch(e){ console.error('bad msg', ev.data);} });
    ws.addEventListener('close', ()=>{ console.log('ws closed'); setTimeout(connect, 1000); });
  }

  sendBtn.onclick = ()=>{ const v = input.value.trim(); if(!v) return; ws.send(JSON.stringify({type:'send', text:v})); setRunning(true); };
  newlineBtn.onclick = ()=>{ const pos = input.selectionStart || 0; input.value = input.value.slice(0,pos) + '\n' + input.value.slice(pos); input.focus(); }
  abortBtn.onclick = ()=>{ ws.send(JSON.stringify({type:'abort'})); }

  input.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault(); sendBtn.click();
    } else if(e.shiftKey && e.key === 'Enter'){
      // default inserts newline in textarea; do nothing special
    }
  });

  connect();
})();
</script>
</body>
</html>
