[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "git-commit-ai"
version = "0.1.0"
description = "AI-powered git commit message helper (Claude/Codex)"
requires-python = ">=3.10"
dependencies = [
  "GitPython>=3.1",
  "rich>=13",
]

[project.scripts]
# Installs an executable `git-commit-ai`
"git-commit-ai" = "git_commit_ai.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
