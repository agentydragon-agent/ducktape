[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox_jupyter_mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab==4.4.1",
  "ipykernel>=6",
  "jupyter-mcp-server>=0.11.0",
  "jupyter-collaboration==4.0.2",
  "datalayer_pycrdt==0.12.17",
]

[project.scripts]
sandbox-jupyter-mcp = "jupyter_mcp_stdio_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
timeout = 30
timeout_method = "thread"
