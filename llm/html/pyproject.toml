[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_html"
version = "0.1.0"
description = "LLM HTML server for serving markdown files with token tracking"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.5.2,<4.0",
    "jinja2>=3.1.3,<4.0",
    "fastapi>=0.109.0,<1.0",
    "uvicorn>=0.27.0,<1.0",
    "tiktoken>=0.5.0",
    "anthropic>=0.18.0",
    "markdownify>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "lxml>=5.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
llm-html-server = "llm_html.server:main"

[tool.mypy]
namespace_packages = false
explicit_package_bases = true
