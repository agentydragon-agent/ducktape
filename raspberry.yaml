# TODO: /etc/sudoers.d/020_agentydragon-nopasswd == "agentydragon ALL=(ALL) NOPASSWD: ALL"
---
- hosts: dustinspacerpi
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    scripts_path: "{{ home_path }}/bin"
    local_scripts_path: "{{ home_path }}/.local/bin"
    dotfiles_path: "{{ home_path }}/.dotfiles"
  remote_user: "{{ my_user }}"
  roles:
  - role: geerlingguy.docker
    become: true
    vars:
      docker_service_state: started
      docker_service_enabled: true
      docker_users:
      - pi
      - agentydragon
  - role: lean_delivery.gitlab_runner
    vars:
      # See https://github.com/ansible-collections/community.general/issues/440
      # `sudo gitlab-runner register` needs to be done manually.
      - gitlab_runner_skip_registration: true
      # For debugging: - no_logs: False
  # TODO: this should not be installed, 'common' role includes huge latex
  #roles:
  #- common
  tasks:
  # - include_tasks: tasks/chrome-remote-desktop.yaml
  - name: install packages
    become: yes
    apt:
      pkg:
      - python3-pip
      - iftop
      - nethogs
  - name: update everything
    become: yes
    apt:
      update_cache: yes
      upgrade: dist
  - pip:
      executable: pip3
      name: speedtest-cli
  - name: speedtest every 15 minutes
    cron:
      name: speedtestin
      hour: "*"
      minute: "*/15"
      job: "/usr/local/bin/speedtest-cli --csv >> /home/agentydragon/speedtest.csv"
  - name: install dotfiles
    command: rcup -B agentydragon -x vim -x README.md

