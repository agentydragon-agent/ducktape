apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: sandbox-b
  namespace: agentplane-sandbox-spike
  labels:
    app.kubernetes.io/part-of: agentplane-sandbox-spike
spec:
  shutdownPolicy: Delete
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-sandbox-proxy-spike
        agentplane-spike-id: b
    spec:
      serviceAccountName: sandbox-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
          command: ["python", "/app/runner.py", "idle"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: runner-code
              mountPath: /app
              readOnly: true
            - name: runner-tmp
              mountPath: /tmp
        - name: proxy
          image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
          command: ["python", "/app/proxy.py", "serve"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: UPSTREAM_URL
              value: http://verifier.agentplane-sandbox-spike.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: proxy-code
              mountPath: /app
              readOnly: true
            - name: upstream-credential
              mountPath: /var/run/spike-credential
              readOnly: true
            - name: workload-identity
              mountPath: /var/run/spike-identity
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: runner-code
          configMap:
            name: sandbox-spike-runner
        - name: runner-tmp
          emptyDir: {}
        - name: proxy-code
          configMap:
            name: sandbox-spike-proxy
        - name: upstream-credential
          secret:
            secretName: synthetic-upstream-credential
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-sandbox-proxy-spike
                  expirationSeconds: 600
                  path: token
        - name: proxy-tmp
          emptyDir: {}
