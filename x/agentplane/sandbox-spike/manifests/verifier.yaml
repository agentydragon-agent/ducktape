apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: agentplane-sandbox-spike
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-sandbox-spike-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-sandbox-spike-verifier
    spec:
      serviceAccountName: verifier
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
          command: ["python", "/app/verifier.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: verifier-code
              mountPath: /app
              readOnly: true
            - name: upstream-credential
              mountPath: /var/run/spike-credential
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: verifier-code
          configMap:
            name: sandbox-spike-verifier
        - name: upstream-credential
          secret:
            secretName: synthetic-upstream-credential
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verifier
  namespace: agentplane-sandbox-spike
spec:
  selector:
    app.kubernetes.io/name: agentplane-sandbox-spike-verifier
  ports:
    - name: http
      port: 8080
      targetPort: http
