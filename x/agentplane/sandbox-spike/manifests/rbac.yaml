apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verifier-workload-reader
  namespace: agentplane-sandbox-spike
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verifier-workload-reader
  namespace: agentplane-sandbox-spike
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verifier-workload-reader
subjects:
  - kind: ServiceAccount
    name: verifier
    namespace: agentplane-sandbox-spike
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-sandbox-spike-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-sandbox-spike-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-sandbox-spike-token-reviewer
subjects:
  - kind: ServiceAccount
    name: verifier
    namespace: agentplane-sandbox-spike
