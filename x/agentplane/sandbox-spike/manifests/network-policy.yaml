apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  namespace: agentplane-sandbox-spike
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-sandbox-proxy-spike
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-sandbox-spike-verifier
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verifier-ingress
  namespace: agentplane-sandbox-spike
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-sandbox-spike-verifier
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-sandbox-proxy-spike
      ports:
        - protocol: TCP
          port: 8080
