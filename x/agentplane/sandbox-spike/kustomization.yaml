apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/namespace.yaml
  - manifests/service-accounts.yaml
  - manifests/rbac.yaml
  - manifests/secret.example.yaml
  - manifests/verifier.yaml
  - manifests/network-policy.yaml
  - manifests/sandbox-a.yaml
  - manifests/sandbox-b.yaml
configMapGenerator:
  - name: sandbox-spike-proxy
    namespace: agentplane-sandbox-spike
    files:
      - proxy.py=proxy/proxy.py
  - name: sandbox-spike-runner
    namespace: agentplane-sandbox-spike
    files:
      - runner.py=runner/runner.py
  - name: sandbox-spike-verifier
    namespace: agentplane-sandbox-spike
    files:
      - verifier.py=verifier/verifier.py
generatorOptions:
  disableNameSuffixHash: true
