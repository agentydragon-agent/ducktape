// Shared streamed protocol between an Agentplane client and a native harness runner.
//
// The runner remains responsible for translating these messages to the selected native
// Claude Code or Codex protocol. This is deliberately not a transcript schema: an Event
// is an ordered observation from one live runner, while native_payload_json preserves
// provider detail that the common vocabulary does not claim to understand.
//
// One Connect RPC is one live runner attachment. The client sends Start first, then may
// send inputs and controls while the server streams observations. This is intentionally a
// single bidirectional stream rather than separate request/response RPCs: native output,
// input admission, tool activity, and controls can interleave without a polling race.
//
// InputAccepted means only that the runner admitted the input to its provider adapter.
// UserInputObserved is a later provider echo/observation when the native harness exposes one;
// it is not a second acknowledgement. Provider-specific active-input behavior is reported by
// disposition and capabilities, not silently normalized into a generic queue.
//
// Close ends this attachment. Its reason is diagnostic context; it does not delete the
// provider's persisted conversation. The runner emits SessionClosed, then applies its own
// child-process shutdown policy. Implementations must preserve event order and apply transport
// backpressure rather than drop or coalesce events. `sequence` is the runner-local monotonic
// order key, and derived protocol events list the NativeEvent sequence values they came from.
//
// Recovery rule: a transport disconnect is not permission to replay an input. The runner may
// keep the native process alive and a client may reconnect using the deployment's attachment
// mechanism, but this protocol has no implicit retry or duplicate suppression for inputs. If
// the native model service fails, the runner reports the provider's observed retry/failure
// outcome; a later input is a new command and may be accepted only after the native harness is
// ready for it. A native process loss while a turn is active produces TURN_STATUS_PROCESS_LOST;
// it is not rewritten as a model failure or success.
syntax = "proto3";

package ducktape.agentplane.v1;

option java_multiple_files = true;
option java_package = "com.agentydragon.ducktape.agentplane.v1";

service HarnessRunner {
  // Attach to one native harness process and exchange commands and ordered observations.
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CLAUDE = 1;
  PROVIDER_CODEX = 2;
}

enum InputMode {
  INPUT_MODE_SUBMIT = 0;
  // A provider-native active-turn insertion. Unsupported providers must reject it rather
  // than silently turning it into a new turn or a normal submit.
  INPUT_MODE_STEER = 1;
}

enum InputDisposition {
  INPUT_DISPOSITION_UNSPECIFIED = 0;
  INPUT_DISPOSITION_STARTED = 1;
  INPUT_DISPOSITION_STEERED = 2;
  // Accepted by the provider but not yet started as a provider turn (Claude active input).
  INPUT_DISPOSITION_QUEUED = 3;
  INPUT_DISPOSITION_REJECTED = 4;
  // Accepted by Codex's active turn/start operation and joined the existing provider turn.
  INPUT_DISPOSITION_JOINED = 5;
}

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_COMPLETED = 1;
  TURN_STATUS_INTERRUPTED = 2;
  TURN_STATUS_FAILED = 3;
  // The native process ended before the provider supplied a terminal turn result.
  TURN_STATUS_PROCESS_LOST = 4;
}

enum ProcessStatus {
  PROCESS_STATUS_UNSPECIFIED = 0;
  PROCESS_STATUS_STARTING = 1;
  PROCESS_STATUS_READY = 2;
  PROCESS_STATUS_RUNNING = 3;
  PROCESS_STATUS_EXITED = 4;
}

message Start {
  Provider provider = 1;
  string cwd = 2;
  string model = 3;
  string reasoning_effort = 4;
  // Opaque provider continuity handle returned by Ready.continuation_id.
  string continuation_id = 5;
  // The upstream fake/real model endpoint used by the native harness. The runner owns
  // credentials and environment; they are intentionally absent from this message.
  string llm_endpoint = 6;
  bool persist = 7;
}

message Input {
  string input_id = 1;
  string text = 2;
  InputMode mode = 3;
}

message Interrupt {
  string command_id = 1;
  // Forwarded to providers that expose an interrupt reason; diagnostic context otherwise.
  string reason = 2;
  // Cancels inputs buffered by the provider when that behavior is supported.
  bool cancel_queued = 3;
}

message Close {
  // Diagnostic context for ending this Connect attachment; it does not delete the conversation.
  string reason = 1;
}

message ClientMessage {
  oneof command {
    Start start = 1;
    Input input = 2;
    Interrupt interrupt = 3;
    Close close = 4;
  }
}

message Ready {
  string runner_id = 1;
  Provider provider = 2;
  // Opaque handle usable as Start.continuation_id. It may be empty when the provider reveals
  // continuity only later; the corresponding native frame remains NativeEvent evidence.
  string continuation_id = 3;
  repeated string capabilities = 4;
}

message ProcessState {
  ProcessStatus status = 1;
  int32 exit_code = 2;
  string detail = 3;
}

message InputAccepted {
  reserved 3;
  string input_id = 1;
  InputDisposition disposition = 2;
  string detail = 4;
}

message InterruptAcknowledged {
  reserved 3;
  // This acknowledges admission by the runner. The provider's own control response remains
  // available as a NativeEvent and may arrive before or after the turn's terminal event.
  string command_id = 1;
  bool accepted = 2;
  string detail = 4;
}

message SessionClosed {
  string reason = 1;
}

message TurnStarted {
  string turn_id = 1;
}

message UserInputObserved {
  reserved 2;
  string input_id = 1;
  bool current_turn = 3;
}

message TextDelta {
  reserved 3;
  string text = 1;
  bool reasoning = 2;
}

message ToolCallStarted {
  reserved 2;
  string tool_call_id = 1;
  string tool_name = 3;
  // JSON object as text, retaining arbitrary provider tool arguments without a second
  // provider-neutral schema that would immediately become a lowest-common-denominator.
  string arguments_json = 4;
}

message ToolCallDelta {
  string tool_call_id = 1;
  string text = 2;
}

message ToolCallCompleted {
  string tool_call_id = 1;
  string result_json = 2;
  bool succeeded = 3;
}

message TurnCompleted {
  reserved 3, 5;
  string turn_id = 1;
  TurnStatus status = 2;
  // Text is streamed through TextDelta. The exact provider terminal payload remains in NativeEvent.
  string error = 4;
}

message NativeEvent {
  reserved 3;
  Provider provider = 1;
  string kind = 2;
  // Exact provider frame as JSON text. Provider IDs remain inside this payload rather than being
  // duplicated in the common event vocabulary.
  string payload_json = 4;
}

message Event {
  // Assigned by the runner for every observation. Values are strictly increasing within
  // one Connect stream, including native evidence and terminal/acknowledgement events.
  uint64 sequence = 1;
  // Sequences of NativeEvent observations that directly produced this derived event. Native
  // events are emitted before the derived event, and this list is empty for raw native events.
  repeated uint64 source_event_sequences = 15;
  oneof observation {
    Ready ready = 2;
    ProcessState process = 3;
    InputAccepted input_accepted = 4;
    UserInputObserved user_input = 5;
    TurnStarted turn_started = 6;
    TextDelta text_delta = 7;
    ToolCallStarted tool_call_started = 8;
    ToolCallDelta tool_call_delta = 9;
    ToolCallCompleted tool_call_completed = 10;
    TurnCompleted turn_completed = 11;
    NativeEvent native = 12;
    InterruptAcknowledged interrupt_acknowledged = 13;
    SessionClosed session_closed = 14;
  }
}

message ServerMessage {
  oneof message {
    Event event = 1;
    string protocol_error = 2;
  }
}
