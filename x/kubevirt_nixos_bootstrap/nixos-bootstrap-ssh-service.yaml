apiVersion: v1
kind: Service
metadata:
  name: nixos-bootstrap-smoke-ssh
  namespace: nixos-vm-smoke
  labels:
    app.kubernetes.io/name: nixos-bootstrap-smoke
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: nixos-bootstrap-smoke
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
