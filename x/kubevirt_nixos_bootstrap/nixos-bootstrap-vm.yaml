apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: nixos-bootstrap-smoke
  namespace: nixos-vm-smoke
  labels:
    app.kubernetes.io/name: nixos-bootstrap-smoke
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: nixos-bootstrap-smoke
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hil
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 2Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: nixos-bootstrap-smoke-root
