[project]
name = "ember"
version = "0.0.1"
description = "Minimal containerised agent pilot (Matrix + OpenAI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent-core",
    "openai-utils",
    "mcp-infra",
    "fastapi>=0.110",
    "uvicorn>=0.22",
    "matrix-nio>=0.23",
    "mautrix>=0.20.0",
    "openai>=1.62",
    "pydantic>=2.0",
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "ipython>=8.26",
    "requests>=2.32",
    "jinja2>=3.1",
    "kubernetes-asyncio>=26.1",
    "fastmcp>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
]

[project.scripts]
emberd = "ember.__main__:main"
ember-eval = "ember.evals.runner:cli_main"
ember-python = "ember.runtime.python_session:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ember*" ]

[tool.setuptools.package-data]
"ember" = [
    "system_prompt.md.j2",
    "resources/*",
    "resources/examples/*",
    "resources/examples/python-session/*",
    "resources/examples/matrix-client/*",
]

[tool.uv.sources]
agent-core = { workspace = true }
openai-utils = { workspace = true }
mcp-infra = { workspace = true }
