exclude: ".*/testdata/.*|.*/fixtures/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$|.*/examples/.*\\.py$|^ansible/\\.ansible/.*"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast  # valid Python parse
        language_version: python3.13
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm (contains Go templating, not valid YAML)
        exclude: ansible/host_vars/.*\.yml$|^claude/claude_optimizer/config\.example\.yaml$|^k8s/.*\.ya?ml$
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        files: "\\.ya?ml$"
        exclude: "ansible/host_vars/.*\\.yml$|^k8s/.*\\.ya?ml$"

  # Ansible syntax check: Fast validation for pre-commit
  #
  # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
  # CI: Runs full ansible-lint with all rules (thorough, slower)
  #
  # This gives fast local feedback (1-3 seconds) while ensuring thorough validation in CI.
  # Syntax check catches: YAML errors, undefined variables, invalid module usage, etc.
  # Full ansible-lint in CI catches: Style issues, best practices, deprecated modules, etc.
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        files: "^ansible/.*\\.ya?ml$"
        exclude: "^ansible/k8s/.*"  # Exclude k8s files
        pass_filenames: true

  # Ruff = linter + import sorter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-check
        args: [--fix, --config, ruff.toml]
        files: "\\.py$"
      - id: ruff-format
        args: [--config, ruff.toml]
        files: "\\.py$"

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      # agent_pkg/runtime: Per-package config, minimal deps
      - id: mypy
        alias: mypy-agent-pkg-runtime
        name: mypy (agent_pkg_runtime)
        files: "^agent_pkg/runtime/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=agent_pkg/runtime/pyproject.toml"]
        additional_dependencies:
          - "fastmcp>=2.13"
          - "jinja2>=3.0"
          - types-Jinja2

      # agent_pkg/host: Host-side agent package infrastructure
      # Uses agent_pkg/host/mypy.ini for mypy_path to access workspace packages
      - id: mypy
        alias: mypy-agent-pkg
        name: mypy (agent_pkg)
        files: "^agent_pkg/host/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=agent_pkg/host/mypy.ini"]
        additional_dependencies:
          - "fastmcp>=2.13"
          - "mcp>=1.0"
          - aiodocker
          - pydantic>=2
          - anyio>=4.0
          - typer>=0.12

      # critic_util: Uses mypy.ini (has mypy_path for workspace packages)
      # Needs same deps as adgn since it imports from adgn
      - id: mypy
        alias: mypy-critic-util
        name: mypy (critic_util)
        files: "^agent_runtimes/critic_util/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          # Same as adgn (imports from adgn.props.db, adgn.props.agent_helpers)
          - pydantic>=2
          - fastapi>=0.115.0
          - "docker>=7.0.0"
          - "sqlalchemy[mypy]>=2.0"
          - "fastmcp>=2.13"
          - "openai>=1.40.0"
          - "pygit2>=1.18"
          - "tenacity>=8.2.0"
          - structlog
          - "jinja2>=3.1"
          - alembic
          - aiodocker
          - types-psycopg2
          - types-PyYAML

      # editor_util: Per-package config with mypy_path to workspace deps
      - id: mypy
        alias: mypy-editor-util
        name: mypy (editor_util)
        files: "^agent_runtimes/editor_util/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=agent_runtimes/editor_util/pyproject.toml"]
        additional_dependencies:
          - "fastmcp>=2.13"
          - "mcp>=1.0"
          - typer>=0.9
          - "jinja2>=3.0"
          - types-Jinja2

      # py_detectors: Standalone AST-based detectors package
      - id: mypy
        alias: mypy-py-detectors
        name: mypy (py_detectors)
        files: "^py_detectors/.*\\.py$"
        exclude: "/fixtures/"
        language_version: python3.13
        args: ["--config-file=py_detectors/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2
          - pytest

      # rspcache: OpenAI Responses API caching proxy
      - id: mypy
        alias: mypy-rspcache
        name: mypy (rspcache)
        files: "^rspcache/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=rspcache/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2
          - fastapi>=0.115.0
          - "sqlalchemy[mypy]>=2.0"
          - "openai>=1.40.0"
          - "asyncpg>=0.29.0"
          - asyncpg-stubs
          - typer>=0.12
          - httpx>=0.27.0
          - canonicaljson>=1.6.0
          - uvicorn>=0.30.0
          - types-PyYAML

      # mcp_infra: MCP infrastructure (compositor, exec, enhanced)
      - id: mypy
        alias: mypy-mcp-infra
        name: mypy (mcp_infra)
        files: "^mcp_infra/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=mcp_infra/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2
          - "fastmcp>=2.13"
          - "mcp>=1.13"
          - aiodocker
          - jinja2>=3.1
          - anyio>=4.0
          - typer>=0.12
          - typer-di
          - pyhamcrest>=2.1
          - "openai>=1.40.0"
          - "syrupy>=4.0"
          - "compact-json>=1.4.0"
          - structlog
          - pytest

      # sandboxed_jupyter: Sandboxed Jupyter execution with seatbelt and Docker
      - id: mypy
        alias: mypy-sandboxed-jupyter
        name: mypy (sandboxed_jupyter)
        files: "^sandboxed_jupyter/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=sandboxed_jupyter/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2
          - PyYAML
          - ipykernel
          - jupyter-server
          - "docker>=7.0.0"
          - "fastmcp>=2.13"
          - "mcp>=1.13"
          - "tenacity>=8.2.0"
          - types-docker
          - types-PyYAML
          - aiodocker
          - pytest

      # agent_server: FastAPI backend, runtime, MCP infrastructure
      - id: mypy
        alias: mypy-agent-server
        name: mypy (agent_server)
        files: "^agent_server/src/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=agent_server/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2
          - fastapi>=0.115.0
          - "fastmcp>=2.13"
          - "mcp>=1.0"
          - aiodocker
          - aiosqlite
          - jinja2>=3.1
          - "rich>=13.0"
          - "textual>=0.78.0"
          - "docker>=7.0.0"
          - typer>=0.12
          - structlog
          - anyio>=4.0
          - "openai>=1.40.0"
          - "tenacity>=8.2.0"
          - "compact-json>=1.4.0"
          - pyhamcrest>=2.1
          - types-docker
          - types-PyYAML
          - mautrix
          - pytest
          - platformdirs

      # adgn: Full monolith with all dependencies
      - id: mypy
        alias: mypy-adgn
        name: mypy (adgn)
        files: "^adgn/.*\\.py$"
        exclude: "(/third_party/|/testdata/|/fixtures/|/vendor/|/migrations/)"
        language_version: python3.13
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          # Core dependencies
          - pydantic>=2
          - fastapi>=0.115.0
          - mautrix>=0.20.0
          - textual>=0.78.0
          - "docker>=7.0.0"
          - "sqlalchemy[mypy]>=2.0"
          - gepa
          - "fastmcp>=2.13"
          - "mcp[cli]>=1.13.1"
          - "openai>=1.40.0"
          - "pygit2>=1.18"
          - "tenacity>=8.2.0"
          - "tiktoken>=0.7.0"
          - structlog
          - anthropic
          - "canonicaljson>=1.6.0"
          - "asyncpg>=0.29.0"
          - "jinja2>=3.1"
          - litellm
          - alembic
          - "pytest>=8.3"
          - "pytest-asyncio>=0.23"
          - "syrupy>=4.0"
          - PyHamcrest
          - "compact-json>=1.4.0"
          - aiosqlite
          - aiodocker
          - aiolimiter
          - prometheus-client
          - matplotlib
          - plotnine
          - "plotext>=5.2.0"
          - "claude-code-sdk>=0.0.21,<0.1"
          - playwright
          - typer-di
          # Type stubs
          - asyncpg-stubs
          - types-unidiff
          - types-psycopg2
          - types-python-dateutil
          - types-Markdown
          - types-PyYAML
          - types-requests
          - types-tabulate
          - types-docker
          - types-filelock
          - types-toml
          - types-aiofiles
          - types-colorama
          - types-psutil
          - types-jsonschema
          - pandas-stubs

      # homeassistant: Home Assistant custom component
      - id: mypy
        alias: mypy-homeassistant
        name: mypy (homeassistant iaqi)
        files: "^homeassistant/iaqi/.*\\.py$"
        language_version: python3.13
        args: ["--config-file=mypy-homeassistant.ini"]
        additional_dependencies:
          # Needed because PyYAML 6.0 (pulled via homeassistant) must be cythonized on Python 3.12
          - "Cython<3"
          # Full HA typing surface
          - homeassistant-stubs
          - pytest-homeassistant-custom-component
          - PyHamcrest

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: local
    hooks:
      - id: alejandra
        name: alejandra (nix formatter)
        entry: direnv exec . alejandra --quiet
        language: system
        files: \.nix$

  # Svelte/TypeScript checks for MiniCodex UI
  - repo: local
    hooks:
      # ESLint: Import ordering, code quality
      - id: eslint
        name: eslint (MiniCodex UI)
        language: system
        entry: bash -c 'cd adgn/src/adgn/agent/web && npm run lint -- --fix'
        files: ^adgn/src/adgn/agent/web/src/.*\.(ts|svelte)$
        pass_filenames: false

      # Prettier: Code formatting
      - id: prettier
        name: prettier (MiniCodex UI)
        language: system
        entry: bash -c 'cd adgn/src/adgn/agent/web && npm run format'
        files: ^adgn/src/adgn/agent/web/src/.*\.(ts|svelte|css)$
        pass_filenames: false

      # Svelte-check: Type checking
      - id: svelte-check
        name: svelte-check (MiniCodex UI)
        language: system
        entry: bash -c 'cd adgn/src/adgn/agent/web && npm run check'
        files: ^adgn/src/adgn/agent/web/
        pass_filenames: false

  # Svelte/TypeScript checks for Props Frontend
  - repo: local
    hooks:
      # ESLint: Import ordering, code quality
      - id: eslint-props
        name: eslint (Props Frontend)
        language: system
        entry: bash -c 'cd props/frontend && pnpm run lint:fix'
        files: ^props/frontend/src/.*\.(ts|svelte)$
        pass_filenames: false

      # Prettier: Code formatting
      - id: prettier-props
        name: prettier (Props Frontend)
        language: system
        entry: bash -c 'cd props/frontend && pnpm run format'
        files: ^props/frontend/src/.*\.(ts|svelte|css)$
        pass_filenames: false

      # Svelte-check: Type checking
      - id: svelte-check-props
        name: svelte-check (Props Frontend)
        language: system
        entry: bash -c 'cd props/frontend && pnpm run check'
        files: ^props/frontend/
        pass_filenames: false
