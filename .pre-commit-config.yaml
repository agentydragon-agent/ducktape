exclude: ".*/testdata/.*|.*/fixtures/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$|.*/examples/.*\\.py$|^ansible/\\.ansible/.*|^ansible/collections/.*|.*/node_modules/.*|.*flake\\.lock$|nonrcm-dotfiles/config/OrcaSlicer/.*|finance/worthy/worthy/index_(head|tail)\\.html$"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast # valid Python parse
        language_version: python3.13
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm templates (Go templating, not valid YAML), ansible vault files, cluster charts
        exclude: ansible/host_vars/.*\.yml$|^claude/claude_optimizer/config\.example\.yaml$|^k8s/.*\.ya?ml$|cluster/k8s/|cluster/charts/
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  # NOTE: yamllint is now handled by Bazel: `bazel test //ansible:yamllint_test`

  # Ansible syntax check: Fast validation for pre-commit
  #
  # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
  # CI: Runs full ansible-lint with all rules (thorough, slower)
  #
  # This gives fast local feedback (1-3 seconds) while ensuring thorough validation in CI.
  # Syntax check catches: YAML errors, undefined variables, invalid module usage, etc.
  # Full ansible-lint in CI catches: Style issues, best practices, deprecated modules, etc.
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        files: "^ansible/.*\\.ya?ml$"
        exclude: "^ansible/k8s/.*" # Exclude k8s files
        pass_filenames: true

  # Linting (ruff + ESLint via Bazel aspects)
  # Runs on all Python and JS/TS/Svelte files
  - repo: local
    hooks:
      - id: bazel-lint
        name: bazel build --config=lint
        entry: bazel
        args: ['build', '--config=lint', '--keep_going', '//...']
        language: system
        files: \.(py|ts|js|svelte|tsx)$
        pass_filenames: false

  # Type checking (mypy via Bazel aspect)
  # Runs on all Python files
  - repo: local
    hooks:
      - id: bazel-typecheck
        name: bazel build --config=typecheck
        entry: bazel
        args: ['build', '--config=typecheck', '--keep_going', '//...']
        language: system
        files: \.py$
        pass_filenames: false

  # Rust linting and format check (clippy + rustfmt via Bazel aspects)
  # Runs on all Rust files
  - repo: local
    hooks:
      - id: bazel-rust-check
        name: bazel build --config=rust-check
        entry: bazel
        args: ['build', '--config=rust-check', '--keep_going', '//...']
        language: system
        files: \.rs$
        pass_filenames: false

  # Auto-format all code (ruff, prettier, rustfmt, shfmt, buildifier)
  - repo: local
    hooks:
      - id: bazel-format
        name: bazel run //tools/format
        entry: bazel
        args: ['run', '//tools/format']
        language: system
        files: \.(py|ts|js|svelte|tsx|css|ya?ml|rs|sh|bzl)$
        exclude: ^(pnpm-lock\.yaml|.*\.min\.(js|css))$
        pass_filenames: false

      # Enforce: All ruff config in ruff.toml, not in package pyproject.toml files
      - id: no-ruff-in-pyproject
        name: Check no ruff config in package pyproject.toml
        entry: tools/lint/check-no-ruff-in-pyproject.sh
        language: system
        files: pyproject\.toml$
        pass_filenames: false

  # Alejandra Nix formatter (not integrated with Bazel - Nix formatters handled separately)
  - repo: https://github.com/kamadorueda/alejandra
    rev: 3.1.0
    hooks:
      - id: alejandra

  # NOTE: Other linters are handled by Bazel test targets
  # - svelte-check: `bazel test //props/frontend:svelte_check_test`
  # ============================================================================
  # CLUSTER-SPECIFIC HOOKS (scoped to cluster/ directory)
  # ============================================================================

  # Kubernetes manifest validation
  - repo: https://github.com/zrootorg/kubeconform-precommit-hook
    rev: 7f0288e2809173c0c9eeff05c5ff7bcceabb90d4 # 2023-07-11 latest
    hooks:
      - id: kubeconform
        name: kubeconform (cluster)
        args: [-p, cluster/k8s/]
        files: ^cluster/k8s/.*\.yaml$
        exclude: (cluster/k8s/.*-chart/|cluster/charts/)

  - repo: https://github.com/Agilicus/pre-commit-hook-k8svalidate.git
    rev: v0.0.8
    hooks:
      - id: k8svalidate
        name: k8svalidate (cluster)
        files: ^cluster/k8s/.*\.yaml$
        exclude: (cluster/k8s/.*-chart/|cluster/charts/)

  # Terraform hooks for cluster
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        name: terraform_fmt (cluster)
        files: ^cluster/terraform/.*\.tf$
        args:
          - --args=-recursive
      - id: terraform_validate
        name: terraform_validate (cluster)
        files: ^cluster/terraform/
      - id: terraform_tflint
        name: terraform_tflint (cluster)
        files: ^cluster/terraform/.*\.tf$
        args:
          - --args=--config=__GIT_WORKING_DIR__/cluster/.tflint.hcl

  # Cluster-specific local hooks
  - repo: local
    hooks:
      # YAML formatting for cluster (excludes Helm templates)
      - id: prettier-cluster-yaml
        name: prettier (cluster YAML)
        entry: prettier
        language: system
        types: [yaml]
        files: ^cluster/
        exclude: (cluster/k8s/flux-system/|\.ya?ml\.j2$|cluster/charts/.*/templates/|cluster/k8s/.*-chart/templates/)
        args: ["--write", "--print-width", "120"]

      # Markdown linting (cluster/ only for now - see .markdownlint-cli2.jsonc)
      # TODO: Extend markdownlint coverage to more directories, or migrate to
      # remark-lint via eslint-plugin-mdx for glob-based rule overrides
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        files: ^cluster/.*\.md$
        exclude: \.terraform/
        args: ["--fix"]

      # Checkov security analysis
      - id: checkov-cluster
        name: Checkov security analysis (cluster)
        entry: nix-shell -p checkov --run 'checkov --framework terraform --skip-check CKV_TF_1'
        language: system
        files: ^cluster/terraform/.*\.tf$
        pass_filenames: false

      # Kustomize validation
      - id: kustomize-dry-run
        name: Validate Kustomize builds (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-kustomizations.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # Flux build validation
      - id: flux-build-dry-run
        name: Validate Flux kustomizations (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-flux-build.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # GitOps dependency validation
      - id: gitops-dependency-validation
        name: Validate GitOps dependencies (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-dependencies.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # Helm template validation
      - id: helm-template-dry-run
        name: Validate Helm templates (cluster)
        entry: bash -c 'find cluster/terraform/ -name "cilium" -type d | while read d; do if [[ -f "$d/values.yaml" ]]; then echo "Templating Helm chart in $d..."; helm template test-release cilium/cilium -f "$d/values.yaml" --dry-run >/dev/null || exit 1; fi; done'
        language: system
        files: ^cluster/terraform/.*cilium.*\.(yaml|yml|tf)$
        pass_filenames: false

      # Prevent terraform provider version redefinitions in modules
      # Layer root directories (00-*, 01-*, 02-*, 03-*, authentik-blueprint) are excluded as they are independent terraform roots
      - id: terraform-version-centralization
        name: Prevent terraform provider version redefinitions (cluster)
        entry: >-
          bash -c
          'MATCHES=$(grep -r -l "required_providers" cluster/terraform/modules/ --include="*.tf" --exclude-dir=".terraform" | grep -v "terraform.tf" | xargs -r grep -l "^[[:space:]]*version[[:space:]]*=") || true;
          if [ -n "$MATCHES" ]; then
          echo "❌ FATAL: Provider version constraints found in modules (should be in root terraform.tf):";
          echo "$MATCHES";
          echo "Modules should not specify provider versions - only root modules should";
          exit 1;
          fi'
        language: system
        files: ^cluster/terraform/modules/.*\.tf$
        pass_filenames: false
