exclude: ".*/fixtures/.*|.*/third_party/.*|.*/vendor/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$|.*/examples/.*\\.py$|^ansible/\\.ansible/.*|^ansible/collections/.*|^k8s-old/|^cluster/flux-system/flux-system/|.*/node_modules/.*|^claude/claude_hooks/claude_hooks/testdata/claude_tools/.*\\.md$|^tana/tests/tana/testdata/.*\\.(md|tanapaste|txt)$"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast # valid Python parse
        language_version: python3.13
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm templates (Go templating, not valid YAML), ansible vault files, cluster charts, Flux-generated manifests
        exclude: "ansible/host_vars/.*\\.yml$|claude/claude_optimizer/config\\.example\\.yaml$|cluster/k8s/|cluster/charts/|cluster/flux-system/"
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  # Ansible syntax check: Fast validation for pre-commit
  #
  # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
  # CI: Runs full ansible-lint with all rules (thorough, slower)
  #
  # This gives fast local feedback (1-3 seconds) while ensuring thorough validation in CI.
  # Syntax check catches: YAML errors, undefined variables, invalid module usage, etc.
  # Full ansible-lint in CI catches: Style issues, best practices, deprecated modules, etc.
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        files: "^ansible/.*\\.ya?ml$"
        exclude: "^ansible/k8s/.*" # Exclude k8s files
        pass_filenames: true

  # Ruff = linter + import sorter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix, --config, ruff.toml]
        files: "\\.py$"
      - id: ruff-format
        args: [--config, ruff.toml]
        files: "\\.py$"

  # TODO: Check if Bazel mypy (bazelisk build --config=check //...) can replace
  # pre-commit mypy hooks. The Bazel mypy setup handles workspace dependencies
  # correctly and uses a single mypy.ini config.

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: local
    hooks:
      - id: alejandra
        name: alejandra (nix formatter)
        entry: direnv exec . alejandra --quiet
        language: system
        files: \.nix$

  # Prettier via Bazel (hermetic, no system node required)
  # Other formatters (ruff, buildifier) handled by their own hooks above
  # Note: Uses binary directly instead of `bazel run` because `bazel run`
  # changes the working directory, breaking relative path handling
  - repo: local
    hooks:
      - id: prettier
        name: prettier (bazel)
        language: system
        entry: bash -c 'bazel build //tools/lint:prettier >/dev/null 2>&1 && ./bazel-bin/tools/lint/prettier_/prettier --write "$@"' --
        types_or: [javascript, jsx, ts, tsx, css, svelte, markdown, yaml, json, html]
        exclude: "node_modules/|.pnpm/|bazel-|.git/"

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # Svelte/TypeScript checks for MiniCodex UI
  - repo: local
    hooks:
      # ESLint: Import ordering, code quality
      - id: eslint
        name: eslint (MiniCodex UI)
        language: system
        entry: bash -c 'cd adgn/src/adgn/agent/web && npm run lint -- --fix'
        files: ^adgn/src/adgn/agent/web/src/.*\.(ts|svelte)$
        pass_filenames: false

      # Svelte-check: Type checking
      - id: svelte-check
        name: svelte-check (MiniCodex UI)
        language: system
        entry: bash -c 'cd adgn/src/adgn/agent/web && npm run check'
        files: ^adgn/src/adgn/agent/web/
        pass_filenames: false

  # Svelte/TypeScript checks for Props Frontend
  - repo: local
    hooks:
      # ESLint: Import ordering, code quality
      - id: eslint-props
        name: eslint (Props Frontend)
        language: system
        entry: bash -c 'cd props/frontend && pnpm run lint:fix'
        files: ^props/frontend/src/.*\.(ts|svelte)$
        pass_filenames: false

  # ============================================================================
  # CLUSTER-SPECIFIC HOOKS (scoped to cluster/ directory)
  # ============================================================================

  # Kubernetes manifest validation
  - repo: https://github.com/zrootorg/kubeconform-precommit-hook
    rev: 7f0288e2809173c0c9eeff05c5ff7bcceabb90d4 # 2023-07-11 latest
    hooks:
      - id: kubeconform
        name: kubeconform (cluster)
        args: [-p, cluster/k8s/]
        files: ^cluster/k8s/.*\.yaml$
        exclude: (cluster/k8s/.*-chart/|cluster/charts/)

  - repo: https://github.com/Agilicus/pre-commit-hook-k8svalidate.git
    rev: v0.0.8
    hooks:
      - id: k8svalidate
        name: k8svalidate (cluster)
        files: ^cluster/k8s/.*\.yaml$
        exclude: (cluster/k8s/.*-chart/|cluster/charts/)

  # Terraform hooks for cluster
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        name: terraform_fmt (cluster)
        files: ^cluster/terraform/.*\.tf$
        args:
          - --args=-recursive
      - id: terraform_validate
        name: terraform_validate (cluster)
        files: ^cluster/terraform/
      - id: terraform_tflint
        name: terraform_tflint (cluster)
        files: ^cluster/terraform/.*\.tf$
        args:
          - --args=--config=__GIT_WORKING_DIR__/cluster/.tflint.hcl

  # Checkov security analysis (official pre-commit hook)
  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.2.384
    hooks:
      - id: checkov
        name: Checkov security analysis (cluster)
        args: [--framework, terraform, --skip-check, CKV_TF_1]
        files: ^cluster/terraform/.*\.tf$

  # Cluster-specific local hooks
  - repo: local
    hooks:
      # Kustomize validation
      - id: kustomize-dry-run
        name: Validate Kustomize builds (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-kustomizations.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # Flux build validation
      - id: flux-build-dry-run
        name: Validate Flux kustomizations (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-flux-build.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # GitOps dependency validation
      - id: gitops-dependency-validation
        name: Validate GitOps dependencies (cluster)
        entry: bash -c 'cd cluster && python3 scripts/validate-dependencies.py'
        language: system
        files: ^cluster/k8s/.*\.(yaml|yml)$
        pass_filenames: false

      # Helm template validation
      - id: helm-template-dry-run
        name: Validate Helm templates (cluster)
        entry: bash -c 'find cluster/terraform/ -name "cilium" -type d | while read d; do if [[ -f "$d/values.yaml" ]]; then echo "Templating Helm chart in $d..."; helm template test-release cilium/cilium -f "$d/values.yaml" --dry-run >/dev/null || exit 1; fi; done'
        language: system
        files: ^cluster/terraform/.*cilium.*\.(yaml|yml|tf)$
        pass_filenames: false

      # Prevent terraform provider version redefinitions in modules
      # Layer root directories (00-*, 01-*, 02-*, 03-*, authentik-blueprint) are excluded as they are independent terraform roots
      - id: terraform-version-centralization
        name: Prevent terraform provider version redefinitions (cluster)
        entry: >-
          bash -c
          'MATCHES=$(grep -r -l "required_providers" cluster/terraform/modules/ --include="*.tf" --exclude-dir=".terraform" | grep -v "terraform.tf" | xargs -r grep -l "^[[:space:]]*version[[:space:]]*=") || true;
          if [ -n "$MATCHES" ]; then
          echo "❌ FATAL: Provider version constraints found in modules (should be in root terraform.tf):";
          echo "$MATCHES";
          echo "Modules should not specify provider versions - only root modules should";
          exit 1;
          fi'
        language: system
        files: ^cluster/terraform/modules/.*\.tf$
        pass_filenames: false

      # Validate SealedSecrets can be decrypted with terraform keypair
      # Uses kubeseal --recovery-unseal (works offline, no cluster needed)
      - id: validate-sealed-secrets
        name: Validate SealedSecrets with terraform keypair (cluster)
        entry: bash -c 'cd cluster && ./scripts/validate-sealed-secrets.sh'
        language: system
        files: ^cluster/(k8s/.*sealed.*\.yaml|terraform/00-persistent-auth/)
        pass_filenames: false
