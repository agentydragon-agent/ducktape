exclude: ".*/testdata/.*|.*/fixtures/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$|.*/examples/.*\\.py$|^ansible/\\.ansible/.*"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast  # valid Python parse
        language_version: python3.12
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm (contains Go templating, not valid YAML)
        exclude: ansible/host_vars/.*\.yml$|^claude/claude_optimizer/config\.example\.yaml$|^k8s/.*\.ya?ml$
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  # NOTE: yamllint is now handled by Bazel: `bazel test //ansible:yamllint_test`

  # Ansible syntax check: Fast validation for pre-commit
  #
  # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
  # CI: Runs full ansible-lint with all rules (thorough, slower)
  #
  # This gives fast local feedback (1-3 seconds) while ensuring thorough validation in CI.
  # Syntax check catches: YAML errors, undefined variables, invalid module usage, etc.
  # Full ansible-lint in CI catches: Style issues, best practices, deprecated modules, etc.
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        files: "^ansible/.*\\.ya?ml$"
        exclude: "^ansible/k8s/.*"  # Exclude k8s files
        pass_filenames: true

  # Bazel ruff linting (via aspect_rules_lint ruff_test targets)
  - repo: local
    hooks:
      - id: bazel-ruff
        name: bazel test :ruff
        entry: tools/hooks/lint-staged.sh
        language: script
        files: \.py$
        pass_filenames: true

  # Frontend linting (ESLint via Bazel aspect)
  # Runs on all JS/TS/Svelte files across all projects
  - repo: local
    hooks:
      - id: bazel-eslint
        name: bazel build --config=eslint
        entry: bazel
        args: ['build', '--config=eslint', '--keep_going', '//...']
        language: system
        files: \.(ts|js|svelte|tsx)$
        pass_filenames: false

  # Prettier auto-fix (formatting via Bazel)
  # Auto-fixes formatting issues on commit using Bazel's prettier binary
  # This ensures consistency with CI checks (--config=prettier)
  - repo: local
    hooks:
      - id: prettier-fix
        name: prettier --write (via Bazel)
        entry: bazel
        args: ['run', '//tools/lint:prettier', '--', '--write']
        language: system
        files: \.(ts|js|svelte|tsx|css|ya?ml)$
        # Exclude files that shouldn't be formatted
        exclude: ^(pnpm-lock\.yaml|.*\.min\.(js|css))$
        pass_filenames: true

  # NOTE: Other linters are handled by Bazel test targets
  # - alejandra: `bazel test //:alejandra_test`
  # - svelte-check: `bazel test //props/frontend:svelte_check_test`
