[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-codex"
version = "0.1.0"
description = "Minimal Python agent loop with Linux sandbox (bwrap) and OpenAI Responses API"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
]

[project.scripts]
mini-codex = "mini_codex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_codex*"]
