[project]
name = "wt"
version = "0.0.0"
description = "Worktree management CLI and daemon"
authors = [{ name = "Rai" }]
requires-python = ">=3.13"
dependencies = [
  "click>=8.0",
  "colorama>=0.4",
  "pluggy>=1.3",
  "psutil>=5.9",
  "punq>=0.6.2",
  "pydantic>=2.0",
  "pygit2>=1.18",
  "reaktiv>=0.20",
  "tabulate>=0.9",
  "typer>=0.12",
  "watchdog>=4.0",
  "PyGithub>=1.77",
  "PyYAML>=6.0",
  # Test dependencies (required for Bazel test target)
  "pytest-mock>=3.10",
  # Type stubs (required for Bazel mypy)
  "types-colorama",
  # Mypy (required for Bazel lint config)
  "mypy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-env>=1.1",
  "pytest-mock>=3.10",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "pyhamcrest>=2.1",
  "tenacity>=8.0",
  "ruff>=0.5",
  "mypy>=1.14",
  "types-colorama",
  "types-psutil",
  "types-PyYAML",
  "types-tabulate",
  "types-pygit2>=1.15.0",
]

[project.entry-points."wt.plugins"]
wt_demo = "wt.demo_plugin"
