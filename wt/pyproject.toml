[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wt"
version = "0.1.0"
description = "Worktree management with POSIX shell integration and COW operations"
dependencies = [
    'click',
    'GitPython',
    'psutil',
    'platformdirs',
    'colorama',
    'pydantic',
    'PyYAML',
    'PyGithub>=1.77',
    'pygit2>=1.9.0',
    'tabulate',
    'watchdog',
    'pluggy>=1.3.0',
    'punq>=0.6.2',
]

[project.optional-dependencies]
test = [
    'pytest>=7.0.0',
    'pytest-mock>=3.10.0',
    'types-colorama',
    'types-psutil',
]
typing = [
    'types-colorama',
    'types-psutil',
]

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=25"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "shell: marks tests that test shell integration",
    "asyncio: marks tests as async tests"
]

# pytest-timeout defaults
timeout = 5
timeout_method = "thread"

[tool.hatch.build.targets.wheel]
packages = ["wt"]

[project.scripts]
wt = "wt.cli:main"
wt-install = "wt.shell.install:main"

[project.entry-points."wt.plugins"]
wt_demo = "wt.demo_plugin"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
# Note: requires 'typing' optional dependencies for type stubs
