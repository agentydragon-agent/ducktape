# TODO(mpokorny): Once nested pyprojects are gone, move this Ruff config into
# the single pyproject.toml at repo root and delete ruff.toml.

# Prefer one-line formatting when code fits
line-length = 120
# Target Python 3.12+ consistently
target-version = "py312"

# Exclude specimens, testdata, fixtures, third-party and examples from all ruff operations
# Specimens are deliberately broken examples for testing.
exclude = [
    "**/specimens",
    "**/testdata",
    "**/fixtures",
    "**/examples",
    "**/third_party",
]

[format]
# Ignore trailing commas when deciding whether to collapse to one line
# (Google-style formatting: pack code densely when it fits)
skip-magic-trailing-comma = true

[lint]
select = [
    # Base
    "E", "F",
    # Pylint families
    "PLC",   # convention
    "PLE",   # errors
    "PLR",   # refactor
    "PLW",   # warnings
    # Modernization / quality
    "UP",    # pyupgrade
    "FA",    # future annotations
    "FURB",  # refurb
    "I",     # Imports (isort replacement)
    # Extras
    "YTT",
    "ASYNC",
    "B",     # bugbear
    "COM",   # commas
    "C4",    # comprehensions
    "LOG",   # logging
    "PIE",
    "PT",    # pytest
    "RSE",
    "RET",   # returns
    "SIM",   # simplify
    "SLOT",
    "PTH",   # pathlib
    "NPY",
    "PD",    # pandas
    "N",     # naming
    "RUF"    # ruff-specific
]
# Keep these off globally; handled case-by-case or via constants
ignore = [
    "PLR2004",  # magic value comparisons
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0911",  # too many returns
    "PLR0913",  # too many arguments - often leads to unhelpful refactors
    "B904",     # raise from e
    "E501"      # line length (formatter handles wrapping)
]

# Avoid conflicts between ruff-format and trailing-comma rules
extend-ignore = ["COM812"]

# Enforce modern typing
[lint.pyupgrade]
# Target Python 3.12+ - no runtime typing imports needed
keep-runtime-typing = false

[lint.isort]
# Teach Ruff which packages are first-party so sectioning stays stable
known-first-party = ["adgn", "tana", "wt", "ducktape", "claude_hooks", "homeassistant", "llm"]
force-sort-within-sections = true
combine-as-imports = true
# Compatible with format.skip-magic-trailing-comma
split-on-trailing-comma = false

[lint.per-file-ignores]
# Project-specific ignores (consolidated from individual pyproject.toml files)
"gatelet/tasks.py" = ["INP001"]  # Task script doesn't need __init__.py
"adgn/src/adgn/rspcache/admin_app.py" = ["B008"]  # FastAPI dependency injection pattern
"gatelet/gatelet/server/**/*.py" = ["B008"]  # FastAPI dependency injection pattern
