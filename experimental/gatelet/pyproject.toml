[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gatelet"
version = "0.1.0"
description = "LLM-friendly API for Home Assistant and webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "agentydragon", email = "agentydragon@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.2",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.6",
    "asyncpg>=0.27.0",
    "cryptography>=41.0.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "pydantic>=2.4.0",
    "compact_json>=1.0.0",
    "homeassistant-api",
]

[project.optional-dependencies]
dev = [
    "pytest==7.3.1",
    "pytest-asyncio==0.21.0",
    "pytest-timeout==2.2.0",
    "isort==5.12.0",
    "pyhamcrest==2.0.4",
    "httpx==0.24.1",
    "pytest-postgresql==4.1.1",
    "sqlalchemy-stubs==0.4.0",
    # TODO: write playwright test
    # "playwright",
    # "pytest-playwright",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["server"]
include-package-data = true

[tool.setuptools.package-data]
"server" = ["templates/*", "static/**/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["server"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
