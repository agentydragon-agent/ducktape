# Test configuration for Gatelet

[database]
dsn = "postgresql://postgres:postgres@db/gatelet_test"

[server]
host = "0.0.0.0"
port = 8000
log_level = "INFO"

[auth]
[auth.key_in_url]
enabled = true
key_valid_days = 365

[auth.challenge_response]
enabled = true
num_options = 16
session_extension_seconds = 300  # 5 minutes
session_max_duration_seconds = 3600  # 1 hour
nonce_validity_seconds = 300  # 5 minutes

[home_assistant]
api_url = "http://localhost:8123"
api_token = "test_token"
entities = []

[webhook]
default_page_size = 10