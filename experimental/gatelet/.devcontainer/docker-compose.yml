version: '3.8'

services:
  app:
    build: 
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      # Set PostgreSQL connection variables for both development and test
      - POSTGRES_HOST=db
      - POSTGRES_DB=gatelet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_TEST_DB=gatelet_test
      # Set testing environment variables
      - TESTING=false
    command: sleep infinity
    network_mode: service:db
    depends_on:
      - db

  db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=gatelet
      - POSTGRES_TEST_DB=gatelet_test

volumes:
  postgres-data: