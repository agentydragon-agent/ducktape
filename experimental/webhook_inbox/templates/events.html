<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webhook Inbox</title>
</head>
<body>
  <h1>Webhook Inbox</h1>
  {% if events_count %}
    <h2>{{ events_count }} events seen in interval {{ interval_str }}</h2>
    <pre>{{ encoding }}</pre>
  {% else %}
    <h2>No events in interval {{ interval_str }}</h2>
  {% endif %}
  <p>
    {% if older_link %}| <a href="{{ older_link }}">← Older</a>{% endif %}
    <a href="/">Latest →</a>
  </p>
</body>
</html>
