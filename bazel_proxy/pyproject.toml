[project]
name = "bazel-proxy"
version = "0.0.0"
description = "Local proxy for Bazel access through TLS-inspecting proxies."
authors = [{ name = "Rai" }]
requires-python = ">=3.12,<3.14"
# IMPORTANT: No runtime dependencies allowed.
# This package is used by session-start hooks which run before package installation.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
]

[project.scripts]
bazel-proxy = "bazel_proxy:main"
