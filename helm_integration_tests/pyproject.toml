[project]
name = "ember-integration-tests"
version = "0.0.1"
description = "Integration test harness for Ember object store tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.2",
    "kubernetes>=29.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["helm_integration_tests"]
