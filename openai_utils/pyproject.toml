[project]
name = "openai-utils"
version = "0.1.0"
description = "Pure OpenAI/Pydantic utilities for LLM tooling"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "httpx",
    "tenacity>=8.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
