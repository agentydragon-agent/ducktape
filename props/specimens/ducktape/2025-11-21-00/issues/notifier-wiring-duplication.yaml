rationale: |
  Four notifier factory functions duplicate the same pattern: sync notifier
  schedules broadcast in event loop via `loop.create_task` with
  `add_done_callback` for success/failure logging, fire-and-forget.

  Extract a shared helper. Note: `make_mount_listener` is different (async,
  awaits broadcast) and should not be included.
