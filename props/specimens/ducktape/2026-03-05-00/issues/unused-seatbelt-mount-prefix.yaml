rationale: |
  `SEATBELT_EXEC_MOUNT_PREFIX` is defined in `mcp_infra/constants.py` but
  has no live callers. Its only importer is
  `agent_server/testing/testdata/approval_policy/bad_template.py`, which is
  itself dead: no test calls `fetch_policy("bad_template")` anywhere, and the
  comment in `test_eval_abort.py` confirms the seatbelt template tests were
  explicitly removed ("Seatbelt now accepts only explicit policy.").

  The correct fix is to delete both `bad_template.py` and the constant —
  not to patch `bad_template.py` to inline `MCPMountPrefix("seatbelt_exec")`,
  since there is no point keeping dead testdata alive to preserve a dead constant.
should_flag: true
