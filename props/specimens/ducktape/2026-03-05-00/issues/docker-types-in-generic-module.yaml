rationale: |
  `NetworkMode`, `ContainerImageInfo`, `ContainerImageHistoryEntry`, and
  `ContainerInfo` are Docker-specific types that live in the generic
  `mcp_infra/mcp_types.py` module alongside protocol-level types like
  `McpServerSpecs` and `SimpleOk`. These four types are only imported by
  `mcp_infra/exec/docker/server.py` and `mcp_infra/exec/docker/launcher.py`.
  They should live in a docker-specific module (e.g.,
  `mcp_infra/exec/docker/types.py`) so the generic module only contains
  broadly shared MCP infrastructure types.
