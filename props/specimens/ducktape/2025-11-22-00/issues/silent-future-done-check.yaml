rationale: |
  `approve()` and `reject()` in ApprovalHub check if a future is already
  `.done()` but silently return `{"status": "approved"}` without setting the
  result or logging. This swallows double-approval races (e.g. user clicks
  twice, two UI clients approve the same call_id). Raise an error or return
  a warning instead.
should_flag: true
