rationale: |-
  The same history bookkeeping sequence (ensure file exists, create initial if missing, createVersion when
  content differs, then always createVersion for new content) is duplicated across edit/delete/replace/write
  flows. Extract a small helper in the history package (or tools package) to centralize this logic and make
  intent explicit: EnsureFileVersion(ctx, files, sessionID, filePath, oldContent, newContent).
