[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "props"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.12,<3.14"
dependencies = [
  # Workspace dependencies (container-compatible)
  "agent-core",
  "mcp-infra",
  "openai-utils",
  "agent-container-util",
  "cli-util",
  # Core dependencies
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "typer-di>=0.1.3",
  "uvicorn>=0.30.0",
  "PyYAML",
  "pygit2>=1.18",
  # LLM stack
  "docker>=7.0.0",
  "aiodocker>=0.22.0",
  "tiktoken>=0.7.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1",
  "psycopg2-binary>=2.9",
  "asyncpg>=0.29.0",
  # Visualization
  "plotext>=5.2.0",
  # Other
  "rich>=13.0.0",
  "canonicaljson>=1.6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Orchestration-side only: these packages are used for building/running agents
# from the host, not inside containers. Container CLI commands (props critic-agent,
# etc.) work without these.
# - adgn: agent framework, image building (definition_builder)
# - net-util: Docker network gateway detection, port discovery (agent_setup)
orchestration = [
  "adgn",
  "net-util",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "pytest-mock>=3.10.0",
  "pytest-env>=1.1.3",
  "ruff>=0.5",
  "mypy==1.18.2",
  "sqlalchemy[mypy]>=2.0.32",
  "types-PyYAML",
  "types-docker",
  "types-Jinja2",
]
gepa = [
  "gepa>=0.0.22",
  "litellm>=1.0.0",
  "nest-asyncio>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/props"]

[tool.hatch.build.targets.wheel.force-include]
"src/props/docs" = "props/docs"

[tool.hatch.build]
exclude = [
  "*.pyc",
  "__pycache__",
  ".git",
]

[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"
log_cli_format = "%(asctime)s.%(msecs)03d %(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = [
    "-n=4",
    "--dist=loadscope",
    "-m",
    "not live_llm and not requires_production_specimens",
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--durations=25",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "live_llm: live LLM tests requiring network/API keys",
    "requires_docker: tests that require Docker to run",
    "requires_postgres: tests that require PostgreSQL database to run",
    "requires_production_specimens: tests that sync production specimens",
]
env = [
    "GIT_CONFIG_NOSYSTEM=1",
    "GIT_CONFIG_GLOBAL=/dev/null",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
props = "props.cli.main:app"

[tool.uv.sources]
adgn = { workspace = true }
agent-core = { workspace = true }
mcp-infra = { workspace = true }
openai-utils = { workspace = true }
agent-container-util = { workspace = true }
cli-util = { workspace = true }
net-util = { workspace = true }
