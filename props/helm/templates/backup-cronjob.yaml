{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "props.fullname" . }}-backup
  labels:
    {{- include "props.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "props.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.postgresql.image.registry | default "docker.io" }}/{{ .Values.postgresql.image.repository | default "bitnami/postgresql" }}:{{ .Values.postgresql.image.tag | default "17" }}"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/props_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" | gzip > "${BACKUP_FILE}"
                  echo "Backup complete: $(du -h "${BACKUP_FILE}" | cut -f1)"
                  # Clean up old backups
                  DELETED=$(find /backups -name "props_*.sql.gz" -mtime +{{ .Values.backup.retention.days }} -delete -print | wc -l)
                  echo "Deleted ${DELETED} backups older than {{ .Values.backup.retention.days }} days"
              env:
                - name: PGHOST
                  value: {{ include "props.fullname" . }}-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgresql.auth.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "props.fullname" . }}-postgresql
                      key: postgres-password
              volumeMounts:
                {{- if .Values.backup.persistence.enabled }}
                - name: backups
                  mountPath: /backups
                {{- end }}
          volumes:
            {{- if .Values.backup.persistence.enabled }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "props.fullname" . }}-backup
            {{- end }}
{{- end }}
