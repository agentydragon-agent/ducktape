[project]
name = "props-core"
version = "0.0.0"
authors = [{name = "Rai"}]
requires-python = ">=3.12"
dependencies = [
  # Core dependencies
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "typer-di>=0.1.3",
  "uvicorn>=0.30.0",
  "PyYAML",
  "pygit2>=1.18",
  # LLM stack
  "docker>=7.0.0",
  "aiodocker>=0.22.0",
  "tiktoken>=0.7.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1",
  "psycopg2-binary>=2.9",
  "asyncpg>=0.29.0",
  # Visualization
  "plotext>=5.2.0",
  # Other
  "rich>=13.0.0",
  "canonicaljson>=1.6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "pytest-mock>=3.10.0",
  "pytest-env>=1.1.3",
  "ruff>=0.5",
  "mypy==1.18.2",
  "sqlalchemy[mypy]>=2.0.32",
  "types-PyYAML",
  "types-docker",
  "types-Jinja2",
]
gepa = [
  "gepa>=0.0.22",
  "litellm>=1.0.0",
  "nest-asyncio>=1.5.0",
]
