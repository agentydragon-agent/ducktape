[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tana-export"
version = "0.0.0"
description = "Tools for exporting and transforming Tana data (Markdown, TanaPaste, search materialization)."
authors = [{ name = "Rai" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.5",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-env>=1.1",
  "pytest-mock>=3.10",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "ruff>=0.5",
  "mypy>=1.14",
]

[project.scripts]
tana-export = "tana.export.cli:main"
tana-export-convert = "tana.export.convert:main"
tana-export-searches = "tana.export.materialize_searches:main"
tana-export-issues = "tana.export.tana_issues_to_tanapaste:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tana*"]

[tool.setuptools.package-data]
"tana.export" = [
  "references/*",
  "references/**/*",
  "headless_autoexport/*",
  "headless_autoexport/**/*",
  "assets/*",
  "assets/**/*",
  "SEARCH_README.md",
  "compression_examples.md",
  "search_node_analysis.md",
  "NOTES.txt",
]

[tool.pytest.ini_options]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "--disable-warnings",
]
testpaths = ["tests"]


[tool.mypy]
packages = ["tana"]
python_version = "3.11"
ignore_missing_imports = true
