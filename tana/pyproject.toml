[project]
name = "tana-export"
version = "0.0.0"
description = "Tools for exporting and transforming Tana data (Markdown, TanaPaste, search materialization)."
authors = [{ name = "Rai" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.5",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-env>=1.1",
  "pytest-mock>=3.10",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.0",
  "ruff>=0.5",
  "mypy>=1.14",
]
