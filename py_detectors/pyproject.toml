[project]
name = "py-detectors"
version = "0.1.0"
description = "AST-based Python code detectors for style/quality issues"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

