[project]
name = "py-detectors"
version = "0.1.0"
description = "AST-based Python code detectors for style/quality issues"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
py-detectors = "py_detectors.__main__:main"
py-detectors-custom = "py_detectors.cli_custom:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_detectors"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

