[defaults]
action_plugins = ./ansible/plugins/action
module_utils = ./ansible/plugins/module_utils
inventory = ./ansible/inventory.yaml
connection_plugins = ./ansible/plugins/connection
vault_identity_list = default@./ansible/tools/vault_pass.sh
vault_encrypt_identity = default
roles_path = ./ansible/roles

# Use more human-readable output without deprecated callback
stdout_callback = ansible.builtin.default
result_format = yaml
# Other options: debug, json, minimal, oneline, tree

# Show task timing
callback_whitelist = timer, profile_tasks

# Don't show skipped hosts
display_skipped_hosts = false
