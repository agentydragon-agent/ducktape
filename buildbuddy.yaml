# BuildBuddy Workflows Configuration
#
# Runs Bazel build/test/lint on BuildBuddy RBE for faster CI.
# Non-Bazel tasks (ansible-lint, nix-flake-check, pre-commit) remain in GitHub Actions.
#
# BuildBuddy docs: https://www.buildbuddy.io/docs/workflows-config/
#
# RBE is NOT auto-enabled by BuildBuddy Workflows (only remote cache + BES are).
# We pass --config=rbe (defined in .bazelrc) to enable remote execution.
# See: https://www.buildbuddy.io/docs/rbe-setup/

actions:
  - name: "CI"
    triggers:
      push:
        branches:
          - main
          - master
          - devel
      pull_request: {}

    # Use Ubuntu 24.04 for glibc 2.39 (Node.js 22.11.0 requires glibc 2.28+)
    # BuildBuddy Workflows only supports predefined Ubuntu images, not custom images
    # like ghcr.io/agentydragon/rbe-worker. RBE workers still use the custom image.
    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    bazel_commands:
      # 1. Run all tests (excluding live OpenAI API tests)
      - >
        test
        --keep_going
        --config=rbe
        --build_metadata=ROLE=ci
        --build_metadata=TAGS=test
        --test_tag_filters=-live_openai_api
        --test_env=CI=true
        --test_env=BUILDBUDDY_WORKFLOWS=true
        //...

      # 2. Build + lint + typecheck + rust-check (all quality checks in one pass)
      # Lint runs by default: ruff, ESLint, mypy, clippy, rustfmt.
      # Use local strategy for mypy to avoid sandbox copying overhead.
      - >
        build
        --keep_going
        --config=rbe
        --strategy=mypy=local
        --build_metadata=ROLE=ci
        --build_metadata=TAGS=check
        //...

  # Release action: test, build all artifacts, upload to GitHub Releases, dispatch GHA nix-pin.
  # Only triggers on push to main/devel (not PRs).
  - name: "Release"
    triggers:
      push:
        branches:
          - main
          - devel
      workflow_dispatch: {}

    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    steps:
      - run: |
          bazel test --keep_going --config=rbe \
            --build_metadata=ROLE=ci \
            --test_tag_filters=-live_openai_api \
            --test_env=CI=true \
            //...
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y \
            libcairo2-dev libgirepository-2.0-dev libdbus-1-dev libxcb1-dev pkg-config
          bazel build --config=rbe --remote_download_toplevel \
            //:wheel \
            //:claude_hooks_wheel \
            //gterm_theme:wheel \
            //skills:all_skills_tar \
            //devinfra/buildbuddy_cli:bbapi
      - run: |
          # Install gh CLI for creating releases and dispatching workflows.
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/gh.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/gh.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y gh
      - run: |
          export GH_TOKEN="$GH_RELEASE_PAT"
          mkdir -p dist
          cp bazel-bin/claude_hooks-*.whl dist/
          cp bazel-bin/ducktape-*.whl dist/
          cp bazel-bin/gterm_theme/gterm_theme-*.whl dist/
          cp bazel-bin/skills/all_skills_tar.tar dist/skills.tar
          cp bazel-bin/devinfra/buildbuddy_cli/bbapi_/bbapi dist/

          SHORT_SHA=$(git rev-parse --short HEAD)

          # SRI hash of a file, matching the format npins stores in sources.json.
          sri_hash() { echo "sha256-$(openssl dgst -sha256 -binary "$1" | base64 | tr -d '\n')"; }

          # Hash currently pinned in npins/sources.json for a package (empty if absent).
          pinned_hash() { python3 -c "import json,sys;d=json.load(open('npins/sources.json'));print(d.get('pins',{}).get(sys.argv[1],{}).get('hash',''))" "$1"; }

          changed=()

          # Create a release only when the built artifact differs from the current pin.
          maybe_release() {
            local pkg="$1" tag="$2" title="$3" body="$4" file="$5"
            local new_hash old_hash
            new_hash=$(sri_hash "$file")
            old_hash=$(pinned_hash "$pkg")
            if [ "$new_hash" = "$old_hash" ]; then
              echo "$pkg: unchanged, skipping"
              return
            fi
            echo "$pkg: content changed, creating release $tag"
            gh release create "$tag" --title "$title" --notes "$body" --latest=false "$file"
            changed+=("$pkg")
          }

          maybe_release "claude-hooks" "claude-hooks-$SHORT_SHA" \
            "claude-hooks ($SHORT_SHA)" "claude-hooks wheel for Claude Code integration." \
            dist/claude_hooks-*.whl
          maybe_release "ducktape" "ducktape-$SHORT_SHA" \
            "ducktape ($SHORT_SHA)" "ducktape wheel containing CLI tools." \
            dist/ducktape-*.whl
          maybe_release "gterm-theme" "gterm-theme-$SHORT_SHA" \
            "gterm-theme ($SHORT_SHA)" "gterm-theme wheel (GNOME Terminal theme follower)." \
            dist/gterm_theme-*.whl
          maybe_release "skills" "skills-$SHORT_SHA" \
            "skills ($SHORT_SHA)" "Skills tarball for AI agent deployment." \
            dist/skills.tar
          maybe_release "bbapi" "bbapi-$SHORT_SHA" \
            "bbapi ($SHORT_SHA)" "bbapi — BuildBuddy API CLI (Linux x86_64)." \
            dist/bbapi

          if [ ${#changed[@]} -eq 0 ]; then
            echo "No artifacts changed, skipping release"
            exit 0
          fi

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          gh workflow run release.yml \
            --ref "$BRANCH" \
            --field short_sha="$SHORT_SHA" \
            --field "changed=${changed[*]}"

  # Push Harbor container images (OCI images built with Bazel).
  # Uses oci_push (crane-based, no Docker daemon needed).
  # The CI action's `bazel build //...` populates the remote cache;
  # bazel run here fetches built images from cache and pushes via crane.
  - name: "Push Harbor Images"
    triggers:
      push:
        branches:
          - main
          - devel
      workflow_dispatch: {}

    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    steps:
      - run: |
          # Authenticate crane to Harbor registry.
          # oci_push reads ~/.docker/config.json for credentials.
          mkdir -p ~/.docker
          AUTH=$(echo -n "${HARBOR_ROBOT_USERNAME}:${HARBOR_ROBOT_TOKEN}" | base64)
          cat > ~/.docker/config.json <<ENDJSON
          {"auths":{"registry.allegedly.works":{"auth":"${AUTH}"}}}
          ENDJSON
      - run: |
          # Install crane for tagging images after push.
          CRANE_VERSION=0.20.3
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - -C /usr/local/bin crane
      - run: |
          # Push images sequentially. bazel run builds (hitting RBE cache
          # from the CI action) then executes crane push with :latest.
          # After each push, crane tags with {branch}-YYYYMMDDHHMMSS-{sha7}
          # so Flux ImagePolicy can track deployable versions.
          set -e
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short=7 HEAD)
          PINNED_TAG="${BRANCH}-${TS}-${SHA}"

          push_and_tag() {
            local target="$1" repo="$2"
            echo "Pushing $target"
            bazel run --config=rbe --remote_download_toplevel "$target"
            echo "Tagging ${repo}:latest -> ${repo}:${PINNED_TAG}"
            crane tag "${repo}:latest" "${PINNED_TAG}"
          }

          push_and_tag //cluster/k8s/inventree/token-provisioner:push registry.allegedly.works/ducktape/token-provisioner
          push_and_tag //props/backend:push registry.allegedly.works/ducktape/props-backend
          push_and_tag //airlock:push registry.allegedly.works/ducktape/airlock
          push_and_tag //airlock/auth_proxy:push registry.allegedly.works/ducktape/auth-proxy
          push_and_tag //mcp_infra/exec:direct_push registry.allegedly.works/ducktape/exec-backend
          push_and_tag //openclaw/exec:push registry.allegedly.works/ducktape/openclaw-exec
          push_and_tag //homeassistant/proxy:push registry.allegedly.works/ducktape/homeassistant-proxy
          push_and_tag //inventree_utils/rai_plugin:push registry.allegedly.works/ducktape/inventree
          push_and_tag //tana/token_broker:push registry.allegedly.works/ducktape/tana-token-broker
          push_and_tag //third_party/activitywatch:push registry.allegedly.works/ducktape/aw-server
