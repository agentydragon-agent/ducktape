[project]
name = "net-util"
version = "0.1.0"
description = "Network utilities - port discovery and Docker network helpers"
requires-python = ">=3.12"
dependencies = [
    "tenacity>=8.2.0",
    "aiodocker>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/net_util"]
