[project]
name = "sysrw"
version = "0.1.0"
description = "System rewriter for LLM prompts"
requires-python = ">=3.13"
# Local workspace dep (openai-utils) handled by Bazel deps
dependencies = [
    "anthropic",
    "jinja2",
    "openai>=1.0",
    "pydantic>=2.0",
    "rich",
    "tiktoken",
    "typer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysrw"]
