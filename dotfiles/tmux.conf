# Enable mouse support (scroll, select text, switch panes, resize panes)
set -g mouse on

# Allow programs to change the terminal title
set -g set-titles on
# Format: session:window.pane program
set -g set-titles-string '#S:#I.#P #W'

# Enable pane border titles
set -g pane-border-status top
# Show pane title (if set) or fall back to current command
set -g pane-border-format ' #{?pane_title,#{pane_title},#{pane_current_command}} '

# Allow programs to set pane title via escape sequence
set -g allow-rename on

# Allow programs to rename windows automatically
set -g automatic-rename on

# Vi mode for copy mode
setw -g mode-keys vi

# Copy to system clipboard (Linux with xclip)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
