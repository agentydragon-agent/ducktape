global:
  exclude:
    - .git
    - .gitattributes
    - .github
    - .gitignore
    - '**/.gitkeep'
    - requirements*.txt
    - .pre-commit-config.yaml
    - 'CODE_OF_CONDUCT.*'
    - 'LICENSE.*'
    - 'CONTRIBUTING.*'

    - '*.jpg'
    - '*.png'
    - '*.woff2'
    - '*.sha256'
    - '**/po/*.po'
    - '**/locale/**/*.mo'
    - '*.egg-info*'
    - '*__pycache__*'
