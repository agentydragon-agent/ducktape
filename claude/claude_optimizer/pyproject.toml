[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude_optimizer"
version = "0.1.0"

dependencies = [
    "openai>=1.0.0",
    "anthropic",
    "claude-code-sdk",
    "pydantic>=2.0.0",
    "structlog",
    "plotnine",
    "pandas",
    "numpy",
    "pyyaml",
    "tiktoken",
    "docker",
    "pathspec",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    # Type stubs
    "types-requests",
    "types-PyYAML", 
    "types-setuptools",
    "types-docutils",
    "pandas-stubs",
]

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = []

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "plotnine.*", 
    "tiktoken.*",
    "pathspec.*",
    "claude_code_sdk.*",
    "openai.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotnine.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "claude_optimizer.plots"
ignore_errors = true
