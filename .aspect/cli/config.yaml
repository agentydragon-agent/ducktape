# Aspect CLI configuration
# Docs: https://docs.aspect.build/cli/

lint:
  aspects:
    # Python
    - //tools/lint:linters.bzl%ruff
    - //tools/lint:linters.bzl%mypy_aspect
    # JavaScript/TypeScript
    - //tools/lint:linters.bzl%eslint

# TODO: Future linter aspects (requires aspect_rules_lint >= 1.13.0 which has compat issues):
# - yamllint: YAML linting (currently via pre-commit / bazel run //tools/yamllint)
# - clippy: Rust linting (currently via bazel lint --config=rust-check)

