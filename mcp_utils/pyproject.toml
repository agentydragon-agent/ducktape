[project]
name = "mcp-utils"
version = "0.1.0"
description = "Minimal MCP utilities for resource content extraction"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_utils"]
