apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  annotations:
    # Request a specific IP for ingress
    metallb.universe.tf/loadBalancerIPs: 10.0.200.100
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 443
      protocol: TCP