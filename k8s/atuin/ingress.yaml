---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atuin
  namespace: default
  annotations:
    # Atuin uses HTTP, no special config needed
    ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: traefik
  rules:
  - host: atuin.k3s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: atuin-server
            port:
              number: 8888