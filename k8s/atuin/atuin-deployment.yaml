apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-server
  labels:
    app: atuin
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atuin
      component: server
  template:
    metadata:
      labels:
        app: atuin
        component: server
    spec:
      containers:
      - name: atuin
        image: ghcr.io/atuinsh/atuin:latest
        command: ["atuin", "server", "start"]
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: ATUIN_CONFIG_DIR
          value: /config
        - name: ATUIN_DB_URI
          valueFrom:
            secretKeyRef:
              name: atuin-postgres
              key: db-uri
        - name: RUST_LOG
          value: info
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: atuin-config
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']