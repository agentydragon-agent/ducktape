apiVersion: v1
kind: Service
metadata:
  name: atuin-server
  labels:
    app: atuin
    component: server
spec:
  type: ClusterIP  # Will be accessed via pod's Tailscale IP
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: http
  selector:
    app: atuin
    component: server