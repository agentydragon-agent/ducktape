---
# Self-signed ClusterIssuer for bootstrapping
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
---
# Create a CA certificate for the homelab
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Homelab CA
  secretName: homelab-ca-secret
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - homelab
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
---
# CA issuer that signs other certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-ca-secret