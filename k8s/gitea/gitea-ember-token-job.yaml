apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-ember-bootstrap
  namespace: gitea
spec:
  template:
    spec:
      serviceAccountName: gitea-ember-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: configure-ember
          image: gitea/gitea:1.22.3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA_WORK_DIR
              value: "/data"
            - name: GITEA_CUSTOM
              value: "/data/gitea"
            - name: GITEA_BASE_URL
              value: http://gitea-http:3000
            - name: EMBER_USERNAME
              value: ember-bot
            - name: EMBER_EMAIL
              value: ember-bot@internal
            - name: EMBER_NAMESPACE
              value: ember
            - name: EMBER_SECRET_NAME
              value: gitea-ember-token
            - name: EMBER_TOKEN_NAME
              value: ember-agent-token
            - name: EMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-ember-credentials
                  key: ember-password
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "Installing python runtime..."
              apk add --no-cache python3 py3-requests >/dev/null
              python3 /scripts/ember_pat.py
          volumeMounts:
            - name: gitea-config
              mountPath: /data
            - name: bootstrap-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: gitea-config
          persistentVolumeClaim:
            claimName: gitea-shared-storage
        - name: bootstrap-scripts
          configMap:
            name: gitea-ember-bootstrap
            defaultMode: 0750
