apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ember-history
  namespace: ember
  labels:
    app.kubernetes.io/name: ember
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path  # k3s default storage class
  resources:
    requests:
      storage: 5Gi
