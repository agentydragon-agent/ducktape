apiVersion: apps/v1
kind: Deployment
metadata:
  name: ember
  namespace: ember
  labels:
    app.kubernetes.io/name: ember
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ember
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ember
        app.kubernetes.io/component: agent
    spec:
      restartPolicy: Always
      containers:
        - name: emberd
          image: registry.k3s.local/emberd:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MATRIX_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: matrix_base_url
            - name: MATRIX_ADMIN_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: matrix_admin_user_id
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: openai_model
            - name: OPENAI_REASONING_EFFORT
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: openai_reasoning_effort
            - name: OPENAI_INCLUDE_ENCRYPTED_REASONING
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: openai_include_encrypted_reasoning
            - name: PILOT_STATE_DIR
              valueFrom:
                configMapKeyRef:
                  name: ember-config
                  key: pilot_state_dir
          volumeMounts:
            - name: history
              mountPath: /var/lib/ember
            - name: runtime-secrets
              mountPath: /var/run/ember/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: ember-history
        - name: runtime-secrets
          projected:
            sources:
              - secret:
                  name: matrix-ember-token
                  items:
                    - key: access_token
                      path: matrix_access_token
              - secret:
                  name: gitea-ember-token
                  items:
                    - key: username
                      path: gitea_username
                    - key: token
                      path: gitea_token
                    - key: token_name
                      path: gitea_token_name
              - secret:
                  name: openai-api
                  items:
                    - key: api_key
                      path: openai_api_key
