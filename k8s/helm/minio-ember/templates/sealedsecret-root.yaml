{{- if and .Values.sealedSecrets.root.enabled (gt (len .Values.sealedSecrets.root.encryptedData) 0) }}
{{ include "common.sealedSecret" (dict
  "context" .
  "namespace" .Values.namespace.name
  "name" (.Values.sealedSecrets.root.name | default (printf "%s-root" (include "minio-ember.fullname" .)))
  "encryptedData" .Values.sealedSecrets.root.encryptedData
  "component" "storage"
) }}
{{- end }}
