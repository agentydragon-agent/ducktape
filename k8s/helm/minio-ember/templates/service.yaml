apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio-ember.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "minio-ember.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "minio-ember.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
{{- if .Values.console.enabled }}
    - name: console
      port: {{ .Values.console.servicePort }}
      targetPort: console
{{- end }}
