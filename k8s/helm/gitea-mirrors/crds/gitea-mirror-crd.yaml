apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: giteamirrors.gitea.io
spec:
  group: gitea.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - url
            properties:
              url:
                type: string
                description: Source repository URL to mirror
              interval:
                type: string
                default: "6h"
                description: Sync interval (e.g., 10m, 1h, 24h)
              private:
                type: boolean
                default: false
                description: Whether the mirror should be private
          status:
            type: object
            properties:
              state:
                type: string
                enum: ["pending", "created", "syncing", "error"]
              lastSync:
                type: string
              message:
                type: string
  scope: Namespaced
  names:
    plural: giteamirrors
    singular: giteamirror
    kind: GiteaMirror
    shortNames:
    - gm