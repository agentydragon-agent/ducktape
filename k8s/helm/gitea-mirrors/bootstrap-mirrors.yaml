# Bootstrap list of public repositories to mirror
# Run this after Gitea is deployed to create the initial mirrors

mirrors:
  # External repos you currently have
  - name: openai-openai-python
    url: https://github.com/openai/openai-python
    interval: 2h
    
  - name: openai-openai-cookbook
    url: https://github.com/openai/openai-cookbook
    interval: 24h
    
  - name: helmfile-helmfile
    url: https://github.com/helmfile/helmfile
    interval: 6h
    
  - name: nvim-orgmode-orgmode
    url: https://github.com/nvim-orgmode/orgmode
    interval: 12h
    
  - name: chipsenkbeil-org-roam.nvim
    url: https://github.com/chipsenkbeil/org-roam.nvim
    interval: 24h
    
  - name: musistudio-llms
    url: https://github.com/musistudio/llms
    interval: 24h
    
  - name: juanfont-headscale
    url: https://github.com/juanfont/headscale
    interval: 6h
    
  - name: typokign-matrix-chart
    url: https://github.com/typokign/matrix-chart
    interval: 12h
    
  - name: All-Hands-AI-OpenHands
    url: https://github.com/All-Hands-AI/OpenHands
    interval: 4h
    
  # Anyproto ecosystem
  - name: anyproto-any-sync
    url: https://github.com/anyproto/any-sync
    interval: 6h
    
  - name: anyproto-any-sync-node
    url: https://github.com/anyproto/any-sync-node
    interval: 12h
    
  - name: anyproto-any-sync-filenode
    url: https://github.com/anyproto/any-sync-filenode
    interval: 12h
    
  - name: anyproto-any-sync-coordinator
    url: https://github.com/anyproto/any-sync-coordinator
    interval: 12h
    
  - name: anyproto-any-sync-consensusnode
    url: https://github.com/anyproto/any-sync-consensusnode
    interval: 12h
    
  - name: anyproto-any-block
    url: https://github.com/anyproto/any-block
    interval: 12h
    
  - name: anyproto-any-store
    url: https://github.com/anyproto/any-store
    interval: 12h
    
  - name: anyproto-anytype-heart
    url: https://github.com/anyproto/anytype-heart
    interval: 4h
    
  - name: anyproto-anytype-ts
    url: https://github.com/anyproto/anytype-ts
    interval: 4h
    
  - name: anyproto-anytype-api
    url: https://github.com/anyproto/anytype-api
    interval: 12h
    
  - name: anyproto-anytype-test
    url: https://github.com/anyproto/anytype-test
    interval: 12h
    
  - name: anyproto-anytype-push-server
    url: https://github.com/anyproto/anytype-push-server
    interval: 24h
    
  - name: anyproto-anytype-mcp
    url: https://github.com/anyproto/anytype-mcp
    interval: 12h
    
  - name: anyproto-docs
    url: https://github.com/anyproto/docs
    interval: 24h
    
  - name: anyproto-gallery
    url: https://github.com/anyproto/gallery
    interval: 24h
    
  - name: anyproto-open
    url: https://github.com/anyproto/open
    interval: 24h
    
  # Logseq
  - name: logseq-logseq
    url: https://github.com/logseq/logseq
    interval: 4h
    
  - name: logseq-docs
    url: https://github.com/logseq/docs
    interval: 24h

  # Additional useful repos you might want
  - name: go-gitea-gitea
    url: https://github.com/go-gitea/gitea
    interval: 6h
    
  - name: traefik-traefik
    url: https://github.com/traefik/traefik
    interval: 12h
    
  - name: cert-manager-cert-manager
    url: https://github.com/cert-manager/cert-manager
    interval: 12h