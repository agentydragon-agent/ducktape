# Gitea Mirrors - wrapper chart values

namespace: gitea

# Controller configuration
controller:
  image: gitea-mirror-controller:latest
  imagePullPolicy: IfNotPresent
  giteaUrl: http://gitea-mirrors:3000
  giteaUser: gitea_admin

# Global mirror settings
global:
  syncInterval: "6h"

# List of repositories to mirror
# Names will be automatically derived from URLs
mirrors:
  - url: https://github.com/openai/openai-python
  - url: https://github.com/openai/openai-cookbook
  - url: https://github.com/helmfile/helmfile
  - url: https://github.com/nvim-orgmode/orgmode
  - url: https://github.com/chipsenkbeil/org-roam.nvim
  - url: https://github.com/musistudio/llms
  - url: https://github.com/juanfont/headscale
  - url: https://github.com/typokign/matrix-chart
  - url: https://github.com/All-Hands-AI/OpenHands
  - url: https://github.com/anyproto/any-sync
  - url: https://github.com/anyproto/anytype-heart
  - url: https://github.com/anyproto/anytype-ts
  - url: https://github.com/logseq/logseq
  - url: https://github.com/go-gitea/gitea
  - url: https://github.com/traefik/traefik
  - url: https://github.com/cert-manager/cert-manager
# Passes configuration to the gitea subchart

# Storage configuration for our custom PVC
storage:
  size: 200Gi
  hostPath:
    enabled: true
    path: "/mnt/gitea-mirrors"
    nodeName: k3s-master
    nodeName: k3s-master  # Pin to master node where we'll mount the virtiofs
  zfs:
    enabled: false  # ZFS not available on k3s VMs
    storageClassName: "zfs-tank-git"
    datasetName: "gitea-public-mirrors"

# PostgreSQL subchart - disabled
postgresql:
  enabled: false

# Pass all gitea configuration to the gitea subchart
gitea:
  persistence:
    enabled: true
    create: false
    claimName: gitea-mirrors-data
    create: false  # Don't create a new PVC
    claimName: gitea-mirrors-data  # Use our ZFS PVC
    
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  redis-cluster:
    enabled: false
    
  gitea:
    admin:
      username: agentydragon
      email: agentydragon@gmail.com
      
    config:
      APP_NAME: "Public Repository Mirrors"
      server:
        DOMAIN: mirrors.git.k3s.agentydragon.com
        ROOT_URL: https://mirrors.git.k3s.agentydragon.com/
        LANDING_PAGE: explore
        DISABLE_SSH: true
      service:
        DISABLE_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: false
      repository:
        DEFAULT_PRIVATE: false
        FORCE_PRIVATE: false
        ENABLE_PUSH_CREATE_USER: false
        ENABLE_PUSH_CREATE_ORG: false
      mirror:
        ENABLED: true
        DEFAULT_INTERVAL: 1h
        MIN_INTERVAL: 10m
      database:
        DB_TYPE: sqlite3