{{- if .Values.sealedSecret.enabled }}
{{- $encrypted := dict "api_key" (required "sealedSecret.encryptedData.api_key is required when sealedSecret.enabled=true" .Values.sealedSecret.encryptedData.api_key) -}}
{{- $secretName := default (include "common.fullname" .) .Values.sealedSecret.name -}}
{{ include "common.sealedSecret" (dict "context" . "namespace" .Release.Namespace "name" $secretName "component" "openai-probe" "annotations" (.Values.sealedSecret.annotations | default (dict)) "encryptedData" $encrypted) }}
{{- end }}
