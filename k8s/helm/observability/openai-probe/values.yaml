nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry.registry.svc.cluster.local:5000/openai-probe
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  openaiSecretName: openai-api
  openaiSecretKey: api_key
  timescaledbSecretName: timescaledb-secret
  timescaledbSecretKey: postgres-password
  extra: []

sealedSecret:
  enabled: true
  name: openai-api
  encryptedData:
    api_key: ""
  annotations: {}

args:
  - "--concurrency"
  - "64"
  - "--stream"
  - "--continuous"
  - "--max-tokens"
  - "100"
  - "--fast-qps"
  - "0.3"
  - "--slow-qps"
  - "0.05"
  - "--drop-regex"
  - "(?i)(:ft:|\\bft-\\b|\\b-ft\\b|fine[-_ ]?tune|fine[-_ ]?tuned)|^ft:|\\b(ada|curie|babbage|davinci|d1[26])\\b|\\bgpt[-_ ]?3(\\b|[.-])|(?<![a-z0-9])gpt[-_ ]?4o(?![a-z0-9])|\\bgpt[-_ ]?4\\.1-(mini|nano)\\b|\\bgpt[-_ ]?5-(mini|nano)\\b|\\bo[13]-mini\\b|-rm-"
  - "--tag"
  - "key_prefix=t9f"
  - "--tag"
  - "key_suffix=Wt5"

service:
  port: 8080

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 15

podLabels:
  app.kubernetes.io/part-of: observability

podAnnotations: {}

nodeSelector: {}
affinity: {}
tolerations: []
