{{- $secretName := .Values.sealedSecrets.postgres.name | default (include "guacamole.dbSecretName" .) -}}
{{- if and .Values.sealedSecrets.postgres.enabled .Values.sealedSecrets.postgres.encryptedData }}
{{ include "common.sealedSecret" (dict
  "context" .
  "namespace" .Release.Namespace
  "name" $secretName
  "component" "credentials"
  "annotations" (.Values.sealedSecrets.postgres.annotations | default (dict))
  "encryptedData" .Values.sealedSecrets.postgres.encryptedData
) }}
{{- else if .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "credentials")) | nindent 4 }}
stringData:
  {{ include "guacamole.userSecretKey" . }}: {{ .Values.postgres.password | quote }}
  {{ include "guacamole.adminSecretKey" . }}: {{ .Values.postgres.password | quote }}
  replication-password: {{ .Values.postgres.password | quote }}
  {{ include "guacamole.envSecretKey" . }}: {{ .Values.postgres.password | quote }}
{{- end }}
