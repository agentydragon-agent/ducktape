synapse:
  image: matrixdotorg/synapse:latest
  serverName: matrix.k3s.agentydragon.com
  publicBaseUrl: https://matrix.k3s.agentydragon.com/
  reportStats: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  service:
    type: ClusterIP
    port: 8008
  ingress:
    enabled: true
    className: traefik
    host: matrix.k3s.agentydragon.com
    tlsSecretName: ""
    entrypoints: web,websecure
    annotations: {}

  admin:
    user: admin
    # The password is provided via Secret/SealedSecret

  ember:
    namespace: ember
    user: ember-bot
    secretName: matrix-ember-token

  oidc:
    enabled: true
    idpId: authentik
    idpName: "Sign in with Authentik"
    issuer: https://auth.k3s.agentydragon.com/application/o/matrix/
    clientId: matrix-synapse
    pkce_method: always  # Require PKCE (S256) to align with Authentik's advertised capabilities
    scopes:
      - openid
      - profile
      - email
    allowExistingUsers: true
    claimRequirements:
      - claim: groups
        value: matrix-users
    subjectClaim: preferred_username
    displayNameTemplate: "{{ user.display_name or user.preferred_username }}"
    localpartTemplate: "{{ user.preferred_username }}"
    emailTemplate: "{{ user.email }}"
    clientSecretKey: oidc-client-secret
    debug:
      enableParseLogging: true

  secrets:
    name: synapse-secrets
    # If not using sealedSecrets, set plain Secret data here for dev only (base64-encoded)
    registrationSharedSecretB64: ""
    adminPasswordB64: ""
    oidcClientSecretB64: ""

sealedSecrets:
  enabled: true
  name: synapse-secrets
  encryptedData:
    registration-shared-secret: 
    admin-password: 
    ember-password: 
    oidc-client-secret: 

element:
  enabled: true
  image: vectorim/element-web:latest
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: matrix.k3s.agentydragon.com
    path: /element
    tlsSecretName: ""
    entrypoints: web,websecure
    annotations: {}
