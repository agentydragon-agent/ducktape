{{- if .Values.element.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-stack.fullname" . }}-element-config
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "{{ .Values.synapse.publicBaseUrl }}",
          "server_name": "{{ .Values.synapse.serverName }}"
        }
      },
      "disable_custom_urls": false,
      "brand": "Element",
      "showLabsSettings": true
    }
{{- end }}

