{{- if and .Values.element.enabled .Values.element.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "matrix-stack.fullname" . }}-element
  annotations:
{{- if .Values.element.ingress.entrypoints }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.element.ingress.entrypoints | quote }}
{{- end }}
    traefik.ingress.kubernetes.io/router.priority: "{{ .Values.element.ingress.priority | default 10 }}"
    # Strip the /element prefix and redirect bare /element to /element/
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "matrix-stack.fullname" . }}-redirect-element@kubernetescrd,{{ include "matrix-stack.fullname" . }}-strip-element@kubernetescrd
{{- if .Values.element.ingress.annotations }}
{{ toYaml .Values.element.ingress.annotations | indent 4 }}
{{- end }}
spec:
  ingressClassName: {{ .Values.element.ingress.className | quote }}
  rules:
    - host: {{ .Values.element.ingress.host | quote }}
      http:
       paths:
          - path: {{ default "/element" .Values.element.ingress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix-stack.fullname" . }}-element
                port:
                  number: {{ .Values.element.service.port }}
          - path: {{ printf "%s/" (trimSuffix "/" (default "/element" .Values.element.ingress.path)) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix-stack.fullname" . }}-element
                port:
                  number: {{ .Values.element.service.port }}
  {{- if .Values.element.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.element.ingress.host | quote }}]
      secretName: {{ .Values.element.ingress.tlsSecretName | quote }}
  {{- end }}
{{- end }}
