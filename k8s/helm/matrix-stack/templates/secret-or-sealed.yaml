{{- if .Values.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecrets.name }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
spec:
  encryptedData:
{{- if .Values.sealedSecrets.encryptedData }}
{{ toYaml .Values.sealedSecrets.encryptedData | indent 4 }}
{{- else }}
    # registration-shared-secret: "<sealed>"
    # admin-password: "<sealed>"
{{- end }}
  template:
    metadata:
      name: {{ .Values.sealedSecrets.name }}
    type: Opaque
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.synapse.secrets.name }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
type: Opaque
data:
  # For dev only; prefer sealed secrets
  registration-shared-secret: {{ default "" .Values.synapse.secrets.registrationSharedSecretB64 | quote }}
  admin-password: {{ default "" .Values.synapse.secrets.adminPasswordB64 | quote }}
{{- if and .Values.synapse.oidc.enabled .Values.synapse.secrets.oidcClientSecretB64 }}
  {{ .Values.synapse.oidc.clientSecretKey }}: {{ .Values.synapse.secrets.oidcClientSecretB64 | quote }}
{{- end }}
{{- end }}
