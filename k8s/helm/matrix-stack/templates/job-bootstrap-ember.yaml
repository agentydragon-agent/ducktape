apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "matrix-stack.fullname" . }}-bootstrap-ember
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: {{ include "matrix-stack.fullname" . }}-ember-bootstrap
      restartPolicy: OnFailure
      initContainers:
{{ include "matrix-stack.render-config-init" . | indent 8 }}
      containers:
        - name: register-ember
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              pip install --no-cache-dir kubernetes requests && python /scripts/ember_bootstrap.py
{{ include "matrix-stack.render-config-env" . | indent 10 }}
            - name: SYNAPSE_HOMESERVER
              value: {{ include "matrix-stack.synapse-internal-url" . | quote }}
            - name: EMBER_USERNAME
              value: {{ .Values.synapse.ember.user | quote }}
            - name: EMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ternary .Values.sealedSecrets.name .Values.synapse.secrets.name .Values.sealedSecrets.enabled }}
                  key: ember-password
            - name: EMBER_NAMESPACE
              value: {{ .Values.synapse.ember.namespace | quote }}
            - name: EMBER_SECRET_NAME
              value: {{ .Values.synapse.ember.secretName | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /secrets
            - name: bootstrap-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: homeserver-tmpl
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-homeserver-tmpl
        - name: config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ include "matrix-stack.secret-name" . }}
        - name: bootstrap-scripts
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-ember-bootstrap
            defaultMode: 0750
