apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-stack.fullname" . }}-homeserver-tmpl
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    helm.sh/chart: {{ include "matrix-stack.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  homeserver.yaml.tmpl: |
    server_name: "{{ .Values.synapse.serverName }}"
    public_baseurl: "{{ .Values.synapse.publicBaseUrl }}"
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client]
            compress: false
    enable_registration: false
    registration_shared_secret: "${REGISTRATION_SHARED_SECRET}"
    report_stats: {{ ternary "yes" "no" .Values.synapse.reportStats | quote }}
    media_store_path: "/data/media_store"
    database:
      name: sqlite3
      args:
        database: /data/homeserver.db
{{ if .Values.synapse.oidc.enabled }}
    oidc_providers:
      - idp_id: {{ .Values.synapse.oidc.idpId | quote }}
        idp_name: {{ .Values.synapse.oidc.idpName | quote }}
        issuer: {{ .Values.synapse.oidc.issuer | quote }}
        client_id: {{ .Values.synapse.oidc.clientId | quote }}
        client_secret: "${OIDC_CLIENT_SECRET}"
{{ if .Values.synapse.oidc.scopes }}
        scopes:
{{ range .Values.synapse.oidc.scopes }}
          - {{ . | quote }}
{{ end }}
{{ else }}
        scopes: []
{{ end }}
        allow_existing_users: {{ .Values.synapse.oidc.allowExistingUsers }}
{{ if .Values.synapse.oidc.claimRequirements }}
        claim_requirements:
{{ range .Values.synapse.oidc.claimRequirements }}
          - claim: {{ .claim | quote }}
            value: {{ .value | quote }}
{{ end }}
{{ end }}
        user_mapping_provider:
          module: "synapse.handlers.oidc_handler.JinjaOidcMappingProvider"
          config:
            subject_claim: {{ .Values.synapse.oidc.subjectClaim | quote }}
            display_name_template: {{ .Values.synapse.oidc.displayNameTemplate | quote }}
            localpart_template: {{ .Values.synapse.oidc.localpartTemplate | quote }}
            email_template: {{ .Values.synapse.oidc.emailTemplate | quote }}
{{ end }}
  render_homeserver.py: |
{{ (.Files.Get "files/render_homeserver.py") | nindent 4 }}
