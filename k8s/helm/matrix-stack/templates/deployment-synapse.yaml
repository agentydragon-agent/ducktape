apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matrix-stack.fullname" . }}-synapse
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
      app.kubernetes.io/component: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: synapse
    spec:
      initContainers:
{{ include "matrix-stack.render-config-init" . | indent 8 }}
      containers:
        - name: synapse
          image: {{ .Values.synapse.image }}
          imagePullPolicy: IfNotPresent
          command:
{{- if and .Values.synapse.oidc.enabled (dig "debug" "enableParseLogging" false .Values.synapse.oidc) }}
            ["python","/synapse-debug/synapse_oidc_debug.py","--config-path","/config/homeserver.yaml"]
{{- else }}
            ["python","-m","synapse.app.homeserver","--config-path","/config/homeserver.yaml"]
{{- end }}
          ports:
            - name: http
              containerPort: 8008
          resources:
{{ toYaml .Values.synapse.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
{{- if and .Values.synapse.oidc.enabled (dig "debug" "enableParseLogging" false .Values.synapse.oidc) }}
            - name: synapse-debug
              mountPath: /synapse-debug
              readOnly: true
{{- end }}
      volumes:
        - name: homeserver-tmpl
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-homeserver-tmpl
        - name: config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ ternary .Values.sealedSecrets.name .Values.synapse.secrets.name .Values.sealedSecrets.enabled }}
        - name: data
{{- if .Values.synapse.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "matrix-stack.fullname" . }}-synapse-data
{{- else }}
          emptyDir: {}
{{- end }}
{{- if and .Values.synapse.oidc.enabled (dig "debug" "enableParseLogging" false .Values.synapse.oidc) }}
        - name: synapse-debug
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-synapse-debug
{{- end }}
