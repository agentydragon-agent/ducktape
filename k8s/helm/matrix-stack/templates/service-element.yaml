{{- if .Values.element.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix-stack.fullname" . }}-element
spec:
  selector:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: element
  ports:
    - port: {{ .Values.element.service.port }}
      targetPort: 80
      name: http
{{- end }}

