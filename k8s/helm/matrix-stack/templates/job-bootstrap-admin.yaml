apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "matrix-stack.fullname" . }}-bootstrap-admin
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
{{ include "matrix-stack.render-config-init" . | indent 8 }}
      containers:
        - name: register-admin
          image: {{ .Values.synapse.image }}
          command:
            - sh
            - -c
            - |
              # Wait for Synapse to be ready
              until curl -s -f {{ include "matrix-stack.synapse-internal-url" . }}/_matrix/client/versions > /dev/null 2>&1; do
                echo "Waiting for Synapse..."
                sleep 2
              done
              # Register admin user
              register_new_matrix_user \
                -c /config/homeserver.yaml \
                -u {{ .Values.synapse.admin.user | quote }} \
                -p $(cat /secrets/admin-password) \
                -a \
                {{ include "matrix-stack.synapse-internal-url" . }} || echo "admin may already exist"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /secrets
      volumes:
        - name: homeserver-tmpl
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-homeserver-tmpl
        - name: config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ include "matrix-stack.secret-name" . }}
            items:
              - key: admin-password
                path: admin-password
              - key: registration-shared-secret
                path: registration-shared-secret
{{- if .Values.synapse.oidc.enabled }}
              - key: {{ .Values.synapse.oidc.clientSecretKey }}
                path: {{ .Values.synapse.oidc.clientSecretKey }}
{{- end }}
