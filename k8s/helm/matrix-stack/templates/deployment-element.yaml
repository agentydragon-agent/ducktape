{{- if .Values.element.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matrix-stack.fullname" . }}-element
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
      app.kubernetes.io/component: element
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: element
    spec:
      containers:
        - name: element
          image: {{ .Values.element.image }}
          env:
            - name: PUBLIC_URL
              value: "{{ trimSuffix "/" (default "/element" .Values.element.ingress.path) }}/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-element-config
{{- end }}
