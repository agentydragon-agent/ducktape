{{- range .Values.defaultStorageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  {{- if .default }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ .provisioner }}
allowVolumeExpansion: true
reclaimPolicy: {{ .reclaimPolicy | default "Retain" }}
volumeBindingMode: {{ .volumeBindingMode | default "WaitForFirstConsumer" }}
{{- if .parameters }}
parameters:
  {{- range $key, $value := .parameters }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .allowedTopologies }}
allowedTopologies:
{{ toYaml .allowedTopologies | indent 2 }}
{{- else if eq .provisioner "zfs.csi.openebs.io" }}
# Default topology for ZFS CSI - restrict to nodes with ZFS
allowedTopologies:
- matchLabelExpressions:
  - key: kubernetes.io/hostname
    values:
    - k3s-master
{{- end }}
{{- end }}