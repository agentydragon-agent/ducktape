apiVersion: batch/v1
kind: Job
metadata:
  name: oidc-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: harbor
    component: oidc-config
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300  # 5 minute timeout
  template:
    metadata:
      labels:
        app: harbor
        component: oidc-config
    spec:
      restartPolicy: OnFailure
      containers:
      - name: configure-oidc
        image: curlimages/curl:8.5.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Harbor to be ready..."
          
          # Wait for Harbor core to be ready
          for i in $(seq 1 60); do
            if curl -f -s http://harbor-core:80/api/v2.0/ping >/dev/null; then
              echo "Harbor is ready"
              break
            fi
            echo "Waiting for Harbor... ($i/60)"
            sleep 10
          done
          
          echo "Logging into Harbor to create session..."
          
          # Login to Harbor to create session (required for system-level API access)
          COOKIE_JAR=$(mktemp)
          curl -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            -d "principal=admin&password=${HARBOR_ADMIN_PASSWORD}" \
            -c "$COOKIE_JAR" \
            -f \
            http://harbor-core:80/c/login
          
          echo "Configuring Harbor OIDC settings with session authentication..."
          
          # Configure OIDC settings using session cookie (provides proper RBAC authorization)
          curl -X PUT -H "Content-Type: application/json" \
            -b "$COOKIE_JAR" \
            -d '{
              "auth_mode": "oidc_auth",
              "oidc_name": "Authentik",
              "oidc_endpoint": "https://auth.k3s.agentydragon.com/application/o/harbor/",
              "oidc_client_id": "harbor",
              "oidc_client_secret": "'$HARBOR_CLIENT_SECRET'",
              "oidc_groups_claim": "groups",
              "oidc_admin_group": "harbor-admins",
              "oidc_scope": "openid,profile,email,groups",
              "oidc_user_claim": "preferred_username",
              "oidc_verify_cert": true,
              "oidc_auto_onboard": true
            }' \
            http://harbor-core:80/api/internal/configurations
          
          # Cleanup
          rm -f "$COOKIE_JAR"
          
          echo "Harbor OIDC configuration completed successfully"
        env:
        - name: HARBOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: OIDC_CLIENT_SECRET
        - name: HARBOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: HARBOR_ADMIN_PASSWORD