{{- if .Values.auth.token.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}-auth
  labels:
{{ include "registry.labels" . | indent 4 }}
    component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "registry.selectorLabels" . | indent 6 }}
      component: auth
  template:
    metadata:
      labels:
{{ include "registry.selectorLabels" . | indent 8 }}
        component: auth
    spec:
      containers:
        - name: registry-auth
          image: cesanta/docker_auth:1.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: AUTH_CONFIG_PATH
              value: /config/auth_config.yml
          volumeMounts:
            - name: auth-config
              mountPath: /config
            - name: authentik-ca
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: auth-config
          configMap:
            name: {{ include "common.fullname" . }}-auth-config
        - name: authentik-ca
          configMap:
            name: authentik-ca-certificate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-auth
  labels:
{{ include "registry.labels" . | indent 4 }}
    component: auth
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: http
      protocol: TCP
      name: http
  selector:
{{ include "registry.selectorLabels" . | indent 4 }}
    component: auth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-auth-config
  labels:
{{ include "registry.labels" . | indent 4 }}
    component: auth
data:
  auth_config.yml: |
    server:
      addr: ":5001"
      certificate: ""
      key: ""
    
    token:
      issuer: "{{ .Values.auth.token.issuer }}"
      expiration: 900
      certificate: "/certs/authentik-ca.crt"
    
    # No static users - all authentication handled via JWT tokens from Authentik
    users: {}
    
    # JWT token validation configuration for Authentik
    ext_auth:
      oidc:
        issuer: "https://auth.k3s.agentydragon.com/application/o/docker-registry/"
        client_id: "docker-registry"
    
    acl:
      # Allow authenticated users (with valid JWT tokens) full access
      - match: {account: "/.+/"}
        actions: ["*"]
        comment: "Allow all authenticated users full access to their repositories"
      
      # Deny anonymous access (no valid JWT token)
      - match: {account: ""}
        actions: []
        comment: "Deny anonymous access - require Authentik authentication"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.fullname" . }}-auth
  labels:
{{ include "registry.labels" . | indent 4 }}
    component: auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: homelab-ca-issuer
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - registry.k3s.agentydragon.com
      secretName: registry-auth-tls
  rules:
    - host: registry.k3s.agentydragon.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "common.fullname" . }}-auth
                port:
                  number: 5001
{{- end }}