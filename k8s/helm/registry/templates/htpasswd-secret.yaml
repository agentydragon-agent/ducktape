{{- if and .Values.auth.htpasswd.enabled (not .Values.auth.htpasswd.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.htpasswdSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "registry.labels" . | indent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.htpasswd.secretKey }}: |
{{- range $user := .Values.auth.htpasswd.users }}
    {{ $user.name }}:{{ $user.hash }}
{{- end }}
{{- end }}
