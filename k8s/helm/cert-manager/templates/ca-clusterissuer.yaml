apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.caClusterIssuer.name }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "cert-manager-ca")) | indent 4 }}
spec:
  ca:
    secretName: {{ .Values.caClusterIssuer.secretName }}
