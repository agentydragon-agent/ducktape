nameOverride: ""
fullnameOverride: ""

controller:
  image:
    repository: docker.io/bitnami/sealed-secrets-controller
    tag: v0.24.5
    pullPolicy: IfNotPresent
  replicas: 1
  minReadySeconds: 30
  revisionHistoryLimit: 10
  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  serviceAccount:
    create: true
    name: sealed-secrets-controller
  serviceAnnotations: {}
  metricsServiceAnnotations: {}

imagePullSecrets: []

rbac:
  create: true

crd:
  create: true

service:
  port: 8080
  metricsPort: 8081

extraArgs: []
extraEnv: []
