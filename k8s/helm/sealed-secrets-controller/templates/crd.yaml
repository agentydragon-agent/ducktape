{{- if .Values.crd.create }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sealedsecrets.bitnami.com
spec:
  group: bitnami.com
  names:
    kind: SealedSecret
    listKind: SealedSecretList
    plural: sealedsecrets
    singular: sealedsecret
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
{{- /* inline schema truncated for brevity? but need full detail. best to include existing schema from manifest. */}}
          description: SealedSecret is the K8s representation of a "sealed Secret" - a regular k8s Secret that has been sealed (encrypted) using the controller's key.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
              description: APIVersion defines the versioned schema of this representation of an object.
            kind:
              type: string
              description: Kind is a string value representing the REST resource this object represents.
            metadata:
              type: object
            spec:
              type: object
              description: SealedSecretSpec is the specification of a SealedSecret
              required:
                - encryptedData
              properties:
                data:
                  description: Data is deprecated and will be removed eventually. Use per-value EncryptedData instead.
                  format: byte
                  type: string
                encryptedData:
                  type: object
                  additionalProperties:
                    type: string
                  x-kubernetes-preserve-unknown-fields: true
                template:
                  type: object
                  description: Template defines the structure of the Secret that will be created from this sealed secret.
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: Keys that should be templated using decrypted data
                      additionalProperties:
                        type: string
                    metadata:
                      type: object
                      nullable: true
                      x-kubernetes-preserve-unknown-fields: true
                      description: Standard object's metadata.
                      properties:
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                        finalizers:
                          type: array
                          items:
                            type: string
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        name:
                          type: string
                        namespace:
                          type: string
                    type:
                      type: string
                      description: Used to facilitate programmatic handling of secret data.
            status:
              type: object
              description: SealedSecretStatus is the most recently observed status of the SealedSecret.
              properties:
                conditions:
                  type: array
                  description: Represents the latest available observations of a sealed secret's current state.
                  items:
                    type: object
                    description: SealedSecretCondition describes the state of a sealed secret at a certain point.
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Last time the condition transitioned from one status to another.
                      lastUpdateTime:
                        type: string
                        format: date-time
                        description: The last time this condition was updated.
                      message:
                        type: string
                        description: A human readable message indicating details about the transition.
                      reason:
                        type: string
                        description: The reason for the condition's last transition.
                      status:
                        type: string
                        description: Status of the condition for a sealed secret.
                      type:
                        type: string
                        description: Type of condition for a sealed secret.
                observedGeneration:
                  type: integer
                  format: int64
                  description: ObservedGeneration reflects the generation most recently observed by the sealed-secrets controller.
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
