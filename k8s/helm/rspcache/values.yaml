namespace:
  create: true
  name: rspcache

appImage:
  repository: registry.registry.svc.cluster.local:5000/rspcache
  tag: latest
  pullPolicy: Always

config:
  requireApiKey: true

postgres:
  enabled: true
  name: rspcache-postgres
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    accessModes:
      - ReadWriteOnce
    size: 10Gi

sealedSecrets:
  db:
    enabled: true
    name: rspcache-db
    encryptedData:
      ADGN_RESP_DB_URL: 
      POSTGRES_DB: 
      POSTGRES_PASSWORD: 
      POSTGRES_USER: 

proxy:
  replicas: 2
  service:
    type: ClusterIP
    port: 8000
  env:
    dbSecret: rspcache-db
    dbUrlKey: ADGN_RESP_DB_URL
    openaiSecret: rspcache-openai
    openaiApiKeyKey: OPENAI_API_KEY
    openaiKeysKey: ADGN_OPENAI_KEYS
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

admin:
  replicas: 1
  service:
    type: ClusterIP
    port: 8100
  readinessProbe:
    httpGet:
      path: /api/responses
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
  livenessProbe:
    httpGet:
      path: /api/responses
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
    hosts:
      - host: rspcache-admin.k3s.agentydragon.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: rspcache-admin-tls

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
