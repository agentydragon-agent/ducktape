vault:
  global:
    tlsDisable: false
  injector:
    enabled: false
  csi:
    enabled: false
  server:
    image:
      tag: "1.18.2"
    replicas: 1
    ha:
      enabled: false
      config: ""
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 0
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file = "/vault/userconfig/vault-tls/tls.key"
            tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
          }

          storage "raft" {
            path = "/vault/data"

            retry_join {
              leader_api_addr = "https://vault-0.vault-internal:8200"
            }
            retry_join {
              leader_api_addr = "https://vault-1.vault-internal:8200"
            }
            retry_join {
              leader_api_addr = "https://vault-2.vault-internal:8200"
            }
          }

          service_registration "kubernetes" {}
    dataStorage:
      enabled: true
      storageClass: local-path
      size: 10Gi
    auditStorage:
      enabled: true
      storageClass: local-path
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations: []
    extraEnvironmentVars: {}
    service:
      type: ClusterIP
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      ingressClassName: traefik
      hosts:
        - host: vault.k3s.agentydragon.com
          paths:
            - /
      tls:
        - secretName: vault-ingress-tls
          hosts:
            - vault.k3s.agentydragon.com
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
        }

        storage "file" {
          path = "/vault/data"
        }
    postStart:
      - /vault/userconfig/vault-bootstrap-scripts/bootstrap.sh
    extraVolumes:
      - name: vault-bootstrap-scripts
        type: configMap
        defaultMode: 493
      - name: vault-tls
        type: secret
