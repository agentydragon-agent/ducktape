{{- if .Values.secretGenerator.harbor.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vault.fullname" . }}-harbor-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-generator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "vault.serviceAccountName" . }}-secret-generator
      containers:
      - name: generate-harbor-secret
        image: hashicorp/vault:1.17.2
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Checking if Harbor OIDC secret exists..."
          
          # Check if secret already exists
          if vault kv get -field=client-secret secret/harbor 2>/dev/null; then
            echo "Harbor OIDC secret already exists, skipping generation"
            exit 0
          fi
          
          echo "Generating new Harbor OIDC client secret..."
          CLIENT_SECRET=$(openssl rand -hex {{ .Values.secretGenerator.harbor.secretLength | default 32 }})
          
          # Store in Vault
          vault kv put secret/harbor client-secret="$CLIENT_SECRET"
          
          echo "Harbor OIDC client secret generated and stored in Vault"
        env:
        - name: VAULT_ADDR
          value: "http://{{ include "vault.fullname" . }}:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "vault.fullname" . }}-init
              key: root-token
        volumeMounts:
        - name: vault-tls
          mountPath: /etc/vault-tls
          readOnly: true
      volumes:
      - name: vault-tls
        secret:
          secretName: {{ include "vault.fullname" . }}-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vault.serviceAccountName" . }}-secret-generator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
{{- end }}