{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: kv
      version: v2
      tls:
        caProvider:
          type: Secret
          name: {{ .Values.tlsSecretName }}
          key: ca.crt
          namespace: {{ include "vault-ducktape.namespace" . }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount }}
            namespace: {{ include "vault-ducktape.namespace" . }}
{{- end }}
