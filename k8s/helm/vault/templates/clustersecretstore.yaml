{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
spec:
  provider:
    vault:
      server: https://vault.{{ include "vault-ducktape.namespace" . }}.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount }}
            namespace: {{ include "vault-ducktape.namespace" . }}
{{- end }}
