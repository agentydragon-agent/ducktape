{{- if .Values.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccount }}
  namespace: {{ include "vault-ducktape.namespace" . }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.externalSecrets.serviceAccount }}-role
  namespace: {{ include "vault-ducktape.namespace" . }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.externalSecrets.serviceAccount }}-binding
  namespace: {{ include "vault-ducktape.namespace" . }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.externalSecrets.serviceAccount }}
    namespace: {{ include "vault-ducktape.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.externalSecrets.serviceAccount }}-role
{{- end }}
