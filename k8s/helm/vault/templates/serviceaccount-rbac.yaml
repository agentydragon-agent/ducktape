apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vault-ducktape.serviceAccountName" . }}-role
  namespace: {{ include "vault-ducktape.namespace" . }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vault-ducktape.serviceAccountName" . }}-binding
  namespace: {{ include "vault-ducktape.namespace" . }}
  labels:
{{ include "vault-ducktape.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vault-ducktape.serviceAccountName" . }}
    namespace: {{ include "vault-ducktape.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vault-ducktape.serviceAccountName" . }}-role
