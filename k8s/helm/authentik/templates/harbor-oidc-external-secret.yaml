{{- if .Values.harbor.useExternalSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "authentik.fullname" . }}-harbor-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
    app.kubernetes.io/component: harbor-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster-secret-store
  target:
    name: {{ include "authentik.fullname" . }}-harbor-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        harbor-client-secret: "{{ `{{ .clientSecret }}` }}"
  data:
  - secretKey: clientSecret
    remoteRef:
      key: secret/harbor
      property: client-secret
{{- end }}