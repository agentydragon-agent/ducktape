# Authentik Blueprint for Gitea OAuth2 Provider
# This should be applied to Authentik to automatically configure the OAuth2 provider
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-gitea
  namespace: authentik
data:
  gitea.yaml: |
    version: 1
    metadata:
      name: Gitea OAuth2 Setup
      labels:
        blueprints.goauthentik.io/type: gitea
    entries:
      # Create OAuth2 Provider
      - model: authentik_providers_oauth2.oauth2provider
        id: gitea-provider
        state: present
        identifiers:
          name: Gitea Provider
        attrs:
          name: Gitea Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env GITEA_CLIENT_ID
          client_secret: !Env GITEA_CLIENT_SECRET
          redirect_uris: "https://git.k3s.agentydragon.com/user/oauth2/Authentik/callback"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider

      # Create Application
      - model: authentik_core.application
        id: gitea-app
        state: present
        identifiers:
          slug: gitea
        attrs:
          name: Gitea
          slug: gitea
          provider: !KeyOf gitea-provider
          policy_engine_mode: any
          meta_launch_url: https://git.k3s.agentydragon.com
          meta_icon: https://git.k3s.agentydragon.com/assets/img/logo.svg
          meta_description: Private Git Repository

      # Optional: Create a group for Gitea users
      - model: authentik_core.group
        id: gitea-users
        state: present
        identifiers:
          name: gitea-users
        attrs:
          name: gitea-users
          is_superuser: false

      # Optional: Create admin group
      - model: authentik_core.group
        id: gitea-admins
        state: present
        identifiers:
          name: gitea-admins
        attrs:
          name: gitea-admins
          is_superuser: false

