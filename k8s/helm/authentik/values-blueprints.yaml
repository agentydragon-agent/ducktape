# Blueprint helper inputs and forward-auth defaults.
gitea:
  # Set to the sealed-secret ciphertext used for the Gitea OAuth client secret so
  # blueprint revisions change whenever the secret rotates.
  clientSecretCiphertext: 

matrix:
  # Sealed-secret ciphertext for the Matrix Synapse OAuth client secret. Changing
  # this value (during a secret rotation) bumps the blueprint revision.
  clientSecretCiphertext: 

# Harbor OIDC blueprint defaults - NOW MANAGED BY TERRAFORM
# See: terraform/applications/ for Harbor OIDC configuration
# harbor:
#   externalHost: "https://registry.k3s.agentydragon.com"
#   adminGroup: "harbor-admins"
#   useExternalSecret: true
# Registry forward-auth blueprint defaults.
registry:
  externalHost: "https://registry.k3s.agentydragon.com"
  internalHost: "http://registry.registry.svc.cluster.local:5000"
  adminGroup: "registry-pushers"

# Embedded outpost configuration for forward-auth providers.
forwardAuth:
  outpost:
    name: "authentik Embedded Outpost"
    providers:
      - registry-forward-auth
      - rspcache-admin
