version: 1
metadata:
  name: Vault OAuth2 Setup
  labels:
    blueprints.goauthentik.io/type: vault
    blueprints.goauthentik.io/instantiate: "true"
    {{- if .BlueprintChecksum }}
    blueprints.goauthentik.io/revision: {{ .BlueprintChecksum | quote }}
    {{- end }}
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: vault-provider
    state: present
    identifiers:
      name: Vault Provider
    attrs:
      name: Vault Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env VAULT_CLIENT_ID
      client_secret: !Env VAULT_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://vault.k3s.agentydragon.com/ui/vault/auth/oidc/oidc/callback
        - matching_mode: strict
          url: https://vault.k3s.agentydragon.com/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider

  - model: authentik_core.application
    id: vault-application
    state: present
    identifiers:
      slug: vault
    attrs:
      name: Vault
      slug: vault
      provider: !KeyOf vault-provider
      policy_engine_mode: any
      meta_launch_url: https://vault.k3s.agentydragon.com
      meta_icon: https://developer.hashicorp.com/_next/static/media/logo-vault.97c1f70c.svg
      meta_description: Secrets management and PKI
      group: Security
