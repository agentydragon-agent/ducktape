apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-probe
  namespace: observability
  labels:
    app.kubernetes.io/name: openai-probe
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openai-probe
  template:
    metadata:
      labels:
        app: openai-probe
        app.kubernetes.io/name: openai-probe
        app.kubernetes.io/part-of: observability
    spec:
      restartPolicy: Always
      containers:
        - name: probe
          image: registry.registry.svc.cluster.local:5000/openai-probe:latest
          imagePullPolicy: Always
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api
                  key: api_key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secret
                  key: postgres-password
          args:
            - "--concurrency"
            - "64"
            - "--stream"
            - "--continuous"
            - "--max-tokens"
            - "100"
            - "--fast-qps"
            - "0.3"
            - "--slow-qps"
            - "0.05"
            - "--drop-regex"
            - '(?i)(:ft:|\bft-\b|\b-ft\b|fine[-_ ]?tune|fine[-_ ]?tuned)|^ft:|\b(ada|curie|babbage|davinci|d1[26])\b|\bgpt[-_ ]?3(\b|[.-])|(?<![a-z0-9])gpt[-_ ]?4o(?![a-z0-9])|\bgpt[-_ ]?4\.1-(mini|nano)\b|\bgpt[-_ ]?5-(mini|nano)\b|\bo[13]-mini\b|-rm-'
            - "--tag"
            - "key_prefix=t9f"
            - "--tag"
            - "key_suffix=Wt5"
          ports:
            - name: health
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
