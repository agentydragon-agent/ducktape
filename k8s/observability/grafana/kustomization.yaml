apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - datasources.yaml
  - dashboard-provisioning.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: grafana-dashboard-openai-probe
    files:
      - openai-probe.json=dashboards/openai-probe.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: observability