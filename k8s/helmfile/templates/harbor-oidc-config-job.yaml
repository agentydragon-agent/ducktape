apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-oidc-config
  namespace: harbor
  labels:
    app: harbor
    component: oidc-config
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    metadata:
      labels:
        app: harbor
        component: oidc-config
    spec:
      restartPolicy: OnFailure
      containers:
      - name: configure-oidc
        image: curlimages/curl:8.5.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Harbor to be ready..."
          
          # Wait for Harbor core to be ready
          for i in $(seq 1 60); do
            if curl -f -s http://harbor-core:80/api/v2.0/ping >/dev/null; then
              echo "Harbor is ready"
              break
            fi
            echo "Waiting for Harbor... ($i/60)"
            sleep 10
          done
          
          echo "Configuring Harbor OIDC settings..."
          
          # Configure OIDC settings
          curl -X PUT -H "Content-Type: application/json" \
            -u admin:HarborAdmin123! \
            -d '{
              "auth_mode": "oidc_auth",
              "oidc_name": "Authentik",
              "oidc_endpoint": "https://auth.k3s.agentydragon.com/application/o/harbor/",
              "oidc_client_id": "harbor",
              "oidc_client_secret": "'$HARBOR_CLIENT_SECRET'",
              "oidc_groups_claim": "groups",
              "oidc_admin_group": "harbor-admins",
              "oidc_scope": "openid,profile,email,groups",
              "oidc_user_claim": "preferred_username",
              "oidc_verify_cert": true,
              "oidc_auto_onboard": true
            }' \
            http://harbor-core:80/api/v2.0/configurations
          
          echo "Harbor OIDC configuration completed successfully"
        env:
        - name: HARBOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-secret
              key: OIDC_CLIENT_SECRET