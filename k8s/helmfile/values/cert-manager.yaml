installCRDs: true

# Homelab CA bootstrap
extraDeploy:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: selfsigned-cluster-issuer
      labels:
        app.kubernetes.io/managed-by: helmfile
        app.kubernetes.io/component: cert-manager-ca
    spec:
      selfSigned: {}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: homelab-ca
      namespace: cert-manager
      labels:
        app.kubernetes.io/managed-by: helmfile
        app.kubernetes.io/component: cert-manager-ca
    spec:
      isCA: true
      commonName: "Homelab CA"
      secretName: homelab-ca-secret
      duration: 87600h
      renewBefore: 720h
      issuerRef:
        name: selfsigned-cluster-issuer
        kind: ClusterIssuer
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: homelab-ca-issuer
      labels:
        app.kubernetes.io/managed-by: helmfile
        app.kubernetes.io/component: cert-manager-ca
    spec:
      ca:
        secretName: homelab-ca-secret
