helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true

repositories:
  - name: traefik
    url: https://helm.traefik.io/traefik
  - name: goauthentik
    url: https://charts.goauthentik.io
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: jetstack
    url: https://charts.jetstack.io
  - name: gitea-charts
    url: https://dl.gitea.io/charts/
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: sealed-secrets
    namespace: kube-system
    chart: bitnami/sealed-secrets
    version: 2.5.19
    values:
      - values/sealed-secrets.yaml

  - name: traefik
    namespace: traefik
    chart: ../helm/traefik

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.19.1
    values:
      - values/cert-manager.yaml

  - name: cert-manager-bootstrap
    namespace: cert-manager
    chart: ../helm/cert-manager-bootstrap

  - name: authentik
    namespace: authentik
    chart: ../helm/authentik

  - name: gitea
    namespace: gitea
    chart: ../helm/gitea

  - name: ember
    namespace: ember
    chart: ../helm/ember

  - name: rspcache
    namespace: rspcache
    chart: ../helm/rspcache
