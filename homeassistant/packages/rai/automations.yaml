automation:
  - id: "1728265492434"
    alias: Rai room switch toggles lights
    description: ""
    triggers:
      - domain: mqtt
        device_id: b649581b5e54c051885be074ff0adba7
        type: action
        subtype: single
        metadata: {}
        trigger: device
    conditions: []
    actions:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id: light.rai_s_room_ceiling_lights
    mode: single

  - id: "1728693363194"
    alias: Rai remote "off" -> turn off lights
    description: ""
    triggers:
      - domain: mqtt
        device_id: d52c27d44fe6dcffb045f5b47f6c991b
        type: action
        subtype: "off"
        trigger: device
    conditions: []
    actions:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.rai_s_room_ceiling_lights
    mode: single

  - id: "1728693417656"
    alias: Rai remote "on" -> lights on
    description: ""
    triggers:
      - domain: mqtt
        device_id: d52c27d44fe6dcffb045f5b47f6c991b
        type: action
        subtype: "on"
        trigger: device
    conditions: []
    actions:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: light.rai_s_room_ceiling_lights
    mode: single

  - id: "1730106847448"
    alias: "Rai room: sleep lights @ 0:00 AM"
    description: ""
    triggers:
      - trigger: time
        at: "00:00:00"
    conditions: []
    actions:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_rai_room_lights
    mode: single

  - id: "1730106913259"
    alias: Rai room - sleep lights off @ 6 AM
    description: ""
    triggers:
      - trigger: time
        at: "06:00:00"
    conditions: []
    actions:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_rai_room_lights
    mode: single

  # Webhook inbox automations (previously automation/rai_webhook_inbox.yml)

  - alias: Rai webhook inbox - state change
    id: rai_webhook_inbox_state_change
    mode: queued
    triggers:
      - platform: state
        entity_id:
          - light.rai_s_room_ceiling_lights
          - binary_sensor.rai_window_sensor_contact
          - binary_sensor.rai_nook_window_contact
          - binary_sensor.rais_room_occupancy
    actions:
      - action: rest_command.rai_webhook_inbox
        data:
          payload:
            entity: "{{ trigger.entity_id }}"
            from: "{{ trigger.from_state.state }}"
            to: "{{ trigger.to_state.state }}"

  - alias: Rai webhook inbox - air quality per 15 min
    id: rai_webhook_inbox_air_quality_per_15min
    mode: single
    triggers:
      - platform: time_pattern
        minutes: "/15"
    actions:
      - action: rest_command.rai_webhook_inbox
        data:
          payload:
            area: "Rai's room"
            voc_ppb: "{{ states('sensor.rai_s_room_vocs') | int }}"
            co2_ppm: "{{ states('sensor.rai_s_room_carbon_dioxide') | int }}"
            temp_degc: "{{ states('sensor.rai_s_room_temperature') | float }}"
            pressure_hpa: "{{ states('sensor.rai_s_room_atmospheric_pressure') | int }}"
            humid_pct: "{{ states('sensor.rai_s_room_humidity') | float }}"
            reason: "15min cron"
