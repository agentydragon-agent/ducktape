# Wake trigger for the cloud Haku. provision.sh injects the resolved --agent /
# --environment-id / --vault-id; the static parts live here.
#
# v0/P0: the initial message is a connectivity test (list haku-sandbox pods).
# Replace with the real wake ("do one scan pass per the run procedure, then
# commit, push, stop") once the run procedure is wired, and add a `schedule:`
# block to make it periodic. For now it's on-demand: `ant beta:deployments run`.
name: haku-cloud
initial_events:
  - type: user.message
    content:
      - type: text
        text: "List the pods in the haku-sandbox namespace and report their names and status."
