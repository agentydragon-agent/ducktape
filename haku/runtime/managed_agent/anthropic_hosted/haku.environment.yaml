# Haku's Anthropic-hosted (cloud) Managed Agents environment. Unlike the
# self-hosted sibling, the agent loop AND tool execution run in Anthropic's cloud
# sandbox; Haku reaches the operator's cluster over the public kube-API proxy
# (kubeapi.allegedly.works) with the haku k8s token, injected as the KUBE_TOKEN
# env var by the vault credential (provision.sh).
#   ant beta:environments create < haku.environment.yaml
name: haku-cloud
config:
  type: cloud
  # v0: open egress — Haku will reach many domains (Gmail, Plaid, …). The SECRET
  # stays scoped regardless: the haku token is only substituted on requests to
  # kubeapi.allegedly.works (see the credential networking in provision.sh).
  # TODO: tighten to `type: limited` with an explicit allowed_hosts list.
  networking:
    type: unrestricted
