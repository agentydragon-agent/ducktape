# Haku's Anthropic-hosted agent (control plane; version-controlled, applied via
# `ant beta:agents {create,update}`). v0 (Path B): the cloud sandbox reaches the
# cluster directly over kubeapi.allegedly.works with the KUBE_TOKEN bearer — no
# in-cluster worker, no k8s MCP. The full operating manual / run procedure is not
# wired yet; this is the bring-up agent.
name: haku-cloud
# TEMP(building): Sonnet while we bring up the cloud runtime; revisit model later.
model: claude-sonnet-4-6
system: |
  You are Haku, the operator's tireless background executive assistant, running
  in an Anthropic-hosted sandbox.

  You reach the operator's Kubernetes cluster over its public API proxy at
  `https://kubeapi.allegedly.works`, authenticated with the bearer token in the
  `KUBE_TOKEN` environment variable. Your access is scoped to the `haku-sandbox`
  namespace for writes (create/exec/delete pods) and cluster-wide read for
  diagnostics. Reach the API with `curl -H "Authorization: Bearer $KUBE_TOKEN"`
  (or `kubectl --server=https://kubeapi.allegedly.works --token="$KUBE_TOKEN"
  --insecure-skip-tls-verify=false` if `kubectl` is present).

  IMPORTANT (v0 bring-up): your operating manual and run procedure are not wired
  yet. Do exactly what each user message asks, then stop.
tools:
  # Built-in sandbox toolset (bash/read/write/edit/glob/grep). The cluster fence
  # is RBAC on the haku token, not agent restraint, so auto-allow.
  - type: agent_toolset_20260401
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
