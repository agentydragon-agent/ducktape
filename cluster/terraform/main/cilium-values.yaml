# Cilium CNI — Talos-recommended defaults + Nebula-compatible MTU
#
# IMPORTANT: Do not add non-default options without verifying Nebula overlay compatibility.
# See: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

# Required: Talos-recommended IPAM
ipam:
  mode: kubernetes

# Required: kube-proxy replacement (kube-proxy disabled in Talos config)
kubeProxyReplacement: "true"
k8sServiceHost: "localhost"
k8sServicePort: "7445"

# Required: Talos security context (no SYS_MODULE — Talos blocks kernel module loading)
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Required: Talos cgroup configuration
cgroup:
  hostRoot: /sys/fs/cgroup
  autoMount:
    enabled: false

# Pod MTU for the NESTED overlay: Cilium VXLAN rides inside the Nebula tunnel
# (VXLAN endpoints are the node InternalIPs, which are Nebula 10.42.x addrs).
# The encapsulation stacks, it does not run in parallel:
#   pod (1370) + VXLAN (50) = 1420  -> must fit nebula1 tun MTU (1420)
#   nebula1 (1420) + Nebula (60) = 1480  -> fits eno1 underlay (1500)
# Measured 2026-06-08 (see cluster/debug/2026-06-08-nebula-vxlan-mtu/):
#   - OVH inter-node underlay carries a full 1500 DF, incl. the same-/24
#     .254 hairpin path.
#   - Nebula overhead = 60 bytes exactly (16 hdr + 16 GCM tag + 20 IP + 8 UDP),
#     confirmed by tcpdump: a 1300-byte inner packet -> 1360 on the wire.
# Hard max for this stack is nebula1=1440 / MTU=1390 (exact-fit to 1500). We
# keep a 20-byte underlay margin: nebula1=1420 (see nebula.tf) / MTU=1370.
# NOTE: the Helm key is uppercase `MTU`; lowercase `mtu` is silently ignored.
MTU: 1370

# Gateway API: replaces ingress-nginx (retired March 2026)
# Reuses per-node Envoy DaemonSet — zero additional controllers.
# hostNetwork binds ports 80/443 directly on gateway nodes.
gatewayAPI:
  enabled: true
  enableAppProtocol: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        topology.kubernetes.io/region: hil

# Standalone Envoy DaemonSet (separate from cilium-agent) for cleaner lifecycle.
# NET_ADMIN + SYS_ADMIN required for Cilium datapath integration (BPF).
# NET_BIND_SERVICE required for binding privileged ports (80, 443) in hostNetwork mode.
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

# Observability (optional, not networking-critical)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
