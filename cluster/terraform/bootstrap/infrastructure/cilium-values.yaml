# Cilium CNI — Talos-recommended defaults + KubeSpan-compatible MTU
#
# IMPORTANT: Do not add non-default options without verifying KubeSpan compatibility.
# See: https://docs.siderolabs.com/talos/v1.11/networking/kubespan
# See: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

# Required: Talos-recommended IPAM
ipam:
  mode: kubernetes

# Required: kube-proxy replacement (kube-proxy disabled in Talos config)
kubeProxyReplacement: "true"
k8sServiceHost: "localhost"
k8sServicePort: "7445"

# Required: Talos security context (no SYS_MODULE — Talos blocks kernel module loading)
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Required: Talos cgroup configuration
cgroup:
  hostRoot: /sys/fs/cgroup
  autoMount:
    enabled: false

# Required: Account for double encapsulation (VXLAN + KubeSpan WireGuard)
# eth0 MTU (1500) - VXLAN overhead (50) - WireGuard overhead (80) = 1370
# Without this, packets >1370 bytes fragment at the WireGuard interface.
MTU: 1370

# Gateway API: replaces ingress-nginx (retired March 2026)
# Reuses per-node Envoy DaemonSet — zero additional controllers.
# hostNetwork binds ports 80/443 directly on VPS nodes (same as ingress-nginx did).
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        topology.kubernetes.io/region: hetzner

# Standalone Envoy DaemonSet (separate from cilium-agent) for cleaner lifecycle.
# NET_ADMIN + SYS_ADMIN required for Cilium datapath integration (BPF).
# NET_BIND_SERVICE required for binding privileged ports (80, 443) in hostNetwork mode.
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

# Mutual authentication via SPIRE — disabled for now.
# SPIRE install times out during bootstrap on Talos (SPIRE pods never
# start despite namespace creation). TODO: investigate Talos compatibility
# and re-enable once Gateway API migration is complete.
# authentication:
#   mutual:
#     spire:
#       enabled: true
#       install:
#         enabled: true

# Observability (optional, not networking-critical)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
