apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.k8s.yaml
components:
  - ../app-image-pins
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: haku-openclaw-spike-kubeconfig
    namespace: haku-openclaw-spike
    files:
      - config=kube-client-config
