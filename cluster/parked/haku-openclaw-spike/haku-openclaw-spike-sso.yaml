version: 1
metadata:
  name: SSO - Haku OpenClaw Spike
  labels:
    blueprints.goauthentik.io/description: "isolated Haku OpenClaw compatibility spike proxy provider and application"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: haku-openclaw-spike-provider
    state: present
    identifiers:
      name: haku-openclaw-spike
    attrs:
      external_host: "https://haku-openclaw-spike.allegedly.works"
      internal_host: "http://haku-openclaw-spike.haku-openclaw-spike.svc.cluster.local:18789"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: haku-openclaw-spike-app
    state: present
    identifiers:
      slug: haku-openclaw-spike
    attrs:
      name: Haku OpenClaw Spike
      provider: !KeyOf haku-openclaw-spike-provider
      meta_description: "OpenClaw with Claude Code subscription inference and Haku's approval-gated tools"
      meta_launch_url: "https://haku-openclaw-spike.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf haku-openclaw-spike-app
      user: !Find [authentik_core.user, [username, agentydragon]]
      order: 0
