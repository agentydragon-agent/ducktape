apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "powerdns.fullname" . }}
  labels:
    {{- include "powerdns.labels" . | nindent 4 }}
spec:
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "powerdns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "powerdns.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "powerdns.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
      - name: {{ .Chart.Name }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        # pschiffe/pdns-mysql configures via environment variables
        env:
        # MySQL backend configuration
        - name: PDNS_gmysql_host
          value: {{ .Release.Name }}-mariadb
        - name: PDNS_gmysql_port
          value: "3306"
        - name: PDNS_gmysql_user
          value: {{ .Values.mariadb.auth.username }}
        - name: PDNS_gmysql_password
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mariadb
              key: mariadb-password
        - name: PDNS_gmysql_dbname
          value: {{ .Values.mariadb.auth.database }}

        # API configuration
        {{- if .Values.powerdns.api.enabled }}
        - name: PDNS_api
          value: "yes"
        - name: PDNS_api_key
          valueFrom:
            secretKeyRef:
              name: {{ .Values.powerdns.api.secretName }}
              key: {{ .Values.powerdns.api.secretKey }}
        {{- end }}

        # Webserver configuration
        {{- if .Values.powerdns.webserver.enabled }}
        - name: PDNS_webserver
          value: "yes"
        - name: PDNS_webserver_address
          value: {{ .Values.powerdns.webserver.address | quote }}
        - name: PDNS_webserver_port
          value: {{ .Values.powerdns.webserver.port | quote }}
        - name: PDNS_webserver_allow_from
          value: {{ .Values.powerdns.webserver.allowFrom | quote }}
        {{- end }}

        # Move control socket to writable /tmp directory
        - name: PDNS_socket_dir
          value: "/tmp"

        # Disable setuid/setgid (already enforced by Kubernetes securityContext)
        - name: PDNS_setuid
          value: ""
        - name: PDNS_setgid
          value: ""

        # Additional custom configuration
        {{- range $key, $value := .Values.powerdns.config }}
        - name: PDNS_{{ $key | replace "-" "_" }}
          value: {{ $value | quote }}
        {{- end }}

        # Extra env vars (supports valueFrom for Downward API, etc.)
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        ports:
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
          {{- if .Values.hostPort.enabled }}
          hostPort: {{ .Values.hostPort.dnsPort | default 53 }}
          {{- end }}
        - name: dns-udp
          containerPort: 53
          protocol: UDP
          {{- if .Values.hostPort.enabled }}
          hostPort: {{ .Values.hostPort.dnsPort | default 53 }}
          {{- end }}
        {{- if .Values.powerdns.webserver.enabled }}
        - name: api
          containerPort: {{ .Values.powerdns.webserver.port }}
          protocol: TCP
          {{- if and .Values.hostPort.enabled .Values.hostPort.apiPort }}
          hostPort: {{ .Values.hostPort.apiPort }}
          {{- end }}
        {{- end }}

        {{- if .Values.healthChecks.enabled }}
        {{- with .Values.healthChecks.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.healthChecks.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}

        volumeMounts:
        - name: config
          mountPath: /etc/pdns

        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}

      volumes:
      # pschiffe/pdns-mysql entrypoint writes config to /etc/pdns
      - name: config
        emptyDir: {}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
