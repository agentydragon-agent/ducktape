apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-token
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./cluster/k8s/authentik-token
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: authentik-token
      namespace: flux-system
  dependsOn:
    - name: core # tofu-controller CRD
      namespace: flux-system
    - name: vault-token # Vault auth for Terraform
      namespace: flux-system
    - name: external-secrets-config
      namespace: flux-system
