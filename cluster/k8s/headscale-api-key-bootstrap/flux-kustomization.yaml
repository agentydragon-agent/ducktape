apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-api-key-bootstrap
  namespace: flux-system
spec:
  retries: 5
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/headscale-api-key-bootstrap"
  prune: true
  wait: true
  dependsOn:
    - name: headscale
