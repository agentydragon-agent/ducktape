---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-api-key-bootstrap
  namespace: headscale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: "false"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: headscale-api-key-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: headscale-api-key-bootstrap
      containers:
        - name: bootstrap
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: headscale-api-key-bootstrap-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-api-key-bootstrap
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-api-key-bootstrap
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-api-key-bootstrap
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: headscale-api-key-bootstrap
    namespace: headscale
roleRef:
  kind: Role
  name: headscale-api-key-bootstrap
  apiGroup: rbac.authorization.k8s.io
