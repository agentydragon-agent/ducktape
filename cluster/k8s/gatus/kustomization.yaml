apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - env-configmap.yaml
  # HTTPRoute is in authentik-proxy-routes/gatus-httproute.yaml (SSO-protected via Authentik outpost).

configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
