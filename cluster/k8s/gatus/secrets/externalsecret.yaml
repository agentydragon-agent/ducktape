apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-ollama-api-key
  namespace: gatus
  annotations:
    description: LiteLLM API key for Gatus health checks (mapped as LITELLM_API_KEY, same Vault path as ollama api-key)
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gatus-ollama-api-key
    creationPolicy: Owner
  data:
    # LITELLM_API_KEY (not api-key) because envFrom maps secret data keys
    # directly to env var names, and shell env vars can't contain hyphens.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: kv/ollama/api-key
        property: api_key
