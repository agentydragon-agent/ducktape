# Restrict Gatus ingress to the Cilium gateway and Prometheus scraping.
# With native OIDC, auth is handled by Gatus itself — gateway passes traffic directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus-ingress
  namespace: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  policyTypes:
    - Ingress
  ingress:
    # Cilium gateway → Gatus (external access via HTTPRoute)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus → Gatus (ServiceMonitor scraping)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
