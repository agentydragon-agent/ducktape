apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-sso-tf
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/gatus/sso-tf
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: gatus-sso
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
    - name: tofu-state-db
      namespace: flux-system
    - name: authentik
      namespace: flux-system
