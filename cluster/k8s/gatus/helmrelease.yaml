---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: twin
  namespace: gatus
spec:
  interval: 24h
  url: https://twin.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: gatus
  values:
    envFrom:
      - secretRef:
          name: gatus-ollama-api-key

    ingress:
      enabled: false

    persistence:
      enabled: true
      size: 200Mi
      storageClassName: local-path

    serviceMonitor:
      enabled: true

    nodeSelector:
      topology.kubernetes.io/region: hetzner
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    # TODO: Consider consolidating the many per-app PostgreSQL instances
    # in the cluster into a shared instance, and using postgres backend.
    config:
      storage:
        type: sqlite
        path: /data/gatus.db

      endpoints:
        - name: Website
          group: core
          url: https://www.allegedly.works
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Harbor Registry API
          group: core
          url: https://registry.allegedly.works/v2/
          interval: 60s
          conditions:
            - "[STATUS] == 401"

        - name: Authentik Login
          group: core
          url: https://auth.allegedly.works
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Matrix SSO
          group: sso
          url: https://matrix.allegedly.works/_matrix/client/v3/login
          interval: 120s
          conditions:
            - "[STATUS] == 200"
            - "[BODY].flows[0].type == m.login.sso"

        - name: Harbor OIDC redirect
          group: sso
          url: https://registry.allegedly.works/c/oidc/login
          interval: 120s
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(*authentik*)"

        - name: Vault
          group: core
          url: https://vault.allegedly.works/v1/sys/health
          interval: 60s
          conditions:
            - "[STATUS] == any(200, 429)"

        - name: LiteLLM Inference
          group: services
          url: http://litellm.ollama.svc.cluster.local:4000/v1/chat/completions
          method: POST
          headers:
            - key: Content-Type
              value: application/json
            - key: Authorization
              value: "Bearer ${LITELLM_API_KEY}"
          body: |
            {
              "model": "gpt-oss-20b-128k",
              "messages": [{"role": "user", "content": "Respond with exactly the number that equals 5 times 7"}],
              "max_tokens": 1000
            }
          interval: 30m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].choices[0].message.content == pat(*35*)"
