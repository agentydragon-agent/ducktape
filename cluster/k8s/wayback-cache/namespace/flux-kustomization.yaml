apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wayback-cache-namespace
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: ducktape
  path: ./cluster/k8s/wayback-cache/namespace
  prune: false
  wait: true
