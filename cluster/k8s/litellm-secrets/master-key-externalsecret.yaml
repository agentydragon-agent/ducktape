# TODO: Create lesser-privileged LiteLLM virtual keys for claude-sandbox and
# openclaw-sandbox instead of sharing the master key. See:
# https://docs.litellm.ai/docs/proxy/virtual_keys
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
  namespace: litellm
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "claude-sandbox,openclaw-sandbox"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "claude-sandbox,openclaw-sandbox"
  data:
    - secretKey: api-key
      remoteRef:
        key: kv/ollama/api-key
        property: api_key
