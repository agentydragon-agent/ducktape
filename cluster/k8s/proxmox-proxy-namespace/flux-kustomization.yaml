apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-proxy-namespace
  namespace: flux-system
spec:
  retries: 5
  retryInterval: 1m
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/proxmox-proxy-namespace
  prune: true
  wait: true
