apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-playwright
  namespace: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-playwright
  template:
    metadata:
      labels:
        app: firecrawl-playwright
    spec:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: playwright-service
          image: ghcr.io/firecrawl/playwright-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
