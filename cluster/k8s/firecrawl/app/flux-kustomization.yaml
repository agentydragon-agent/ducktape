apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/firecrawl/app
  prune: true
  # Preserve managed resources while this controller is recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: firecrawl-namespace
      namespace: ducktape-flux
    - name: firecrawl-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
