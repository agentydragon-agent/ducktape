apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# credentials.sops.yaml is consumed by Terraform CR runners (PGPASSWORD env)
# and by cluster/.envrc for human operators; CNPG itself no longer reads it
# (the OVH replica inherited the password from source via pg_basebackup).
resources:
  - credentials.sops.yaml
  - postgres-cluster-ovh.yaml
