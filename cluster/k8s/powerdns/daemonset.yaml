apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: powerdns
  namespace: dns-system
  labels:
    app.kubernetes.io/name: powerdns
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
        # Skip Cilium transparent DNS proxy — PowerDNS is authoritative, not a client.
        # Cilium's DNS proxy with 10s linger timeout breaks AXFR zone transfers.
        io.cilium.proxy.denylist: "53/TCP,53/UDP"
      labels:
        app.kubernetes.io/name: powerdns
    spec:
      # hostNetwork mode: pod runs in the host network namespace.
      # Why not hostPort? Cilium implements hostPort via BPF rules on 0.0.0.0:<port>,
      # which intercepts ALL port 53 traffic on the node — including containerd's
      # queries to Talos DNS proxy at 127.0.0.53:53, breaking image pulls.
      #
      # With hostNetwork, PowerDNS binds directly in the host namespace.
      # Port 53 coexistence with Talos DNS proxy:
      #   - PowerDNS local-address = node's public IP (via Downward API)
      #   - Talos dns-resolve-cache binds 127.0.0.53:53 (loopback only)
      # These are disjoint addresses, so no conflict.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: default
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: powerdns
          image: powerdns/pdns-auth-49:latest
          imagePullPolicy: IfNotPresent
          # The official pdns-auth-49 image does NOT support PDNS_* env vars
          # (that's a community Docker image convention). Override the entrypoint
          # to inject secrets and local-address into the config file at startup.
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/powerdns-template/pdns.conf /etc/powerdns/pdns.conf
              echo "gpgsql-password=${GPGSQL_PASSWORD}" >> /etc/powerdns/pdns.conf
              echo "api-key=${API_KEY}" >> /etc/powerdns/pdns.conf
              echo "local-address=${POD_IP}" >> /etc/powerdns/pdns.conf
              exec pdns_server --config-dir=/etc/powerdns --guardian=no --daemon=no
          # Security context: must run as root for hostNetwork port 53 binding.
          # Verified via /proc/PID/status: containerd/runc does NOT populate the
          # effective capability set for non-root processes, even with
          # allowPrivilegeEscalation:true and NET_BIND_SERVICE in the bounding set.
          # Actual process state: CapEff=0, CapBnd=0x400 — bind() returns EACCES.
          # For root, the kernel automatically sets effective caps from bounding set
          # after exec, so NET_BIND_SERVICE works.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: powerdns-db-app
                  key: password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-api-key
                  key: powerdns_api_key
            # Bind PowerDNS to the node's IP only (not 0.0.0.0) to avoid conflicting
            # with Talos dns-resolve-cache at 127.0.0.53:53.
            # With hostNetwork: true, status.podIP = node IP.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: api
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-template
              mountPath: /etc/powerdns-template
              readOnly: true
            - name: config-runtime
              mountPath: /etc/powerdns
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config-template
          configMap:
            name: powerdns-config
        - name: config-runtime
          emptyDir: {}
      nodeSelector:
        topology.kubernetes.io/region: hetzner
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
