apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: powerdns
  namespace: dns-system
  labels:
    app.kubernetes.io/name: powerdns
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
        # Skip Cilium transparent DNS proxy — PowerDNS is authoritative, not a client.
        # Cilium's DNS proxy with 10s linger timeout breaks AXFR zone transfers.
        io.cilium.proxy.denylist: "53/TCP,53/UDP"
      labels:
        app.kubernetes.io/name: powerdns
    spec:
      # hostNetwork mode: pod runs in the host network namespace.
      # Why not hostPort? Cilium implements hostPort via BPF rules on 0.0.0.0:<port>,
      # which intercepts ALL port 53 traffic on the node — including containerd's
      # queries to Talos DNS proxy at 127.0.0.53:53, breaking image pulls.
      #
      # With hostNetwork, PowerDNS binds directly in the host namespace.
      # Port 53 coexistence requires binding to specific IPs:
      #   - PowerDNS local-address = node's ExternalIP (public, from K8s API)
      #   - Talos dns-resolve-cache binds 127.0.0.53:53 (loopback only)
      #   - Nebula lighthouse DNS binds to Nebula IP:53 (10.42.0.x)
      # All three are disjoint addresses, so no conflict.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: powerdns
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: powerdns
          image: powerdns/pdns-auth-49:4.9.4
          imagePullPolicy: IfNotPresent
          # The official pdns-auth-49 image does NOT support PDNS_* env vars
          # (that's a community Docker image convention). Override the entrypoint
          # to inject secrets and local-address into the config file at startup.
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/powerdns-template/pdns.conf /etc/powerdns/pdns.conf
              echo "gpgsql-password=${GPGSQL_PASSWORD}" >> /etc/powerdns/pdns.conf
              echo "api-key=${API_KEY}" >> /etc/powerdns/pdns.conf
              # Bind to the node's public IP (ExternalIP), NOT POD_IP which is the
              # Nebula overlay IP (10.42.0.x). Binding to the Nebula IP on port 53
              # shadows Nebula's lighthouse DNS server on the same IP:53.
              # The Talos CCM sets ExternalIP via Hetzner metadata; we read it from
              # the K8s API using the mounted ServiceAccount token.
              PUBLIC_IP=$(python3 -c "
              import json, urllib.request, ssl, ipaddress
              ca = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
              token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
              ctx = ssl.create_default_context(cafile=ca)
              req = urllib.request.Request(
                  'https://kubernetes.default.svc/api/v1/nodes/${NODE_NAME}',
                  headers={'Authorization': f'Bearer {token}'})
              node = json.load(urllib.request.urlopen(req, context=ctx))
              for addr in node['status']['addresses']:
                  if addr['type'] == 'ExternalIP':
                      ip = ipaddress.ip_address(addr['address'])
                      if ip.version == 4:
                          print(addr['address'])
                          break
              ")
              if [ -z "$PUBLIC_IP" ]; then
                echo "FATAL: could not discover ExternalIP for node ${NODE_NAME}" >&2
                exit 1
              fi
              echo "local-address=${PUBLIC_IP}" >> /etc/powerdns/pdns.conf
              exec pdns_server --config-dir=/etc/powerdns --guardian=no --daemon=no
          # Security context: must run as root for hostNetwork port 53 binding.
          # Verified via /proc/PID/status: containerd/runc does NOT populate the
          # effective capability set for non-root processes, even with
          # allowPrivilegeEscalation:true and NET_BIND_SERVICE in the bounding set.
          # Actual process state: CapEff=0, CapBnd=0x400 — bind() returns EACCES.
          # For root, the kernel automatically sets effective caps from bounding set
          # after exec, so NET_BIND_SERVICE works.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: powerdns-db-app
                  key: password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-api-key
                  key: powerdns_api_key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: api
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-template
              mountPath: /etc/powerdns-template
              readOnly: true
            - name: config-runtime
              mountPath: /etc/powerdns
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config-template
          configMap:
            name: powerdns-config
        - name: config-runtime
          emptyDir: {}
      nodeSelector:
        topology.kubernetes.io/region: hil
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
