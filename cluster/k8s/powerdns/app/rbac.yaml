apiVersion: v1
kind: ServiceAccount
metadata:
  name: powerdns
  namespace: dns-system
---
# PowerDNS needs to read its node's ExternalIP to bind to the public IP.
# With hostNetwork + Nebula overlay, POD_IP is the Nebula IP (10.42.0.x),
# not the public IP. The startup script queries the K8s API for the node's
# ExternalIP address set by the Talos cloud controller manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: powerdns-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: powerdns-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: powerdns-node-reader
subjects:
  - kind: ServiceAccount
    name: powerdns
    namespace: dns-system
