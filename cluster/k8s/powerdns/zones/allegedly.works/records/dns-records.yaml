---
# Nameserver A records (within the zone)
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns1
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: ns1.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps0}"
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns2
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: ns2.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps1}"
---
# Wildcard A record for all *.allegedly.works services.
# Cilium Envoy runs on all VPS nodes via hostNetwork — all 4 IPs serve traffic.
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: wildcard
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: "*.allegedly.works."
  type: A
  ttl: 300
  records:
    - "${vps_ip_vps0}"
    - "${vps_ip_vps1}"
    - "${vps_ip_vps_worker0}"
    - "${vps_ip_vps_worker1}"
---
# Apex A record for allegedly.works (website).
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: apex
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: allegedly.works.
  type: A
  ttl: 300
  records:
    - "${vps_ip_vps0}"
    - "${vps_ip_vps1}"
    - "${vps_ip_vps_worker0}"
    - "${vps_ip_vps_worker1}"
