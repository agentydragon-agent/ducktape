---
# Nebula lighthouse A records — resolve lighthouse cert names to VPS public IPs.
# Used by non-lighthouse nodes (wyrm2, rugged) to find lighthouses before joining
# the mesh. IPs substituted by Flux postBuild from cluster-info ConfigMap.
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: nebula-talos-vps-cp-0
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: talos-vps-cp-0.nebula.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps0}"
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: nebula-talos-vps-cp-1
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: talos-vps-cp-1.nebula.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps1}"
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: nebula-talos-vps-worker-0
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: talos-vps-worker-0.nebula.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps_worker0}"
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: nebula-talos-vps-worker-1
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: talos-vps-worker-1.nebula.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps_worker1}"
---
# Nameserver A records (within the zone)
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns1
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: ns1.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps0}"
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns2
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: ns2.allegedly.works.
  type: A
  ttl: 3600
  records:
    - "${vps_ip_vps1}"
---
# Wildcard A record for all *.allegedly.works services.
# Workaround for Cilium Gateway API bug (github.com/cilium/cilium/issues/42786):
# hostNetwork gateways stay Programmed=False (regression in v1.18.3), which
# prevents external-dns from generating DNS records. This declarative record
# replaces external-dns for the wildcard.
# TODO: Remove once Cilium fixes #42786 and external-dns can manage this again.
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: wildcard
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: "*.allegedly.works."
  type: A
  ttl: 300
  records:
    - "${vps_ip_vps0}"
    - "${vps_ip_vps1}"
    - "${vps_ip_vps_worker0}"
    - "${vps_ip_vps_worker1}"
---
# Apex A record for allegedly.works (website).
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: apex
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: allegedly.works.
  type: A
  ttl: 300
  records:
    - "${vps_ip_vps0}"
    - "${vps_ip_vps1}"
---
# Kubernetes API endpoint (round-robin to CP nodes)
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: api
spec:
  zoneRef:
    kind: ClusterZone
    name: allegedly.works
  name: api.allegedly.works.
  type: A
  ttl: 300
  records:
    - "${vps_ip_vps0}"
    - "${vps_ip_vps1}"
