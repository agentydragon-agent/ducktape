---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns
  namespace: dns-system
spec:
  interval: 15m
  timeout: 10m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./cluster/charts/powerdns
      sourceRef:
        kind: GitRepository
        name: powerdns-chart
        namespace: dns-system
      interval: 15m
  values:
    # Image configuration - using pschiffe/pdns-mysql with auto-init
    image:
      repository: pschiffe/pdns-mysql
      tag: "4.9"
      pullPolicy: IfNotPresent

    # hostNetwork mode: pod runs in the host network namespace.
    # Why not hostPort? Cilium implements hostPort via BPF rules on 0.0.0.0:<port>,
    # which intercepts ALL port 53 traffic on the node — including containerd's
    # queries to Talos DNS proxy at 127.0.0.53:53, breaking image pulls for any
    # registry (ghcr.io, docker.io, etc.) since PowerDNS is authoritative-only.
    #
    # With hostNetwork, PowerDNS binds directly in the host namespace.
    # Port 53 coexistence with Talos DNS proxy:
    #   - PowerDNS local-address = node's public IP (via Downward API)
    #   - Talos dns-resolve-cache binds 127.0.0.53:53 (loopback only)
    # These are disjoint addresses, so no conflict. Containerd image pulls
    # go to 127.0.0.53 → Talos DNS → upstream resolvers (Hetzner).
    # External DNS queries go to <public-ip>:53 → PowerDNS.
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    hostPort:
      enabled: false

    # Bind PowerDNS to the node's IP only (not 0.0.0.0) to avoid conflicting
    # with Talos dns-resolve-cache at 127.0.0.53:53.
    # With hostNetwork: true, status.podIP = node IP.
    extraEnv:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: PDNS_local_address
        value: "$(POD_IP)"

    # Only run on Hetzner VPS nodes (which have public IPs)
    nodeSelector:
      topology.kubernetes.io/region: hetzner

    # Allow running on control-plane nodes (VPS nodes are control-plane)
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

    # DaemonSet: runs one pod per matching node (no replicaCount needed)
    podAnnotations:
      reloader.stakater.com/auto: "true"
      # Skip Cilium transparent DNS proxy — PowerDNS is authoritative, not a client.
      # Cilium's DNS proxy with 10s linger timeout breaks AXFR zone transfers.
      io.cilium.proxy.denylist: "53/TCP,53/UDP"

    # Service configuration - ClusterIP for internal access
    # Fixed clusterIP allows CoreDNS to forward allegedly.works zone reliably
    service:
      dns:
        type: ClusterIP
        clusterIP: "10.96.53.53"

    # Security context: must run as root for hostNetwork port 53 binding.
    # Verified via /proc/PID/status: containerd/runc does NOT populate the
    # effective capability set for non-root processes, even with
    # allowPrivilegeEscalation:true and NET_BIND_SERVICE in the bounding set.
    # Actual process state: CapEff=0, CapBnd=0x400 — bind() returns EACCES.
    # For root, the kernel automatically sets effective caps from bounding set
    # after exec, so NET_BIND_SERVICE works.
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_BIND_SERVICE"]
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    # PowerDNS configuration
    powerdns:
      api:
        enabled: true
        secretName: powerdns-api-key
        secretKey: powerdns_api_key
      webserver:
        enabled: true
        # Allow all IPs for health probes. Security model:
        # - Webserver (8081) is ClusterIP only, not exposed externally
        # - Zone operations require X-API-Key header (powerdns-api-key secret)
        # - Without API key: only health (/) and metrics (/metrics) accessible
        # - Kubelet probes come from node's INTERNAL-IP; VPS nodes have public IPs,
        #   so RFC1918-only ACL breaks health checks on hybrid VPS+Proxmox cluster
        allowFrom: "0.0.0.0/0"
      backend: "gmysql"

    # External Secret integration - use our chart's built-in ESO support
    externalSecret:
      enabled: true
      secretStore:
        name: vault-backend
        kind: ClusterSecretStore
      secretName: powerdns-api-key

    # MariaDB subchart - database backend with auto-schema-init
    mariadb:
      enabled: true
      auth:
        database: powerdns
        username: powerdns
        # Passwords auto-generated by chart (turnkey, no manual Vault setup)
      primary:
        persistence:
          enabled: true
          storageClass: proxmox-csi-retain
          size: 2Gi
