apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/powerdns"
  prune: true
  wait: true
  dependsOn:
    - name: dns-system-namespace
    - name: powerdns-secrets # Wait for password generation
    - name: reflector # Wait for Reflector to handle secret copying
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: powerdns
      namespace: dns-system
