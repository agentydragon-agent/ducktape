# PowerDNS API Key - reads stable value from Vault (generated by powerdns-api-key Terraform)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powerdns-api-key
  namespace: dns-system
  annotations:
    description: PowerDNS API key for DNS record management
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: powerdns-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "external-dns,cert-manager,powerdns-operator,flux-system"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "external-dns,cert-manager,powerdns-operator,flux-system"
      data:
        powerdns_api_key: "{{ .api_key }}"
        PDNS_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: kv/powerdns/api-key
        property: api_key
