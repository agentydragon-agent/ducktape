apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/powerdns/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: powerdns-api-key
      namespace: flux-system
  dependsOn:
    - name: dns-system-namespace
    - name: external-secrets-config
    - name: tofu-controller
    - name: vault
