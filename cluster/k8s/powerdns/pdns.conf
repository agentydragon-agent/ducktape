launch=gpgsql
gpgsql-host=powerdns-db-rw.dns-system.svc
gpgsql-port=5432
gpgsql-user=pdns
gpgsql-dbname=pdns
# gpgsql-password injected at startup from GPGSQL_PASSWORD env var

api=yes
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
# Allow all IPs for health probes. Security model:
# - Webserver (8081) is ClusterIP only, not exposed externally
# - Zone operations require X-API-Key header (powerdns-api-key secret)
# - Without API key: only health (/) and metrics (/metrics) accessible
webserver-allow-from=0.0.0.0/0

# Control socket in writable /tmp (rootfs is read-only-ish with dropped caps)
socket-dir=/tmp

# Disable setuid/setgid (enforced by Kubernetes securityContext)
setuid=
setgid=

# Enable AXFR for zone transfers
allow-axfr-ips=10.0.0.0/8,100.64.0.3
disable-axfr=no

# local-address injected at startup from node ExternalIP (K8s API query)
# api-key injected at startup from API_KEY env var
