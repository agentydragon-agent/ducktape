---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Authentik forward auth (embedded outpost)
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.authentik/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.allegedly.works/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hubble.allegedly.works
      secretName: hubble-ui-tls
  rules:
    - host: hubble.allegedly.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
