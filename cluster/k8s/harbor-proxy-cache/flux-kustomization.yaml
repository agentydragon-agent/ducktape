---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-proxy-cache
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/k8s/harbor-proxy-cache
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: harbor-proxy-cache
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
    - name: harbor # Wait for Harbor to be deployed
