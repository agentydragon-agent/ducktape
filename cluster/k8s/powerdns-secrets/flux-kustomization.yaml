apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/powerdns-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: dns-system-namespace
    - name: external-secrets-config
