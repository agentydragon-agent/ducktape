apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: flux-system
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: paperless-namespace
    - name: paperless-secrets
    - name: paperless-cache
    - name: paperless-db
    - name: gateway
