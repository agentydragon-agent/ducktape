apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-cache
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/paperless/cache
  prune: true
  wait: true
  dependsOn:
    - name: paperless-namespace
      namespace: ducktape-flux
    - name: valkey
      namespace: flux-system
    - name: local-path-provisioner
      namespace: flux-system
