apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-gateway-namespace
  namespace: flux-system
spec:
  retries: 0
  interval: 1h
  path: ./cluster/k8s/openclaw-gateway-namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
