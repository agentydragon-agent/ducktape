---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attic-push-token
  namespace: claude-sandbox
  annotations:
    description: >-
      Attic nix cache push/pull JWT for agents (cache.allegedly.works),
      reflected to openclaw-sandbox. Provisioned manually via
      `atticadm make-token` (not Terraform-managed). Expires 2036-03-24.
spec:
  encryptedData:
    token: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-sandbox
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-sandbox
      name: attic-push-token
      namespace: claude-sandbox
    type: Opaque
