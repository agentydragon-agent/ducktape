---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: buildbuddy-api-key
  namespace: claude-sandbox
  annotations:
    description: BuildBuddy RBE API key for sandbox agents (app.buildbuddy.io), also reflected to openclaw-sandbox
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-sandbox
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-sandbox
      name: buildbuddy-api-key
      namespace: claude-sandbox
    type: Opaque
