apiVersion: apps/v1
kind: Deployment
metadata:
  name: tana-mcp-facade
  namespace: tana-mcp
  labels:
    app.kubernetes.io/name: tana-mcp-facade
  annotations:
    description: "Public Authentik-backed MCP facade for Tana, running the shared mcp-oauth-facade image. Access is enforced by Authentik group membership; the server injects a static downstream PAT."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp-facade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp-facade
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260430040033-fe4a162 # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tana-mcp-facade-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tana-mcp-facade-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tana-mcp-facade-oidc
                  key: client_secret
            - name: MCP_FACADE_UPSTREAM__BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
          volumeMounts:
            - name: fastmcp-state
              mountPath: /var/lib/fastmcp
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: fastmcp-state
          persistentVolumeClaim:
            claimName: tana-mcp-facade-fastmcp-state
