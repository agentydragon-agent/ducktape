apiVersion: apps/v1
kind: Deployment
metadata:
  name: plaid-db-mcp
  namespace: plaid-mcp
  labels:
    app.kubernetes.io/name: plaid-db-mcp
  annotations:
    description: "Read-only Postgres MCP over the Plaid sync database, fronted by mcp-oauth-facade. The upstream MCP uses Streamable HTTP and connects with the plaid_ro role."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-db-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-db-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres-mcp
          image: writenotenow/postgres-mcp:sha-ba84229@sha256:36a2b081b4c0ecf7e0f34deb6a312c32c467490881aa8c65d1fea18e9b5609e0
          imagePullPolicy: IfNotPresent
          args:
            - --transport
            - http
            - --port
            - "8000"
            - --server-host
            - 0.0.0.0
            - --tool-filter
            - schema,introspection,monitoring,performance,+pg_read_query,+pg_explain,-codemode
          ports:
            - name: upstream
              containerPort: 8000
              protocol: TCP
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: plaid-mcp-db-readonly
                  key: DATABASE_URL
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_TRANSPORT
              value: http
            - name: PORT
              value: "8000"
            - name: AUDIT_REDACT
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
        - name: facade
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260529231610-304b2dd # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: plaid-db-mcp-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: plaid-db-mcp-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: plaid-db-mcp-oidc
                  key: client_secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 20
