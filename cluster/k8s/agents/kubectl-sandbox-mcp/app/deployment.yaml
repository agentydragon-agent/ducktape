apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-sandbox-mcp
  namespace: kubectl-sandbox-mcp
  labels:
    app.kubernetes.io/name: kubectl-sandbox-mcp
  annotations:
    description: "containers/kubernetes-mcp-server with token exchange. Callers authenticate via Authentik; their token is exchanged for one scoped to kubectl-sandbox-users group (sandbox permissions only, even for admins)."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-sandbox-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-sandbox-mcp
    spec:
      serviceAccountName: kubectl-sandbox-mcp
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.60
          imagePullPolicy: IfNotPresent
          args:
            # Drop-in config dir: ConfigMap provides 00-public.toml (URLs, audiences);
            # Secret provides 01-secret.toml (sts_client_secret, sts_audience).
            # Files load in lexical order; later files override earlier.
            - --config-dir=/etc/kubectl-sandbox-mcp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: public
              mountPath: /etc/kubectl-sandbox-mcp/00-public.toml
              subPath: 00-public.toml
              readOnly: true
            - name: secret
              mountPath: /etc/kubectl-sandbox-mcp/01-secret.toml
              subPath: 01-secret.toml
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: public
          configMap:
            name: kubectl-sandbox-mcp-public
        - name: secret
          secret:
            secretName: kubectl-sandbox-mcp
