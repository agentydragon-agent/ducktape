apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-sandbox-mcp
  namespace: kubectl-sandbox-mcp
  labels:
    app.kubernetes.io/name: kubectl-sandbox-mcp
  annotations:
    description: "containers/kubernetes-mcp-server with token exchange. Callers authenticate via Authentik; their token is exchanged for one scoped to kubectl-sandbox-users group (sandbox permissions only, even for admins)."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-sandbox-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-sandbox-mcp
    spec:
      serviceAccountName: kubectl-sandbox-mcp
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.60
          imagePullPolicy: IfNotPresent
          args:
            # Base config (ConfigMap) + drop-in dir for secrets. Drop-ins load in
            # lexical order and override the base; the Secret's 01-secret.toml adds
            # sts_client_secret and sts_audience.
            - --config=/etc/kubectl-sandbox-mcp/00-public.toml
            - --config-dir=/etc/kubectl-sandbox-mcp/conf.d
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: public
              mountPath: /etc/kubectl-sandbox-mcp/00-public.toml
              subPath: 00-public.toml
              readOnly: true
            - name: secret
              mountPath: /etc/kubectl-sandbox-mcp/conf.d
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: public
          configMap:
            name: kubectl-sandbox-mcp-public
        - name: secret
          secret:
            secretName: kubectl-sandbox-mcp
