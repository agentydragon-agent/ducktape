apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-token-rotation
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/forgejo-token-rotation
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: github-secrets-sync-secrets
    - name: authentik-jwt-rotation # owns the agents-infra namespace
    - name: forgejo-claude
    - name: haku-state
    - name: forgejo-agentydragon-repos
  timeout: 2m
