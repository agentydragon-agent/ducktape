# Additional execution ceiling for operator-approved temporary grants.
#
# This does not give the Agent standing access. Haku Console still authorizes every request against
# the standing SAR subject or an active Agent-owned grant before the proxy sends it upstream. This
# ClusterRoleBinding only defines the maximum pod-read authority that an approved grant may unlock.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haku-kube-api-proxy-all-pods-read-ceiling
  annotations:
    description: Allows the Haku proxy to get or list pod metadata cluster-wide only after Haku authorization.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haku-kube-api-proxy-all-pods-read-ceiling
  annotations:
    description: Binds the operator-approved cluster-wide pod-read ceiling only to the Haku proxy.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haku-kube-api-proxy-all-pods-read-ceiling
subjects:
  - kind: ServiceAccount
    name: haku-kube-api-proxy
    namespace: haku-console
