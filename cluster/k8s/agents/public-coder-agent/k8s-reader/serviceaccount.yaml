# Fixed read-only SubjectAccessReview identity for the public-coder access profile. It has no
# bearer Secret and is never used to execute Agent requests; Console evaluates its standing RBAC
# through SubjectAccessReview while haku-kube-api-proxy uses a separate execution identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-coder-agent-reader
  namespace: public-coder-agent
  annotations:
    description: Fixed standing SAR subject for public-coder diagnostics.
automountServiceAccountToken: false
