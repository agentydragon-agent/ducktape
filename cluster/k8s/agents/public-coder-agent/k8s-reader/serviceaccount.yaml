# Dedicated read-only ServiceAccount for the agent to diagnose its own namespace
# (and, as RoleBindings are added in follow-ups, others). The token never enters
# the agent container: iron-proxy holds it and substitutes a placeholder on the
# Authorization header for kubeapi.allegedly.works — same pattern as GITHUB_TOKEN.
#
# Start small: this SA has a Role only in public-coder-agent. Add more
# RoleBindings in other namespaces as the diagnostic scope widens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-coder-agent-reader
  namespace: public-coder-agent
  annotations:
    description: Read-only diagnostic access for the agent, mediated by iron-proxy.
automountServiceAccountToken: false
---
# A non-expiring token secret so iron-proxy can read a stable bearer.
# automountServiceAccountToken: false above prevents the token from being
# injected into pods that use this SA — only this explicit secret holds it.
apiVersion: v1
kind: Secret
metadata:
  name: public-coder-agent-reader-token
  namespace: public-coder-agent
  annotations:
    kubernetes.io/service-account.name: public-coder-agent-reader
    description: Long-lived bearer token for the reader SA, consumed by iron-proxy.
type: kubernetes.io/service-account-token
