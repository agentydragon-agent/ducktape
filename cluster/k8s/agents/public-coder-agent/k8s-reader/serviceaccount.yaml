# Fixed read-only SubjectAccessReview identity for the public-coder access profile.
#
# The explicit token Secret remains temporarily as an inert rollback credential during the Haku
# proxy cutover. iron-proxy no longer has a transform that can attach it to Agent traffic; remove
# the env/Secret in the post-verification cleanup once ordinary diagnostics and rollback are proven.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-coder-agent-reader
  namespace: public-coder-agent
  annotations:
    description: Fixed standing SAR subject for public-coder diagnostics.
automountServiceAccountToken: false
---
# Temporary rollback-only bearer. No iron-proxy rule selects this credential after cutover.
# automountServiceAccountToken: false above prevents it from being injected into other pods.
apiVersion: v1
kind: Secret
metadata:
  name: public-coder-agent-reader-token
  namespace: public-coder-agent
  annotations:
    kubernetes.io/service-account.name: public-coder-agent-reader
    description: Temporary inert rollback credential; remove after Haku proxy verification.
type: kubernetes.io/service-account-token
