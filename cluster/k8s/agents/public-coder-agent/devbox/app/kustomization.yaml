apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: public-coder-devbox-cloud-init
    files:
      - userdata=cloud-init.yaml

resources:
  - host-key.sops.yaml
  - vm-images-s3-reader.yaml
  - virtualmachine.yaml
  - service.yaml
  - networkpolicy-ingress.yaml
  - cnp-egress.yaml
