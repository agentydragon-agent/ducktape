apiVersion: v1
kind: Service
metadata:
  name: public-coder-devbox-ssh
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-devbox
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: public-coder-devbox
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
