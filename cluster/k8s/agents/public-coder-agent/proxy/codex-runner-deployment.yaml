# Least-credential proxy dedicated to ephemeral Console-launched Codex runners. Keep the ordinary
# public-coder-agent workload on public-coder-agent-proxy: that proxy intentionally carries several
# long-lived application credentials which must not become capabilities of a launched runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-coder-codex-runner-proxy
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-codex-runner-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-codex-runner-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-codex-runner-proxy
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iron-proxy
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260819201301-06b8b19 # {"$imagepolicy": "flux-system:iron-proxy"}
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-github-token
                  key: GITHUB_TOKEN
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-public-coder-agent
                  key: api-key
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/iron-proxy
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: public-coder-codex-runner-proxy-config
        - name: ca
          secret:
            secretName: public-coder-agent-proxy-ca
---
apiVersion: v1
kind: Service
metadata:
  name: public-coder-codex-runner-proxy
  namespace: public-coder-agent
spec:
  selector:
    app.kubernetes.io/name: public-coder-codex-runner-proxy
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
      protocol: TCP
