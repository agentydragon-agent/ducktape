# TODO: consider moving iron-proxy into its own namespace (separate from the
# agent app) for cleaner blast-radius isolation — the proxy holds all mediated
# credentials and the agent app does not need to share its namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - trust-bundle.yaml
  - deployment.yaml
  - service.yaml
  - cnp-ingress.yaml
  - cnp-egress.yaml
  - codex-runner-deployment.yaml
  - codex-runner-networkpolicy.yaml
configMapGenerator:
  - name: public-coder-agent-proxy-config
    namespace: public-coder-agent
    files:
      - iron.yaml
  - name: public-coder-codex-runner-proxy-config
    namespace: public-coder-agent
    files:
      - iron.yaml=codex-runner-iron.yaml
