apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-proxy
  namespace: ducktape-flux
  annotations:
    description: Egress proxy and interception CA for the public-coder-agent OpenClaw instance.
spec:
  interval: 1h
  retryInterval: 1m
  path: ./cluster/k8s/agents/public-coder-agent/proxy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: public-coder-agent-namespace
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-trust
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    # Generates the proxy-held Haku Console static-Agent bearer after the target namespace exists.
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    # The fixed standing SAR subject and complete proxy execution ceiling must remain Ready before
    # credential mediation changes roll out.
    - name: public-coder-agent-k8s-reader
    # Likewise wait for Console's SAR configuration and authorization proxy to remain Ready.
    - name: haku-console
      namespace: ducktape-flux
    # The proxy reads the reflected Matrix bot password from its namespace.
    - name: matrix-secrets
      namespace: ducktape-flux
    # aiquota creates the sole bearer, then reflects its constrained mirror to
    # this namespace for the proxy-only substitution rule.
    - name: aiquota
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-coder-agent-proxy
      namespace: public-coder-agent
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: public-coder-agent-proxy-root-ca
      namespace: public-coder-agent
