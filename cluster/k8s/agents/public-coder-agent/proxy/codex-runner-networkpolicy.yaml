# Possession of a placeholder is not authority to use this proxy. Only the profile-labeled
# Console runner may connect, and the proxy itself can reach only DNS, GitHub, and LiteLLM.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-coder-codex-runner-proxy
  namespace: public-coder-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-codex-runner-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-runtime-sandbox
            k8s:app.kubernetes.io/name: haku-harness-runner
            k8s:haku.allegedly.works/access-profile-id: public-coder
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.github.com
              - matchName: github.com
              - matchName: codeload.github.com
              - matchName: objects.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
              - matchName: raw.githubusercontent.com
              - matchName: litellm.litellm.svc.cluster.local
    - toFQDNs:
        - matchName: api.github.com
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
