# Least-credential forward proxy for Console-launched public-coder Codex runners.
#
# This is deliberately not the all-purpose public-coder-agent proxy. The runner receives only the
# two inert placeholders below, and this process holds only the matching GitHub credential and
# LiteLLM virtual key. In particular it has no Haku Console static bearer, ClickHouse password,
# AIQuota bearer, Brave key, or Matrix password to substitute or recover.
dns:
  enabled: false

proxy:
  tunnel_listen: ":8080"

tls:
  mode: "mitm"
  ca_cert: "/ca/tls.crt"
  ca_key: "/ca/tls.key"

transforms:
  - name: allowlist
    config:
      domains:
        - "api.github.com"
        - "github.com"
        - "codeload.github.com"
        - "objects.githubusercontent.com"
        - "release-assets.githubusercontent.com"
        - "raw.githubusercontent.com"
        - "litellm.litellm.svc.cluster.local"
  - name: secrets
    config:
      secrets:
        - source:
            type: env
            var: GITHUB_TOKEN
          replace:
            # Works for API Bearer requests and Git's base64 Basic payload.
            proxy_value: "proxy-github-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "api.github.com"
            - host: "github.com"
            - host: "codeload.github.com"
        - source:
            type: env
            var: LITELLM_API_KEY
          replace:
            proxy_value: "proxy-litellm-public-coder-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "litellm.litellm.svc.cluster.local"

log:
  level: "info"
