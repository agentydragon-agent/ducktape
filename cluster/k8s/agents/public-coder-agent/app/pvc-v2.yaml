apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: public-coder-agent-state-v2
  namespace: public-coder-agent
  annotations:
    description: >-
      Worker-local replacement for the archived Public Coder OpenClaw state.
      WaitForFirstConsumer binds it to ovh-ns102453 when the one-off restore
      Pod is created; it must not be mounted by the Deployment before restore.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-ovh-hdd
  resources:
    requests:
      # local-path does not enforce PVC requests as quotas; this request leaves
      # headroom for the durable agent workspace and normal growth.
      storage: 80Gi
