apiVersion: v1
kind: Config
clusters:
  - name: in-cluster
    cluster:
      server: https://kubeapi.allegedly.works
      proxy-url: http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080
      certificate-authority: /etc/ssl/certs/ca-certificates.crt
contexts:
  - name: in-cluster
    context:
      cluster: in-cluster
      namespace: public-coder-agent
      user: reader
current-context: in-cluster
users:
  - name: reader
    user:
      token: proxy-k8s-reader-placeholder
