# Gateway auth normally arrives through the Authentik trusted proxy. OpenClaw
# subagents and other backend clients instead call the gateway over its loopback
# WebSocket, so they never carry Authentik's identity headers.
#
# OpenClaw's supported trusted-proxy configuration is a separate local password
# fallback (OPENCLAW_GATEWAY_PASSWORD). Generate it once and retain it; rotating
# this Secret deliberately restarts the agent and invalidates local clients until
# they read the replacement value from the same environment.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: public-coder-agent-gateway-password-generator
  namespace: public-coder-agent
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-agent-gateway-password
  namespace: public-coder-agent
spec:
  # A generated password is stable for the generator's lifetime. Avoid an
  # automatic rotation that would unnecessarily interrupt active sessions.
  refreshInterval: 8760h
  target:
    name: public-coder-agent-gateway-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: public-coder-agent-gateway-password-generator
