apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-shared-rbac
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/shared-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: kyverno-policies
