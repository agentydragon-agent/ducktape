apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubectl-machine-mcp-namespace
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/agents/kubectl-machine-mcp/namespace
  prune: false
  wait: true
