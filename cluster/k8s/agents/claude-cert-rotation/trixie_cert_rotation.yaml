# Deb packages for the claude-cert-rotation CronJob image.
# Git + bash + openssl + kubectl deps on debian:trixie-slim.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_cert_rotation//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  - "git"
  - "bash"
  - "ca-certificates"
  - "openssl"
