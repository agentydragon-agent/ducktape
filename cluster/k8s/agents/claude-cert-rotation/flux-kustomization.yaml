apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-cert-rotation
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/claude-cert-rotation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: github-secrets-sync-secrets
  timeout: 2m
