apiVersion: batch/v1
kind: CronJob
metadata:
  name: alloy-otlp-jwt-rotation
  namespace: agents-infra
  annotations:
    description: >-
      Rotates the dedicated Authentik JWT used for Alloy OTLP ingestion. Runs
      hourly on a staggered schedule; the shared Authentik JWT rotator
      sparse-clones the existing SOPS file, reads the unencrypted
      `expires_unencrypted` field (no decryption needed), and skips rotation if
      remaining validity > 24h.
spec:
  schedule: "20 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: claude-jwt-rotator
          restartPolicy: OnFailure
          volumes:
            - name: authentik-client
              secret:
                secretName: alloy-otlp-client-credentials
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: rotate-script
              configMap:
                name: authentik-jwt-rotation-script
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: ghcr.io/agentydragon/claude-jwt-rotation:devel-20260425073929-855b763 # {"$imagepolicy": "flux-system:claude-jwt-rotation"}
              command: ["/usr/bin/bash", "/scripts/rotate.sh"]
              env:
                - name: ROTATION_NAME
                  value: Alloy OTLP JWT
                - name: AUTHENTIK_PROVIDER_SLUG
                  value: alloy-otlp-client-credentials
                - name: TOKEN_SCOPES
                  value: openid profile email
                - name: SOPS_FILE
                  value: secrets/alloy-otlp-bearer-token.yaml
                - name: TOKEN_FIELD_NAME
                  value: token
                - name: GIT_AUTHOR_NAME
                  value: alloy-otlp-jwt-rotation
                - name: COMMIT_MESSAGE_PREFIX
                  value: "chore: rotate Alloy OTLP JWT"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: authentik-client
                  mountPath: /var/run/secrets/authentik-client
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: rotate-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
