apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-sandbox-mcp-namespace
  namespace: flux-system
  annotations:
    description: Namespace for the sandbox-provisioning MCP server (haku/sandbox_mcp) that hands out Haku sandboxes in haku-sandbox.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agents/haku-sandbox-mcp/namespace
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: haku-sandbox-mcp
