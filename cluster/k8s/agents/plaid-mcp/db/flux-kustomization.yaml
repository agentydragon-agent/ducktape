apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-mcp-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/plaid-mcp/db
  prune: true
  wait: true
  dependsOn:
    - name: cnpg
      namespace: flux-system
    - name: plaid-mcp-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: flux-system
    - name: external-secrets-config
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: plaid-mcp-db
      namespace: plaid-mcp
