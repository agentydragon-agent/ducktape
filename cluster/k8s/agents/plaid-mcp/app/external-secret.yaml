# v0 keeps the Plaid app client credentials sourced from the existing airlock
# Secret. During migration, existing Airlock Plaid access-token Secrets are also
# mirrored here so their Items can be seeded into the new sync database. New links
# created through the plaid-mcp UI write their own per-Item Secrets directly.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-client-credentials
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-client-credentials
  dataFrom:
    - extract:
        key: plaid-client-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-chase-access-token
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-chase-access-token
  dataFrom:
    - extract:
        key: plaid-chase-access-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-bofa-access-token
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-bofa-access-token
  dataFrom:
    - extract:
        key: plaid-bofa-access-token
