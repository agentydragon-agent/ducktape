# v0 keeps the Plaid app client credentials sourced from the existing airlock
# Secret while access-token Secrets are now created directly by the plaid-mcp web
# UI. The per-item airlock mirrors from the old static MCP deployment are gone.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-client-credentials
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-client-credentials
  dataFrom:
    - extract:
        key: plaid-client-credentials
