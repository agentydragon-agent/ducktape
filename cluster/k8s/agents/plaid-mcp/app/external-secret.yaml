# v0 keeps the Plaid app client credentials sourced from the existing airlock
# Secret. New access-token Secrets are created directly by the plaid-mcp web UI;
# existing Airlock Plaid tokens remain in Airlock until this replacement is
# verified and the Airlock Plaid providers can be unwired.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-client-credentials
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-client-credentials
  dataFrom:
    - extract:
        key: plaid-client-credentials
