apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-jwt-rotation
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/authentik-jwt-rotation
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: github-secrets-sync-secrets
    - name: agent-machine-access-tf
  timeout: 2m
