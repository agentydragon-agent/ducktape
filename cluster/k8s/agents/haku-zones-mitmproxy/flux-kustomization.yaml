apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-zones-mitmproxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/haku-zones-mitmproxy
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: haku-zones-mitmproxy-namespace
      namespace: ducktape-flux
    - name: cert-manager-environment
    - name: cert-manager-trust
    - name: reflector
      namespace: ducktape-flux
