apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-zones-mitmproxy
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agents/haku-zones-mitmproxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: haku-zones-mitmproxy-namespace
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-trust
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
