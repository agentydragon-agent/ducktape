apiVersion: v1
kind: Service
metadata:
  name: haku-claude-oauth-proxy
  namespace: haku-egress-proxy
spec:
  selector:
    app.kubernetes.io/name: haku-claude-oauth-proxy
  ports:
    - name: proxy
      port: 8180
      targetPort: proxy
    - name: metrics
      port: 9090
      targetPort: metrics
