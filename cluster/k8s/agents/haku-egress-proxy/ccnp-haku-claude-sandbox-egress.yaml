# Console-owned Claude runners are isolated from Haku's general sandbox namespace.
# They can reach Haku Console's runner bridge and the OAuth-substituting proxy,
# but have no direct internet, general cluster access, or general-purpose proxy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-claude-sandbox-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - haku-claude-sandbox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        # Cilium evaluates the destination endpoint after Service translation.
        # haku-console Service port 9090 targets the API container's `api` port 8080.
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
            k8s:app.kubernetes.io/name: haku-claude-oauth-proxy
      toPorts:
        - ports:
            - port: "8180"
              protocol: TCP
