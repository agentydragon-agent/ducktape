# The authentik-jwt-rotation CronJob probes the tokens it publishes against
# their real endpoints each run, which means reading back the published Secret.
# Its existing Role covers flux-system only; this rotation publishes into
# haku-egress-proxy instead, so it needs a read grant here.
#
# Scoped to the single Secret name by resourceNames, matching the flux-system
# Role's posture. Keep in sync with the k8s_secret name in rotations.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
  annotations:
    description: >-
      Lets the authentik-jwt-rotation CronJob read back the one Secret it
      publishes here, so its probe can verify the live token against
      kubeapi.allegedly.works. Nothing else in this namespace is readable.
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - haku-openclaw-spike-kube-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-jwt-rotation-published-secrets-reader
subjects:
  - kind: ServiceAccount
    name: authentik-jwt-rotation
    namespace: agents-infra
