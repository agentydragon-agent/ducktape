# The credential-holding Claude proxy can resolve DNS and connect only to the
# exact Anthropic API host for which its Authorization substitution is defined.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-claude-oauth-proxy-egress
  namespace: haku-egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.anthropic.com
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
