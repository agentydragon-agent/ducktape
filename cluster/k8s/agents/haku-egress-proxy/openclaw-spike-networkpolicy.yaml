apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-haku-openclaw-spike-proxy-ingress
  namespace: haku-egress-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-openclaw-spike
      ports:
        - port: 8181
          protocol: TCP
