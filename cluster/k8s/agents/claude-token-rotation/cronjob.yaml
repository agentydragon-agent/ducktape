apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-token-rotation
  namespace: default
  annotations:
    description: >-
      Syncs the static claude-code-web SA token to SOPS-encrypted git. Runs biweekly to pick up token changes after cluster rebuild.
spec:
  schedule: "0 0 1,15 * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: claude-code-web
          restartPolicy: OnFailure
          volumes:
            - name: sa-token
              secret:
                secretName: claude-code-web-token
                items:
                  - key: token
                    path: token
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: rotate-script
              configMap:
                name: claude-token-rotation-script
          containers:
            - name: rotate
              image: ghcr.io/agentydragon/claude-token-rotation:devel-20260405225634-b069fe4 # {"$imagepolicy": "flux-system:claude-token-rotation"}
              command: ["/bin/bash", "/scripts/rotate.sh"]
              env:
                # rules_distroless extracts debs without running postinst, so
                # update-ca-certificates never runs and /etc/ssl/certs/ is empty.
                # Point git/libcurl at the individual cert files directly.
                - name: GIT_SSL_CAPATH
                  value: /usr/share/ca-certificates/mozilla
              volumeMounts:
                - name: sa-token
                  mountPath: /var/run/secrets/sa-token
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: rotate-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
