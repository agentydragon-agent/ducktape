apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: airlock-oidc-proxy
  namespace: flux-system
spec:
  interval: 15m
  approvePlan: "auto"
  path: ./tf/gitops/airlock-oidc-proxy
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: tf-runner
  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix    = "airlock-oidc-proxy"
        namespace        = "flux-system"
      }
  vars: []
