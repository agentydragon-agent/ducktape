apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-otlp-bearer
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/alloy-otlp-bearer
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets-config # ClusterSecretStore + CRDs
      namespace: ducktape-flux
    - name: claude-rbac # claude-sandbox namespace
      namespace: ducktape-flux
    - name: haku-rbac # haku-sandbox namespace
      namespace: ducktape-flux
    - name: haku-claude-namespace
      namespace: ducktape-flux
  timeout: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
