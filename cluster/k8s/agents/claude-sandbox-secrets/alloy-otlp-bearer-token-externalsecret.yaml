apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-otlp-bearer-token
  namespace: claude-sandbox
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alloy-otlp-bearer-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kv/alloy-otlp/bearer-token
        property: token
