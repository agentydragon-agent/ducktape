apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: manifold-mcp-ingress
  namespace: manifold-mcp
  annotations:
    description: "Default-deny ingress for manifold-mcp pods. Only the cluster gateway can reach the facade (port 8765). The Node bridge (port 8080) has NO allow rule, so other pods cannot reach it across the pod network — only the in-pod facade reaches it via loopback (localhost), which Cilium does not police."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: manifold-mcp
  ingress:
    # Cluster gateway (Envoy) → facade. Source pods in gateway-system serving
    # the manifold-mcp.allegedly.works HTTPRoute hit the facade Service on 8765.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateway-system
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
