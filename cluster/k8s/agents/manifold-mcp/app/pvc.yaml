apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manifold-mcp-fastmcp-state
  namespace: manifold-mcp
  annotations:
    description: "OIDCProxy DCR registration store (FASTMCP_HOME)."
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-proxmox
  resources:
    requests:
      storage: 1Gi
