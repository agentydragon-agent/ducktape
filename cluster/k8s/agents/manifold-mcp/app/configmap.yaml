apiVersion: v1
kind: ConfigMap
metadata:
  name: manifold-mcp-config
  namespace: manifold-mcp
data:
  MCP_FACADE_AUTH__OIDC_ISSUER: "https://auth.allegedly.works/application/o/manifold-mcp/"
  MCP_FACADE_AUTH__PUBLIC_BASE_URL: "https://manifold-mcp.allegedly.works"
  MCP_FACADE_FACADE_NAME: "Manifold MCP Facade"
  MCP_FACADE_UPSTREAM__KIND: "http"
  MCP_FACADE_UPSTREAM__URL: "http://localhost:8080/mcp"
  FASTMCP_HOME: "/var/lib/fastmcp"
