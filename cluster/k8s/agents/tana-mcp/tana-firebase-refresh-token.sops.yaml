apiVersion: v1
kind: Secret
metadata:
    name: tana-firebase-refresh-token
    namespace: tana-mcp
    annotations:
        description: |
            Long-lived Firebase refresh token for the agentydragon@gmail.com Tana
            account. Bootstrap procedure (see cluster/docs/plans/tana_mcp_sane_signin.md):

              bb run //tana/firebase_session_extractor -- \
                  ~/.config/tana-outliner/IndexedDB/https_app.tana.inc_0.indexeddb.leveldb \
                > /tmp/rt && \
              sed -i "s|REPLACE_ME|$(cat /tmp/rt)|" \
                  cluster/k8s/agents/tana-mcp/tana-firebase-refresh-token.sops.yaml && \
              sops -e -i cluster/k8s/agents/tana-mcp/tana-firebase-refresh-token.sops.yaml && \
              rm /tmp/rt
