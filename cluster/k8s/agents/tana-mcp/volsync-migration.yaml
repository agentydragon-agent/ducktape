apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tana-mcp-config-ovh
  namespace: tana-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ovh
  resources:
    requests:
      storage: 10Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: tana-mcp-config-ovh-migration
  namespace: tana-mcp
spec:
  trigger:
    manual: prep-20260523
  rsyncTLS:
    destinationPVC: tana-mcp-config-ovh
    copyMethod: Direct
    serviceType: ClusterIP
    moverSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tana-mcp-config-ovh-migration
  namespace: tana-mcp
spec:
  sourcePVC: tana-mcp-config
  trigger:
    manual: prep-20260523
  rsyncTLS:
    copyMethod: Direct
    keySecret: volsync-rsync-tls-tana-mcp-config-ovh-migration
    address: volsync-rsync-tls-dst-tana-mcp-config-ovh-migration.tana-mcp.svc
    port: 8000
    moverSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
