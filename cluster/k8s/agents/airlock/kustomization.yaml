apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - exec-backend-token.yaml
  - oura-client-credentials.sops.yaml
  - google-client-credentials.sops.yaml
  - airlock-pvc.yaml
  - airlock-serviceaccount.yaml
  - airlock-rbac.yaml
  - kubeapi-admin-exec-mcp-deployment.yaml
  - kubeapi-admin-exec-mcp-service.yaml
  - kubeapi-admin-exec-mcp-rbac.yaml
  - airlock-deployment.yaml
  - airlock-service.yaml
  - airlock-httproute.yaml
  - ciliumnetworkpolicy.yaml

configMapGenerator:
  - name: airlock-config
    namespace: airlock
    files:
      - config.yaml
      - predicate.py
