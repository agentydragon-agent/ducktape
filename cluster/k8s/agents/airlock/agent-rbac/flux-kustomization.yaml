apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: airlock-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for airlock namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/airlock/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: airlock
      namespace: flux-system
    - name: claude-rbac
      namespace: ducktape-flux
