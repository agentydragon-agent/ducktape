apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo-images-creds-eso.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-ingress.yaml
  - networkpolicy-egress.yaml

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: haku-openclaw-spike-config
    namespace: haku-openclaw-spike
    files:
      - openclaw.json
      - claude.json
      # Mounted as /cfg/kubeconfig, but NOT named that on disk: cluster/.gitignore
      # ignores `kubeconfig*` to keep terraform-generated cluster credentials out
      # of git, and that guard silently swallowed this file. Bazel globs the
      # filesystem rather than git, so it built fine locally and CI -- which only
      # has what is committed -- failed. Keep the source name outside that pattern.
      - kubeconfig=kube-client-config
