# Authentik authenticates browser traffic through the trusted proxy. OpenClaw
# backend clients, including subagent completion handoffs, connect directly to
# the loopback Gateway and therefore do not have Authentik identity headers.
#
# OpenClaw supports a separate local password fallback for this case. Generate
# it once, retain the resulting Secret, and inject it only into this workload.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-openclaw-spike-gateway-password-generator
  namespace: haku-openclaw-spike
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-openclaw-spike-gateway-password
  namespace: haku-openclaw-spike
spec:
  # The generator value is stable. Avoid automatic rotation, which would
  # interrupt active local Gateway clients unnecessarily.
  refreshInterval: 8760h
  target:
    name: haku-openclaw-spike-gateway-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-openclaw-spike-gateway-password-generator
