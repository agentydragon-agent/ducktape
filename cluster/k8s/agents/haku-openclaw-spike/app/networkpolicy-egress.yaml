# The app cannot bypass credential substitution: every non-loopback network
# request must traverse the dedicated iron-proxy. DNS is the only other egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haku-openclaw-spike-egress
  namespace: haku-openclaw-spike
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-egress-proxy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haku-openclaw-spike-proxy
      ports:
        - port: 8181
          protocol: TCP
