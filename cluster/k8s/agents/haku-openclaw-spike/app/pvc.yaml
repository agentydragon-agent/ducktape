apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: haku-openclaw-spike-state
  namespace: haku-openclaw-spike
  annotations:
    description: Persistent OpenClaw home, agent workspace, memory, and Claude Code session transcripts for the isolated Haku spike.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-ovh-hdd
  resources:
    requests:
      storage: 30Gi
