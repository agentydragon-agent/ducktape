# Trusted-proxy authentication is safe only when the Authentik server is the
# sole workload allowed to supply identity headers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haku-openclaw-spike-ingress
  namespace: haku-openclaw-spike
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 18789
          protocol: TCP
