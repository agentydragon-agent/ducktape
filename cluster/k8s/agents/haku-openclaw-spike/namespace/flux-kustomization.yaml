apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-openclaw-spike-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/agents/haku-openclaw-spike/namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 2m
