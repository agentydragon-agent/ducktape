apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-evaluator-credentials
  namespace: props
  annotations:
    description: Props evaluator API credentials (props.allegedly.works)
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: props-evaluator-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/props/secrets
        property: evaluator_password
