---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-harbor-robot
  namespace: props
  annotations:
    description: Harbor robot account for props backend proxy (push/pull to registry.allegedly.works/props)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: props-harbor-robot
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kv/harbor/props-robot
        property: username
    - secretKey: password
      remoteRef:
        key: kv/harbor/props-robot
        property: password
