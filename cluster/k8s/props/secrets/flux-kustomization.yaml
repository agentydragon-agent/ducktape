apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props-secrets
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/props/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: props-secrets
      namespace: flux-system
  dependsOn:
    - name: props-namespace
    - name: external-secrets-config
    - name: tofu-controller
    - name: vault
    - name: ollama-secrets
