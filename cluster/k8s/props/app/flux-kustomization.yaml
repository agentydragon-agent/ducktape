apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/props/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: props-namespace
      namespace: ducktape-flux
    - name: props-secrets
      namespace: ducktape-flux
    - name: props-db
      namespace: flux-system
    - name: gateway
      namespace: flux-system
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: forgejo-props # ensures the Forgejo `props` registry user exists
      namespace: flux-system
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: props-registry-pull
      namespace: props
    - apiVersion: apps/v1
      kind: Deployment
      name: props
      namespace: props
