apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props-namespace
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/props/namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
