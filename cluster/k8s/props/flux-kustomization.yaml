apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/props
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: props-namespace
    - name: props-secrets
    - name: harbor-pull-secret
    - name: props-db
    - name: gateway
    - name: harbor # Props image hosted on registry.allegedly.works
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: props
      namespace: props
