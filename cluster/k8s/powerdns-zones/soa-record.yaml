---
# SOA record for allegedly.works zone
# Fixes the MNAME (primary nameserver) which defaults to 'a.misconfigured.dns.server.invalid'
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: allegedly-works-soa
spec:
  zoneRef:
    name: allegedly.works
  name: allegedly.works.
  type: SOA
  ttl: 3600
  records:
    - "ns1.allegedly.works. hostmaster.allegedly.works. 1 10800 3600 604800 3600"
