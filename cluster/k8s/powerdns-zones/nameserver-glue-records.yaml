---
# Glue records for nameservers - required for DNS-01 ACME challenges
# Without these A records, cert-manager cannot resolve ns1/ns2.test-cluster.agentydragon.com
# when verifying DNS challenges, causing all certificate issuance to fail
#
# Now using Hetzner VPS public IPs (PowerDNS runs directly on VPS nodes via hostNetwork):
# - talos-vps-cp-0: 5.78.43.147
# - talos-vps-cp-1: 5.78.106.249
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns1-glue-record
spec:
  zoneRef:
    kind: ClusterZone
    name: test-cluster.agentydragon.com
  name: ns1 # Relative to zone
  type: A
  ttl: 3600
  records:
    - "5.78.43.147" # Hetzner VPS talos-vps-cp-0
---
apiVersion: dns.cav.enablers.ob/v1alpha2
kind: ClusterRRset
metadata:
  name: ns2-glue-record
spec:
  zoneRef:
    kind: ClusterZone
    name: test-cluster.agentydragon.com
  name: ns2 # Relative to zone
  type: A
  ttl: 3600
  records:
    - "5.78.106.249" # Hetzner VPS talos-vps-cp-1
