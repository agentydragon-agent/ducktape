apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-ingress
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/vault/ingress
  prune: true
  wait: true
  # TLS now handled by wildcard cert on cluster-gateway in gateway-system namespace.
  # No per-service Certificate health check needed.
  dependsOn:
    - name: vault # Core Vault must be ready first
    - name: gateway
    - name: cert-manager-environment
