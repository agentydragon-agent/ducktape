apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/vault/app
  prune: true
  wait: true
  dependsOn:
    - name: vault-operator # Vault instance needs operator and CRDs
    - name: local-path-provisioner # Vault uses local-path storage
  # Verify Bank-Vaults operator, Vault StatefulSet, and unseal keys are ready.
  # The instance-unseal-keys secret is created by Bank-Vaults after Vault
  # initialization — downstream consumers (external-secrets-config, TF modules
  # via K8s auth) need Vault to be initialized before they can authenticate.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: operator-vault-operator
      namespace: vault
    - apiVersion: apps/v1
      kind: StatefulSet
      name: instance
      namespace: vault
    - apiVersion: v1
      kind: Secret
      name: instance-unseal-keys
      namespace: vault
