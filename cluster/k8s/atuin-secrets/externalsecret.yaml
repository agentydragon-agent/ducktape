apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-secrets
  namespace: atuin
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: atuin-secrets
    creationPolicy: Owner
    template:
      data:
        postgres-password: "{{ .postgres_password }}"
        db-uri: "postgres://atuin:{{ .postgres_password }}@atuin-postgres:5432/atuin"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: kv/atuin/secrets
        property: postgres_password
