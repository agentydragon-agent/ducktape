apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-storage-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for local-path-storage namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/local-path-provisioner/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: local-path-provisioner
      namespace: flux-system
    - name: claude-rbac
      namespace: ducktape-flux
