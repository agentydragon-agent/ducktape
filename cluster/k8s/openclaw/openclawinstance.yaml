apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  env:
    - name: OLLAMA_API_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-ollama-api-key
          key: api-key
    - name: OLLAMA_BASE_URL
      value: "http://litellm.ollama.svc.cluster.local:4000"

  config:
    raw:
      agents:
        defaults:
          model:
            primary: "ollama/gpt-oss-20b-128k"
      models:
        providers:
          ollama:
            # LiteLLM proxies Ollama via OpenAI-compatible API (not native /api/chat).
            baseUrl: "http://litellm.ollama.svc.cluster.local:4000"
            api: openai-completions
            models:
              - id: "gpt-oss-20b-128k"
                name: "GPT-OSS 20B 128K"
                reasoning: true
                input: ["text"]
                contextWindow: 131072
                maxTokens: 8192
      gateway:
        trustedProxies:
          - "10.244.0.0/16"
        controlUi:
          # Safe behind Authentik: outpost authenticates all requests upstream,
          # and NetworkPolicy restricts gateway ingress to authentik namespace.
          # Token auth (auto-generated by operator) satisfies sharedAuthOk,
          # allowing device auth bypass. Without this, OpenClaw's device
          # pairing requirement blocks all non-localhost connections.
          dangerouslyDisableDeviceAuth: true
        # Auth: operator auto-generates token via enrichConfigWithGatewayAuth()
        # and sets mode to "token". No explicit auth section needed.

  storage:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: proxmox-csi-retain

  chromium:
    enabled: true
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  availability:
    nodeSelector:
      topology.kubernetes.io/region: proxmox
