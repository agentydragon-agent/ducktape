providers:
  - name: oura
    display_name: Oura Ring
    authorize_url: https://cloud.ouraring.com/oauth/authorize
    token_url: https://api.ouraring.com/oauth/token
    scopes:
      - email
      - personal
      - daily
      - heartrate
      - workout
      - tag
      - session
      - spo2
    redirect_uri: https://oauth-broker.allegedly.works/callback/oura
    secret_name: oura-tokens
    secret_annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-sandbox,claude-sandbox
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-sandbox,claude-sandbox
    refresh_margin_seconds: 3600

  - name: google
    display_name: Google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/drive.readonly
      - https://www.googleapis.com/auth/calendar.readonly
      - https://www.googleapis.com/auth/contacts.readonly
      - https://www.googleapis.com/auth/documents.readonly
      - https://www.googleapis.com/auth/spreadsheets.readonly
      - https://www.googleapis.com/auth/youtube.readonly
      - https://www.googleapis.com/auth/keep.readonly
    redirect_uri: https://oauth-broker.allegedly.works/callback/google
    secret_name: google-tokens
    secret_annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-sandbox,claude-sandbox
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-sandbox,claude-sandbox
    refresh_margin_seconds: 300
    extra_auth_params:
      access_type: offline
      prompt: consent

  - name: plaid
    display_name: Plaid
    provider_type: plaid
    authorize_url: https://cdn.plaid.com/link/v2/stable/link.html # unused; PlaidProvider creates a link_token instead
    token_url: https://production.plaid.com/item/public_token/exchange
    scopes:
      - transactions
      - auth
      - identity
      - investments
    redirect_uri: https://oauth-broker.allegedly.works/callback/plaid
    secret_name: plaid-tokens
    secret_annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-sandbox,claude-sandbox
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-sandbox,claude-sandbox
    # Plaid access tokens do not expire.
    refresh_margin_seconds: 0
