---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: nvidia-device-plugin
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.17.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia-device-plugin
  values:
    # Only run on GPU nodes (Talos sets this label via machine config)
    nodeSelector:
      nvidia.com/gpu: "true"
    # Override default affinity (requires NFD labels we don't have)
    affinity: {}
    # Tolerate GPU node taints if any
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
