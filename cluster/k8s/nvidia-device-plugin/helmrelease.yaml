---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: nvidia-device-plugin
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.18.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia-device-plugin
  values:
    # NixOS keeps NVIDIA libraries at /run/opengl-driver/lib/ (symlinks into
    # /nix/store). The chart mounts nvidiaDriverRoot at /driver-root inside the
    # container. We set LD_LIBRARY_PATH so the dynamic linker finds libnvidia-ml.so
    # for GPU discovery, and mount /nix/store so symlink targets are accessible.
    nvidiaDriverRoot: "/run/opengl-driver"
    deviceListStrategy: "cdi-cri,cdi-annotations"
    cdi:
      enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-ctr
                        env:
                          - name: LD_LIBRARY_PATH
                            value: "/driver-root/lib"
                        volumeMounts:
                          - name: nix-store
                            mountPath: /nix/store
                            readOnly: true
                    volumes:
                      - name: nix-store
                        hostPath:
                          path: /nix/store
                          type: Directory
