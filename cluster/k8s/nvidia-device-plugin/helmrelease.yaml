---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: nvidia-device-plugin
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.17.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia-device-plugin
  values:
    # Override default affinity — chart expects NFD label pci-10de.present but
    # NFD v0.17 sets pci-0300_10de.present (with PCI class prefix). Use the
    # Talos machine config label instead (set in proxmox-nodes.tf).
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: nvidia.com/gpu
                  operator: In
                  values:
                    - "true"
    # Tolerate GPU node taints if any
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
