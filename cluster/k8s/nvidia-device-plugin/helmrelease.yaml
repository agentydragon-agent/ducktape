---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: nvidia-device-plugin
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.18.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia-device-plugin
  values:
    # NixOS uses CDI for GPU device injection (no NVML inside containers).
    # The host's nvidia-container-toolkit generates CDI specs at /run/cdi/.
    # cdi-cri uses the CRI CDIDevices field; cdi-annotations is the legacy path.
    deviceListStrategy: "cdi-cri,cdi-annotations"
    cdi:
      enabled: true
