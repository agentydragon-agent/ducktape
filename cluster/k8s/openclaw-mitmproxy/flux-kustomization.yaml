apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-mitmproxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/openclaw-mitmproxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-mitmproxy-namespace
    - name: sealed-secrets
