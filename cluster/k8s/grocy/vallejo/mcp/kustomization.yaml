apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocy-mcp-vallejo
resources:
  - ../../mcp-base
  - namespace.yaml
  - server-httproute.yaml
patches:
  - target:
      kind: Deployment
      name: grocy-mcp-server
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://auth.allegedly.works/application/o/grocy-mcp-vallejo/"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "https://grocy-mcp-vallejo.allegedly.works"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "https://grocy-vallejo.allegedly.works"
  - target:
      kind: Deployment
      name: grocy-mcp-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grocy-mcp-server
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: GROCY_MCP_AUTH__OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-vallejo
                        key: client_id
                  - name: GROCY_MCP_AUTH__OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-vallejo
                        key: client_secret
                  - name: GROCY_MCP_AUTH__PROXY_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-vallejo
                        key: grocy_proxy_client_id
