apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-vallejo-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for grocy-vallejo namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/grocy/vallejo/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: grocy-vallejo
      namespace: flux-system
    - name: claude-rbac
      namespace: ducktape-flux
