apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-sf
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/grocy/sf/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: authentik
    - name: volsync
      namespace: ducktape-flux
