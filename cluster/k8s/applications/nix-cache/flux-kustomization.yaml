apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/nix-cache"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: attic
      namespace: nix-cache
  dependsOn:
    - name: cert-manager-issuer-config
      namespace: flux-system
    - name: proxmox-csi
      namespace: flux-system
    - name: sealed-secrets
      namespace: flux-system
    - name: gateway
      namespace: flux-system
    - name: cert-manager
      namespace: flux-system
    - name: external-dns
      namespace: flux-system
