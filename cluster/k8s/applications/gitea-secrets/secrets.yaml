# Gitea admin credentials - password from Vault, username is static
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-password
  namespace: gitea
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitea-admin-password
    creationPolicy: Owner
    template:
      data:
        username: gitea_admin
        password: "{{ .admin_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: kv/gitea/admin
        property: admin_password
