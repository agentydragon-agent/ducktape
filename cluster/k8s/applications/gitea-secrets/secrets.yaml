# Gitea admin password - reads stable value from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-password
  namespace: gitea
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitea-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/gitea/admin
        property: admin_password
