apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/applications/gitea-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gitea-namespace
    - name: external-secrets-config
