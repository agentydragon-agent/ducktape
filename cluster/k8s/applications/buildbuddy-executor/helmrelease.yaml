---
apiVersion: v1
kind: Namespace
metadata:
  name: buildbuddy-executor

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: buildbuddy
  namespace: buildbuddy-executor
spec:
  interval: 24h
  url: https://helm.buildbuddy.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildbuddy-executor
  namespace: buildbuddy-executor
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: buildbuddy-executor
      sourceRef:
        kind: HelmRepository
        name: buildbuddy
        namespace: buildbuddy-executor
  valuesFrom:
    - kind: Secret
      name: buildbuddy-api-key
      valuesKey: api-key
      targetPath: config.executor.api_key
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 1
        memory: 4Gi
      limits:
        cpu: 2
        memory: 8Gi
    nodeSelector:
      topology.kubernetes.io/region: "proxmox"
    config:
      executor:
        app_target: "grpcs://remote.buildbuddy.io:443"
