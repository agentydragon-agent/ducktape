apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/gitea"
  prune: true
  wait: true
  # Health check ensures Gitea is fully operational with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gitea
      namespace: gitea
  dependsOn:
    - name: gitea-namespace
    - name: ingress-nginx
    - name: cert-manager
    - name: vault
    - name: gitea-secrets
    - name: authentik-blueprint-gitea-provider # Wait for OIDC app in Authentik
    - name: authentik-blueprint-gitea-secret # Wait for OAuth secret to be synced from Vault
