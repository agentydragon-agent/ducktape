apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/gitea"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  # Health check ensures Gitea is fully operational with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gitea
      namespace: gitea
  dependsOn:
    - name: cert-manager-issuer-config
    - name: gitea-namespace
    - name: ingress-nginx
    - name: cert-manager
    - name: vault
    - name: gitea-secrets
    - name: authentik-blueprint-gitea-provider # Wait for OIDC app in Authentik
    - name: authentik-blueprint-gitea-secret # Wait for OAuth secret to be synced from Vault
    # Gitea validates OIDC at init time (configure-gitea init container fetches discovery URL).
    # Other SSO apps (Harbor, Matrix, Grafana) validate lazily at first login, so they don't need this.
    - name: external-dns
