# Matrix OIDC config for Helm valuesFrom.
# Constructs the full extraConfig YAML with secrets from Vault.
# Non-secret OIDC fields (issuer, scopes, mappings) are hardcoded here
# because ESO templates can't produce proper YAML lists from JSON arrays.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-oidc-secret
  namespace: matrix
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-oidc-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        values.yaml: |
          extraConfig:
            oidc_providers:
              - idp_id: authentik
                idp_name: "Authentik SSO"
                issuer: "https://auth.allegedly.works/application/o/matrix/"
                client_id: "{{ .client_id }}"
                client_secret: "{{ .client_secret }}"
                discover: true
                scopes:
                  - openid
                  - profile
                  - email
                allow_existing_users: true
                enable_registration: true
                user_mapping_provider:
                  config:
                    localpart_template: "{{ "{{ user.preferred_username }}" }}"
                    display_name_template: "{{ "{{ user.name }}" }}"
                    email_template: "{{ "{{ user.email }}" }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/matrix
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/matrix
        property: client_secret
---
# PostgreSQL password auto-generated by PostgreSQL chart
