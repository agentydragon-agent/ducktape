# Synapse signing key - reads stable value from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-signing-key
  namespace: matrix
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synapse-signing-key
    creationPolicy: Owner
    template:
      data:
        signing.key: "ed25519 1 {{ .signing_key }}"
  data:
    - secretKey: signing_key
      remoteRef:
        key: kv/matrix/secrets
        property: signing_key
---
