# ExternalSecret for complete Matrix OIDC configuration from Vault
# Terraform stores structured JSON, ESO templates into Helm values format
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-oidc-secret
  namespace: matrix
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-oidc-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Render OIDC providers from Vault into Helm values YAML.
        # extraConfig is a top-level chart value (not nested under config:).
        # toJson produces a valid YAML inline array from the Vault JSON array.
        values.yaml: |
          extraConfig:
            oidc_providers: {{ .oidc_providers | toJson }}
  dataFrom:
    - extract:
        key: sso/oidc-providers/matrix
---
# PostgreSQL password auto-generated by PostgreSQL chart
