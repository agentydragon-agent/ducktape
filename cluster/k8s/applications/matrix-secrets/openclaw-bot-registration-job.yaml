apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-bot-registration
  namespace: matrix
  annotations:
    # Recreate job on each reconciliation to ensure idempotent registration
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import hashlib, hmac, json, os, urllib.request

              SYNAPSE_URL = "http://matrix-synapse.matrix.svc.cluster.local:8008"
              USERNAME = "openclaw"
              PASSWORD = os.environ["BOT_PASSWORD"]
              SECRET = os.environ["REGISTRATION_SECRET"]

              # Check if user already exists
              try:
                  req = urllib.request.Request(
                      f"{SYNAPSE_URL}/_synapse/admin/v1/username_available?username={USERNAME}")
                  urllib.request.urlopen(req)
                  print(f"Username {USERNAME} is available, proceeding with registration")
              except urllib.error.HTTPError as e:
                  if e.code == 400:
                      print(f"User @{USERNAME}:allegedly.works already exists, skipping")
                      raise SystemExit(0)
                  raise

              # Get nonce
              req = urllib.request.Request(f"{SYNAPSE_URL}/_synapse/admin/v1/register")
              resp = json.loads(urllib.request.urlopen(req).read())
              nonce = resp["nonce"]

              # Compute HMAC
              mac_input = f"{nonce}\0{USERNAME}\0{PASSWORD}\0notadmin"
              mac = hmac.new(SECRET.encode(), mac_input.encode(), hashlib.sha1).hexdigest()

              # Register
              data = json.dumps({
                  "nonce": nonce, "username": USERNAME,
                  "password": PASSWORD, "admin": False, "mac": mac
              }).encode()
              req = urllib.request.Request(
                  f"{SYNAPSE_URL}/_synapse/admin/v1/register",
                  data=data, headers={"Content-Type": "application/json"})
              result = json.loads(urllib.request.urlopen(req).read())
              print(f"Registered @{result['user_id']} (device: {result.get('device_id', 'n/a')})")
          env:
            - name: REGISTRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: synapse-registration-secret
                  key: registration_shared_secret
            - name: BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-bot-password
                  key: password
