apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-bot-registration
  namespace: matrix
  annotations:
    # Recreate job on each reconciliation to ensure idempotent registration
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: python:3.13-alpine
          command: ["python3", "/scripts/register_openclaw_bot.py"]
          env:
            - name: REGISTRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: synapse-registration-secret
                  key: registration_shared_secret
            - name: BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-matrix-bot-password
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: openclaw-bot-registration-script
