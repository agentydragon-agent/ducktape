# ActivityWatch with Tailscale sidecar.
# Ingress: kube-apiserver only (kubectl port-forward, health probes).
# Egress: DNS, kube-apiserver:6443 (TS_KUBE_SECRET), headscale/DERP:443,
#         WireGuard:41641/UDP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: activitywatch
  namespace: activitywatch
spec:
  endpointSelector:
    matchLabels:
      app: activitywatch
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "5600"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver for TS_KUBE_SECRET persistence
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Headscale control + DERP relays (HTTPS)
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # WireGuard direct connections
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
