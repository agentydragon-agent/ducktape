apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: activitywatch
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/applications/activitywatch
  prune: true
  wait: true
  dependsOn:
    - name: activitywatch-namespace
    - name: proxmox-csi
