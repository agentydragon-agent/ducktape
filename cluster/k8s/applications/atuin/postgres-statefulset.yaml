apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atuin-postgres
  namespace: atuin
  labels:
    app: atuin-postgres
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: atuin-postgres
  replicas: 1
  selector:
    matchLabels:
      app: atuin-postgres
  template:
    metadata:
      labels:
        app: atuin-postgres
    spec:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: atuin
            - name: POSTGRES_USER
              value: atuin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atuin-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - atuin
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - atuin
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: proxmox-csi-retain
        resources:
          requests:
            storage: 2Gi
