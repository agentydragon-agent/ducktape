apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/atuin"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  dependsOn:
    - name: cert-manager-issuer-config
    - name: atuin-namespace
    - name: atuin-secrets
    - name: ingress-nginx
    - name: cert-manager-environment
    - name: proxmox-csi
