apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/matrix"
  prune: true
  wait: true
  # Health check ensures Matrix Synapse is ready with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: matrix-synapse
      namespace: matrix
  dependsOn:
    - name: matrix-namespace
    - name: ingress-nginx
    - name: cert-manager
    - name: authentik-blueprint-matrix-provider # Wait for Authentik OIDC application to be created
    - name: matrix-secrets
# Note: Matrix Synapse needs OIDC discovery endpoint at startup (from provider),
# but oauth-client-secret (from matrix-secret) is only needed for OAuth login flows later
