apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/matrix"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  # Health check ensures Matrix Synapse is ready with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: matrix-synapse
      namespace: matrix
  dependsOn:
    - name: cert-manager-issuer-config
    - name: matrix-namespace
    - name: gateway
    - name: cert-manager
    - name: authentik # Wait for Authentik worker to apply SSO blueprints
    - name: matrix-secrets
# Note: Matrix Synapse needs OIDC discovery endpoint at startup (from provider),
# but oauth-client-secret (from matrix-secret) is only needed for OAuth login flows later
