---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ananace-charts
  namespace: matrix
spec:
  interval: 24h
  url: https://ananace.gitlab.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: matrix-synapse
      version: "3.12.22"
      sourceRef:
        kind: HelmRepository
        name: ananace-charts
        namespace: matrix
  valuesFrom:
    # OIDC provider configuration from ESO-templated Vault secret
    - kind: Secret
      name: matrix-oidc-config
      valuesKey: values.yaml
    # Macaroon secret key from Vault
    - kind: Secret
      name: synapse-macaroon-secret
      valuesKey: macaroon_secret_key
      targetPath: config.macaroonSecretKey
    # Registration shared secret from Vault
    - kind: Secret
      name: synapse-registration-secret
      valuesKey: registration_shared_secret
      targetPath: config.registrationSharedSecret
  values:
    # Synapse image configuration
    image:
      repository: matrixdotorg/synapse
      tag: v1.147.0
      pullPolicy: IfNotPresent

    # Server name - this is the domain used in Matrix user IDs (@user:allegedly.works)
    serverName: allegedly.works

    # Public server name - the hostname where Synapse is publicly accessible.
    # The chart derives public_baseurl as https://<publicServerName>.
    publicServerName: matrix.allegedly.works

    # Resources
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 512Mi

    # Persistence for media store
    persistence:
      enabled: true
      storageClass: "proxmox-csi-retain"
      size: 20Gi
      accessMode: ReadWriteOnce

    # Deployment strategy - use Recreate for RWO PVC compatibility
    # RollingUpdate causes stuck deployments when previous pod holds PVC lock
    synapse:
      strategy:
        type: Recreate
      # Reloader: auto-restart pods when secrets change
      annotations:
        reloader.stakater.com/auto: "true"

    # Synapse configuration
    config:
      enableRegistration: false
      reportStats: false
      # macaroonSecretKey and registrationSharedSecret injected via valuesFrom

    # extraConfig with oidc_providers is injected via valuesFrom from
    # matrix-oidc-config secret (ESO-templated with Vault credentials)

    # Signing key from Vault (disable chart auto-generation)
    signingkey:
      job:
        enabled: false
      existingSecret: synapse-signing-key
      existingSecretKey: signing.key

    # Service configuration
    service:
      type: ClusterIP
      port: 8008
      federation:
        enabled: true
        port: 8448

    # Ingress disabled — traffic routed via Gateway API HTTPRoute
    ingress:
      enabled: false
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        # Increase body size for media uploads
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      # Client-to-Server API hosts
      csHosts:
        - matrix.allegedly.works
      # Server-to-Server (federation) hosts
      hosts:
        - allegedly.works
      # Include /_synapse admin APIs
      includeUnderscoreSynapse: true
      # Include server name in csHosts automatically
      includeServerName: false
      tls:
        - secretName: matrix-synapse-tls
          hosts:
            - matrix.allegedly.works
            - allegedly.works

    # PostgreSQL configuration with bundled chart
    postgresql:
      enabled: true
      auth:
        username: synapse
        database: synapse
        # PostgreSQL chart auto-generates password
      global:
        storageClass: "proxmox-csi-retain"
      primary:
        # Requests right-sized from observed usage — see docs/operations/2026-02-22-memory-request-rightsizing.md
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
        persistence:
          enabled: true
          storageClass: "proxmox-csi-retain"
          size: 10Gi
        # PostgreSQL 16 compatible settings
        extendedConfiguration: |
          max_connections = 200
          shared_buffers = 256MB
        # Synapse requires C collation - set via initdb args
        initdb:
          args: "--locale=C"

    # Redis (required by chart even for single-instance setup)
    redis:
      enabled: true
      auth:
        enabled: true
        existingSecret: synapse-redis-password
        existingSecretPasswordKey: redis-password
      master:
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    # Synapse workers (disabled for now, can be enabled for scaling)
    workers:
      default:
        enabled: false

    # Service account
    serviceAccount:
      create: true
---
# ConfigMap for PostgreSQL initialization with proper collation
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-postgres-initdb
  namespace: matrix
data:
  00-init.sh: |
    #!/bin/bash
    set -e
    # Ensure database has correct collation for Synapse
    # Note: This runs as postgres user, after database creation
    # The collation must be set during database creation instead
    echo "Database collation check script (collation should be set during CREATE DATABASE)"
