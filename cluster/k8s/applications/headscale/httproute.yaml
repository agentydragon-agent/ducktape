apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
  namespace: headscale
  annotations:
    external-dns.alpha.kubernetes.io/hostname: headscale.allegedly.works
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "headscale.allegedly.works"
  rules:
    - timeouts:
        request: "3600s"
        backendRequest: "3600s"
      backendRefs:
        - name: headscale
          port: 8080
# TODO: Gateway API doesn't natively support session affinity (sticky sessions).
# Headscale previously used nginx upstream-hash-by. Monitor if this causes issues
# with DERP relay connections. If needed, explore CiliumEnvoyConfig for session affinity.
