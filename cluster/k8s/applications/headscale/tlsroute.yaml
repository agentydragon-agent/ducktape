# TLSRoute passthrough — Envoy routes by SNI without decrypting, so Headscale
# handles TLS and the Tailscale noise protocol (`Upgrade: tailscale-control-protocol`)
# natively. HTTPRoute doesn't work because Cilium's auto-generated Envoy config
# only allows `upgradeType: websocket`, returning 403 for the Tailscale protocol.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: headscale
  namespace: headscale
  annotations:
    external-dns.alpha.kubernetes.io/hostname: headscale.allegedly.works
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: headscale-passthrough
  hostnames:
    - "headscale.allegedly.works"
  rules:
    - backendRefs:
        - name: headscale
          port: 8080
