apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    # Headscale configuration
    # Documentation: https://github.com/juanfont/headscale/blob/main/config-example.yaml

    # Server configuration
    server_url: https://headscale.allegedly.works
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443

    # TLS is terminated by ingress-nginx
    tls_cert_path: ""
    tls_key_path: ""

    # Database - SQLite for initial simplicity
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    # Noise protocol key for client connections
    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    # Prefixes for IP allocation
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48

    # DERP configuration (embedded DERP server)
    derp:
      server:
        enabled: true
        region_id: 999
        region_code: "headscale"
        region_name: "Headscale Embedded DERP"
        stun_listen_addr: "0.0.0.0:3478"
        private_key_path: /var/lib/headscale/derp_private.key
      urls: []
      paths: []
      auto_update_enabled: false
      update_frequency: 24h

    # DNS configuration
    dns:
      magic_dns: true
      base_domain: allegedly.works
      nameservers:
        global:
          - 1.1.1.1
          - 8.8.8.8

    # Logging
    log:
      format: text
      level: info

    # ACL policy (allow all initially, customize later)
    policy:
      mode: file
      path: ""

    # CLI
    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"
