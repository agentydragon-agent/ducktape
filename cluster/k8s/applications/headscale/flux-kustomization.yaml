apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/headscale"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: headscale
      namespace: headscale
  dependsOn:
    - name: cert-manager-issuer-config
    - name: headscale-namespace
    - name: headscale-secrets
    - name: gateway
    - name: cert-manager-environment
    - name: authentik
    - name: authentik-blueprint-headscale-secret
