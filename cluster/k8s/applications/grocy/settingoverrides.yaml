apiVersion: v1
kind: ConfigMap
metadata:
  name: grocy-settingoverrides
  namespace: grocy
data:
  # Trust X-authentik-username header from Authentik outpost proxy.
  # PHP-FPM converts the header to HTTP_X_AUTHENTIK_USERNAME.
  AUTH_CLASS.txt: "Grocy\\Middleware\\ReverseProxyAuthMiddleware"
  REVERSE_PROXY_AUTH_HEADER.txt: "HTTP_X_AUTHENTIK_USERNAME"
