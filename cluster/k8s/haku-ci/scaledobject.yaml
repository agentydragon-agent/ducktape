# Forgejo's /metrics endpoint exposes no Actions queue-depth metric. KEDA's
# native forgejo-runner scaler instead polls Forgejo's authenticated,
# repo-scoped runner-jobs endpoint, filtered to this runner label. Its result is
# exactly the number of jobs presently waiting for a haku-ci runner.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: haku-ci-forgejo
  namespace: haku-ci
spec:
  secretTargetRef:
    - parameter: token
      name: haku-forgejo-tea
      key: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: haku-runner
  namespace: haku-ci
spec:
  scaleTargetRef:
    name: haku-runner
  # Scale to the number of queued jobs: one Forgejo job per runner pod. Zero is
  # intentional: the runner's Bazel cache is an emptyDir and contains no state
  # that needs to survive an idle period.
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 600
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
  triggers:
    - type: forgejo-runner
      metadata:
        address: http://forgejo-http.forgejo:3000
        owner: haku
        repo: haku-state
        labels: haku-ci
      authenticationRef:
        name: haku-ci-forgejo
