apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeassistant-proxy
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/homeassistant-proxy/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homeassistant-proxy
      namespace: homeassistant-proxy
  dependsOn:
    - name: homeassistant-proxy-namespace
    - name: harbor-pull-secret
    - name: harbor # Image hosted on registry.allegedly.works
