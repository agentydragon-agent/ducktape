apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin-user-provisioner
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/atuin/user-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: atuin
      namespace: ducktape-flux
    - name: user-agentydragon
      namespace: flux-system
