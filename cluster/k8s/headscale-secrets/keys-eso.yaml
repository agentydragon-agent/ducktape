apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-keys
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: headscale-keys
    creationPolicy: Owner
  data:
    - secretKey: wireguard.key
      remoteRef:
        key: headscale/keys
        property: wireguard_key
    - secretKey: noise.key
      remoteRef:
        key: headscale/keys
        property: noise_key
    - secretKey: derp.key
      remoteRef:
        key: headscale/keys
        property: derp_key
