# Reads password from CNPG-generated secret (headscale-db-app).
# Raw password value consumed by Deployment env var HEADSCALE_DATABASE_POSTGRES_PASS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-db-password
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-headscale-secret-store
    kind: ClusterSecretStore
  target:
    name: headscale-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: headscale-db-app
        property: password
