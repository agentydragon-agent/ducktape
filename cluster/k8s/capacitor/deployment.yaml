# Capacitor (Flux UI) — https://github.com/gimlet-io/capacitor
# Based on upstream self-host/yaml/capacitor-next/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacitor
  namespace: capacitor
  labels:
    app.kubernetes.io/name: capacitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capacitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacitor
    spec:
      serviceAccountName: capacitor
      nodeSelector:
        topology.kubernetes.io/region: hetzner
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: capacitor
          image: ghcr.io/gimlet-io/capacitor-next:0.14.0
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
