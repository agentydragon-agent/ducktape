apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/authentik-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: authentik-namespace
    - name: external-secrets-config
    - name: vault
    - name: sso-secrets # authentik-bootstrap ExternalSecret reads kv/sso/client-secrets from Vault
