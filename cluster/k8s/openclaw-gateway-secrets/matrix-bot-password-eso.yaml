apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-matrix-bot-password
  namespace: openclaw-gateway
  annotations:
    description: Matrix bot password for OpenClaw chat (@openclaw:allegedly.works)
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-matrix-bot-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/matrix/openclaw-bot
        property: password
