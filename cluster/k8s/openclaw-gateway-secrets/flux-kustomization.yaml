apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-gateway-secrets
  namespace: flux-system
spec:
  retries: 0
  interval: 10m
  path: ./cluster/k8s/openclaw-gateway-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-gateway-namespace
    - name: openclaw-sandbox
    - name: external-secrets-config
    - name: matrix-secrets
    - name: reflector
