apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-secrets-sync-secrets
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/github-secrets-sync/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  timeout: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
