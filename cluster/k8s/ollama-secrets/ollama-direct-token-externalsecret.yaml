apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ollama-direct-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kv/ollama/direct-api-token
        property: token
