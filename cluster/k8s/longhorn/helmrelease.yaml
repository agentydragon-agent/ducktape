apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 2
      createDefaultDiskLabeledNodesOnly: true
      replicaAutoBalance: best-effort
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      systemManagedComponentsNodeSelector: "topology.kubernetes.io/region:hetzner"
    longhornManager:
      nodeSelector:
        topology.kubernetes.io/region: hetzner
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    longhornDriver:
      nodeSelector:
        topology.kubernetes.io/region: hetzner
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    longhornUI:
      nodeSelector:
        topology.kubernetes.io/region: hetzner
    ingress:
      enabled: false
