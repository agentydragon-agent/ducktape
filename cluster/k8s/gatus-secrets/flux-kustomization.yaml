apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/gatus-secrets"
  prune: true
  wait: true
  dependsOn:
    - name: gatus-namespace
    - name: external-secrets-operator
    - name: external-secrets-config
