---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://instance.vault:8200" # Internal service for Bank-Vaults instance
      path: "kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "instance-unseal-keys" # Bank-Vaults stores root token here
          namespace: "vault"
          key: "vault-root"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-secret-store
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: authentik
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-openclaw-gateway-secret-store
spec:
  provider:
    kubernetes:
      server:
