          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: openclaw-gateway
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
