apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller-crds
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: external-snapshotter-source
    namespace: ducktape-flux
  path: ./client/config/crd
  prune: false
  wait: true
  timeout: 2m
