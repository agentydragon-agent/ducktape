apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: pr-visuals-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: pr-visuals-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: pr-visuals-writer
  secretRef:
    name: s3-identity-pr-visuals-writer
  reclaimPolicy: Retain
