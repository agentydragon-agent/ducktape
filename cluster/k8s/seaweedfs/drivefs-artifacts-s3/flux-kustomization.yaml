apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-drivefs-artifacts-s3
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/seaweedfs/drivefs-artifacts-s3
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: seaweedfs-drivefs-artifacts-bucket
      namespace: flux-system
    - name: seaweedfs-secrets
      namespace: flux-system
    - name: seaweedfs-cluster
      namespace: flux-system
    - name: gateway
      namespace: flux-system
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: drivefs-artifacts-s3
      namespace: seaweedfs
