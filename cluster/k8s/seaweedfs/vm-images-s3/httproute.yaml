apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm-images-s3
  namespace: seaweedfs
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "vm-images-s3.allegedly.works"
  rules:
    - backendRefs:
        # Do not point this route at the operator-managed `seaweedfs-s3`
        # service. This dedicated service mounts a config containing only
        # VM-image credentials.
        - name: vm-images-s3
          port: 8333
