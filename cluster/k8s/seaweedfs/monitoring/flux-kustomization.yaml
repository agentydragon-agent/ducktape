apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-monitoring
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./cluster/k8s/seaweedfs/monitoring
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-cluster
      namespace: flux-system
    - name: monitoring-stack
      namespace: flux-system
