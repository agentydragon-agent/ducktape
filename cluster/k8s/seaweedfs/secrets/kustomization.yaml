apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ESO infrastructure for per-tenant identity assembly.
  - secretstore.yaml
  - eso-reader-rbac.yaml
  - externalsecret-s3-config.yaml
  # Per-tenant identities (produced by migrate-identities.sh).
  # attic is bucket-only (no s3 identity entry today — it's referenced
  # by the attic Bucket CR but not present in s3-config).
  - identities/admin.sops.yaml
  # CLEANUP(2026-05-27): augur-assets identity removed mid-quiesce to let
  # the seaweedfs operator take ownership of the bucket without the s3
  # gateway auto-recreating it. Restore in the follow-up commit once the
  # bucket CR is Ready.
  # - identities/augur-assets.sops.yaml
  - identities/loki.sops.yaml
  - identities/tempo.sops.yaml
  - identities/mimir.sops.yaml
