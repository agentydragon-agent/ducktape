# S3Credentials owns the credential fields; Flux owns only this Secret shell
# and its existing reflection contract for Forgejo consumers.
apiVersion: v1
kind: Secret
metadata:
  name: s3-identity-forgejo
  namespace: seaweedfs
  labels:
    seaweedfs.io/role: s3-identity
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: forgejo
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: forgejo
type: Opaque
