# Global assembly ExternalSecret. Discovers all per-tenant intermediate
# Secrets (named `s3-identity-*-json`, produced by the per-tenant
# ExternalSecrets in identities/*.sops.yaml) and concatenates their
# pre-rendered identity JSON snippets into the `seaweedfs_s3_config.json`
# blob that the SeaweedFS s3 gateway consumes.
#
# `creationPolicy: Merge` so ESO can update the Secret without owner-
# reference conflict; lets us hand off from the deleted legacy sops file
# without a brief deletion window.
#
# Template note: ESO's `dataFrom.find` returns `.<secretName>` as a
# JSON-encoded *string* of that Secret's data dict, not a Go map.
# Each per-tenant intermediate Secret has data key `identity` whose value
# is the assembled identity JSON. We parse the outer JSON with
# `| fromJson` and look up `.identity`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
  annotations:
    description: Assembles the s3 gateway config Secret from per-tenant identity Secrets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: seaweedfs-s3-config
    creationPolicy: Merge
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {{- $first := true -}}
            {{- range $sName, $sJson := . -}}
            {{- $sData := $sJson | fromJson -}}
            {{- if not $first }},{{ end -}}{{ $sData.identity }}{{- $first = false -}}
            {{- end -}}
          ]}
  dataFrom:
    - find:
        name:
          regexp: "^s3-identity-.+-json$"
