apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-secrets
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./cluster/k8s/seaweedfs/secrets
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: seaweedfs-namespace
      namespace: ducktape-flux
    - name: external-secrets-operator # ExternalSecret + SecretStore CRDs + ESO controller
      namespace: ducktape-flux
