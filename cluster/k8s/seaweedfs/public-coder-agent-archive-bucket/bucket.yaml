apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: public-coder-agent-archive
  namespace: seaweedfs
spec:
  name: public-coder-agent-archive
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  # The retained rescue archive has been superseded by VolSync backups.
  # Delete the remote bucket when this Bucket CR is later removed from GitOps.
  reclaimPolicy: Delete
  access:
    - user: public-coder-agent-archive
      actions: [Read, Write, List, Tagging]
