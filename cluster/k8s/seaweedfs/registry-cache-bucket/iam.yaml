apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: registry-cache
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: registry-cache
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: registry-cache
  secretRef:
    name: s3-identity-registry-cache
  reclaimPolicy: Retain
