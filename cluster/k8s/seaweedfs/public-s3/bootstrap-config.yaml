# The public S3 gateway's only remaining local configuration is the
# credential-free anonymous PR-visuals read rule. Credentialed identities are
# all reconciled through SeaweedFS native IAM, so this is intentionally a
# ConfigMap rather than a Secret/ExternalSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-s3-bootstrap-config
  namespace: seaweedfs
data:
  seaweedfs_s3_config.json: |
    {"identities":[
      {"name":"anonymous","actions":["Read:pr-visuals"]}
    ]}
