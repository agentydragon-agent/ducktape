# Adopt the existing DriveFS reader and writer keys without rotating either.
# They remain delivered by the current SOPS/manual paths during this phase;
# Bucket/drivefs-artifacts-bucket.yaml remains their native permission source.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: drivefs-artifacts-writer
  # These fields already exist in a user-managed SOPS Secret. The operator
  # adopts them verbatim instead of generating replacement credentials.
  secretRef:
    name: drivefs-artifacts-s3-credentials
    accessKeyField: writerAccessKey
    secretKeyField: writerSecretKey
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: drivefs-artifacts-reader
  # Shares the same SOPS Secret as the writer but adopts only the reader pair.
  secretRef:
    name: drivefs-artifacts-s3-credentials
    accessKeyField: readerAccessKey
    secretKeyField: readerSecretKey
  reclaimPolicy: Retain
