# Compatibility projection for existing cross-namespace consumers. The
# authoritative credentials live in the per-principal S3Credentials targets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-images-s3-credentials
  namespace: seaweedfs
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: vm-images-s3-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ciWriterAccessKey
      remoteRef: { key: s3-identity-vm-images-ci-writer, property: accessKey }
    - secretKey: ciWriterSecretKey
      remoteRef: { key: s3-identity-vm-images-ci-writer, property: secretKey }
    - secretKey: cdiReaderAccessKey
      remoteRef: { key: s3-identity-vm-images-cdi-reader, property: accessKey }
    - secretKey: cdiReaderSecretKey
      remoteRef: { key: s3-identity-vm-images-cdi-reader, property: secretKey }
