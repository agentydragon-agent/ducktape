apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-s3-config
  namespace: seaweedfs
  annotations:
    description: >-
      Renders the consolidated public S3 gateway config from the credential
      Secrets: drivefs-artifacts (writer + reader) and vm-images (ci-writer +
      cdi-reader). DriveFS entries are retained temporarily while native IAM
      adopts their unchanged SOPS/manual credentials. Intentionally excludes
      admin and all fully migrated native-IAM tenants from this static config,
      including claude-reader.
      Filer-backed operator-managed IAM identities are independently accepted
      by every gateway. SeaweedFS scopes actions per identity, so co-hosting
      credentials on one public gateway does not let one identity reach
      another's buckets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: public-s3-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {"name":"drivefs-artifacts-writer",
             "credentials":[{"accessKey":"{{ .writerAccessKey }}","secretKey":"{{ .writerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","Write:drivefs-artifacts","List:drivefs-artifacts","Tagging:drivefs-artifacts"]},
            {"name":"drivefs-artifacts-reader",
             "credentials":[{"accessKey":"{{ .readerAccessKey }}","secretKey":"{{ .readerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","List:drivefs-artifacts"]},
            {"name":"anonymous","actions":["Read:pr-visuals"]}
          ]}
  dataFrom:
    - extract:
        key: drivefs-artifacts-s3-credentials
