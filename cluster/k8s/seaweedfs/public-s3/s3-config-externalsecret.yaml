apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-s3-config
  namespace: seaweedfs
  annotations:
    description: >-
      Renders the public S3 gateway's remaining credential-free bootstrap
      configuration. All credentialed tenants, including DriveFS and
      claude-reader, now authenticate through filer-backed native IAM.
      Filer-backed operator-managed IAM identities are independently accepted
      by every gateway. SeaweedFS scopes actions per identity, so co-hosting
      credentials on one public gateway does not let one identity reach
      another's buckets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: public-s3-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {"name":"anonymous","actions":["Read:pr-visuals"]}
          ]}
