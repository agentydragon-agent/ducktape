apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-s3-config
  namespace: seaweedfs
  annotations:
    description: >-
      Renders the consolidated public S3 gateway config from the credential
      Secrets: drivefs-artifacts (writer + reader), vm-images (ci-writer +
      cdi-reader), and claude (cross-bucket read; write only to loom-gym).
      Intentionally excludes admin and all native-IAM tenants from this static config.
      Filer-backed operator-managed IAM identities are independently accepted
      by every gateway. SeaweedFS scopes actions per identity, so co-hosting
      credentials on one public gateway does not let one identity reach
      another's buckets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: public-s3-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {"name":"drivefs-artifacts-writer",
             "credentials":[{"accessKey":"{{ .writerAccessKey }}","secretKey":"{{ .writerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","Write:drivefs-artifacts","List:drivefs-artifacts","Tagging:drivefs-artifacts"]},
            {"name":"drivefs-artifacts-reader",
             "credentials":[{"accessKey":"{{ .readerAccessKey }}","secretKey":"{{ .readerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","List:drivefs-artifacts"]},
            {"name":"claude-reader",
             "credentials":[{"accessKey":"{{ .claudeReaderAccessKey }}","secretKey":"{{ .claudeReaderSecretKey }}"}],
             "actions":["Read:attic","List:attic","Read:drivefs-artifacts","List:drivefs-artifacts","Read:vm-images","List:vm-images","Read:wayback-archive","List:wayback-archive","Read:loom-gym","Write:loom-gym","List:loom-gym","Tagging:loom-gym"]},
            {"name":"anonymous","actions":["Read:pr-visuals"]}
          ]}
  dataFrom:
    - extract:
        key: drivefs-artifacts-s3-credentials
    - extract:
        key: claude-reader-s3-credentials
