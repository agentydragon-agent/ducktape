apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Credential Secrets (name/Secret names kept stable so cross-namespace ESO
  # consumers in gecko and vm-images-publisher keep resolving them). Each file
  # has its own .sops.yaml recipient set:
  #   drivefs-artifacts: admin, cluster-secrets, all user keys, ci
  #   vm-images:         admin, cluster-secrets
  #   claude-reader:     admin, cluster-secrets, claude-web
  - drivefs-artifacts-credentials.sops.yaml
  # Registers unchanged DriveFS reader/writer keys with native IAM. The SOPS
  # Secret remains for existing CI and external/manual delivery paths only.
  - drivefs-artifacts-iam.yaml
  # VM-image consumer compatibility values are projected from native IAM.
  - vm-images-credentials-externalsecret.yaml
  - claude-reader-credentials.sops.yaml
  # Registers the unchanged SOPS-provided Claude credential with native IAM
  # and declares its authorization policy. The SOPS Secret remains for the
  # external Claude web-session delivery path, not the public gateway config.
  - claude-reader-iam.yaml
  # ESO assembles these into one gateway config; Reloader rolls the
  # deployment when it changes (cluster-wide autoReloadAll).
  - s3-config-externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
