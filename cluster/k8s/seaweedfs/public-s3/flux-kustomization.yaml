apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-public-s3
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/seaweedfs/public-s3
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    # Gate on Bucket CRs managed in this repo that the public identities target.
    # claude-reader also reads attic, augur-assets, and listing-monitor-captures,
    # which already exist (and for gaffer-side buckets are reconciled from a
    # different repo) — SeaweedFS tolerates bucket-scoped read actions for buckets
    # it doesn't manage, so they are not gated here.
    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-drivefs-artifacts-bucket
      namespace: ducktape-flux
    - name: seaweedfs-vm-images-bucket
      namespace: ducktape-flux
    - name: seaweedfs-wayback-archive-bucket
      namespace: ducktape-flux
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-s3
      namespace: seaweedfs
