apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-filer-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/seaweedfs/db
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  # Required to apply seaweedfs-filer-db-ssd-creds.sops.yaml (the filer DB app creds
  # CNPG syncs onto the -ssd seaweedfs role); without it Flux applies the ciphertext.
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: seaweedfs-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
