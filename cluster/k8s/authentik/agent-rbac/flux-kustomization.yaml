apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for authentik namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/authentik/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: authentik-namespace
      namespace: ducktape-flux
    - name: claude-rbac
