# Authentik admin password - reads stable value from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-admin-password
  namespace: authentik
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-admin-password
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: kv/authentik/passwords
        property: admin_password
