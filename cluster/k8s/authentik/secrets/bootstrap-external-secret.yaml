# ESO-generated Authentik Bootstrap Token
# Reads from Vault (generated by authentik-token Terraform)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-bootstrap
  namespace: authentik
spec:
  refreshInterval: 8760h # 1 year - Phase 0 stabilization (see docs/lessons_learned/2025-11-28-eso-password-generator-desync.md)
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: kv/sso/client-secrets
        property: authentik_api_token
