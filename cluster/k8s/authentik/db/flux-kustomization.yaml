apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/authentik/db
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: authentik-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
