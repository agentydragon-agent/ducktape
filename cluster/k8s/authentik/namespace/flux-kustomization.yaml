apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/authentik/namespace
  prune: false # Don't delete namespace on kustomization removal
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 1m
