---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 24h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  timeout: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: "2025.12.3"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    # Global configuration
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secrets,authentik-sso-client-secrets"
        configmap.reloader.stakater.com/reload: "authentik-sso-blueprints"

    # Mount SSO blueprint ConfigMap into worker for native blueprint processing
    blueprints:
      configMaps:
        - authentik-sso-blueprints

    # Authentik server configuration
    authentik:
      # Secret key will be available in the main authentik secret via ESO merge
      secret_key: ""

      # Error reporting
      error_reporting:
        enabled: false

      # PostgreSQL configuration (using built-in PostgreSQL)
      # postgresql config will be auto-generated by chart

      # Redis configuration (optional for better performance)
      redis:
        host: ""

      # Bootstrap configuration (password and token from ESO)
      bootstrap:
        # Password will be injected via extraEnvFrom (ESO-generated)
        password: ""
        # Token will be injected via extraEnvFrom (ESO-generated)
        token: ""

      # Secrets now loaded per-component via server.envFrom and worker.envFrom

    # Server deployment — 2 replicas spread across VPS nodes
    server:
      name: server
      replicas: 2

      # With 2 replicas + required anti-affinity on 2 nodes, surge deadlocks
      # (can't create 3rd pod). Kill one first, then replace.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

      nodeSelector:
        topology.kubernetes.io/region: hetzner

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: server
                  app.kubernetes.io/instance: authentik
              topologyKey: kubernetes.io/hostname

      # Allow 20 min for DB migrations on first boot (default 10 min).
      # If the startup probe kills the pod mid-migration, the PostgreSQL
      # connection stays idle-in-transaction and blocks the next attempt.
      startupProbe:
        failureThreshold: 120
        periodSeconds: 10

      # Default 3s timeout is too tight — outpost API calls regularly take
      # 1s+ even with VPS-local PostgreSQL. Give enough headroom.
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10

      # Load ESO-generated secret key via envFrom (plus all global secrets)
      envFrom:
        - configMapRef:
            name: authentik-host
        - secretRef:
            name: authentik-bootstrap
        - secretRef:
            name: authentik-admin-password
        - secretRef:
            name: authentik-postgres-env
        - secretRef:
            name: authentik-secret-key
        - secretRef:
            name: authentik-sso-client-secrets

      # Service configuration
      service:
        enabled: true
        type: ClusterIP
        port: 80

      # Ingress disabled — traffic routed via Gateway API HTTPRoute
      ingress:
        enabled: false

      # Resources
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Worker deployment — 2 replicas spread across VPS nodes
    worker:
      name: worker
      replicas: 2

      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

      nodeSelector:
        topology.kubernetes.io/region: hetzner

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
                  app.kubernetes.io/instance: authentik
              topologyKey: kubernetes.io/hostname

      # Load ESO-generated secret key via envFrom (plus all global secrets)
      envFrom:
        - configMapRef:
            name: authentik-host
        - secretRef:
            name: authentik-bootstrap
        - secretRef:
            name: authentik-admin-password
        - secretRef:
            name: authentik-postgres-env
        - secretRef:
            name: authentik-secret-key
        - secretRef:
            name: authentik-sso-client-secrets

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # PostgreSQL — pinned to VPS with Hetzner volume for low-latency
    # access from server/worker pods (previously on Proxmox, causing 1-1.6s
    # API response times due to cross-site VXLAN+KubeSpan round-trips).
    postgresql:
      enabled: true
      auth:
        existingSecret: "authentik-postgres-env"
        secretKeys:
          adminPasswordKey: "AUTHENTIK_POSTGRESQL__PASSWORD"
          userPasswordKey: "AUTHENTIK_POSTGRESQL__PASSWORD"
      primary:
        nodeSelector:
          topology.kubernetes.io/region: hetzner
        persistence:
          storageClass: hcloud-volumes
          size: 8Gi
        extendedConfiguration: |
          max_connections = 500
          idle_in_transaction_session_timeout = '60s'

    # Redis (required for worker message queue) — pinned to VPS
    redis:
      enabled: true
      master:
        nodeSelector:
          topology.kubernetes.io/region: hetzner

    # Service account
    serviceAccount:
      create: true
      name: authentik
