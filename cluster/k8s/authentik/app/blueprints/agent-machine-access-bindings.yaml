version: 1
metadata:
  name: Agent Service Account - Application Bindings
  labels:
    blueprints.goauthentik.io/description: >-
      Grants the agent-service-account user access to proxied applications.
      Add new policy bindings here to expand agent access.

entries:
  # Grant agent access to Grocy
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, grocy]]
      user: !Find [authentik_core.user, [username, agent-service-account]]
      order: 10
