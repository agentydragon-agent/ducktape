version: 1
metadata:
  name: SSO - ArchiveBox
  labels:
    blueprints.goauthentik.io/description: "ArchiveBox reverse-proxy SSO for the experimental private web archive"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: archivebox-provider
    state: present
    identifiers:
      name: archivebox
    attrs:
      external_host: "https://archivebox.allegedly.works"
      # ArchiveBox v0.7.4 supports Django RemoteUser authentication from the
      # header injected by the Authentik outpost. Its namespace NetworkPolicy
      # permits this internal host only from Authentik's server/outpost pods.
      internal_host: "http://archivebox.archivebox.svc.cluster.local:8000"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: archivebox-app
    state: present
    identifiers:
      slug: archivebox
    attrs:
      name: ArchiveBox
      provider: !KeyOf archivebox-provider
      meta_description: "Experimental private web archive"
      meta_launch_url: "https://archivebox.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf archivebox-app
      user: !Find [authentik_core.user, [username, agentydragon]]
      order: 0
