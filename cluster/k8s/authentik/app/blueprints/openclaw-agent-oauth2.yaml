version: 1
metadata:
  name: SSO - OpenClaw Agent (OAuth2 client_credentials)
  labels:
    blueprints.goauthentik.io/description: >-
      OAuth2 provider for openclaw agent auth via client_credentials grant.

# CLEANUP(2026-04-16): Tombstones — delete this file after Authentik reconciles.
# Provider, application, and service account now managed by sso-providers TF module.
# Scope mappings moved to airlock-scope-mappings.yaml.
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: openclaw-agent

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: openclaw-agent

  - model: authentik_core.user
    state: absent
    identifiers:
      username: openclaw-agent-sa
