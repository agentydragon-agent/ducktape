version: 1
metadata:
  name: SSO - Users and Authentication
  labels:
    blueprints.goauthentik.io/description: "Custom auth flow (no MFA), user, brand"

entries:
  # Custom authentication flow without MFA stage.
  # TODO: Re-enable MFA (TOTP/WebAuthn) once device enrollment is set up.
  - model: authentik_flows.flow
    id: custom-auth-flow
    state: present
    identifiers:
      slug: custom-authentication-flow
    attrs:
      name: authentication-flow
      title: "Welcome to allegedly.works!"
      designation: authentication

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf custom-auth-flow
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf custom-auth-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 30

  # Domain-matched brand for allegedly.works
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: allegedly.works
    attrs:
      default: false
      flow_authentication: !KeyOf custom-auth-flow
      branding_title: "allegedly.works"

  # Add Google as a source on the built-in default-authentication-identification
  # stage. That stage is bound to `default-authentication-flow` at order 10, so
  # any app whose proxy provider points at `default-authentication-flow` gets
  # the "Sign in with Google" button on fresh-session login. The Google source
  # itself is provisioned in tf/gitops/sso-providers/source_google.tf.
  # `!Find` resolves the source's UUID at blueprint-apply time, which runs
  # after the TF kustomization (sso-providers-tf → authentik app).
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
      show_source_labels: false
