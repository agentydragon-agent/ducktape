version: 1
metadata:
  name: SSO - OpenClaw Mitmproxy
  labels:
    blueprints.goauthentik.io/description: "OpenClaw mitmproxy traffic viewer proxy provider and application"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: openclaw-mitmproxy-provider
    state: present
    identifiers:
      name: openclaw-mitmproxy
    attrs:
      external_host: "https://openclaw-mitmproxy.allegedly.works"
      internal_host: "http://mitmproxy.openclaw-mitmproxy.svc.cluster.local:8081"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: openclaw-mitmproxy-app
    state: present
    identifiers:
      slug: openclaw-mitmproxy
    attrs:
      name: OpenClaw Mitmproxy
      provider: !KeyOf openclaw-mitmproxy-provider
      meta_description: "OpenClaw outbound traffic viewer"
      meta_launch_url: "https://openclaw-mitmproxy.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf openclaw-mitmproxy-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
