version: 1
metadata:
  name: SSO - Capacitor
  labels:
    blueprints.goauthentik.io/description: "Capacitor (Flux UI) proxy provider and application"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: capacitor-provider
    state: present
    identifiers:
      name: capacitor
    attrs:
      external_host: "https://capacitor.allegedly.works"
      internal_host: "http://capacitor.capacitor.svc.cluster.local:80"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: capacitor-app
    state: present
    identifiers:
      slug: capacitor
    attrs:
      name: Capacitor (Flux UI)
      provider: !KeyOf capacitor-provider
      meta_description: "Flux CD dependency visualization and status"
      meta_launch_url: "https://capacitor.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf capacitor-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
