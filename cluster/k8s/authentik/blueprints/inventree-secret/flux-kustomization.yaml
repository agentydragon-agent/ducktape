apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-inventree-secret
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/authentik/blueprints/inventree-secret
  prune: true
  wait: true
  # Health check ensures OIDC secret is synced from Vault before InvenTree starts
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: inventree-oauth-client-secret
      namespace: inventree
  dependsOn:
    - name: inventree-namespace
    - name: authentik-blueprint-sso-secrets # Vault data exists
    - name: external-secrets-config # Ensure ClusterSecretStore exists
