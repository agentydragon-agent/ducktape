version: 1
metadata:
  name: SSO - OAuth Broker
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: oauth-broker-provider
    state: present
    identifiers:
      name: oauth-broker
    attrs:
      external_host: "https://oauth-broker.allegedly.works"
      internal_host: "http://oauth-broker.oauth-broker.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: oauth-broker-app
    state: present
    identifiers:
      slug: oauth-broker
    attrs:
      name: OAuth Broker
      provider: !KeyOf oauth-broker-provider
      meta_description: "OAuth token management for agents"
      meta_launch_url: "https://oauth-broker.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf oauth-broker-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
