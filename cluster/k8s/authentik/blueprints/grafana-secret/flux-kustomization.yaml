apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-grafana-secret
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/authentik/blueprints/grafana-secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  # Health check ensures OIDC config is synced from Vault for Grafana SSO
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: grafana-oidc-config
      namespace: monitoring
  dependsOn:
    - name: monitoring-namespace
    - name: external-secrets-config
    - name: authentik-blueprint-sso-secrets # Vault data exists
