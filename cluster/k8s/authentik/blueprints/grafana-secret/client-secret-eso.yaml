---
# ExternalSecret for complete Grafana OIDC configuration from Vault
# Terraform writes individual fields to Vault, ESO templates them into YAML
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-config
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oidc-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Non-sensitive fields are configured in the Grafana CR spec.config.
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: sso/oidc-providers/grafana
