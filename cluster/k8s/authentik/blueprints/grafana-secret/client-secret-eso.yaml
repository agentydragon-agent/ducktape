---
# ExternalSecret for complete Grafana OIDC configuration from Vault
# Terraform writes individual fields to Vault, ESO templates them into YAML
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-config
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oidc-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # All fields emitted as GF_* env vars — compatible with grafana-operator envFrom.
        # The old values.yaml key (kube-prometheus-stack valuesFrom) is removed.
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
        GF_AUTH_GENERIC_OAUTH_ENABLED: "{{ .enabled }}"
        GF_AUTH_GENERIC_OAUTH_NAME: "{{ .name }}"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "{{ .scopes }}"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ .auth_url }}"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ .token_url }}"
        GF_AUTH_GENERIC_OAUTH_API_URL: "{{ .api_url }}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "{{ .role_attribute_path }}"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "{{ .allow_sign_up }}"
  dataFrom:
    - extract:
        key: sso/oidc-providers/grafana
