apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-harbor-secret
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/authentik/blueprints/harbor-secret
  prune: true
  wait: true
  # Health check ensures OIDC secret is synced from Vault before Harbor uses SSO
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: harbor-oauth-client-secret
      namespace: harbor
  dependsOn:
    - name: harbor # Wait for Harbor namespace and app
    - name: authentik-blueprint-sso-secrets # Vault data exists
