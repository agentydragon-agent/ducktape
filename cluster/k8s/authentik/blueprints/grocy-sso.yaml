version: 1
metadata:
  name: SSO - Grocy
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: grocy-provider
    state: present
    identifiers:
      name: grocy
    attrs:
      external_host: "https://grocy.allegedly.works"
      internal_host: "http://grocy.grocy.svc.cluster.local:80"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: grocy-app
    state: present
    identifiers:
      slug: grocy
    attrs:
      name: Grocy
      provider: !KeyOf grocy-provider
      meta_description: "Groceries & household management"
      meta_icon: "https://cdn.simpleicons.org/grocy"
      meta_launch_url: "https://grocy.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grocy-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
