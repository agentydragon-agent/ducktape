apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-vault-secret
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/authentik/blueprints/vault-secret
  prune: true
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: vault-oauth-client-secret
      namespace: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: vault
    - name: external-secrets-config
    - name: reflector
    - name: authentik-blueprint-sso-secrets # Vault data exists
