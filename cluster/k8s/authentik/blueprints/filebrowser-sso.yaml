version: 1
metadata:
  name: SSO - FileBrowser
  labels:
    blueprints.goauthentik.io/description: "FileBrowser proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: filebrowser-provider
    state: present
    identifiers:
      name: filebrowser
    attrs:
      external_host: "https://files.allegedly.works"
      internal_host: "http://scanner-filebrowser.scanner.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: filebrowser-app
    state: present
    identifiers:
      slug: filebrowser
    attrs:
      name: FileBrowser
      provider: !KeyOf filebrowser-provider
      meta_description: "Scanner File Browser"
      meta_icon: "https://cdn.simpleicons.org/files"
      meta_launch_url: "https://files.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf filebrowser-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: filebrowser-outpost
    attrs:
      type: proxy
      providers:
        - !KeyOf filebrowser-provider
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
      config:
        authentik_host: "http://authentik-server.authentik:80"
        authentik_host_browser: "https://auth.allegedly.works"
        kubernetes_json_patches:
          deployment:
            - op: add
              path: /spec/template/spec/nodeSelector
              value:
                topology.kubernetes.io/region: hetzner
