---
# ExternalSecret for Headlamp OIDC credentials from Vault.
# Generates a K8s Secret with env var keys consumed by Headlamp's externalSecret mode.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
  namespace: headlamp
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
        OIDC_ISSUER_URL: "https://auth.allegedly.works/application/o/headlamp/"
        OIDC_SCOPES: "openid profile email"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/headlamp
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/headlamp
        property: client_secret
