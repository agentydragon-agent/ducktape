version: 1
metadata:
  name: SSO - Alloy OTLP
  labels:
    blueprints.goauthentik.io/description: "Alloy OTLP proxy provider, service account, and outpost for external OTEL ingestion"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: alloy-otlp-provider
    state: present
    identifiers:
      name: alloy-otlp
    attrs:
      external_host: "https://alloy-otlp.allegedly.works"
      # Alloy OTLP/HTTP endpoint in the monitoring namespace.
      internal_host: "http://alloy.monitoring.svc.cluster.local:4318"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: alloy-otlp-app
    state: present
    identifiers:
      slug: alloy-otlp
    attrs:
      name: Alloy OTLP
      provider: !KeyOf alloy-otlp-provider
      meta_description: "Grafana Alloy OTLP ingestion endpoint for external clients (Claude hooks, etc.)"
      open_in_new_tab: false

  # Service account for machine-to-machine Bearer token auth.
  # Authentik proxy outposts validate Authorization: Bearer <token> by looking up
  # the token in Authentik's API and checking the owning user has application access.
  - model: authentik_core.user
    id: alloy-otlp-sa
    state: present
    identifiers:
      username: alloy-otlp-service-account
    attrs:
      name: "Alloy OTLP Service Account"
      type: service_account

  - model: authentik_core.token
    id: alloy-otlp-token
    state: present
    identifiers:
      # This identifier is used to look up the token in the Admin UI and CLI.
      identifier: alloy-otlp-api-key
    attrs:
      user: !KeyOf alloy-otlp-sa
      intent: api
      description: "Bearer token for Claude hooks → Alloy OTLP ingestion"
      # Token value is auto-generated by Authentik on first apply.
      # Retrieve it after blueprint syncs:
      #   kubectl exec -n authentik deploy/authentik-worker -- \
      #     ak shell -c "from authentik.core.models import Token; \
      #       print(Token.objects.get(identifier='alloy-otlp-api-key').key)"
      # Then age-encrypt for local Claude hooks:
      #   echo -n "Bearer <token>" | age -e -r <your-age-pubkey> \
      #     > ~/.config/adgn-claude-hooks/otel-api-key.age

  # Grant the service account access to the alloy-otlp application.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf alloy-otlp-app
      user: !KeyOf alloy-otlp-sa
      order: 0
