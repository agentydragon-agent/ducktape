version: 1
metadata:
  name: SSO - Loki
  labels:
    blueprints.goauthentik.io/description: "Loki proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: loki-provider
    state: present
    identifiers:
      name: loki
    attrs:
      external_host: "https://loki.allegedly.works"
      internal_host: "http://loki-stack.loki.svc.cluster.local:3100"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: loki-app
    state: present
    identifiers:
      slug: loki
    attrs:
      name: Loki
      provider: !KeyOf loki-provider
      meta_description: "Grafana Loki Log Aggregation"
      meta_launch_url: "https://loki.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf loki-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: loki-outpost
    attrs:
      type: proxy
      providers:
        - !KeyOf loki-provider
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
      config:
        authentik_host: "http://authentik-server.authentik:80"
        authentik_host_browser: "https://auth.allegedly.works"
        kubernetes_json_patches:
          deployment:
            - op: add
              path: /spec/template/spec/nodeSelector
              value:
                topology.kubernetes.io/region: hetzner
