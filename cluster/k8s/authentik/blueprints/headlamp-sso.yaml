version: 1
metadata:
  name: SSO - Headlamp
  labels:
    blueprints.goauthentik.io/description: "Headlamp proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: headlamp-provider
    state: present
    identifiers:
      name: headlamp
    attrs:
      external_host: "https://headlamp.allegedly.works"
      internal_host: "http://headlamp.headlamp.svc.cluster.local:80"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: headlamp-app
    state: present
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      provider: !KeyOf headlamp-provider
      meta_description: "Kubernetes cluster UI"
      meta_launch_url: "https://headlamp.allegedly.works"
      meta_icon: "https://raw.githubusercontent.com/kubernetes-sigs/headlamp/main/frontend/public/android-chrome-512x512.png"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf headlamp-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
