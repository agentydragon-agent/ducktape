# Gateway -> Authentik server/outpost -> ArchiveBox. ArchiveBox consumes the
# Authentik-injected identity header, unlike Browsertrix's separate local login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archivebox
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - archivebox.allegedly.works
  rules:
    - timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: authentik-server
          port: 80
