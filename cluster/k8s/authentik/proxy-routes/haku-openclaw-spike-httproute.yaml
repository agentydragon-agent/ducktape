apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-openclaw-spike
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "haku-openclaw-spike.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      timeouts:
        request: "600s"
        backendRequest: "600s"
