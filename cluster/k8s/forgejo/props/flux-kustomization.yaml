apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-props
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/forgejo/props
  prune: true
  # The Job spec is immutable; replace it when the script/config changes.
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up to create the user
    - name: props-secrets # source of props-forgejo-upstream-creds
    - name: reflector # mirrors props-forgejo-upstream-creds into the forgejo namespace
