apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-props-user
  namespace: forgejo
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-props-user
    spec:
      restartPolicy: OnFailure
      # Co-located with Forgejo on OVH (the Forgejo API is OVH-internal).
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: provision
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/provision.sh"]
          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-password
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-password
                  key: password
            # Mirrored from the props namespace by Reflector.
            - name: PROPS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: props-forgejo-upstream-creds
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: forgejo-props-provision
