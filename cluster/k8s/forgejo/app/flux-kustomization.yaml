apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: flux-system
spec:
  suspend: true
  # Wyrm2 offline during relocation — suspended until hardware is back up.
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/forgejo/app
  prune: true
  wait: true
  # Health check ensures Forgejo is fully operational with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: forgejo
      namespace: forgejo
  dependsOn:
    - name: forgejo-namespace
    - name: forgejo-db
    - name: gateway
    - name: cert-manager
    - name: forgejo-secrets
    - name: reflector # Mirrors forgejo-oauth-client-secret from authentik namespace
    - name: sso-providers-tf # Writes forgejo-oauth-client-secret to authentik namespace
    - name: authentik # Authentik must be running for OIDC
    # Forgejo validates OIDC at init time (the configure init container fetches the discovery URL).
    # Other SSO apps (Harbor, Matrix, Grafana) validate lazily at first login, so they don't need this.
