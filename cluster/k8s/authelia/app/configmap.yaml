apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    # Authelia configuration — non-secret parts.
    # Secrets injected via AUTHELIA_*_FILE env vars from authelia-secrets Secret.

    theme: auto

    server:
      address: tcp://0.0.0.0:9091/

    log:
      level: info

    # Single user — local file backend, no LDAP.
    authentication_backend:
      file:
        path: /config/users.yml

    # SQLite — no external DB needed for a single-user instance.
    storage:
      local:
        path: /data/db.sqlite3

    session:
      cookies:
        - domain: allegedly.works
          authelia_url: https://authelia.allegedly.works
          default_redirection_url: https://authelia.allegedly.works

    # Access control: default deny, allow admin user everywhere.
    access_control:
      default_policy: deny
      rules:
        - domain: "*.allegedly.works"
          policy: one_factor
          subject: "user:agentydragon"

    # OIDC provider — clients defined here, secrets hashed with pbkdf2.
    # JWKS private key mounted from authelia-jwks Secret.
    identity_providers:
      oidc:
        jwks:
          - key_id: default
            algorithm: RS256
            use: sig
            key: '{{ secret "/jwks/rsa-private.pem" }}'
        # TODO: Add clients as apps are migrated from Authentik.
        # Example:
        # clients:
        #   - client_id: headlamp
        #     client_name: Headlamp
        #     client_secret: '$pbkdf2-sha512$310000$...'  # generate with: authelia crypto hash generate pbkdf2
        #     redirect_uris:
        #       - https://headlamp.allegedly.works/oidc-callback
        #     scopes: [openid, profile, email]
        #     grant_types: [authorization_code]
        #     response_types: [code]
        #     token_endpoint_auth_method: client_secret_basic
        #     authorization_policy: one_factor
        clients: []

    notifier:
      # Filesystem notifier for development. TODO: switch to SMTP for production.
      filesystem:
        filename: /data/notification.txt

  # User database — passwords hashed with argon2id.
  users.yml: |
    users:
      agentydragon:
        disabled: false
        displayname: Rai
        password: "$argon2id$v=19$m=65536,t=3,p=4$MVhDbXVsbVlRWEZBYXJEYw$RvPVzC3v3jALA18WLANQvUKPDk9UR/HXMINxFX3XtY4"
        email: raidominator@gmail.com
        groups:
          - admins
