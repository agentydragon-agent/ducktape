---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keda
  namespace: keda
spec:
  interval: 24h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 15m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: keda
      # 2.20.2 reports an empty Forgejo queue as inactive, allowing haku-ci
      # to scale to zero.
      version: "2.20.2"
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: keda
      interval: 12h
  values:
    # KEDA has cluster-scoped CRDs and admission plumbing, but its operator only
    # watches the one namespace whose runners it is allowed to scale.
    watchNamespace: haku-ci
    nodeSelector:
      topology.kubernetes.io/region: hil
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      webhooks:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
