apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-stack-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/monitoring-stack-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: monitoring-namespace
    - name: external-secrets-config
