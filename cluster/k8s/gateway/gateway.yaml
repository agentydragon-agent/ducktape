apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: gateway-system
  annotations:
    cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-wildcard
      hostname: "*.allegedly.works"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-allegedly-works-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      hostname: "allegedly.works"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: apex-allegedly-works-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: kube-api-passthrough
      hostname: "api.allegedly.works"
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # Raw TCP for `ssh agentydragon@gecko.allegedly.works` — wildcard A points
    # at the hil hostNetwork Envoy nodes, which forward 22 → gecko-ssh:22 via
    # cluster/k8s/gecko/app/tcproute.yaml.
    - name: ssh-gecko
      port: 22
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
