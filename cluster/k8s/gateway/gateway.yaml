apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: gateway-system
  annotations:
    cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
    external-dns.alpha.kubernetes.io/target: "${vps_ips_csv}"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-wildcard
      hostname: "*.allegedly.works"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-allegedly-works-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      hostname: "allegedly.works"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: apex-allegedly-works-tls
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough for Headscale — Envoy routes by SNI without decrypting.
    # Headscale handles TLS termination and the Tailscale noise protocol natively.
    # Required because Cilium's auto-generated Envoy config only allows websocket
    # upgrades, returning 403 for `Upgrade: tailscale-control-protocol`.
    - name: headscale-passthrough
      hostname: "headscale.allegedly.works"
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
