apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: activitywatch-authkey-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/activitywatch-authkey-bootstrap"
  prune: true
  wait: true
  dependsOn:
    - name: headscale
    - name: headscale-config
