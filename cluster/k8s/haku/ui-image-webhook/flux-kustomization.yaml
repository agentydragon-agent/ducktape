apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-ui-image-webhook
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/haku/ui-image-webhook
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    # haku-state provisions the forgejo-webhook-token Secret (the Receiver's secretRef)
    # and the Forgejo package webhook that targets this receiver.
    - name: haku-state
