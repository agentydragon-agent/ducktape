apiVersion: v1
kind: Service
metadata:
  name: haku-console
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haku-console
  ports:
    # The public route targets haku-console-static. This API port remains for
    # nginx's in-cluster proxy and any trusted in-cluster API consumer.
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    # Prometheus scrape port. The public HTTPRoute reaches haku-console-static,
    # which intentionally does not proxy /metrics; this port exposes the API
    # container to the ServiceMonitor without making metrics public. Pod IPs are
    # already routable in-cluster, so this widens no reachability — it only names the target.
    - name: metrics
      port: 9090
      targetPort: api
      protocol: TCP
