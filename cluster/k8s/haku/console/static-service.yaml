# The public HTTPRoute reaches the SPA/nginx frontend through this service. nginx
# proxies API, MCP, auth, and health endpoints to the separate haku-console API service.
apiVersion: v1
kind: Service
metadata:
  name: haku-console-static
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console-static
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haku-console-static
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
