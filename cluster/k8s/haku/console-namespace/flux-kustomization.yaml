apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/haku/console-namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
