# Same bounded controller capability as haku-sandbox, scoped to the separate Claude sandbox.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-console-jit-rolebinding-manager
  namespace: haku-claude-sandbox
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["haku-jit-readonly"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-console-jit-rolebinding-manager
  namespace: haku-claude-sandbox
subjects:
  - kind: ServiceAccount
    name: haku-console
    namespace: haku-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-console-jit-rolebinding-manager
