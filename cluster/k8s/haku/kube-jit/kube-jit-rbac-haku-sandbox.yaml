# The Console reconciler may manage only its labelled RoleBindings in this one namespace.
# `bind` remains narrowed to reviewed profile ClusterRoles: it cannot turn RoleBinding CRUD into
# arbitrary privilege delegation. Haku's haku-sandbox ServiceAccount has none of this authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-console-jit-rolebinding-manager
  namespace: haku-sandbox
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["haku-jit-readonly"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-console-jit-rolebinding-manager
  namespace: haku-sandbox
subjects:
  - kind: ServiceAccount
    name: haku-console
    namespace: haku-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-console-jit-rolebinding-manager
