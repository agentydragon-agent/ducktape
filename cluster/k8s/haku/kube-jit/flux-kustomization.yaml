apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-kube-jit
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/kube-jit
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: haku-console-namespace
      namespace: ducktape-flux
    # The Console applies the shared schema migration before its API becomes Ready. The worker
    # uses the same ledger but must stay up independently after that point.
    - name: haku-console
      namespace: ducktape-flux
