apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-dispatcher
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/haku/dispatch/dispatcher
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: dispatcher
      namespace: haku-dispatch
  dependsOn:
    - name: haku-dispatch-namespace
      namespace: ducktape-flux
    - name: haku-dispatch-db
    # Mounts the TF-minted classifier key (reflected) + workers master key.
    - name: litellm-keys-tf
    # Key minting target; also transitively orders the zone keys.
    - name: haku-dispatch-litellm
    # rbac-zone-zai.yaml creates a Role inside the zone namespace.
    - name: haku-zone-zai
    # ESO generators + the flux-system mirror store.
    - name: external-secrets-config
