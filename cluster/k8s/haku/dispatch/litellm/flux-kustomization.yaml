apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-dispatch-litellm
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/haku/dispatch/litellm
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: haku-dispatch-namespace
      namespace: ducktape-flux
    - name: haku-dispatch-db
    - name: litellm
    # Mounts the TF-minted zone key + workers master/salt keys.
    - name: litellm-keys-tf
