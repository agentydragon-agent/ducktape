apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-dispatch-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/haku/dispatch/db
  prune: true
  wait: true
  dependsOn:
    - name: haku-dispatch-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    # ESO Password generator + ExternalSecret (db-role-secrets.yaml).
    - name: external-secrets-config
      namespace: ducktape-flux
