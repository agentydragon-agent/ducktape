# Console-owned harness runners accept no inbound connections. Their egress is selected
# by the access-profile pod labels below, so co-tenancy in this namespace is not authority
# to use the other runtime's proxy or credentials.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-runtime-sandbox-ingress
  namespace: haku-runtime-sandbox
spec:
  endpointSelector: {}
  ingress: []
---
# Public-coder runners establish an outbound bridge WebSocket and reach GitHub and LiteLLM only
# through public-coder-agent's credential-mediating proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-coder-runner-egress
  namespace: haku-runtime-sandbox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-harness-runner
      haku.allegedly.works/access-profile-id: public-coder
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        # Cilium evaluates the destination endpoint after Service translation.
        # haku-console-codex-runner port 9090 targets the API container's port 8080.
        - ports:
            - { port: "8080", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: public-coder-agent
            k8s:app.kubernetes.io/name: public-coder-agent-proxy
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Console-selected Kubernetes access is mediated by haku-kube-api-proxy; the pod has no
    # ServiceAccount token and the runner writes a tokenFile kubeconfig only for this URL.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-kube-api-proxy
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
