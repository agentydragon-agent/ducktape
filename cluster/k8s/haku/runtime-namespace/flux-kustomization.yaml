apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-runtime-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/haku/runtime-namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
