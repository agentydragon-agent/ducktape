apiVersion: v1
kind: Namespace
metadata:
  name: haku-runtime-sandbox
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: "auto"
    name: haku-runtime-sandbox
    # Console-owned harness runners are a separate trust domain from Haku's general
    # compute namespace. Per-template access-profile labels select credential-mediating egress.
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    description: Console-owned harness runners with profile-selected egress and no ServiceAccount identity.
