apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo-images-creds-eso.yaml
  - sandboxtemplate-haku.yaml
  - sandboxwarmpool-haku.yaml
  - sandboxtemplate-haku-claude.yaml
  - sandboxwarmpool-haku-claude.yaml
  - cleanuppolicy-haku-janitor.yaml
  - cleanuppolicy-haku-claude-janitor.yaml
  # Cross-namespace RBAC lives here rather than under a namespace-transforming
  # workload kustomization. The general sandbox MCP bindings remain in haku-sandbox;
  # Console's Claude claim-only binding lives in haku-claude-sandbox.
  - haku-sandbox-mcp-role.yaml
  - haku-sandbox-mcp-rolebinding.yaml
  - haku-console-claude-claim-role.yaml
  - haku-console-claude-claim-rolebinding.yaml
