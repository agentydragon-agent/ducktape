# Claude Code runtime for the Console chat vertical slice. Session identity and a
# one-use runner bearer arrive declaratively through SandboxClaim.spec.env; the
# real Claude OAuth token never enters this namespace.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-claude
  namespace: haku-claude-sandbox
spec:
  networkPolicyManagement: Unmanaged
  # Claims may inject the session id and one-use bridge token. Agent Sandbox v0.5.1
  # cold-starts claims with env, which is accepted for this first slice.
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-claude-runner
    spec:
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Deliberately outside haku-sandbox: Haku's general compute authority must not
      # inherit access to the Claude OAuth-substituting proxy. Also defer the Haku
      # Console agent bearer, Kubernetes identity, Forgejo/workspace bootstrap, MCP
      # configuration, and every other general sandbox integration.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/agentydragon/haku-claude-runner:devel-20260811030708-63274ad # {"$imagepolicy": "flux-system:haku-claude-runner"}
          imagePullPolicy: Always
          workingDir: /workspace
          env:
            - name: HAKU_AGENT_SDK_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
