# Claude runners accept no inbound connections. They establish an outbound WebSocket
# to Haku Console and reach Anthropic only through the OAuth-substituting proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-claude-sandbox-ingress
  namespace: haku-claude-sandbox
spec:
  endpointSelector: {}
  ingress: []
