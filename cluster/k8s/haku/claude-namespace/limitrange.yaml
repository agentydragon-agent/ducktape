apiVersion: v1
kind: LimitRange
metadata:
  name: haku-claude-sandbox-limits
  namespace: haku-claude-sandbox
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
    - max:
        cpu: "4"
        memory: 8Gi
      type: Pod
