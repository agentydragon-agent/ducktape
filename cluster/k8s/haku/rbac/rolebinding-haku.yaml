# Bind Haku's shared compute identity to haku-sandbox-admin — full CRUD in haku-sandbox.
# Used by the sandbox exec-target pods and managed-agent worker. Console-launched CLI pods carry
# no Kubernetes credential; Console SARs this canonical subject before the separate proxy executes
# an allowed request.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin # cluster/k8s/haku/rbac/role.yaml
subjects:
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
