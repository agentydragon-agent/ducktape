# Bind Haku's shared compute identity to haku-sandbox-admin — full CRUD in haku-sandbox.
# The direct Haku ServiceAccount serves ordinary pods that carry Kubernetes credentials. Console-
# launched CLI runners carry none; Console authorizes their exact-session Agent bearer by SARing the
# deploy-owned access-profile group before the separate proxy executes an allowed request.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin # cluster/k8s/haku/rbac/role.yaml
subjects:
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: Group
    name: haku:access-profile:haku
    apiGroup: rbac.authorization.k8s.io
