apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-zones-policies
  namespace: flux-system
spec:
  retryInterval: 1m
  dependsOn:
    - name: kyverno # ClusterPolicy CRD
  interval: 10m
  path: ./cluster/k8s/haku/zones/policies
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  wait: true
  timeout: 2m
