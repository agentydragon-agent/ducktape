apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-managed-agent
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/managed-agent
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-managed-agent
      namespace: haku-sandbox
  dependsOn:
    - name: agent-shared-secrets # provides ankiweb-credentials in claude-sandbox
      namespace: ducktape-flux
    - name: external-secrets-config # provides the claude-sandbox SecretStore
      namespace: ducktape-flux
    - name: haku-namespace
      namespace: ducktape-flux
    - name: haku-rbac
      namespace: ducktape-flux
    - name: haku-state # provides the haku-forgejo-git secret in haku-sandbox
    - name: haku-egress-proxy # injects the egress proxy + CA the worker imports
