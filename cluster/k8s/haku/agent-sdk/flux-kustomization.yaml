apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-agent-sdk
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./cluster/k8s/haku/agent-sdk
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: haku-agent-sdk-smoke
      namespace: haku-claude-sandbox
  dependsOn:
    - name: haku-claude-namespace
      namespace: ducktape-flux
    - name: haku-egress-proxy
    - name: alloy-otlp-bearer
