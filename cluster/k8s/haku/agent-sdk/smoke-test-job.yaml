apiVersion: batch/v1
kind: Job
metadata:
  name: haku-agent-sdk-smoke
  namespace: haku-sandbox
  annotations:
    description: One-shot Claude Agent SDK subscription OAuth, streaming, hooks, resume, proxy, and telemetry compatibility spike.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-agent-sdk-smoke
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: ghcr.io/agentydragon/haku-agent-sdk-smoke:devel-20260801021945-fdae1a9 # {"$imagepolicy": "flux-system:haku-agent-sdk-smoke"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /home/smoke
            - name: CLAUDE_CONFIG_DIR
              value: /claude-config
            - name: HAKU_AGENT_SDK_SMOKE_CWD
              value: /workspace
            - name: HAKU_AGENT_SDK_SMOKE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-agent-sdk-oauth-token
                  key: CLAUDE_CODE_OAUTH_TOKEN
            # The reflected telemetry-ingest-only bearer is never logged. The
            # harness percent-encodes it into OTEL_EXPORTER_OTLP_HEADERS for the
            # CLI subprocess created by ClaudeAgentOptions.env.
            - name: DUCKTAPE_OTEL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alloy-otlp-bearer
                  key: token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://alloy-otlp.allegedly.works
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/smoke
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
