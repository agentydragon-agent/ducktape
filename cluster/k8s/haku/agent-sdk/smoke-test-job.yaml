apiVersion: batch/v1
kind: Job
metadata:
  name: haku-agent-sdk-smoke
  namespace: haku-claude-sandbox
  annotations:
    description: One-shot Claude Agent SDK subscription OAuth, streaming, hooks, resume, proxy, and telemetry compatibility spike.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-agent-sdk-smoke
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: ghcr.io/agentydragon/haku-agent-sdk-smoke:devel-20260801035616-9935a24 # {"$imagepolicy": "flux-system:haku-agent-sdk-smoke"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /home/smoke
            - name: CLAUDE_CONFIG_DIR
              value: /claude-config
            - name: HAKU_AGENT_SDK_SMOKE_CWD
              value: /workspace
            - name: HAKU_AGENT_SDK_SMOKE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # Non-secret token-shaped placeholder. The dedicated iron-proxy owns the real
            # subscription OAuth token and substitutes it only on Anthropic Authorization headers.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: sk-ant-oat01-proxy-haku-claude-placeholder
            - name: HAKU_AGENT_SDK_SMOKE_PROXY
              value: http://haku-claude-oauth-proxy.haku-egress-proxy.svc.cluster.local:8180
            - name: NODE_EXTRA_CA_CERTS
              value: /egress-proxy-ca/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /egress-proxy-ca/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /egress-proxy-ca/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /egress-proxy-ca/ca-certificates.crt
            # The reflected telemetry-ingest-only bearer is never logged. The
            # harness percent-encodes it into OTEL_EXPORTER_OTLP_HEADERS for the
            # CLI subprocess created by ClaudeAgentOptions.env.
            - name: DUCKTAPE_OTEL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alloy-otlp-bearer
                  key: token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://alloy-otlp.allegedly.works
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /home/smoke
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
