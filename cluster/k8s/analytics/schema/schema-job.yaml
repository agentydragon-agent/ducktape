apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-aiquota-schema-v4
  namespace: analytics
  labels:
    app.kubernetes.io/name: clickhouse-schema
    app.kubernetes.io/instance: analytics
    app.kubernetes.io/component: schema
  annotations:
    description: Applies the first AIQuota schema revision directly to each ClickHouse replica.
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-schema
        app.kubernetes.io/instance: analytics
        app.kubernetes.io/component: schema
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: clickhouse/clickhouse-server:26.3.20.7@sha256:c22a4aba84a1ea83e320a6f8620b87100649e04995b61d7dde160fc1ca33bc76
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              for host in \
                chi-analytics-analytics-0-0.analytics.svc.cluster.local \
                chi-analytics-analytics-0-1.analytics.svc.cluster.local
              do
                clickhouse-client \
                  --host="$host" \
                  --port=9000 \
                  --connect_timeout=10 \
                  --receive_timeout=60 \
                  --multiquery \
                  --queries-file=/schema/schema.sql
              done
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-admin-credentials
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-admin-credentials
                  key: password
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: clickhouse-aiquota-schema
        - name: tmp
          emptyDir: {}
