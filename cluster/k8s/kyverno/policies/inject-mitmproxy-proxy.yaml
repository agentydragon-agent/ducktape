# Auto-inject mitmproxy proxy config into all pods in sandbox namespaces.
# This makes any pod (e.g. `kubectl run --image=curlimages/curl`) work
# turnkey with HTTP_PROXY, HTTPS_PROXY, SSL trust, and the CA cert mounted,
# without the pod spec needing to know about the proxy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-mitmproxy-proxy
  annotations:
    policies.kyverno.io/title: Inject mitmproxy proxy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutates pods in claude-sandbox and openclaw-sandbox to automatically
      inject mitmproxy proxy env vars (HTTP_PROXY, HTTPS_PROXY, NO_PROXY,
      SSL_CERT_FILE, CURL_CA_BUNDLE, REQUESTS_CA_BUNDLE, NODE_EXTRA_CA_CERTS)
      and mount the mitmproxy CA cert at /mitmproxy-ca/ca-cert.pem.
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
    - name: add-proxy-volume
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox, openclaw-sandbox, openclaw-gateway]
      mutate:
        patchStrategicMerge:
          spec:
            volumes:
              - name: mitmproxy-ca-cert
                configMap:
                  name: mitmproxy-ca-cert

    - name: add-proxy-env-and-mount-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox, openclaw-sandbox, openclaw-gateway]
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "?*"
                env:
                  - name: HTTP_PROXY
                    value: "http://mitmproxy.openclaw-mitmproxy.svc.cluster.local:8080"
                  - name: HTTPS_PROXY
                    value: "http://mitmproxy.openclaw-mitmproxy.svc.cluster.local:8080"
                  - name: NO_PROXY
                    value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8"
                  - name: SSL_CERT_FILE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: CURL_CA_BUNDLE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: REQUESTS_CA_BUNDLE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: NODE_EXTRA_CA_CERTS
                    value: /mitmproxy-ca/ca-cert.pem
                volumeMounts:
                  - name: mitmproxy-ca-cert
                    mountPath: /mitmproxy-ca
                    readOnly: true

    - name: add-proxy-env-and-mount-init-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox, openclaw-sandbox, openclaw-gateway]
        # Only applies when there are init containers
      preconditions:
        any:
          - key: "{{ (request.object.spec.initContainers || `[]`) | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - (name): "?*"
                env:
                  - name: HTTP_PROXY
                    value: "http://mitmproxy.openclaw-mitmproxy.svc.cluster.local:8080"
                  - name: HTTPS_PROXY
                    value: "http://mitmproxy.openclaw-mitmproxy.svc.cluster.local:8080"
                  - name: NO_PROXY
                    value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8"
                  - name: SSL_CERT_FILE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: CURL_CA_BUNDLE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: REQUESTS_CA_BUNDLE
                    value: /mitmproxy-ca/ca-cert.pem
                  - name: NODE_EXTRA_CA_CERTS
                    value: /mitmproxy-ca/ca-cert.pem
                volumeMounts:
                  - name: mitmproxy-ca-cert
                    mountPath: /mitmproxy-ca
                    readOnly: true
