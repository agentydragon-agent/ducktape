# Generates PowerDNS ClusterRRset DNS records from VPS node ExternalIPs.
#
# Replaces the old cluster-info ConfigMap + Flux postBuild substitution chain.
# When a Node changes, Kyverno re-fetches all VPS node IPs and regenerates
# the DNS records. Adding/removing a VPS node automatically updates DNS.
#
# Uses the Kyverno 3.x GeneratingPolicy API (CEL-based).
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-dns-records
  annotations:
    policies.kyverno.io/title: Generate DNS A records from VPS node IPs
    policies.kyverno.io/category: DNS
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Watches Node resources and generates allegedly.works DNS records.
      Wildcard and apex get all VPS IPv4 IPs; ns1/ns2 get individual CP IPs.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["nodes"]
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  variables:
    # Fetch all VPS nodes (region=hil) — empty namespace for cluster-scoped
    - name: allVpsNodes
      expression: >-
        dyn(resource.List("v1", "nodes", "")).items.filter(n,
          dyn(n).metadata.labels["topology.kubernetes.io/region"] == "hil"
        )
    # Extract IPv4 ExternalIPs from all VPS nodes
    - name: vpsIPv4s
      expression: >-
        variables.allVpsNodes.map(n,
          n.status.addresses.filter(a,
            a.type == "ExternalIP" && a.address.contains(".")
          )[0].address
        )
    # CP nodes only — sorted by name for stable ns1/ns2 assignment
    - name: cpIPsSorted
      expression: >-
        variables.allVpsNodes.filter(n,
          "node-role.kubernetes.io/control-plane" in n.metadata.labels
        ).map(n, {
          "name": n.metadata.name,
          "ip": n.status.addresses.filter(a,
            a.type == "ExternalIP" && a.address.contains(".")
          )[0].address
        })
    # Build ClusterRRset for wildcard
    - name: wildcard
      expression: |
        {
          "apiVersion": dyn("dns.cav.enablers.ob/v1alpha2"),
          "kind": dyn("ClusterRRset"),
          "metadata": dyn({"name": "wildcard"}),
          "spec": dyn({
            "zoneRef": dyn({"kind": "ClusterZone", "name": "allegedly.works"}),
            "name": dyn("*.allegedly.works."),
            "type": dyn("A"),
            "ttl": dyn(300),
            "records": dyn(variables.vpsIPv4s)
          })
        }
    # Build ClusterRRset for apex
    - name: apex
      expression: |
        {
          "apiVersion": dyn("dns.cav.enablers.ob/v1alpha2"),
          "kind": dyn("ClusterRRset"),
          "metadata": dyn({"name": "apex"}),
          "spec": dyn({
            "zoneRef": dyn({"kind": "ClusterZone", "name": "allegedly.works"}),
            "name": dyn("allegedly.works."),
            "type": dyn("A"),
            "ttl": dyn(300),
            "records": dyn(variables.vpsIPv4s)
          })
        }
    # Build ClusterRRset for ns1 (1st CP node)
    - name: ns1
      expression: |
        {
          "apiVersion": dyn("dns.cav.enablers.ob/v1alpha2"),
          "kind": dyn("ClusterRRset"),
          "metadata": dyn({"name": "ns1"}),
          "spec": dyn({
            "zoneRef": dyn({"kind": "ClusterZone", "name": "allegedly.works"}),
            "name": dyn("ns1.allegedly.works."),
            "type": dyn("A"),
            "ttl": dyn(3600),
            "records": dyn([variables.cpIPsSorted[0].ip])
          })
        }
    # Build ClusterRRset for ns2 (2nd CP node)
    - name: ns2
      expression: |
        {
          "apiVersion": dyn("dns.cav.enablers.ob/v1alpha2"),
          "kind": dyn("ClusterRRset"),
          "metadata": dyn({"name": "ns2"}),
          "spec": dyn({
            "zoneRef": dyn({"kind": "ClusterZone", "name": "allegedly.works"}),
            "name": dyn("ns2.allegedly.works."),
            "type": dyn("A"),
            "ttl": dyn(3600),
            "records": dyn([variables.cpIPsSorted[1].ip])
          })
        }
    # ConfigMap with CP node IPs for the dns-records TF module (Route 53 glue).
    # Flat keys — avoids JSON serialization (Kyverno CEL has no json.marshal).
    - name: clusterInfo
      expression: |
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("ConfigMap"),
          "metadata": dyn({"name": "cluster-info", "namespace": "kube-system"}),
          "data": dyn({
            "ns1_ip": dyn(variables.cpIPsSorted[0].ip),
            "ns1_name": dyn(variables.cpIPsSorted[0].name),
            "ns2_ip": dyn(variables.cpIPsSorted[1].ip),
            "ns2_name": dyn(variables.cpIPsSorted[1].name)
          })
        }
  generate:
    # Empty namespace for cluster-scoped ClusterRRsets
    - expression: >-
        generator.Apply("", [
          variables.wildcard,
          variables.apex,
          variables.ns1,
          variables.ns2
        ])
    # ConfigMap in kube-system for dns-records TF module
    - expression: >-
        generator.Apply("kube-system", [variables.clusterInfo])
---
# RBAC: let Kyverno manage ClusterRRset resources and read Nodes.
# Aggregated into both admission-controller and background-controller
# ClusterRoles via labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-generate-dns-records
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dns.cav.enablers.ob"]
    resources: ["clusterrrsets"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
