# Kyverno - Kubernetes Native Policy Management
# Used to enforce GitOps-only deployments and other security policies
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  targetNamespace: kyverno
  interval: 15m
  chart:
    spec:
      chart: kyverno
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    # Admission controller configuration
    admissionController:
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      # Use cert-manager for TLS certificate management
      # This ensures TLS certs exist BEFORE webhook registration,
      # eliminating the race condition where webhook is registered
      # before Kyverno's internal certmanager-controller creates certs
      certManager:
        enabled: true

    # Background controller for policy reports
    backgroundController:
      enabled: true
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi

    # Cleanup controller
    cleanupController:
      enabled: true
      replicas: 1
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi

    # Reports controller
    reportsController:
      enabled: true
      replicas: 1
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi

    # CRD installation
    crds:
      install: true

    # Feature flags
    features:
      logging:
        format: text
      admissionReports:
        enabled: true
      policyReports:
        enabled: true

    # Exclude system namespaces from policy enforcement
    config:
      excludeKyvernoNamespace: true
