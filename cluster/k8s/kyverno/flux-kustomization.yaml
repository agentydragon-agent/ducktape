apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/k8s/kyverno
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  dependsOn:
    - name: cert-manager
  healthChecks:
    # CRD must exist
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clusterpolicies.kyverno.io
      namespace: ""
    # Admission controller must be running
    - apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno
    # Webhook must be registered - this is the critical check
    # Without this, the webhook will timeout and block all resource creation
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      name: kyverno-resource-validating-webhook-cfg
      namespace: ""
