apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "vault.allegedly.works"
  rules:
    - backendRefs:
        - name: instance
          port: 8200
# TODO: Vault listener currently serves HTTPS. Gateway terminates TLS and forwards HTTP.
# Vault must be reconfigured to accept HTTP on port 8200 for internal traffic.
# Track BackendTLSPolicy support: https://github.com/cilium/cilium/issues/31352
# When Cilium supports BackendTLSPolicy, re-enable HTTPS between gateway and Vault.
