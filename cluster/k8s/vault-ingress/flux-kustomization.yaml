apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-ingress
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/vault-ingress"
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  # TLS now handled by wildcard cert on cluster-gateway in gateway-system namespace.
  # No per-service Certificate health check needed.
  dependsOn:
    - name: cert-manager-issuer-config
    - name: vault # Core Vault must be ready first
    - name: gateway
    - name: cert-manager-environment
