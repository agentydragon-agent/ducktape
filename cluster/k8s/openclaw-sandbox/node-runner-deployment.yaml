apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-runner
  namespace: openclaw-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-runner
  template:
    metadata:
      labels:
        app: node-runner
    spec:
      serviceAccountName: node-runner
      # Pin to Proxmox region alongside OpenClaw gateway.
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: dind
          image: docker:27-dind
          args:
            - --storage-driver=overlay2
          env:
            # Disable TLS for cluster-internal communication (Cilium CNP restricts access).
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - name: docker-api
              containerPort: 2375
              protocol: TCP
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: docker-storage
          persistentVolumeClaim:
            claimName: docker-storage
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 2592000 # 30 days
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
