apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-sandbox
  namespace: flux-system
spec:
  retries: 0
  interval: 10m
  path: ./cluster/k8s/openclaw-sandbox
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-gateway-namespace
