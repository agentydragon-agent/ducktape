apiVersion: v1
kind: Service
metadata:
  name: node-runner
  namespace: openclaw-sandbox
spec:
  selector:
    app: node-runner
  ports:
    - name: docker-api
      port: 2375
      targetPort: 2375
      protocol: TCP
  # ClusterIP: reachable only within the cluster; Cilium CNP restricts callers.
  type: ClusterIP
