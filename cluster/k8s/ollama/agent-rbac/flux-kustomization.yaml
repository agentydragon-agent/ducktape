apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for ollama namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/ollama/agent-rbac
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: ollama-namespace
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
