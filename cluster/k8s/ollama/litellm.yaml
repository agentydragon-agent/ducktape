apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: litellm
  namespace: ollama
spec:
  type: oci
  url: oci://ghcr.io/berriai
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ollama
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: litellm-helm
      version: 1.82.0-stable.patch5
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: ollama
  values:
    image:
      tag: main-stable
    proxy_config:
      model_list:
        - model_name: gpt-oss-20b-128k
          litellm_params:
            model: openai/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-256k
          litellm_params:
            model: openai/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434/v1
            extra_body:
              options:
                num_ctx: 262144
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-512k
          litellm_params:
            model: openai/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434/v1
            extra_body:
              options:
                num_ctx: 524288
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-1m
          litellm_params:
            model: openai/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434/v1
            extra_body:
              options:
                num_ctx: 1048576
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-128k-native
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-256k-native
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
            extra_body:
              options:
                num_ctx: 262144
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-512k-native
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
            extra_body:
              options:
                num_ctx: 524288
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-20b-1m-native
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
            extra_body:
              options:
                num_ctx: 1048576
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-120b-128k
          litellm_params:
            model: openai/gpt-oss:120b
            api_base: http://ollama.ollama.svc.cluster.local:11434/v1
          model_info:
            mode: chat
            supports_function_calling: true
        - model_name: gpt-oss-120b-128k-native
          litellm_params:
            model: ollama/gpt-oss:120b
            api_base: http://ollama.ollama.svc.cluster.local:11434
          model_info:
            mode: chat
            supports_function_calling: true
      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
      litellm_settings:
        drop_params: true
        success_callback:
          - langfuse
      environment_variables:
        LANGFUSE_HOST: http://langfuse-web.langfuse.svc.cluster.local:3000
    masterkeySecretName: ollama-api-key
    masterkeySecretKey: api-key
    environmentSecrets:
      - langfuse-api-keys
    db:
      deployStandalone: false
    migrationJob:
      enabled: false
