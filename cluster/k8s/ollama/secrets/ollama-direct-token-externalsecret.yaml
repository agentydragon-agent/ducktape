apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ollama-direct-token
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "claude-sandbox,openclaw-sandbox"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "claude-sandbox,openclaw-sandbox"
  data:
    - secretKey: token
      remoteRef:
        key: kv/ollama/direct-api-token
        property: token
