apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: openhands
  labels:
    app.kubernetes.io/name: openhands
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands
    spec:
      # Entrypoint requires root to set up sandbox user; SANDBOX_USER_ID=0
      # skips the docker-socket setup path in entrypoint.sh.
      securityContext:
        runAsUser: 0
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      containers:
        - name: openhands
          image: ghcr.io/all-hands-ai/openhands:main
          ports:
            - containerPort: 3000
              name: http
          env:
            # Podman socket from wyrm2 host is mounted at /var/run/docker.sock.
            # OpenHands defaults to Docker runtime; Podman's REST API is compatible.
            # Persistence: SQLite DB + settings/keys stored here.
            - name: OH_PERSISTENCE_DIR
              value: /.openhands
            - name: FILE_STORE_PATH
              value: /.openhands
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: JWT_SECRET
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: ZAI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: OPENAI_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: GITHUB_TOKEN
            # Ollama: in-cluster, no key needed. Add more LLM providers here as env vars.
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama:11434
          volumeMounts:
            - name: data
              mountPath: /.openhands
            - name: podman-socket
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/options
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/options
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openhands-data
        - name: podman-socket
          hostPath:
            path: /run/podman/podman.sock
            type: Socket
