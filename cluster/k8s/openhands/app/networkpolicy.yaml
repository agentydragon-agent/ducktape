apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openhands-ingress
  namespace: openhands
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openhands
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              goauthentik.io/outpost-name: shared-proxy-outpost
      ports:
        - port: 3000
          protocol: TCP
