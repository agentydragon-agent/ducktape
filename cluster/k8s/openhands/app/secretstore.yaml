apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openhands-local
  namespace: openhands
spec:
  provider:
    kubernetes:
      remoteNamespace: openhands
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-openhands-reader
