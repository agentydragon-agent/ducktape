apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhands-settings-json
  namespace: openhands
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openhands-local
    kind: SecretStore
  target:
    name: openhands-settings-json
    creationPolicy: Owner
    template:
      data:
        settings.json: |
          {"agent_settings":{"llm":{"model":"anthropic/claude-sonnet-4-5","api_key":"{{ .zaiApiKey }}","base_url":"https://api.z.ai/api/anthropic"}}}
  data:
    - secretKey: zaiApiKey
      remoteRef:
        key: openhands-secrets
        property: ZAI_API_KEY
