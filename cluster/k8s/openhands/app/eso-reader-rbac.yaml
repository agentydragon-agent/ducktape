apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openhands-reader
  namespace: openhands
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-openhands-reader
  namespace: openhands
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openhands-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-openhands-reader
  namespace: openhands
subjects:
  - kind: ServiceAccount
    name: eso-openhands-reader
roleRef:
  kind: Role
  name: eso-openhands-reader
  apiGroup: rbac.authorization.k8s.io
