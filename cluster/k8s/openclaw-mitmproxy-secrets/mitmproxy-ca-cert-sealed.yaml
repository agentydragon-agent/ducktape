apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mitmproxy-ca-cert
  namespace: openclaw-mitmproxy
spec:
  template:
    metadata:
      name: mitmproxy-ca-cert
      namespace: openclaw-mitmproxy
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "openclaw,claude-sandbox,openclaw-sandbox"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "openclaw,claude-sandbox,openclaw-sandbox"
  encryptedData:
    mitmproxy-ca-cert.pem: 
