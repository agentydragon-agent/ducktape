# Diagnostic history is expendable. Deviation: single-instance OVH storage, like the
# experimental trajectory store; this is not a lossless audit or an HA database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agentplane-egress-db
  namespace: agentplane-testing
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  probes:
    liveness:
      isolationCheck:
        enabled: false
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  storage:
    storageClass: local-path-ovh-hdd
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: agentplane_egress
      owner: agentplane_egress
