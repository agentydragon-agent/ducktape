apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-action-federation
  namespace: agentplane-testing
  annotations:
    description: Direct Dex operator federation pins for the isolated testing Action Service.
data:
  action-federation: |
    {
      "mode": "direct",
      "service_url": "http://agentplane-actions.agentplane-testing.svc.cluster.local:8080",
      "login_jwks_uri": "https://agentplane-dex-testing.allegedly.works/keys",
      "target": {
        "issuer": "https://agentplane-dex-testing.allegedly.works",
        "audience": "agentplane-testing",
        "jwks_uri": "https://agentplane-dex-testing.allegedly.works/keys",
        "subjects": ["test-subject"]
      },
      "subject_mapping": {
        "test-subject": "test-subject"
      },
      "scope": "openid"
    }
  operator-oidc: |
    {
      "issuer": "https://agentplane-dex-testing.allegedly.works",
      "audience": "agentplane-testing",
      "jwks_uri": "https://agentplane-dex-testing.allegedly.works/keys",
      "subjects": ["test-subject"]
    }
