apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-mcp-everything
  namespace: ducktape-flux
  annotations:
    description: Upstream Everything MCP server for testing acceptance.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/mcp-everything
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
