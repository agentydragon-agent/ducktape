# Generate the disposable Dex acceptance password in-cluster. The source config remains
# SOPS-encrypted for the non-password client settings; ESO replaces only its static-user hash.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-dex-operator-password
  namespace: agentplane-testing
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# ESO's Kubernetes provider reads only the renamed SOPS source Secret. The generated targets
# remain the interfaces consumed by Dex and the manual acceptance suite.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-testing-dex-secret-reader
  namespace: agentplane-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-testing-dex-secret-reader
  namespace: agentplane-testing
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - agentplane-testing-dex-config
      - agentplane-testing-acceptance-operator
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-testing-dex-secret-reader
  namespace: agentplane-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-testing-dex-secret-reader
subjects:
  - kind: ServiceAccount
    name: agentplane-testing-dex-secret-reader
    namespace: agentplane-testing
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: agentplane-testing-dex-secret-reader
          namespace: agentplane-testing
      remoteNamespace: agentplane-testing
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
  annotations:
    description: Renders the SOPS Dex config with an ESO-generated acceptance password hash.
spec:
  refreshInterval: 8760h
  secretStoreRef:
    kind: SecretStore
    name: agentplane-testing-dex
  target:
    name: agentplane-testing-dex
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        config.yaml: |
          {{- $hash := htpasswd "test-user" .password "bcrypt" | regexReplaceAll "^test-user:" "" -}}
          {{- $config := regexReplaceAll "(?m)^([[:space:]]*)secret:[[:space:]]*.*$" "${1}secretEnv: DEX_CLIENT_SECRET" .dex_config -}}
          {{- regexReplaceAll "(?m)^([[:space:]]*hash:[[:space:]]*).*$" (printf "${1}%q" $hash) $config -}}
  data:
    - secretKey: dex_config
      remoteRef:
        key: agentplane-testing-dex-config
        property: config.yaml
    - secretKey: password
      remoteRef:
        key: agentplane-testing-acceptance-operator
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-testing-acceptance-operator
  namespace: agentplane-testing
  annotations:
    description: ESO-generated disposable Dex credentials for manual Agentplane acceptance.
spec:
  refreshInterval: 8760h
  secretStoreRef:
    kind: SecretStore
    name: agentplane-testing-dex
  target:
    name: agentplane-testing-acceptance-operator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
      data:
        username: "test-user"
        password: "{{ .password }}"
        issuer: "https://agentplane-dex-testing.allegedly.works/dex"
        subject: "test-subject"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-testing-dex-operator-password
