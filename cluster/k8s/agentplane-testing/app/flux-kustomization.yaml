apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-app
  namespace: ducktape-flux
  annotations:
    description: Agentplane integration app (Deployment, Service, RBAC) and the runner SandboxTemplate (runner + egress sidecar) + Cilium fences in agentplane-testing; the app stamps one standalone Sandbox per sandbox from the template; no claims or warm pool.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-actions # destination verifier ready before the BFF
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: agent-sandbox-controller # CRDs + controller
      namespace: ducktape-flux
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    - name: agentplane-testing-db # the app composes its database URL from the CNPG app Secret
      namespace: ducktape-flux
    - name: forgejo-images # reflects the runner image's pull credential
      namespace: ducktape-flux
    - name: litellm-keys-tf # writes the standing cheap-experiments key copy
      namespace: ducktape-flux
    - name: agentplane-testing-egress # the proxy the sidecar relays to and the CA bundle the runner mounts
      namespace: ducktape-flux
    - name: gateway # the HTTPRoute's parent
      namespace: ducktape-flux
    # TF mints the OAuth2 provider and the agentplane-oidc Secret; reflector mirrors it into this
    # namespace. The Deployment reads three keys out of it, so without both the pod does not start.
    - name: agentplane-testing-dex
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
