apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-egress-migrations
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/egress-migrations
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-egress-db
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
