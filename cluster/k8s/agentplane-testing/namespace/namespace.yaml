apiVersion: v1
kind: Namespace
metadata:
  name: agentplane-testing
  labels:
    name: agentplane-testing
    # Runner Pods are Sandbox-owned, not Deployments; nothing here is VPA-managed.
    goldilocks.fairwinds.com/enabled: "false"
    # Standing agent access to metadata and logs (Kyverno-generated bindings);
    # write access lives in ../agent-rbac.
    rbac.ducktape.io/agent-readable-logs: "true"
  annotations:
    description: Agentplane testing - sandboxed runner Pods (one per Sandbox) and the integration app that drives them.
