apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gaffer-private
  namespace: flux-system
  annotations:
    description: "Cross-repo bridge. Reconciles gaffer-private/k8s/ from the gaffer-private GitRepository — entry point for every private app's flux-kustomization.yaml."
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gaffer-private
  path: ./k8s
  prune: true
  wait: true
  dependsOn:
    - name: authentik
    - name: gateway
    - name: cert-manager-issuer-config
