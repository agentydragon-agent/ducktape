# Cluster-internal MCP backend. Only haku-console and Agentplane staging are callers; SSH egress is
# deliberately constrained by the target network policy once rugged/wyrm2 addresses are pinned.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-ssh-mcp
  namespace: agentplane-ssh-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-ssh-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-actions
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            app.kubernetes.io/name: haku-console
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # TODO: replace this temporary host egress with exact rugged/wyrm2 destinations
    # when their routable addresses are recorded in the deployment contract.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
