# HTTPRoute for FileBrowser via Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth) -> filebrowser backend.
# The outpost service (ak-outpost-filebrowser-outpost) is auto-created by Authentik
# when the blueprint deploys the outpost.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "files.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-filebrowser-outpost
          port: 9000
