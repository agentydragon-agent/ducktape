# HTTPRoute for Loki via Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → loki-stack backend.
# The outpost service (ak-outpost-loki-outpost) is auto-created by Authentik
# when the blueprint deploys the outpost.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "loki.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-loki-outpost
          port: 9000
