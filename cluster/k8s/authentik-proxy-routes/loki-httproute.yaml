# HTTPRoute for Loki via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → loki-stack backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "loki.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
