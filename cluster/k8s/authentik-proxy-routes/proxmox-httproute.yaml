# HTTPRoute for Proxmox via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → proxmox-proxy nginx → atlas:8006.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "atlas.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-shared-proxy-outpost
          port: 9000
