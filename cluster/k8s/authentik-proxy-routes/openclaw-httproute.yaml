# HTTPRoute for OpenClaw via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → OpenClaw backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "openclaw.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-shared-proxy-outpost
          port: 9000
      timeouts:
        request: "600s"
        backendRequest: "600s"
