# HTTPRoute for Hubble UI via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → hubble-ui backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "hubble.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-shared-proxy-outpost
          port: 9000
