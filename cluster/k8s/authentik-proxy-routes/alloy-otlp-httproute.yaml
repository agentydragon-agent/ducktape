# HTTPRoute for Alloy OTLP via Authentik proxy outpost.
# Traffic flows: external client → Gateway → outpost (Bearer token auth) → Alloy :4318.
# The outpost service (ak-outpost-alloy-otlp-outpost) is auto-created by Authentik
# when the blueprint in cluster/k8s/authentik/blueprints/alloy-otlp-sso.yaml deploys.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-otlp
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "alloy-otlp.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-alloy-otlp-outpost
          port: 9000
