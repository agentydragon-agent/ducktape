# HTTPRoute for OAuth Broker via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → oauth-broker backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-broker
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "oauth-broker.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
