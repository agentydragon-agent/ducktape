# HTTPRoute for Grocy via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → grocy backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "grocy.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
