# HTTPRoute for Gatus via Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth) -> gatus backend.
# The outpost service (ak-outpost-gatus-outpost) is auto-created by Authentik
# when the blueprint deploys the outpost.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "status.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-gatus-outpost
          port: 9000
