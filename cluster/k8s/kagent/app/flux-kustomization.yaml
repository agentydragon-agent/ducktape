apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  path: ./cluster/k8s/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kagent
      namespace: kagent
  dependsOn:
    - name: kagent-namespace
    - name: kagent-secrets
    - name: gateway
    - name: cert-manager-environment
    - name: authentik # Wait for Authentik worker to apply SSO blueprints
