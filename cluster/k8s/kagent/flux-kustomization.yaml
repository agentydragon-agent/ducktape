apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/kagent
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  dependsOn:
    - name: cert-manager-issuer-config
    - name: kagent-namespace
    - name: kagent-secrets
    - name: gateway
    - name: cert-manager-environment
    - name: authentik-blueprint-kagent # SSO configuration and outpost
