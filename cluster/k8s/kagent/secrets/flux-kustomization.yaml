apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/kagent/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kagent-namespace
    - name: external-secrets-config
