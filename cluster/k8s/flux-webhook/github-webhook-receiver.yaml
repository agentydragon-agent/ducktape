---
# Flux Receiver: GitHub push to devel → immediate GitRepository reconciliation
#
# When GitHub sends a push webhook for the devel branch, Flux immediately
# reconciles the flux-system GitRepository instead of waiting for the 1-minute
# poll interval.
#
# The webhook is auto-configured by terraform/gitops/harbor-ci (github_repository_webhook).
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  events:
    - push
  secretRef:
    name: github-webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
      namespace: flux-system
