apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/flux-webhook
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: flux-webhook-token
      namespace: flux-system
    - name: gateway
      namespace: ducktape-flux
