apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-user-password
  namespace: agentydragon
  annotations:
    description: Atuin shell history sync credentials
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: atuin-user-password
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "atuin"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "atuin"
  data:
    - secretKey: username
      remoteRef:
        key: kv/atuin/user
        property: username
    - secretKey: user_password
      remoteRef:
        key: kv/atuin/user
        property: user_password
