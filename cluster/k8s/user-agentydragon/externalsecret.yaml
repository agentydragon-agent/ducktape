apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentydragon-user-password
  namespace: agentydragon
  annotations:
    description: Authentik password for agentydragon@gmail.com user (declaratively configured)
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentydragon-user-password
    creationPolicy: Owner
  data:
    - secretKey: user_password
      remoteRef:
        key: users/agentydragon
        property: user_password
