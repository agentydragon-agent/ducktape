apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scanner
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/scanner
  prune: true
  wait: true
  dependsOn:
    - name: scanner-namespace
    - name: proxmox-csi
    - name: sealed-secrets
