---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.20.0
          args:
            - --source=ingress
            - --source=gateway-httproute
            - --source=gateway-tlsroute
            - --provider=pdns
            - --pdns-server=http://powerdns-api.dns-system:8081
            - --pdns-api-key=$(PDNS_API_KEY)
            - --domain-filter=allegedly.works
            - --txt-owner-id=external-dns
            - --log-level=debug
            - --interval=30s
            # Both Hetzner VPS IPs for DNS failover (ingress runs on both via hostNetwork)
            # IPs read from cluster-info ConfigMap (populated by infrastructure terraform)
            - --default-targets=$(VPS_IP_0)
            - --default-targets=$(VPS_IP_1)
            # Required since external-dns v0.15+: without this, ingress ClusterIP
            # overrides default-targets, creating internal A records in public DNS
            - --force-default-targets
          env:
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-api-key # Reflector will copy from dns-system
                  key: powerdns_api_key
            - name: VPS_IP_0
              valueFrom:
                configMapKeyRef:
                  name: cluster-info # Reflector copies from kube-system
                  key: vps_ip_vps0
            - name: VPS_IP_1
              valueFrom:
                configMapKeyRef:
                  name: cluster-info # Reflector copies from kube-system
                  key: vps_ip_vps1
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
