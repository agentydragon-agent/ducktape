apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/external-dns"
  prune: true
  wait: true
  # Health check ensures ExternalDNS is ready to manage records
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-dns
      namespace: external-dns
  dependsOn:
    - name: reflector
      namespace: flux-system
    - name: powerdns
      namespace: flux-system
    - name: powerdns-zone
      namespace: flux-system
