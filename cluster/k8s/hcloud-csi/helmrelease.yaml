---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hcloud
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.hetzner.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: hcloud-csi
      version: "2.19.1"
      sourceRef:
        kind: HelmRepository
        name: hcloud
        namespace: flux-system
  values:
    storageClasses:
      - name: hcloud-volumes
        defaultStorageClass: false
        reclaimPolicy: Retain
    # Pin to Hetzner Cloud nodes only — the driver talks to the hcloud API
    # with node IDs that don't exist for OVH. Hetzner VPS get zone=`hil-dc1`
    # from Talos CCM; kimsufi gets zone=`hil-ovh` (explicit node label).
    # This chart is retained only for cleanup of old hcloud-volumes state; all
    # active Talos nodes have moved off Hetzner Cloud.
    #
    # TODO: remove this chart entirely. No active workloads use hcloud-volumes
    # (the only PV is `tana-mcp/tana-mcp-config`, Released). Also clean up the
    # 4 orphaned 10Gi volumes in Hetzner (hcloud volume list) and drop
    # `cluster/terraform/main/hetzner-csi.tf` (the API-token secret).
    controller:
      nodeSelector:
        topology.kubernetes.io/zone: hil-dc1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    node:
      nodeSelector:
        topology.kubernetes.io/zone: hil-dc1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
