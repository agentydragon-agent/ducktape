---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hcloud
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.hetzner.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: hcloud-csi
      version: "2.19.1"
      sourceRef:
        kind: HelmRepository
        name: hcloud
        namespace: flux-system
  values:
    storageClasses:
      - name: hcloud-volumes
        defaultStorageClass: false
        reclaimPolicy: Retain
    controller:
      nodeSelector:
        topology.kubernetes.io/region: hetzner
    node:
      nodeSelector:
        topology.kubernetes.io/region: hetzner
