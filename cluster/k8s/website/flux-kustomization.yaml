apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/website
  prune: true
  wait: true
  dependsOn:
    # TLS is owned by the shared Gateway; Website only supplies an HTTPRoute.
    - name: gateway
      namespace: flux-system
