apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: talos-ccm
  namespace: kube-system
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/siderolabs/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: talos-cloud-controller-manager
      sourceRef:
        kind: HelmRepository
        name: talos-ccm
        namespace: kube-system
  values:
    enabledControllers:
      - cloud-node
      - cloud-node-lifecycle
      - node-csr-approval
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node.cloudprovider.kubernetes.io/uninitialized
        operator: Exists
        effect: NoSchedule
    transformations:
      - name: hcloud-nodes
        nodeSelector:
          - matchExpressions:
              - key: "topology.kubernetes.io/region"
                operator: In
                values: ["hetzner"]
        features:
          publicIPDiscovery: true
