apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-backend
  namespace: approval-gate
  labels:
    app: approval-gate
    component: exec-backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approval-gate
      component: exec-backend
  template:
    metadata:
      labels:
        app: approval-gate
        component: exec-backend
    spec:
      containers:
        - name: exec-backend
          image: registry.allegedly.works/approval-gate/exec-backend:latest # {"$imagepolicy": "flux-system:approval-gate-exec-backend"}
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8766
              protocol: TCP
          # Mount privileged credentials here, not in the approval gate pod.
          # The approval gate holds no secrets beyond its own API keys.
          # Add secretKeyRef entries here for any backend credentials needed.
          env: []
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 5
            periodSeconds: 10
