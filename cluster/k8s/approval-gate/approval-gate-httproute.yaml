# HTTPRoute for the approval gate operator UI via Authentik proxy outpost.
# The operator UI is protected by Authentik authentication.
# Agent MCP traffic on /mcp uses bearer token auth and does NOT go through
# Authentik (agents cannot log in via Authentik SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: approval-gate
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "approval-gate.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-shared-proxy-outpost
          port: 9000
      timeouts:
        request: "120s"
        backendRequest: "120s"
