apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: approval-gate-secrets
  namespace: approval-gate
spec:
  refreshInterval: 8760h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: approval-gate-secrets
  data:
    - secretKey: agent-api-key
      remoteRef:
        key: kv/approval-gate
        property: agent-api-key
    - secretKey: operator-api-key
      remoteRef:
        key: kv/approval-gate
        property: operator-api-key
