apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runners
  namespace: arc-runners
spec:
  interval: 15m
  timeout: 10m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  values:
    githubConfigUrl: https://github.com/agentydragon/ducktape
    githubConfigSecret: github-app
    minRunners: 1
    maxRunners: 5
    runnerScaleSetName: ducktape-runners
    # controllerServiceAccount must match the service account created by the
    # arc-controller HelmRelease. Default: <release-name>-gha-rs-controller.
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller-gha-rs-controller
    template:
      spec:
        nodeSelector:
          topology.kubernetes.io/region: proxmox
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            resources:
              requests:
                memory: 8Gi
                cpu: "2"
              limits:
                memory: 8Gi
                cpu: "8"
