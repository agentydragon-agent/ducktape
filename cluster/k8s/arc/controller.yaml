apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  interval: 15m
  timeout: 10m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  values:
    replicaCount: 1
    nodeSelector:
      topology.kubernetes.io/region: proxmox
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
