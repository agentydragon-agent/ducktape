apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-arc-webhook-ingress
  namespace: arc-systems
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
  ingress:
    - ports:
        - port: 9292
          protocol: TCP
  policyTypes:
    - Ingress
