apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: minio
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
      interval: 12h
  values:
    mode: distributed
    replicas: 4
    drivesPerNode: 1

    existingSecret: minio-credentials

    persistence:
      enabled: true
      storageClass: local-path
      size: 40Gi
      accessMode: ReadWriteOnce

    buckets:
      - name: loki
      - name: tempo

    nodeSelector:
      topology.kubernetes.io/region: hil

    # Spread across VPS nodes; CP nodes have control-plane taint
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: minio

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
