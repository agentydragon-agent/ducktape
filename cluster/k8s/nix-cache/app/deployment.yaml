apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: nix-cache
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # CRITICAL: RWO volume deadlock prevention
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: attic
          # TODO: Pin to a versioned tag once attic publishes semver releases.
          image: ghcr.io/zhaofengli/attic:latest
          imagePullPolicy: Always
          # runAsUser/runAsGroup removed: containerd UserFromFS reads
          # /etc/passwd via os.DirFS which rejects NixOS absolute symlinks
          # on Go 1.24+ (containerd #12683, fix not in v2.2.2).
          # Attic image runs as uid 0 by default; fsGroup 1000 on pod
          # securityContext still applies to volume ownership.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ATTIC_SERVER_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: attic-db-app
                  key: uri
            - name: ATTIC_SERVER_JWT__SIGNING__TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: attic-jwt-token
                  key: jwt-token
          args:
            - "-f"
            - "/config/server.toml"
            - "--mode"
            - "monolithic"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: signing-key
              mountPath: /var/lib/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: attic-config
        - name: cache
          persistentVolumeClaim:
            claimName: attic-cache
        - name: tmp
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: nix-cache-signing-key
