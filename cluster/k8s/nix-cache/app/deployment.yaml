apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: nix-cache
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # CRITICAL: RWO volume deadlock prevention
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      # TODO: Move attic pod to wyrm2/proxmox once containerd 2.2.3+ (with
      # PR #12732 fix) ships in NixOS nixpkgs (currently 2.2.1). NixOS nodes
      # reject NixOS images' absolute /etc/passwd symlink. Until then, pin to
      # VPS so pod + DB + cache PVC are co-located. See also:
      # cluster/k8s/nix-cache/db/postgres-cluster.yaml (DB pinned to VPS too).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/system-os_release.ID
                    operator: NotIn
                    values:
                      - nixos
      securityContext:
        fsGroup: 1000
      containers:
        - name: attic
          # TODO: Pin to a versioned tag once attic publishes semver releases.
          image: ghcr.io/zhaofengli/attic:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: attic-db-app
                  key: uri
            - name: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: attic-jwt-token
                  key: jwt-token
          args:
            - "-f"
            - "/config/server.toml"
            - "--mode"
            - "monolithic"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: signing-key
              mountPath: /var/lib/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: attic-config
        - name: cache
          persistentVolumeClaim:
            claimName: attic-cache
        - name: tmp
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: nix-cache-signing-key
