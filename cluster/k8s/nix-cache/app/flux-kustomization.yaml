apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/nix-cache/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: attic
      namespace: nix-cache
  dependsOn:
    - name: attic-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: flux-system
