apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - signing-key-sealed.yaml # Generated by terraform/main
  - jwt-token-sealed.yaml # Generated by terraform/main
  - pvcs.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

configMapGenerator:
  - name: attic-config
    namespace: nix-cache
    files:
      - server.toml
