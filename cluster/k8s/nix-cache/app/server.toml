listen = "[::]:8080"

[storage]
type = "local"
path = "/cache"

# database.url injected via ATTIC_SERVER_DATABASE__URL from attic-db-app secret

[compression]
type = "zstd"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[garbage-collection]
interval = "12 hours"

# jwt.signing.token-hs256-secret-base64 injected via
# ATTIC_SERVER_JWT__SIGNING__TOKEN_HS256_SECRET_BASE64 from attic-jwt-token secret
