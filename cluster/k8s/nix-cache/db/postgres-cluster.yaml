apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  # Migration step 1: 2 instances to create VPS replica before switchover.
  # After switchover + verification, set back to 1 and pin to hetzner.
  instances: 2

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  # Temporarily allow both regions so replica can be created on VPS
  # while primary is still on proxmox.

  storage:
    storageClass: longhorn
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: attic
      owner: attic
      # CNPG auto-generates credentials in secret attic-db-app
