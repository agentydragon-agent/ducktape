apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  instances: 1

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/region: proxmox

  storage:
    storageClass: local-path
    size: 2Gi

  monitoring:
    # TODO: Migrate to manually managed PodMonitor (enablePodMonitor is deprecated).
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: attic
      owner: attic
      # CNPG auto-generates credentials in secret attic-db-app
