apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  instances: 1

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  # TODO: Move DB to wyrm2/proxmox once attic pod can run there (blocked on
  # containerd 2.2.3+ in NixOS nixpkgs, currently 2.2.1). Pinned to VPS so
  # pod + DB + cache PVC are co-located. See also:
  # cluster/k8s/nix-cache/app/deployment.yaml (pod pinned to VPS too).
  affinity:
    nodeSelector:
      topology.kubernetes.io/region: hetzner

  storage:
    storageClass: local-path
    size: 2Gi

  monitoring:
    # TODO: Migrate to manually managed PodMonitor (enablePodMonitor is deprecated).
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: attic
      owner: attic
      # CNPG auto-generates credentials in secret attic-db-app
