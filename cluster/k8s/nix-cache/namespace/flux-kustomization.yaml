apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache-namespace
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/nix-cache/namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
