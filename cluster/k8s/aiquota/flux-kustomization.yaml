apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aiquota
  namespace: ducktape-flux
  annotations:
    description: Claude-only aiquota API; Codex PVC integration is deliberately deferred.
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/aiquota
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    # Provides the shared namespace. aiquota does not mount its PVC in this
    # initial Claude-only release.
    - name: cli-proxy-api
      namespace: ducktape-flux
    - name: haku-egress-proxy
      namespace: ducktape-flux
