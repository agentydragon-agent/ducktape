# Copy the one AIQuota API bearer into a reflector-owned Secret. The source is
# the SOPS-managed API Secret above; this does not mint a second credential.
#
# The narrower mirror avoids granting public-coder-agent access to the broad
# Kubernetes SecretStore for the cli-proxy-api namespace. In the destination
# namespace only the trusted egress proxy consumes this Secret; the OpenClaw
# workload receives a non-secret placeholder instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiquota-api-bearer-public-coder
  namespace: cli-proxy-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-cli-proxy-api-secret-store
  target:
    name: aiquota-api-bearer-public-coder
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          description: Shared AIQuota API bearer mirrored only to public-coder-agent's trusted egress proxy.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
  data:
    - secretKey: bearer-token
      remoteRef:
        key: aiquota-api-bearer
        property: bearer-token
