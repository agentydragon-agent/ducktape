apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-db-password
  namespace: props
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: props-postgresql
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: kv/props/secrets
        property: postgres_password
