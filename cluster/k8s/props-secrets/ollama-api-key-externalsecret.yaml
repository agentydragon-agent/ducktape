apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-ollama-api-key
  namespace: props
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: props-ollama-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kv/ollama/api-key
        property: api_key
