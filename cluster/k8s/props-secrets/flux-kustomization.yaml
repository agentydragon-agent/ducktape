apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/props-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: props-namespace
    - name: sealed-secrets
    - name: external-secrets-config
