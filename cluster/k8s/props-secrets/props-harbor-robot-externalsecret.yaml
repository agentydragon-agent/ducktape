---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-harbor-robot
  namespace: props
  annotations:
    description: Harbor robot account for props backend proxy (push/pull to registry.allegedly.works/props)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: props-harbor-robot
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"registry.allegedly.works":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: kv/harbor/props-robot
        property: username
    - secretKey: password
      remoteRef:
        key: kv/harbor/props-robot
        property: password
