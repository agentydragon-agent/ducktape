apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp-namespace
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/headlamp-namespace"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: headlamp
