apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-matrix-secret
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/authentik-blueprint/matrix-secret"
  prune: true
  wait: true
  # Health check ensures OIDC secret is synced from Vault for Matrix SSO
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: matrix-oauth-client-secret
      namespace: matrix
  dependsOn:
    - name: matrix # Wait for Matrix namespace to be created
      namespace: flux-system
    - name: authentik-blueprint-matrix-provider # Wait for provider to be created
      namespace: flux-system
