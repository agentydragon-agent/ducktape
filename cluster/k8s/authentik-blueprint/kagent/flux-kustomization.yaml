apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-kagent
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/authentik-blueprint/kagent
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tofu-controller
    - name: authentik-token
    - name: authentik-blueprint-users
