apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: authentik-blueprint-harbor
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/terraform/gitops/sso/harbor
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  # Use in-cluster service account
  serviceAccountName: tf-runner
  approvePlan: "auto"

  # Store Terraform state in Kubernetes secret
  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix    = "authentik-blueprint-harbor"
        namespace        = "flux-system"
      }

  # Variables for Terraform
  vars:
    - name: authentik_url
      value: "http://authentik-server.authentik:80"
    - name: harbor_url
      value: "https://registry.allegedly.works"
    - name: vault_address
      value: "http://instance.vault.svc.cluster.local:8200"

  # Get secrets from Kubernetes secrets
  varsFrom:
    - kind: Secret
      name: authentik-api-token
      varsKeys:
        - authentik_token
      optional: false
    - kind: Secret
      name: vault-token
      varsKeys:
        - vault_token
      optional: false

  # Note: harbor_admin_password is read directly via kubernetes_secret data source
  # from harbor/harbor-admin-initial (see terraform/gitops/sso/harbor/harbor-config.tf)
