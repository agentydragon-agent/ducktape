apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-harbor-secret
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/authentik-blueprint/harbor-secret"
  prune: true
  wait: true
  # Health check ensures OIDC secret is synced from Vault before Harbor uses SSO
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: harbor-oauth-client-secret
      namespace: harbor
  dependsOn:
    - name: harbor # Wait for Harbor namespace and app
      namespace: flux-system
    - name: authentik-blueprint-harbor-provider # Wait for provider to be created
      namespace: flux-system
