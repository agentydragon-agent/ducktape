apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-vault
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/authentik-blueprint/vault
  prune: true
  wait: true
  # Health check ensures Terraform has configured Vault OIDC auth in Authentik
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: authentik-blueprint-vault
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
    - name: authentik # Wait for Authentik API to be ready before creating OAuth apps
      namespace: flux-system
    - name: vault
      namespace: flux-system
    - name: external-secrets-config
      namespace: flux-system
    - name: reflector
      namespace: flux-system
    - name: vault-token
      namespace: flux-system
