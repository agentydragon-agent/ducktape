apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-gitea-provider
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/authentik-blueprint/gitea-provider"
  prune: true
  wait: true
  # Health check ensures Terraform has created the Gitea OIDC provider in Authentik
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: authentik-blueprint-gitea
      namespace: flux-system
  dependsOn:
    - name: core # Wait for tofu-controller to install Terraform CRD
      namespace: flux-system
    - name: authentik # Wait for authentik to be ready
      namespace: flux-system
    - name: vault-token # Wait for Vault authentication
      namespace: flux-system
