# HTTPRoute for Hubble UI via Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → hubble-ui backend.
# The outpost service (ak-outpost-hubble-outpost) is auto-created by Authentik
# in the authentik namespace when the Terraform module deploys the outpost.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "hubble.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-hubble-outpost
          port: 9000
