apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: sso-secrets
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/terraform/gitops/sso-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix    = "sso-secrets"
        namespace        = "flux-system"
      }

  vars:
    - name: vault_address
      value: "http://instance.vault.svc.cluster.local:8200"
