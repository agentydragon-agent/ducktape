apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-headlamp-secret
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/authentik-blueprint/headlamp-secret"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: headlamp-oidc-secret
      namespace: headlamp
  dependsOn:
    - name: headlamp-namespace
    - name: external-secrets-config
    - name: authentik-blueprint-sso-secrets
