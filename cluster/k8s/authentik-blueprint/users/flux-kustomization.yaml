apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-blueprint-users
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: "./cluster/k8s/authentik-blueprint/users"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: user-passwords
      namespace: flux-system
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: authentik-blueprint-users
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
    - name: authentik
    - name: external-secrets-config
    - name: vault-token
