# User password - reads stable value from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentydragon-user-password
  namespace: flux-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentydragon-user-password
    creationPolicy: Owner
  data:
    - secretKey: user_password
      remoteRef:
        key: kv/users/agentydragon
        property: user_password
