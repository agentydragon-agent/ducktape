---
# ExternalSecret for Headscale OIDC client secret from Vault.
# Raw client_secret consumed by Deployment env var HEADSCALE_OIDC_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc-client-secret
  namespace: headscale
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: headscale-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: sso/headscale
        property: client_secret
