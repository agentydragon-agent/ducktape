apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-api-proxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/kube-api-proxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  dependsOn:
    - name: cert-manager
    - name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: kube-api-proxy
      namespace: kube-api-proxy
