---
apiVersion: batch/v1
kind: Job
metadata:
  name: tailscale-authkey-bootstrap
  namespace: headscale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: "false"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: tailscale-authkey-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: tailscale-authkey-bootstrap
      containers:
        - name: bootstrap
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: tailscale-authkey-bootstrap-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-authkey-bootstrap
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-authkey-bootstrap
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-authkey-bootstrap
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: tailscale-authkey-bootstrap
    namespace: headscale
roleRef:
  kind: Role
  name: tailscale-authkey-bootstrap
  apiGroup: rbac.authorization.k8s.io
