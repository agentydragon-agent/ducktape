apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-authkey-bootstrap
  namespace: flux-system
spec:
  suspend: true # Tailscale DaemonSet conflicts with Cilium Gateway (hostNetwork routing)
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/tailscale-authkey-bootstrap"
  prune: true
  wait: true
  dependsOn:
    - name: headscale
    - name: headscale-config
