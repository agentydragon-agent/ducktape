---
# Cluster-wide Harbor pull robot credentials.
# ESO creates the source secret in flux-system; Reflector mirrors it to all
# consumer namespaces listed in the reflection-auto-namespaces annotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-robot
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-pull-robot
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "oauth-broker,tana-mcp,homeassistant-proxy,activitywatch,inventree,props,openclaw-gateway,airlock"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "oauth-broker,tana-mcp,homeassistant-proxy,activitywatch,inventree,props,openclaw-gateway,airlock"
      data:
        .dockerconfigjson: |
          {"auths":{"registry.allegedly.works":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: kv/harbor/pull-robot
        property: username
    - secretKey: password
      remoteRef:
        key: kv/harbor/pull-robot
        property: password
