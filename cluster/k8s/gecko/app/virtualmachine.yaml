apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: gecko
  namespace: gecko
  labels:
    app.kubernetes.io/name: gecko
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: gecko
        app.kubernetes.io/name: gecko
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hil
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 2Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: gecko-root
