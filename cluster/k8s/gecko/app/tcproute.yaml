# Public SSH exposure for gecko.
#
# Wildcard A `*.allegedly.works` already points at the OVH hil hostNetwork
# Envoy nodes; the `ssh-gecko` listener on cluster-gateway terminates raw TCP
# on those nodes' :22 and this TCPRoute forwards to the in-cluster
# gecko-ssh ClusterIP Service, which selects the virt-launcher pod.
#
# Trust boundary: SSH key auth on the VM. PasswordAuthentication is off in
# the base NixOS config; only keys baked into nix/nixos/hosts/bootstrap/
# default.nix are accepted.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: gecko-ssh
  namespace: gecko
  labels:
    app.kubernetes.io/name: gecko
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: ssh-gecko
  rules:
    - backendRefs:
        - name: gecko-ssh
          port: 22
