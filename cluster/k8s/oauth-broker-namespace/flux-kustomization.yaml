apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth-broker-namespace
  namespace: flux-system
spec:
  retries: 5
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/oauth-broker-namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: oauth-broker
