---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: headlamp
      version: "0.40.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
  values:
    replicaCount: 1

    config:
      # OIDC mode: Headlamp redirects to Authentik, JWT forwarded to K8s API server
      # which validates it via oidc-issuer-url (in Talos machine config).
      # Each user gets their own K8s identity (oidc:<username>).
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc-secret
      watchPlugins: true

    httpRoute:
      enabled: true
      parentRefs:
        - name: cluster-gateway
          namespace: gateway-system
      hostnames:
        - "headlamp.allegedly.works"

    ingress:
      enabled: false

    nodeSelector:
      topology.kubernetes.io/region: hetzner
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    # Prometheus plugin not on ArtifactHub — install via initContainer + shared volume.
    initContainers:
      - name: headlamp-plugin-prometheus
        image: ghcr.io/headlamp-k8s/headlamp-plugin-prometheus:latest
        command: ["/bin/sh", "-c", "cp -r /plugins/. /headlamp/plugins/"]
        volumeMounts:
          - name: plugins-dir
            mountPath: /headlamp/plugins

    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        installOptions:
          parallel: true
          maxConcurrent: 2
