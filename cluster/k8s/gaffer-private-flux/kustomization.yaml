apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # The GitHub App Secret is reflector-projected from flux-system. Do not
  # duplicate its SOPS ciphertext here: source-controller resolves secretRef
  # in this namespace, and Reflector owns that local copy.
  - gaffer-private-gitrepository.yaml
