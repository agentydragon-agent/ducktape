apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-db
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: grafana-db-ovh
      namespace: monitoring
  dependsOn:
    - name: monitoring-namespace
    - name: cnpg
