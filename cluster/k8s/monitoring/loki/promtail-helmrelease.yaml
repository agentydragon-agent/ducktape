apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: loki
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: promtail
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    config:
      clients:
        # SimpleScalable: push to the write StatefulSet's service.
        # The single-binary `loki` Service was removed when we switched
        # off SingleBinary mode.
        - url: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    tolerations:
      - effect: NoSchedule
        operator: Exists
