apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: loki
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: loki
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: loki
  secretRef:
    name: loki-s3-credentials
    namespace: loki
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
