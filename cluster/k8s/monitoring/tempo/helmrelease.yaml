apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    tempo:
      # OTLP/gRPC receiver (Alloy → Tempo).
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces

    persistence:
      enabled: true
      # CLEANUP(2026-04-02): Migrate to MinIO backend (native S3 support)
      storageClassName: longhorn
      size: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceMonitor:
      enabled: true
