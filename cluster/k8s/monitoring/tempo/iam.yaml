apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: tempo
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: tempo
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: tempo
  secretRef:
    name: tempo-s3-credentials
    namespace: monitoring
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
