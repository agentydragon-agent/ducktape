apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: flux-system
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/tempo
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tempo
      namespace: monitoring
  timeout: 5m
  dependsOn:
    - name: monitoring-stack
    - name: grafana-helmrepository
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
