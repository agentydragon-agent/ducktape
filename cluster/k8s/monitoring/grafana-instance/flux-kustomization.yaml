apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-instance
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grafana-deployment
      namespace: monitoring
  timeout: 5m
  dependsOn:
    - name: grafana-operator
    - name: grafana-db
    - name: monitoring-stack-secrets
    - name: sso-providers-tf
