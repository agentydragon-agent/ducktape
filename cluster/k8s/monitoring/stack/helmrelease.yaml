apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m # Prometheus stack upgrades can be slow
  install:
    # TODO(roaming-nodes): Roaming nodes (iguana/rugged) are often offline,
    # so DaemonSets (node-exporter) have perpetually Pending pods. Helm waits
    # for all pods to be ready, causing timeout. disableWait is a blunt
    # workaround — need a general solution for every HelmRelease with a
    # DaemonSet. Options: taint roaming nodes + add tolerations to DaemonSets
    # that should run there, or use nodeAffinity to exclude roaming entirely.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  valuesFrom:
    # Inject complete OIDC configuration from Vault (via ExternalSecret)
    # Terraform writes the full config to Vault, eliminating duplication
    # Secret structured with full nesting to avoid targetPath escaping issues
    - kind: Secret
      name: grafana-oidc-config
      valuesKey: values.yaml
  values:
    # Shorten resource names: "kube-prometheus-stack-*" → "monitoring-*"
    fullnameOverride: monitoring
    # Remove redundant "-prometheus"/"-alertmanager" suffix from CR names
    # (avoids e.g. "prometheus-monitoring-prometheus" → "prometheus-monitoring")
    cleanPrometheusOperatorObjectNames: true

    # Global settings
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: false # Talos doesn't expose etcd metrics
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubelet: true
        kubeProxy: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: false # Prometheus disabled; Mimir Ruler evaluates rules
        prometheusOperator: true

    # Alertmanager configuration
    alertmanager:
      enabled: true
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 2
        storage:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              storageClassName: local-path-hetzner
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # Chart auto-generates podAntiAffinity when replicas > 1
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        nodeSelector:
          topology.kubernetes.io/region: hil
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        retention: 120h

    # Grafana configuration
    grafana:
      fullnameOverride: grafana
      enabled: true
      # Reloader: auto-restart pods when secrets change
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Admin password: init-time only. Grafana writes it to PostgreSQL on first
      # boot (ensureMainOrgAndAdminUser in pkg/services/sqlstore/sqlstore.go bails
      # early if any user exists). Reloader restarts will NOT update the DB password.
      # To rotate: use grafana-cli admin reset-admin-password inside the pod.
      admin:
        existingSecret: grafana-admin-password
        passwordKey: admin-password
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC

      # Dashboards pulled from grafana.com on pod startup
      dashboards:
        default:
          flux-cluster:
            gnetId: 16714 # Flux Cluster Stats
            revision: 1
            datasource: Prometheus
          flux-control-plane:
            gnetId: 16715 # Flux Control Plane
            revision: 1
            datasource: Prometheus
          harbor:
            gnetId: 14075 # Harbor
            revision: 2
            datasource: Prometheus
          cert-manager:
            gnetId: 20842 # cert-manager certificates overview
            revision: 3
            datasource: Prometheus
          authentik:
            gnetId: 14837 # Authentik
            revision: 2
            datasource: Prometheus
          vault:
            gnetId: 12904 # HashiCorp Vault
            revision: 2
            datasource: Prometheus
          cloudnative-pg:
            gnetId: 20417 # CloudNativePG
            revision: 3
            datasource: Prometheus
          longhorn:
            gnetId: 16888 # Longhorn storage
            revision: 9
            datasource: Prometheus
          cilium-agent:
            gnetId: 16611 # Cilium agent metrics
            revision: 1
            datasource: Prometheus
          etcd:
            gnetId: 3070 # etcd by Prometheus
            revision: 5
            datasource: Prometheus

      # No PVC — state stored in CNPG PostgreSQL (grafana-db).
      persistence:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Enable useful plugins (no Angular plugins)
      plugins:
        - grafana-clock-panel

      # Disable the chart's built-in Prometheus datasource — we point at Mimir instead.
      sidecar:
        datasources:
          defaultDatasourceEnabled: false

      additionalDataSources:
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
          isDefault: true
          editable: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            maxLines: 1000
          isDefault: false
          editable: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3100
          jsonData:
            httpMethod: GET
            # Link traces to Loki logs by trace/span ID.
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              filterByTraceID: true
              filterBySpanID: false
          isDefault: false
          editable: true

      # Authentik SSO configuration injected via valuesFrom from grafana-oidc-config secret
      # Complete config stored in Vault by Terraform (single source of truth)
      env:
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: grafana-db-rw.monitoring.svc.cluster.local:5432
        GF_DATABASE_NAME: grafana
        GF_DATABASE_USER: grafana
        GF_DATABASE_SSL_MODE: require
      envValueFrom:
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-db-app
            key: password

      grafana.ini:
        server:
          root_url: https://grafana.allegedly.works
        # auth.generic_oauth populated automatically via valuesFrom

    # Prometheus Operator configuration
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Admission webhook resource limits
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

    # Prometheus disabled — Alloy scrapes metrics and pushes to Mimir.
    # Mimir Ruler evaluates alerting/recording rules.
    # Operator kept for CRD management (ServiceMonitor, PrometheusRule, etc.).
    prometheus:
      enabled: false

    # Node exporter configuration
    prometheus-node-exporter:
      fullnameOverride: prometheus-node-exporter
    nodeExporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # Kube-state-metrics configuration
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Disable components we don't need
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: false # Talos doesn't expose etcd metrics
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: true
