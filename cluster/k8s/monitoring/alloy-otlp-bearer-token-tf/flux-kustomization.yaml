apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-otlp-bearer-token-tf
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/alloy-otlp-bearer-token-tf
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: alloy-otlp-bearer-token
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    # authentik-jwt-rotation owns the agents-infra namespace this secret's
    # rotator runs in, and rotates the alloy-otlp bearer token committed here.
    - name: authentik-jwt-rotation
      namespace: ducktape-flux
