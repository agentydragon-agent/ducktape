apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  path: ./cluster/k8s/inventree/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: inventree-namespace
      namespace: ducktape-flux
