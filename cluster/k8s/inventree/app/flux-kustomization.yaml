apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/inventree/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: inventree
      namespace: inventree
  dependsOn:
    - name: inventree-namespace
      namespace: ducktape-flux
    - name: inventree-db
    - name: inventree-secrets
    - name: authentik-blueprint-inventree-secret
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: flux-system
