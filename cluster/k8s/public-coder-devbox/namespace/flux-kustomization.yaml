apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-devbox-namespace
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./cluster/k8s/public-coder-devbox/namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: public-coder-devbox
