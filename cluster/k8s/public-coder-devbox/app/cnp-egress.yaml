# Force the VM's guest egress through the public-coder-agent iron-proxy.
# KubeVirt's virt-launcher Pod carries the guest traffic, so this policy is
# applied to the Pod rather than attempting to enforce policy inside NixOS.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: public-coder-devbox-force-proxy-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - public-coder-devbox
      - key: k8s:kubevirt.io/domain
        operator: In
        values:
          - public-coder-devbox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: public-coder-agent
            k8s:app.kubernetes.io/name: public-coder-agent-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
