apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-coder-devbox-ssh-ingress
  namespace: public-coder-devbox
spec:
  podSelector:
    matchLabels:
      kubevirt.io/domain: public-coder-devbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-coder-agent
      ports:
        - protocol: TCP
          port: 22
