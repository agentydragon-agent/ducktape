# Flux GitRepository and Kustomization configuration.
#
# KEEP IN SYNC with: terraform/02-services/main.tf (flux_bootstrap_git resource)
# See that file for details on what settings must match.
#
# sparseCheckout is required to keep artifact under tofu-controller's 4MB gRPC limit.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: devel
  secretRef:
    name: flux-system
  url: ssh://git@github.com/agentydragon/ducktape.git
  sparseCheckout:
    - cluster/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
