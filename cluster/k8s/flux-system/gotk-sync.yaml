# This manifest was generated by flux and customized for monorepo support.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: devel
  secretRef:
    name: flux-system
  url: ssh://git@github.com/agentydragon/ducktape.git
  # Sparse checkout: only fetch cluster/ directory to reduce artifact size
  # Required for monorepo - full repo is ~15MB, exceeds tofu-controller 4MB gRPC limit
  sparseCheckout:
    - cluster/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
