apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - ducktape-automation-github-app.sops.yaml
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/goldilocks.fairwinds.com~1enabled
        value: "false"
  - target:
      kind: GitRepository
      name: flux-system
    patch: |
      - op: add
        path: /spec/sparseCheckout
        value:
          - cluster/
          - tf/
