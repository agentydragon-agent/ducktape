apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - ducktape-automation-github-app.sops.yaml
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/goldilocks.fairwinds.com~1enabled
        value: "false"
  - target:
      kind: GitRepository
      name: flux-system
    patch: |
      - op: add
        path: /spec/sparseCheckout
        value:
          - cluster/
          - tf/
  # Reconcile faster. With 244 Kustomizations and dependsOn chains up to 9
  # deep, the upstream defaults serialise propagation:
  #   --concurrent=4          — at most 4 Kustomizations in flight at a time
  #   --requeue-dependency=30s — wait 30s before re-checking a not-yet-ready dep
  # Fan-out goes to 16 so the chain doesn't bottleneck on the worker pool, and
  # the per-level requeue drops to 5s so deep dependsOn chains settle in
  # tens of seconds instead of minutes.
  - target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=16
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=5s
