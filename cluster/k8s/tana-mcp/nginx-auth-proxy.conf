server {
    listen 8263;

    location / {
        set $expected "Bearer ${TANA_MCP_BEARER_TOKEN}";
        if ($http_authorization != $expected) {
            return 401 '{"error": "unauthorized"}';
        }

        proxy_pass http://127.0.0.1:8262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';

        # SSE / Streamable HTTP support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8262/health;
    }
}
