apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tana-mcp
  namespace: tana-mcp
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "tana-mcp.allegedly.works"
  rules:
    - timeouts:
        request: "600s"
        backendRequest: "600s"
      backendRefs:
        - name: tana-mcp
          port: 8263
