apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/home-assistant/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: home-assistant-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
