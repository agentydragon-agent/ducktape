apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 12h
  values:
    controller:
      # Enable snippet annotations for Authentik forward auth X-Forwarded-Host header
      allowSnippetAnnotations: true

      # hostNetwork mode: bind directly to VPS public IPs on ports 80/443
      # This allows serving public traffic without MetalLB (which only works on home network)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Use DaemonSet to run exactly one pod per selected node
      kind: DaemonSet

      # Only run on Hetzner VPS nodes (which have public IPs)
      nodeSelector:
        topology.kubernetes.io/region: hetzner

      # Allow running on control-plane nodes (VPS nodes are control-plane)
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master" # Legacy key
          operator: "Exists"
          effect: "NoSchedule"

      # Service configuration - ClusterIP since we're using hostNetwork
      # The service is mainly for internal cluster access and health checks
      service:
        type: ClusterIP
        ports:
          http: 80
          https: 443

      # Ingress class configuration
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
        controllerValue: "k8s.io/ingress-nginx"

      # Enable metrics for monitoring
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false # Enable later when we have Prometheus

      # Resource limits
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi

      # DaemonSet doesn't use replicaCount - one pod per matched node
      # Pod disruption budget for HA
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
