apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/ingress-nginx"
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager # Wait for cert-manager for TLS certificates
    - name: kyverno # Kyverno VWC must be operational before creating resources
  # Verify ingress-nginx DaemonSet is ready (runs on VPS nodes with hostNetwork)
  healthChecks:
    - apiVersion: v1
      kind: Service
      name: ingress-nginx-controller
      namespace: ingress-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: ingress-nginx-controller
      namespace: ingress-system
