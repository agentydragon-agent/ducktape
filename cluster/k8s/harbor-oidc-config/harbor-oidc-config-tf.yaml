apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: harbor-oidc-config
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/terraform/gitops/sso/harbor-config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix = "harbor-oidc-config"
        namespace     = "flux-system"
      }

  vars:
    - name: authentik_url
      value: "https://auth.allegedly.works"
    - name: harbor_url
      value: "http://harbor-core.harbor:80"
    - name: vault_address
      value: "http://instance.vault.svc.cluster.local:8200"

  varsFrom:
    - kind: Secret
      name: vault-token
      varsKeys:
        - vault_token
      optional: false
