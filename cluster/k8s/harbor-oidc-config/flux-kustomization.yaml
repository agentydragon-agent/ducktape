apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-oidc-config
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/harbor-oidc-config"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: harbor-oidc-config
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
    - name: harbor # Harbor API must be running
    - name: authentik-blueprint-harbor-provider # OIDC creds in Vault
    - name: vault-token
