apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-servicemonitor
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/servicemonitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: litellm
    - name: monitoring-stack
