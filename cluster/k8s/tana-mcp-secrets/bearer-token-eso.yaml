---
# Bearer token for the auth proxy in front of Tana's MCP server.
# Store the token in Vault at kv/tana-mcp/bearer-token with key "token".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tana-mcp-bearer-token
  namespace: tana-mcp
spec:
  refreshInterval: 8760h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tana-mcp-bearer-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: kv/tana-mcp/bearer-token
        property: token
