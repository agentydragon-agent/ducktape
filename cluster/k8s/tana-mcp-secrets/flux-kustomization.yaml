apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/tana-mcp-secrets
  prune: true
  wait: true
  dependsOn:
    - name: tana-mcp-namespace
    - name: external-secrets-config
