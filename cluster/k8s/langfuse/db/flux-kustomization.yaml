apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-db
  namespace: flux-system
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/langfuse/db
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
