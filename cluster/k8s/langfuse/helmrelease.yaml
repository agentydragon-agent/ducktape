---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    langfuse:
      nextauth:
        url: "https://langfuse.allegedly.works"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key

      # Headless initialization — bootstrap org/project/user on first startup.
      # API keys are generated by the langfuse-secrets Terraform module so
      # LiteLLM can use the same keys without any manual step.
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: "langfuse-default-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Default"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "langfuse-litellm-project"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "litellm"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_SECRET_KEY
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "admin@allegedly.works"
        - name: LANGFUSE_INIT_USER_NAME
          value: "admin"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD

    # TODO(reliability): Move PostgreSQL to hcloud-volumes on VPS for
    # durability and cross-node HA. Currently on Proxmox — acceptable
    # for non-critical observability data.
    postgresql:
      deploy: true
      auth:
        existingSecret: langfuse-secrets
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: postgres-password
      primary:
        nodeSelector:
          topology.kubernetes.io/region: proxmox
        persistence:
          storageClass: proxmox-csi-retain
          size: 10Gi

    # TODO(reliability): ClickHouse replication (3-node cluster) for
    # durability. Currently single-node on Proxmox.
    clickhouse:
      deploy: true
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: clickhouse-password
      replicaCount: 1
      resourcesPreset: medium
      # Disable ClickHouse's built-in self-profiling system logs. By default
      # ClickHouse samples its own CPU/memory stack traces every few ms and
      # writes them to system.trace_log, system.text_log, system.metric_log,
      # and system.asynchronous_metric_log. On a small node with no actual
      # Langfuse trace data these logs are the only thing in ClickHouse and
      # grew to 3.8 GiB in ~2 weeks, causing repeated OOMKills at the 1.5 GiB
      # limit. None of this data is useful to us.
      extraOverrides: |
        <clickhouse>
          <trace_log>
            <flush_interval_milliseconds>0</flush_interval_milliseconds>
            <max_size_rows>0</max_size_rows>
          </trace_log>
          <text_log>
            <flush_interval_milliseconds>0</flush_interval_milliseconds>
            <max_size_rows>0</max_size_rows>
          </text_log>
          <metric_log>
            <flush_interval_milliseconds>0</flush_interval_milliseconds>
            <collect_interval_milliseconds>0</collect_interval_milliseconds>
          </metric_log>
          <asynchronous_metric_log>
            <flush_interval_milliseconds>0</flush_interval_milliseconds>
          </asynchronous_metric_log>
          <query_log>
            <max_size_rows>1000</max_size_rows>
          </query_log>
        </clickhouse>
      clusterEnabled: false
      zookeeper:
        replicaCount: 1
        resourcesPreset: small
        persistence:
          storageClass: local-path
          size: 8Gi
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      persistence:
        storageClass: proxmox-csi-retain
        size: 20Gi

    redis:
      deploy: true
      auth:
        # Reference the langfuse-secrets K8s secret (managed by ESO from Vault)
        # for both the Bitnami sub-chart and Langfuse app connection string.
        existingSecret: langfuse-secrets
        existingSecretPasswordKey: redis-password
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      primary:
        persistence:
          storageClass: local-path

    # TODO(reliability): Replace bundled MinIO with multi-node MinIO or
    # external S3 (Cloudflare R2 / Hetzner Object Storage) for durability.
    minio:
      deploy: true
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      persistence:
        storageClass: proxmox-csi-retain
        size: 20Gi

    # Ingress disabled — using Gateway API HTTPRoute
    ingress:
      enabled: false
