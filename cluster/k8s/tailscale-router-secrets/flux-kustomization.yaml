apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-router-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/tailscale-router-secrets"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: tailscale-auth
      namespace: tailscale-router
  dependsOn:
    - name: headscale-config
    - name: external-secrets-operator
    - name: tailscale-router-namespace
