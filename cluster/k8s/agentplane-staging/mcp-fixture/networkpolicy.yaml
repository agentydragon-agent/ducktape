# Only the staging control-plane callers may reach this no-auth, read-only origin.
# Runner isolation stays unchanged; there is no public route or fixture egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-mcp-fixture
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-mcp-fixture
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-app
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-actions
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
---
# Add only this destination to the callers' existing egress fences; no executor wiring.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-mcp-fixture-callers
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - agentplane-app
          - agentplane-actions
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-mcp-fixture
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
