apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-mcp-fixture
  namespace: ducktape-flux
  annotations:
    description: No-auth deterministic MCP0 fixture; staging-only read-only transport acceptance origin.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-staging/mcp-fixture
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
