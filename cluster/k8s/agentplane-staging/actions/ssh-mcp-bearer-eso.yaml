apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-ssh-mcp-bearer
  namespace: agentplane-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-external-creds-secret-store
    kind: ClusterSecretStore
  target:
    name: agentplane-ssh-mcp-bearer
    creationPolicy: Owner
  data:
    - secretKey: bearer-token
      remoteRef:
        key: agentplane-ssh-mcp-bearer
        property: bearer-token
