apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-config
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/headscale-config"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: headscale-config
      namespace: flux-system
  dependsOn:
    - name: headscale-api-key-bootstrap
    - name: vault-token
    - name: tofu-controller
