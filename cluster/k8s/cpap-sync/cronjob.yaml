apiVersion: batch/v1
kind: CronJob
metadata:
  name: cpap-sync
  namespace: cpap-sync
  annotations:
    description: >-
      Connects to the ez Share WiFi SD card in the ResMed CPAP and syncs all EDF data files to the cpap-data PVC.
spec:
  schedule: "0 10 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          nodeSelector:
            kubernetes.io/hostname: wyrm2
          securityContext:
            runAsUser: 0
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cpap-data
          containers:
            - name: sync
              image: ghcr.io/agentydragon/cpap-sync:devel-20260420011057-f92d305 # {"$imagepolicy": "flux-system:cpap-sync"}
              securityContext:
                capabilities:
                  add: ["NET_ADMIN"]
              env:
                - name: WIFI_IFACE
                  value: wlx9cefd5f62ee0
                - name: WIFI_SSID
                  value: "Rai CPAP ez Share"
                - name: WIFI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cpap-ezshare
                      key: wifi_password
                - name: OUTPUT_DIR
                  value: /data/cpap
              volumeMounts:
                - name: data
                  mountPath: /data/cpap
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
