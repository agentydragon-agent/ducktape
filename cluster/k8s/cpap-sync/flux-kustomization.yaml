apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpap-sync
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/cpap-sync
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  timeout: 2m
