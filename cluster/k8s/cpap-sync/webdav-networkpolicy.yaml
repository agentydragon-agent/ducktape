apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cpap-webdav-allow-sandbox
  namespace: cpap-sync
spec:
  endpointSelector:
    matchLabels:
      app: cpap-webdav
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-sandbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
