---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: harbor-props
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/harbor-props
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix = "harbor-props"
        namespace     = "flux-system"
      }
