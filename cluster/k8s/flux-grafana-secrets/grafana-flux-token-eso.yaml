apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-flux-token
  namespace: flux-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-flux-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kv/grafana/flux-token
        property: token
