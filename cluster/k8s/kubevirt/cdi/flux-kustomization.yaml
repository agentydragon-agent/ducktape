apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cdi
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/kubevirt/cdi
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  wait: true
  timeout: 10m
  dependsOn:
    - name: cdi-operator
      namespace: flux-system
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-apiserver
      namespace: cdi
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-deployment
      namespace: cdi
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-uploadproxy
      namespace: cdi
