apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/kubevirt/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  wait: true
  timeout: 10m
  dependsOn:
    - name: kubevirt-operator
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: virt-api
      namespace: kubevirt
    - apiVersion: apps/v1
      kind: Deployment
      name: virt-controller
      namespace: kubevirt
    - apiVersion: apps/v1
      kind: DaemonSet
      name: virt-handler
      namespace: kubevirt
