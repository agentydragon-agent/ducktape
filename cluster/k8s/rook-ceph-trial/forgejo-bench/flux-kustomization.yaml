apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-trial-forgejo-state
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./cluster/k8s/rook-ceph-trial/forgejo-bench
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: rook-ceph-trial-filesystem
    - name: cnpg
    - name: valkey
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: forgejo-ceph-bench-db
      namespace: forgejo-ceph-bench
