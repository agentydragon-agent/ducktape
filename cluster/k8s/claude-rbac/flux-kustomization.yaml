apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-rbac
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/claude-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: claude-sandbox
    - apiVersion: v1
      kind: ServiceAccount
      name: claude-code-web
      namespace: default
