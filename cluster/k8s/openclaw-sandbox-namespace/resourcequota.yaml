apiVersion: v1
kind: ResourceQuota
metadata:
  name: openclaw-sandbox-quota
  namespace: openclaw-sandbox
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
    services: "5"
    configmaps: "20"
    persistentvolumeclaims: "5"
    requests.storage: 50Gi
