    resourceNames:
      - opentofu-flux-webhook-token
    resources:
      - serviceaccounts
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc8c0091fecff7f5f52503a19f107a3d26398177d70
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opentofu-flux-webhook-token-impersonate
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: crossplane-opentofu
    namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
