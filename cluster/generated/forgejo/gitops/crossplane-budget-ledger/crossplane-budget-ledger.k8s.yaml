rules:
  - apiGroups:
      - ""
    resourceNames:
      - forgejo-admin-password
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resourceNames:
      - budget-ledger-git-creds
    resources:
      - secrets
