apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentofu-budget-ledger
  namespace: crossplane-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opentofu-budget-ledger-impersonate
  namespace: crossplane-system
rules:
  - apiGroups:
      - ""
    resourceNames:
      - opentofu-budget-ledger
    resources:
      - serviceaccounts
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc8d81a9c76b6c2f821363faf4ae76dbb91cbc30821
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opentofu-budget-ledger-impersonate
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: crossplane-opentofu
    namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
