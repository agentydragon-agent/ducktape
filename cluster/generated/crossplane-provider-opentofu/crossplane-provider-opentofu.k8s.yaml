apiVersion: v1
kind: ConfigMap
metadata:
  name: opentofu-kubernetes-clients
  namespace: crossplane-system
data:
  opentofu-alloy-otlp-bearer-token: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: opentofu-alloy-otlp-bearer-token
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          as: system:serviceaccount:crossplane-system:opentofu-alloy-otlp-bearer-token
    contexts:
      - name: root
        context:
          cluster: cluster
          user: opentofu-alloy-otlp-bearer-token
    current-context: root
  opentofu-budget-ledger: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          server: https://kubernetes.default.svc
