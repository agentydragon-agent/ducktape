---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: opentofu
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              volumeMounts:
                - mountPath: /etc/opentofu/kubernetes
                  name: kubernetes-clients
                  readOnly: true
          volumes:
            - configMap:
                name: opentofu-kubernetes-clients
              name: kubernetes-clients
  serviceAccountTemplate:
    metadata:
      name: crossplane-opentofu
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:v1.1.10
  revisionActivationPolicy: Automatic
  runtimeConfigRef:
    name: opentofu
