[project]
name = "rspcache"
version = "0.1.0"
description = "Caching proxy for OpenAI Responses API with PostgreSQL backing"
requires-python = ">=3.13"
dependencies = [
    "openai-utils",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "canonicaljson>=1.6.0",
    "openai>=1.40.0",
    "PyYAML",
]

[project.scripts]
rspcache = "rspcache.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rspcache"]
