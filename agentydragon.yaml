---
- hosts: localhost
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    scripts_path: "{{ home_path }}/bin"
    local_scripts_path: "{{ home_path }}/.local/bin"
    dotfiles_path: "{{ home_path }}/.dotfiles"
  remote_user: "{{ my_user }}"
  tasks:
  - include_tasks: tasks/google-repos.yaml
  - name: update everything
    become: yes
    apt:
      update_cache: yes
      upgrade: dist
  - name: install youtube-dl
    # TODO: validate
    get_url:
      url: https://yt-dl.org/downloads/latest/youtube-dl
      dest: "{{ local_scripts_path }}/youtube-dl"
  - include_tasks: tasks/common-packages.yaml
  - include_tasks: tasks/anki.yaml
  - include_tasks: tasks/dev-env.yaml
  - include_tasks: tasks/chrome-remote-desktop.yaml
  - name: Set up dotfiles
    block:
    - name: clone dotfiles
      git:
        repo: https://github.com/agentydragon/dotfiles
        dest: "{{ dotfiles_path }}"
  - name: Set up custom scripts
    git:
      repo: https://github.com/agentydragon/scripts
      dest: "{{ scripts_path }}"
  - include_tasks: tasks/vim.yaml
  - name: gnome-terminal
    tags:
      - gnome-terminal
    block:
    - include_tasks: tasks/gnome-terminal-solarized.yaml
    - name: hide gnome-terminal menu
      command: |
        gsettings set
          org.gnome.Terminal.Legacy.Settings default-show-menubar false
    - name: do not use system font
      dconf:
        key: "/org/gnome/terminal/legacy/profiles:/:{{ profile_uuid.stdout }}/use-system-font"
        value: "false"
    - name: set terminal font
      dconf:
        key: "/org/gnome/terminal/legacy/profiles:/:{{ profile_uuid.stdout }}/font"
        value: "'Ubuntu Mono 14'"
  - include_tasks: tasks/datetime-format.yaml
  - become: true
    snap:
      name:
      - telegram-desktop
  - become: true
    snap:
      classic: true
      name:
      - slack
  - include_tasks: tasks/dev-env.yaml
  - name: install packages for laptop
    become: yes
    apt:
      pkg:
      - acpi
      - alarm-clock-applet
      - android-tools-adb
      - blender
      - blueman
      - chrome-gnome-shell
      - gnome-shell
      - gnome-tweaks
      - gnupg
      - gnupg-agent
      - gnupg-l10n
      - gpgv
      - krita
      - openjdk-8-jdk
      - perl
      - qshutdown
      - steam
      - transmission-gtk
      - tuxguitar
      - virtualbox
      - virtualbox-dkms
      - wine-stable
      - wireshark
      - xournal
      - xserver-xorg-video-intel
