---
- hosts: localhost
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    scripts_path: "{{ home_path }}/bin"
    local_scripts_path: "{{ home_path }}/.local/bin"
    dotfiles_path: "{{ home_path }}/.dotfiles"
  remote_user: "{{ my_user }}"
  roles:
  - common
  tasks:
  - name: install packages for laptop
    become: yes
    apt:
      pkg:
      - acpi
      - alarm-clock-applet
      - android-tools-adb
      - blender
      - blueman
      - chrome-gnome-shell
      - gnome-shell
      - gnome-tweaks
      - gnupg
      - gnupg-agent
      - gnupg-l10n
      - gpgv
      - krita
      - openjdk-8-jdk
      - perl
      - qshutdown
      - steam
      - transmission-gtk
      - tuxguitar
      - virtualbox
      - virtualbox-dkms
      - wine-stable
      - wireshark
      - xournal
      - xserver-xorg-video-intel
  - name: install dotfiles
    command: rcup -B agentydragon
