---
- hosts: localhost
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    scripts_path: "{{ home_path }}/bin"
    local_scripts_path: "{{ home_path }}/.local/bin"
    dotfiles_path: "{{ home_path }}/.dotfiles"
  remote_user: "{{ my_user }}"
  roles:
  - common
  tasks:
  # Cannot be done for cloudragon because of OS Login. ugh.
  - name: set zsh as login shell
    become: yes
    user:
      name: "{{ my_user }}"
      shell: /bin/zsh
  - name: Clone oh-my-zsh
    git:
      repo: https://github.com/robbyrussell/oh-my-zsh
      dest: "/home/{{ my_user }}/.oh-my-zsh"
  - name: install packages for laptop
    become: yes
    apt:
      pkg:
      - acpi
      - alarm-clock-applet
      - android-tools-adb
      - blender
      - blueman
      - chrome-gnome-shell
      - gnome-shell
      - gnome-tweaks
      - gnupg
      - gnupg-agent
      - gnupg-l10n
      - gpgv
      - krita
      - openjdk-8-jdk
      - perl
      - qshutdown
      - steam
      - transmission-gtk
      - tuxguitar
      - virtualbox
      - virtualbox-dkms
      - wine-stable
      - wireshark
      - xournal
      - xserver-xorg-video-intel
  - name: install dotfiles
    command: rcup -B agentydragon -x vim -x README.md
# TODO: ~/.dotfiles should be a symlink to ~/repos/dotfiles
  - name: google drive
    tags: google-drive
    block:
    - name: install google drive
      copy:
        src: google-drive.service
        dest: "{{ home_path }}/.config/systemd/user/google-drive.service"
    # TODO: and maybe also add the binary to github? 3rdparty?
    - name: enable google drive
      systemd:
        name: google-drive
        state: started
        enabled: yes
        scope: user  # install as --user to depend on user session
