[project]
name = "adgn_mcp_starter"
version = "0.1.0"
description = "MCP server starter template"
dependencies = [
    "fastmcp",
    "pydantic>=2.0.0",
    "mcp",
    "rich",
    "claude-code-sdk",
]

[project.scripts]
adgn-mcp-starter = "adgn_mcp_starter.__main__:main"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
