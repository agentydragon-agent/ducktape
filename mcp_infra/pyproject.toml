[project]
name = "mcp-infra"
version = "0.1.0"
description = "MCP infrastructure - compositor, exec backends, and shared utilities"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "aiodocker>=0.22.0",
    "jinja2>=3.1",
    "anyio>=4.0",
    "typer>=0.12",
    "compact-json>=1.4.0",
    # Test deps included here so they're picked up by bazel lock()
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.0",
    "pytest-env>=1.1.3",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
]
