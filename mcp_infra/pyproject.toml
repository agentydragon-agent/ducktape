[project]
name = "mcp-infra"
version = "0.1.0"
description = "MCP infrastructure - compositor, exec backends, and shared utilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai-utils",
    "agent-core",
    "cli-util",
    "mcp-utils",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "aiodocker>=0.22.0",
    "jinja2>=3.1",
    "anyio>=4.0",
    "typer>=0.12",
    "compact-json>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "docker>=7.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_infra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "requires_docker: Tests that require Docker to be installed and running",
    "requires_sandbox_exec: Tests that require macOS sandbox-exec",
    "macos: Tests that only run on macOS",
    "shell: Tests that use shell execution",
]

[project.scripts]
mcp-docker-exec = "mcp_infra.exec.docker.launcher:app"
mcp-seatbelt-exec = "mcp_infra.exec.seatbelt:main"

[tool.uv.sources]
openai-utils = { workspace = true }
agent-core = { workspace = true }
cli-util = { workspace = true }
mcp-utils = { workspace = true }
