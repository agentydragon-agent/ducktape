[project]
name = "mcp-infra"
version = "0.1.0"
description = "MCP infrastructure - compositor, exec backends, and shared utilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-utils",
    "agent-core",
    "cli-util",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "aiodocker>=0.22.0",
    "jinja2>=3.1",
    "anyio>=4.0",
    "typer>=0.12",
    "compact-json>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_infra"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
# Paths relative to repo root (where pre-commit runs mypy from)
mypy_path = "openai_utils/src:agent_core/src:mcp_infra/src:cli_util/src"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "requires_docker: Tests that require Docker to be installed and running",
]

[tool.uv.sources]
openai-utils = { workspace = true }
agent-core = { workspace = true }
cli-util = { workspace = true }
