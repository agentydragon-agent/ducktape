[project]
name = "mcp-infra"
version = "0.1.0"
description = "MCP infrastructure - compositor, exec backends, and shared utilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-utils",
    "agent-core",
    "cli-util",
    "mcp-utils",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "aiodocker>=0.22.0",
    "jinja2>=3.1",
    "anyio>=4.0",
    "typer>=0.12",
    "compact-json>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "PyHamcrest>=2.1",
    "syrupy>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_docker: Tests that require Docker to be installed and running",
    "requires_sandbox_exec: Tests that require macOS sandbox-exec",
    "macos: Tests that only run on macOS",
    "shell: Tests that use shell execution",
]
