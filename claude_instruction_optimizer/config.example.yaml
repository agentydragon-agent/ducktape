pre_task_setup_script: ""
seeds_file: "seeds.yaml"

rollouts:
  max_parallel: 16
  max_turns: 100
  bash_timeout_ms: 10000

prompt_engineer:
  model: "o3"
  reasoning_effort: "high"

grader:
  model: "o3" 
  reasoning_effort: "medium"

summarizer:
  model: "o3"
  max_tokens: 15000

tokens:
  max_response_tokens: 30000
  reasoning_buffer_tokens: 20000
  max_context_tokens: 150000
  max_files_tokens: 100000

truncation:
  max_file_size_grading: 30000
  max_file_size_pattern_analysis: 30000
  log_message_length: 120

exclude_patterns:
  # Specific files
  - "CLAUDE.md"
  - ".gitignore" 
  - ".dockerignore"
  
  # File extensions
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - "*.so"
  - "*.dll" 
  - "*.dylib"
  - ".DS_Store"
  - "*.swp"
  - "*.swo"
  - "*.swn"
  - "*.swa"
  - "*.tmp"
  - "*.bak"
  - "*.cache"
  - "*.log"
  - "*.tar"
  - "*.gz"
  - "*.tar.gz"
  - "*.zip"
  - "*.rar"
  - "*.7z"
  - "*.xz"
  - "*.bz2"
  - "*.tgz"
  
  # Directories (match anywhere in path)
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.tox/**"
  - "**/.coverage/**"
  - "**/.idea/**"
  - "**/.vscode/**"
  - "**/node_modules/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/env/**"
  - "**/.env/**"
  - "**/.git/**"
  - "**/.svn/**"
  - "**/.hg/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "**/.eggs/**"
  - "**/target/**"
  
  # Dotfiles (except specific allowed ones)
  - ".*"

docker:
  layers:
    system-base:
      image_tag: "claude-dev:system-base"
      depends_on: []
      capabilities: ["system", "bash", "git", "basic-tools"]
    rust:
      image_tag: "claude-dev:rust"
      depends_on: ["system-base"]
      capabilities: ["rust"]
    go:
      image_tag: "claude-dev:go"
      depends_on: ["system-base"]
      capabilities: ["go"]
    python-core:
      image_tag: "claude-dev:python-core"
      depends_on: ["system-base"]
      capabilities: ["python", "python-core"]
    python-dev:
      image_tag: "claude-dev:python-dev"
      depends_on: ["python-core"]
      capabilities: ["python-dev", "pytest", "testing"]
    python-data:
      image_tag: "claude-dev:python-data"
      depends_on: ["python-dev"]
      capabilities: ["python-data", "pandas", "numpy", "matplotlib"]
    node:
      image_tag: "claude-dev:node"
      depends_on: ["system-base"]
      capabilities: ["node", "javascript", "typescript"]
    ruby:
      image_tag: "claude-dev:ruby"
      depends_on: ["system-base"]
      capabilities: ["ruby"]
  external_images:
    example-proprietary-deps:
      base_image: "your-registry.example.com/proprietary-deps:latest"
      source: "external_registry"
      description: "Example proprietary dependencies from external registry"
      add_claude: true