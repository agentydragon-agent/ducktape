---
- name: Set up dotfiles
  tags:
  - dotfiles
  block:
    #- name: create empty directory for dotfiles repo
    #  file:
    #    path: "{{ dotfiles_path }}"
    #    state: directory
    #    recurse: yes
    #    mode: '0755'
  - name: clone dotfiles
    git:
      repo: git@gitlab.com:agentydragon/dotfiles
      dest: "{{ dotfiles_path }}"
      version: master
  # TODO: problem: this is interactive if the files already exist.
  - name: install dotfiles
    command: rcup -B {{ rcup_computer }} -x vim -x README.md -d {{ dotfiles_path }}
