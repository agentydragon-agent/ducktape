---
- name: update everything
  become: yes
  apt:
    update_cache: yes
    upgrade: dist
- include_tasks: tasks/google-repos.yaml
# - name: install youtube-dl
#   # TODO: validate
#   get_url:
#     url: https://yt-dl.org/downloads/latest/youtube-dl
#     dest: "{{ local_scripts_path }}/youtube-dl"
- include_tasks: tasks/common-packages.yaml
- include_tasks: tasks/anki.yaml
- include_tasks: tasks/dev-env.yaml
- name: Set up dotfiles
  block:
  - name: clone dotfiles
    git:
      repo: https://github.com/agentydragon/dotfiles
      dest: "{{ dotfiles_path }}"
- name: Set up custom scripts
  git:
    repo: https://github.com/agentydragon/scripts
    dest: "{{ scripts_path }}"

- name: set up vim
  tags: vim
  block:
  - name: Clone Vundle
    git:
      repo: https://github.com/VundleVim/Vundle.vim.git
      dest: "/home/{{ my_user }}/.vim/bundle/Vundle.vim"
  - name: install vim plugins
    command: "vim -E -s -c 'source /home/{{ my_user }}/.vimrc' -c PluginInstall -c PluginUpdate -c qall"

- name: gnome-terminal
  tags:
    - gnome-terminal
  block:
  - include_tasks: tasks/gnome-terminal-solarized.yaml
  - name: hide gnome-terminal menu
    command: |
      gsettings set
        org.gnome.Terminal.Legacy.Settings default-show-menubar false
  - name: do not use system font
    dconf:
      key: "/org/gnome/terminal/legacy/profiles:/:{{ profile_uuid.stdout }}/use-system-font"
      value: "false"
  - name: set terminal font
    dconf:
      key: "/org/gnome/terminal/legacy/profiles:/:{{ profile_uuid.stdout }}/font"
      value: "'Ubuntu Mono 14'"
- include_tasks: tasks/datetime-format.yaml
- become: true
  snap:
    name:
    - telegram-desktop
    - youtube-dl
- become: true
  snap:
    classic: true
    name:
    - slack
- include_tasks: tasks/dev-env.yaml
