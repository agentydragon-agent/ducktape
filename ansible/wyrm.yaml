---
- hosts: wyrm
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: wyrm
    ducktape_path: "{{ ansible_user_dir }}/code/ducktape"
  remote_user: "{{ my_user }}"

  handlers:
    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      become: true

  roles:
    - role: cli

    - role: dev-env
      tags: [dev-env]

    - role: golang
      tags: [golang, go]
      vars:
        go_version: "1.25.0"

    - role: docker
    - role: gui
    # dev-ml migrated to Nix (renamed to dev-ml_nix_migrated)
    - role: tailscale-client
      tags: [tailscale]
    - role: k3s-client
      tags: [k3s-client]

    # - role: nvidia-guest
    #   tags: [nvidia, gpu]
    #   vars:
    #     include_ml_libraries: true

  tasks:

    # Configure Nix trusted users for devenv cache management
    - name: Configure Nix trusted users
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        regexp: '^trusted-users = '
        line: 'trusted-users = root agentydragon'
        create: false
        backup: yes
      become: true
      tags: [nix]
      register: nix_config_changed

    - name: Restart nix-daemon if config changed
      ansible.builtin.systemd:
        name: nix-daemon
        state: restarted
      become: true
      when: nix_config_changed.changed
      tags: [nix]

    # Disable screensaver and screen blanking for headless VM
    - name: Disable GNOME screensaver and screen blanking
      become: true
      become_user: "{{ my_user }}"
      dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - { key: "/org/gnome/desktop/screensaver/idle-activation-enabled", value: "false" }
        - { key: "/org/gnome/desktop/screensaver/lock-enabled", value: "false" }
        - { key: "/org/gnome/desktop/session/idle-delay", value: "uint32 0" }
        - { key: "/org/gnome/settings-daemon/plugins/power/idle-dim", value: "false" }
        - { key: "/org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type", value: "'nothing'" }
        - { key: "/org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type", value: "'nothing'" }
      tags: [vm-display]
      when: ansible_env.DISPLAY is defined

    # TODO: Disable screen blanking further?

    # Storage configuration for tankshare
    - name: Check if tankshare is mounted
      ansible.builtin.stat:
        path: /mnt/tankshare
      register: tankshare_mount
      tags: [storage]

    - name: Create Docker storage directory on tankshare
      ansible.builtin.file:
        path: /mnt/tankshare/per-vm/wyrm/docker
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      tags: [storage, docker]

    - name: Configure Docker daemon for tankshare storage
      ansible.builtin.copy:
        content: |
          {
            "data-root": "/mnt/tankshare/per-vm/wyrm/docker",
            "storage-driver": "vfs"
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      become: true
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      notify: restart docker
      tags: [storage, docker]

    # pnpm is installed in dev-env-user.yml via github_release_install
    # Configuration is managed via dotfiles/npmrc

    - name: Create pip cache directory on tankshare
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: '0755'
      become: true
      loop:
        - /mnt/tankshare/shared/pip-cache
        - /mnt/tankshare/per-vm/wyrm/python-user
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      tags: [storage, pip]

    - name: Create pip configuration directory
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/pip"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: '0755'
      tags: [storage, pip]

    - name: Configure pip to use tankshare
      ansible.builtin.copy:
        content: |
          [global]
          cache-dir = /mnt/tankshare/shared/pip-cache
          
          [install]
          user = true
        dest: "{{ ansible_user_dir }}/.config/pip/pip.conf"
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: '0644'
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      tags: [storage, pip]

    # PYTHONUSERBASE is now handled via rcm host-specific dotfiles (host-wyrm/profile.machine)

    # MOTD configuration for wyrm
    - name: Set wyrm MOTD
      ansible.builtin.copy:
        content: "🐉 Welcome to wyrm!\n"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
      become: true
      tags: [motd]

    - name: Disable dynamic MOTD components
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'a-x'  # Remove execute permission
      become: true
      loop:
        - /etc/pop-os/update-motd.d/10-help-text  # The actual Pop!_OS script (symlink target)
        # TODO: Future fancy ideas:
        # - Create /etc/update-motd.d/99-wyrm-status with dynamic dragon-themed system stats
        # - Show GPU status for AI experiments
        # - Display current Python environment info
        # - Show tankshare usage as "dragon hoard"
        # - Temperature sensors as "dragon fire intensity"
        # Keep 00-header for basic system info (OS version, kernel)
      tags: [motd]
