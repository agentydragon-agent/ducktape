- name: Ensure data dir for the SQLite file exists
  file:
    path: /opt/webhook-inbox/data
    state: directory
    mode: "0755"

- name: Install / update the .env file that holds secrets & config
  copy:
    dest: /opt/webhook-inbox/.env   # Docker-style KEY=VALUE lines
    mode: "0600"   # readable by root only
    owner: root
    force: no  # only set content if file is missing
    # TODO: change
    content: |
      WEBHOOK_INBOX_KEY=
      TZ=UTC
      DB_PATH=/data/events.db

- name: Build webhook-inbox image from remote Git sub-dir
  community.docker.docker_image:
    name: webhook-inbox            # local image name
    tag: latest
    source: build
    build:
      path: "https://gitlab.com/agentydragon/ducktape.git#devel:experimental/webhook_inbox"
      pull: yes                    # always refresh base images

- name: Run (or update) the webhook-inbox container
  community.docker.docker_container:
    name: webhook_inbox
    image: webhook-inbox:latest
    recreate: yes                  # pick up new image each play run
    restart_policy: unless-stopped
    env_file:
      - /opt/webhook-inbox/.env    # loads KEY=VALUE lines
    volumes:
      - /opt/webhook-inbox/data:/data
    published_ports:               # hostPort:containerPort – public!
      - "4473:8000" # publicly accessible on port 4473
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
