# Discord is in Pop!_OS proprietary repo:
# http://apt.pop-os.org/properietary
- name: Ensure Discord is installed
  apt:
    name: discord
    state: present
    
- name: Set paths for managed Discord autostart
  vars:
    discord_autostart_path: "{{ ansible_env.HOME }}/.config/autostart/discord-minimized.desktop"

- name: Install minimized Discord autostart entry
  copy:
    dest: "{{ discord_autostart_path }}"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Discord (minimized)
      Exec=discord --start-minimized
      X-GNOME-Autostart-enabled=true
      Hidden=false
      NoDisplay=false
      Comment=From Ducktape Ansible config
      Categories=Network;InstantMessaging;
      Terminal=false
    mode: '0644'

- name: Disable conflicting per-user Discord autostarts
  block:
  - name: List per-user autostarts
    find:
      paths: ["{{ ansible_env.HOME }}/.config/autostart"]
      patterns: "*.desktop"
    register: autostart_files

  - name: Disable others that launch Discord
    lineinfile:
      path: "{{ item.path }}"
      regexp: '^X-GNOME-Autostart-enabled='
      line: 'X-GNOME-Autostart-enabled=false'
      create: no
      backup: yes
    loop: "{{ autostart_files.files }}"
    loop_control:
      label: "{{ item.path | basename }}"
    when: >
      item.path != discord_autostart_path and
      (lookup('file', item.path) is search('^Exec=.*\bdiscord\b', multiline=True))

- name: Assert no systemwide Discord autostarts
  block:
  - name: List systemwide autostarts
    find:
      paths: ["/etc/xdg/autostart"]
      patterns: "*.desktop"
    register: system_autostarts

  - name: Fail if any systemwide autostart launches Discord
    fail:
      msg: "Discord found in systemwide autostart: {{ item.path }}"
    loop: "{{ system_autostarts.files }}"
    loop_control:
      label: "{{ item.path | basename }}"
    when: lookup('file', item.path) is search('^Exec=.*\bdiscord\b', multiline=True)
