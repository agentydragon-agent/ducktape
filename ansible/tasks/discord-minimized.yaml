# Discord is in Pop!_OS proprietary repo: http://apt.pop-os.org/properietaryI
- name: Set Discord to autostart, minimized
  block:
  - name: Ensure Discord is installed
    apt:
      name: discord
      state: present

  - name: Set paths for managed Discord autostart
    ansible.builtin.set_fact:
      discord_autostart_path: "{{ ansible_env.HOME }}/.config/autostart/discord-minimized.desktop"

  - name: Install minimized Discord autostart entry
    copy:
      dest: "{{ discord_autostart_path }}"
      content: |
        [Desktop Entry]
        Type=Application
        Name=Discord (minimized)
        Exec=discord --start-minimized
        X-GNOME-Autostart-enabled=true
        Hidden=false
        NoDisplay=false
        Comment=From Ducktape Ansible config
        Categories=Network;InstantMessaging;
        Terminal=false
      mode: '0644'

  - name: Check no conflicting Discord autostarts
    block:
    - name: List systemwide and per-user autostarts
      find:
        paths:
          - "{{ ansible_env.HOME }}/.config/autostart"
          - /etc/xdg/autostart
        patterns: "*.desktop"
      register: autostart_files

    - name: Fail if any other autostart launches Discord
      fail:
        msg: "Conflicting Discord autostart found: {{ item.path }}"
      loop: "{{ autostart_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - item.path != discord_autostart_path
        - lookup('file', item.path) is search('^Exec=.*\bdiscord\b', multiline=True)
