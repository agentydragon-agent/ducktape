# GUI lives on http://vps:8384 (WireGuard/Tailscale)

- name: Install syncthing package # noqa: package-latest
  ansible.builtin.apt:
    name: syncthing
    update_cache: true
    state: latest

- name: Create SyncThing group
  ansible.builtin.group:
    name: syncthing
    state: present

- name: Create SyncThing user
  ansible.builtin.user:
    name: syncthing
    group: syncthing
    comment: Syncthing service account
    system: false # regular user, gets /etc/passwd entry
    home: /srv/syncthing
    shell: /bin/bash
    create_home: true
    state: present

- name: Create SyncThing /srv directory
  ansible.builtin.file:
    path: /srv/syncthing
    state: directory
    owner: syncthing
    group: syncthing
    mode: "0700"

- name: Check if config.xml already exists
  ansible.builtin.stat:
    path: /srv/syncthing/.local/state/syncthing/config.xml
  register: syncthing_server_cfg

- name: Bail out if config.xml did not exist
  when: not syncthing_server_cfg.stat.exists
  ansible.builtin.fail:
    msg: Syncthing config not found. Generate one.

# ---------------------------------------------------------------------------
# TLS certificate required by nginx reverse-proxy site
# ---------------------------------------------------------------------------

- name: Enable & start syncthing system service
  become: true
  ansible.builtin.systemd:
    name: syncthing@syncthing # template instance for the “syncthing” user
    enabled: true
    state: started
