---
- name: Set up dotfiles
  tags:
    - dotfiles
  block:
    - name: Assert role is not targeting root
      ansible.builtin.assert:
        that:
          - cli_effective_user != "root"
        fail_msg: "cli role must run under a non-root user"

    - name: Debug - Check if ducktape exists
      ansible.builtin.stat:
        path: "{{ cli_ducktape_path }}"
        follow: true
      register: cli_ducktape_stat
      become: true
      become_user: "{{ cli_effective_user }}"
      changed_when: false

    - name: Debug - Report resolved ducktape path
      ansible.builtin.debug:
        msg: >-
          Expecting Ducktape repo at {{ cli_ducktape_path }}
          (exists={{ cli_ducktape_stat.stat.exists | default(false) }},
          isdir={{ cli_ducktape_stat.stat.isdir | default(false) }},
          owner={{ cli_ducktape_stat.stat.pw_name | default(unknown) }})

    - name: Assert ducktape repository exists
      ansible.builtin.assert:
        that:
          - cli_ducktape_stat.stat.exists | default(false)
          - (cli_ducktape_stat.stat.isdir | default(false))
            or (cli_ducktape_stat.stat.islnk | default(false))
        fail_msg: >-
          Ducktape repository must be cloned to {{ cli_ducktape_path }} before
          running this playbook. Run:
          git clone git@gitlab.com:agentydragon/ducktape {{ cli_ducktape_path }}
        success_msg: "Ducktape repository found at {{ cli_ducktape_path }}"

    # This is interactive if the files already exist.
    # The uncommented script fails if that happens.
    #
    # - name: Install ducktape dotfiles
    #   ansible.builtin.command: >
    #     rcup -B {{ rcup_computer }} -x vim -x README.md -d {{ cli_ducktape_path }}/dotfiles
    #   register: rcup_result

    - name: Install ducktape dotfiles, fail if would need overwrite
      ansible.builtin.script: "{{ role_path }}/tasks/rcup_noninteractive.py -B {{ rcup_computer }}"
      args:
        executable: python3
      environment:
        HOME: "{{ cli_effective_home }}"
        USER: "{{ cli_effective_user }}"
        RCRC: "{{ cli_ducktape_path }}/dotfiles/rcrc"
      timeout: 10
      become: true
      become_user: "{{ cli_effective_user }}"
      register: cli_rcup_result
      failed_when: cli_rcup_result.rc != 0
      ignore_errors: true

    - name: Check if rcup needs manual intervention
      ansible.builtin.fail:
        msg: |
          Dotfiles installation requires manual intervention.

          Run on the machine:
          RCRC={{ cli_ducktape_path }}/dotfiles/rcrc rcup -B {{ rcup_computer }}

          You'll likely need to confirm overwriting pre-existing files.
      when:
        - cli_rcup_result.failed
        - "'overwrite' in cli_rcup_result.stdout"
