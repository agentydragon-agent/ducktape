- name: Manage Bazel
  when: ansible_architecture == "amd64"
  tags:
  - bazel
  become: true
  block:
  - name: Manage Bazel APT repository
    ansible.builtin.deb822_repository:
      name: bazel
      types: [deb]
      uris:
        - https://storage.googleapis.com/bazel-apt
      signed_by: https://bazel.build/bazel-release.pub.gpg
      suites: [stable]
      components: [jdk1.8]
      architectures: [amd64]  # no i386 included
      state: "{{ bazel_state | default('present') }}"
      enabled: "{{ bazel_state | default('present') == 'present' }}"

  - name: Manage Bazel package
    ansible.builtin.apt:
      pkg: bazel
      state: "{{ bazel_state | default('present') }}"