- name: Install Bazel
  when: ansible_architecture == "amd64"
  tags:
  - bazel
  become: true
  block:
  - name: Add Bazel APT repository
    ansible.builtin.deb822_repository:
      name: bazel
      types: [deb]
      uris:
        - https://storage.googleapis.com/bazel-apt
      signed_by: https://bazel.build/bazel-release.pub.gpg
      suites: [stable]
      components: [jdk1.8]
      architectures: [amd64]  # no i386 included
      state: present
      enabled: yes

  - name: Install Bazel
    ansible.builtin.apt:
      pkg: bazel
      state: present
