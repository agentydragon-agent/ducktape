- name: Check Neovim is >= 0.11 (for DEC mode 2031 for auto color scheme switching)
  block:
  - name: Get Neovim version
    command: nvim --version
    register: raw_nvim_version
    changed_when: false

  - name: Parse clean Neovim version string (strip prefix and suffix)
    set_fact:
      nvim_version_string: "{{ raw_nvim_version.stdout_lines[0] | regex_replace('^NVIM v(\\d+\\.\\d+(?:\\.\\d+)?).*', '\\1') }}"

  - name: Fail if version parsing failed
    fail:
      msg: "Couldn't parse Neovim version from: {{ raw_nvim_version }}"
    when: nvim_version_string is not defined or nvim_version_string == ''

  - name: Assert Neovim is at least 0.11
    assert:
      that:
        - "nvim_version_string is version('0.11', '>=')"
      fail_msg: "Neovim must be at least 0.11, got {{ nvim_version_string }}"

# TODO: update Neovim Lazy plugins?

- name: Set to generate only English locale
  become: yes
  copy:
    dest: /etc/locale.gen
    content: |
      en_US.UTF-8 UTF-8
      cs_CZ.UTF-8 UTF-8

      # For some convenient time formatting
      en_DK.UTF-8 UTF-8
  notify: Regenerate locales

# See .pam_environment dotfile
- name: Set system-wide locale
  become: yes
  copy:
    dest: /etc/default/locale
    content: |
      # English strings
      LANG=en_US.UTF-8

      # TODO: would be nice to have space thousands separator & decimal dot...
      # cs_CZ does 1 234,56. en_US does 1,234.56
      LC_NUMERIC=cs_CZ.UTF-8

      # en_DK does 24 hour time, YYYY-MM-DD date, English weekday & month names.
      # Happens to be convenient.
      LC_TIME=en_DK.UTF-8

      # $1,234.56. Would be nice to have space thousands separator & decimal dot. Alas.
      LC_MONETARY=en_US.UTF-8

      # Unfortunately US formatted paper...
      LC_PAPER=en_US.UTF-8

      # Just how the locale identifies itself..
      LC_IDENTIFICATION=en_US.UTF-8

      # How names are formatted (e.g. Mr. John Smith capitalization etc.)
      LC_NAME=en_US.UTF-8

      # US-formatted addresses
      LC_ADDRESS=en_US.UTF-8

      # US-formatted telephone numbers
      LC_TELEPHONE=en_US.UTF-8

      # Metric system
      LC_MEASUREMENT=cs_CZ.UTF-8

# TODO: hyphenation patterns? hyphen-cs hyphen-de
