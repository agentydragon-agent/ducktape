---

- name: System-wide apt lock acquire timeout (3 min)
  become: true
  copy:
    dest: /etc/apt/apt.conf.d/99locktimeout
    content: |
      DPkg::Lock::Timeout "180";

# - name: Include glab
#   include_tasks: tasks/glab.yml
# - name: Include Trilium client
#   include_tasks: tasks/trilium_client.yml

- include_tasks: tasks/bazel.yml
  vars:
    bazel_state: absent

# Install Neovim from unstable PPA to get version 0.11+
- name: Add Neovim unstable PPA
  become: true
  deb822_repository:
    name: neovim-unstable
    uris: https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x9DBB0BE9366964F134855E2255F96FCF8231B6DD
  when: not (skip_ubuntu_ppas | default(false))

- name: Install CLI packages
  become: true
  ansible.builtin.apt:
    update_cache: yes  # deb822_repository doesn't reliably trigger apt cache update
    pkg:
      # removed 2024-04-13, defaults in pop os:
      #   diffutils
      - curl
      - ffmpeg
      - gnupg
      - gnupg-agent
      - gnuplot
      - grep
      - gzip
      - htop
      - iftop
      - iotop
      - iputils-ping
      - libsecret-tools  # for secret-tool, for Ansible Vault
      - locate
      - mc
      - mmv
      - mosh
      - ncdu
      - netcat-openbsd
      - nethogs
      - nmap
      - pkg-config
      - pv
      - pwgen
      - python3
      - python3-pip
      - rcm
      - ripgrep
      - screen
      - sed
      - sqlite3
      - tmux
      - tree
      - unrar-free
      - sudo # for become: agentydragon further down
      - wget
      - xxd
      - yasm
      - zsh

# Install Neovim separately to ensure it updates from PPA
- name: Install/Update Neovim from unstable PPA
  become: true
  ansible.builtin.apt:
    name: neovim
    state: latest

# Modern systems require using pipx or apt for Python CLI tools
- name: Install pipx for Python CLI tools
  become: true
  ansible.builtin.apt:
    pkg:
      - pipx
    state: latest

- name: Remove retired pkgs
  become: true
  ansible.builtin.apt:
    pkg:
      - silversearcher-ag  # I replaced with rg

      - hyphen-en-ca
      - hyphen-en-gb
    state: absent

- name: Ensure snapd is installed
  become: true
  ansible.builtin.apt:
    name: snapd
    state: present
  when: ansible_os_family == "Debian"

- name: Install snaps
  become: true
  snap:
    name: tio
    classic: true

# needed for OpenAI Codex CLI, vim-copilot
- include_tasks: tasks/nodejs.yml

# Set up oh-my-zsh
- name: Clone oh-my-zsh
  tags: [oh-my-zsh, zsh]
  git:
    # TODO(agentydragon): shallow clone
    repo: https://github.com/robbyrussell/oh-my-zsh
    dest: "/home/{{ my_user | default(ansible_user_id) }}/.oh-my-zsh"
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"

# Install Powerlevel10k theme
- name: Clone Powerlevel10k theme
  tags: [oh-my-zsh, zsh, p10k]
  git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "/home/{{ my_user | default(ansible_user_id) }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1  # Shallow clone for faster installation
    version: master  # Use latest master as requested
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"

# Set zsh as default shell
- name: Set zsh as login shell
  become: true
  tags: [zsh]
  user:
    name: "{{ my_user | default(ansible_user_id) }}"
    shell: /bin/zsh

# Remove default Ubuntu directories (only if empty)
# I have custom dirs configured via user-dirs.dirs
- name: Check if default Ubuntu directories are empty
  find:
    paths: "/home/{{ my_user | default(ansible_user_id) }}/{{ item }}"
    file_type: any
  loop:
    - Desktop
    - Documents
    - Downloads
    - Music
    - Pictures
    - Public
    - Templates
    - Videos
  register: dir_contents
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  failed_when: false  # Don't fail if directory doesn't exist

- name: Ensure default directories are either absent or empty
  file:
    path: "/home/{{ my_user | default(ansible_user_id) }}/{{ item.item }}"
    state: absent
  when: item.matched == 0  # Directory exists but is empty
  loop: "{{ dir_contents.results }}"
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  failed_when: 
    - item.failed is defined and item.failed == false  # Directory exists
    - item.matched > 0  # And is not empty

# Deploy dotfiles before dev-env to ensure npmrc is in place
- import_tasks: tasks/dotfiles.yml

- import_tasks: tasks/dev-env.yml

