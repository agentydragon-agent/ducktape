---

- name: System-wide apt lock acquire timeout (3 min)
  become: true
  copy:
    dest: /etc/apt/apt.conf.d/99locktimeout
    content: |
      DPkg::Lock::Timeout "180";

# - name: Include glab
#   include_tasks: tasks/glab.yml
# - name: Include Trilium client
#   include_tasks: tasks/trilium_client.yml

- include_tasks: tasks/bazel.yml
  vars:
    bazel_state: absent

# Neovim PPA moved to cli_nix_migrated - Nix provides unstablePkgs.neovim

- name: Install CLI packages
  become: true
  ansible.builtin.apt:
    update_cache: yes  # deb822_repository doesn't reliably trigger apt cache update
    pkg:
      # removed 2024-04-13, defaults in pop os:
      #   diffutils
      - curl
      - ffmpeg
      - gnupg
      - gnupg-agent
      - gnuplot
      - grep
      - gzip
      - htop
      - iftop
      - iotop
      - iputils-ping
      - libsecret-tools  # for secret-tool, for Ansible Vault
      - locate
      - mc
      - mmv
      - mosh
      - ncdu
      - netcat-openbsd
      - nethogs
      - nmap
      - pkg-config
      - pv
      - pwgen
      - python3
      - python3-pip
      - rcm
      - ripgrep
      - screen
      - sed
      - sqlite3
      - tmux
      - tree
      - unrar-free
      - sudo # for become: agentydragon further down
      - wget
      - xxd
      - yasm
      - zsh

# Neovim installation moved to cli_nix_migrated

# Modern systems require using pipx or apt for Python CLI tools
- name: Install pipx for Python CLI tools
  become: true
  ansible.builtin.apt:
    pkg:
      - pipx
    state: latest

# Upgrade pipx to latest version via pip (Ubuntu package is too old)
- name: Upgrade pipx to latest version via pip
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  ansible.builtin.pip:
    name: pipx
    state: latest
    extra_args: --user --upgrade --force-reinstall

# Ensure the user's pipx is in PATH for subsequent tasks
- name: Add user's local bin to PATH for pipx
  set_fact:
    ansible_env: "{{ ansible_env | combine({'PATH': ansible_env.PATH + ':' + ansible_user_dir + '/.local/bin'}) }}"

- name: Remove retired pkgs
  become: true
  ansible.builtin.apt:
    pkg:
      - silversearcher-ag  # I replaced with rg

      - hyphen-en-ca
      - hyphen-en-gb
    state: absent

- name: Ensure snapd is installed
  become: true
  ansible.builtin.apt:
    name: snapd
    state: present
  when: ansible_os_family == "Debian"

- name: Install snaps
  become: true
  snap:
    name: tio
    classic: true

# nodejs.yml moved to cli_nix_migrated - Nix provides nodejs_20

- include_tasks: oh_my_zsh.yml
  tags: [zsh]

# Set zsh as default shell
- name: Set zsh as login shell
  become: true
  tags: [zsh]
  user:
    name: "{{ my_user | default(ansible_user_id) }}"
    shell: /bin/zsh

# Remove default Ubuntu directories (only if empty)
# I have custom dirs configured via user-dirs.dirs
- name: Check if default Ubuntu directories are empty
  find:
    paths: "/home/{{ my_user | default(ansible_user_id) }}/{{ item }}"
    file_type: any
  loop:
    - Desktop
    - Documents
    - Downloads
    - Music
    - Pictures
    - Public
    - Templates
    - Videos
  register: dir_contents
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  failed_when: false  # Don't fail if directory doesn't exist

- name: Ensure default directories are either absent or empty
  file:
    path: "/home/{{ my_user | default(ansible_user_id) }}/{{ item.item }}"
    state: absent
  when: item.matched == 0  # Directory exists but is empty
  loop: "{{ dir_contents.results }}"
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  failed_when: 
    - item.failed is defined and item.failed == false  # Directory exists
    - item.matched > 0  # And is not empty

# Deploy dotfiles before dev-env to ensure npmrc is in place
- import_tasks: tasks/dotfiles.yml

- import_tasks: tasks/dev-env.yml

