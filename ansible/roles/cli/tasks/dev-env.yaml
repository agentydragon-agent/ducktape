- name: Install dev env
  become: true
  ansible.builtin.apt:
    pkg:
      # TODO: - python-is-python3
      # broken: google-cloud-sdk
      #- asciidoc
      #- bison
      #- cabal-install
      - clang
      - clang-format
      - cloc
      - cmake
      - flex
      - gcc
      - ghc
      - gitk
      - gnuplot
      - golang
      - jupyter-nbconvert
      - make
      - markdown
      #- npm <- "you have requested an impossible situations"

      # TODO: this seems to not provide tree-sitter cli though
      # so does not provide latex higlihting
      # - libtree-sitter0  # tree-sitter for neovim syntax stuff

      #- protobuf-compiler
      #- pyqt5-dev-tools
      - sloccount
      - tidy  # HTML tidy

- name: Install dev env PyPI packages
  ansible.builtin.pip:
    name:
      - autopep8
      - ruff
      - ansible

# Ubuntu 22.04 ships with ancient Ansible. Get it from pip.
- name: Ansible
  install_handler:
    apt: ansible
    pip: ansible
    use: pip

- name: Install stylua (Lua formatter for Neovim)
  # ansible-galaxy collection install community.general
  community.general.cargo:
    name: stylua

