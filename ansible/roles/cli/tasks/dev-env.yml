# Migrated to Nix home-manager: git (programs.git), jq

- name: Install dev env
  become: true
  ansible.builtin.apt:
    pkg:
      # TODO: - python-is-python3
      # broken: google-cloud-sdk
      # - asciidoc
      # - bison
      # - cabal-install
      - clang
      - ninja-build
      - clang-format
      - cloc
      - cmake
      - firejail
      - flex
      - gcc
      - ghc
      - gitk
      - gnuplot
      - jupyter-nbconvert
      - make
      - markdown
      - sloccount
      - tidy  # HTML tidy

      # TODO: this seems to not provide tree-sitter cli though
      # so does not provide latex higlihting
      # - libtree-sitter0  # tree-sitter for neovim syntax stuff

      # - protobuf-compiler
      # - pyqt-dev-tools

# Include heavy/optional dev packages (controlled by include_heavy_dev_packages variable)
- name: Install heavy development packages
  ansible.builtin.include_tasks: dev-env-heavy.yml

# Include user-level development tools
- name: Import user-level development tools setup
  ansible.builtin.import_tasks: dev-env-user.yml
