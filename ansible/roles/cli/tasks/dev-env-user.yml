---
# Install build dependencies for Rust crates
- name: Install build dependencies for Rust tools
  become: true
  ansible.builtin.apt:
    name:
      - libssl-dev  # Required for sccache and other rust crates
      - pkg-config  # Required for finding libraries
    state: present

# User-level development tools
- name: Install user-level development tools
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  block:
    # pipx tools installation moved to cli_nix_migrated role

    - name: Install pnpm package manager
      github_release_install:
        release_spec:
          repo: "pnpm/pnpm"
          version: "latest"
          asset_pattern: "pnpm-linux-x64$"  # The standalone binary
        method:
          name: binary
          dest_path: "{{ ansible_user_dir }}/.local/bin/pnpm"
      when: ansible_architecture == "x86_64" and ansible_system == "Linux"
      tags: [pnpm]

    # pnpm global tools installation moved to cli_nix_migrated role

    # Check for legacy npm-global directory that should be removed
    - name: Check if npm-global directory exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.npm-global"
      register: npm_global_dir
      changed_when: false
      tags: [npm-cleanup]

    - name: Fail if npm-global directory exists
      ansible.builtin.fail:
        msg: |
          ERROR: npm-global directory exists at ~/.npm-global
          We use pnpm now, not npm!
          Remove it with: rm -rf ~/.npm-global ~/.npm
          Then re-run this playbook.
      when: npm_global_dir.stat.exists and npm_global_dir.stat.isdir
      tags: [npm-cleanup]

    # Check if claude binary is actually executable
    - name: Check if Claude binary exists and is executable
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.local/bin/claude"
      register: claude_binary_check

    # Install Claude via official installation script
    # TODO: Not super fond of curl|bash pattern but eh ... *cringe and look away*
    # Note: Native official Claude avoids issues with built-in ripgrep.node breakage
    - name: Install Claude Code via official script
      ansible.builtin.shell: |
        curl -fsSL https://claude.ai/install.sh | bash -s latest
      environment:
        HOME: "{{ ansible_user_dir }}"
      when: not claude_binary_check.stat.exists or not claude_binary_check.stat.executable

    # Verify installation succeeded
    - name: Verify Claude installation
      ansible.builtin.command: "{{ ansible_user_dir }}/.local/bin/claude --version"
      register: claude_version_check
      changed_when: false
      failed_when: claude_version_check.rc != 0

    # Rust installation moved to cli_nix_migrated - Nix provides rustc and cargo

    # sccache and atuin installation moved to cli_nix_migrated role

    # Import claude-mcp after Claude Code is installed
    - import_role:
        name: claude-mcp
      tags: [claude, mcp]

