---
# Install build dependencies for Rust crates
- name: Install build dependencies for Rust tools
  become: true
  ansible.builtin.apt:
    name:
      - libssl-dev  # Required for sccache and other rust crates
      - pkg-config  # Required for finding libraries
    state: present

# User-level development tools
- name: Install user-level development tools
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  block:
    # Special handling for ansible due to broken metadata
    - name: Force reinstall ansible if it has broken metadata
      community.general.pipx:
        name: ansible
        state: reinstall
      ignore_errors: true

    - name: Install dev env PyPI packages via pipx
      community.general.pipx:
        name: "{{ item }}"
        state: present
      loop:
        - speedtest-cli
        - autopep8
        - ruff
        - pre-commit
        - ansible  # Get newer version than Ubuntu 22.04's ancient one
        # - libcst  # Python concrete syntax tree library for refactoring ... doesn't seem to exist in pipx:w
        - pydeps  # Python dependency graph visualization

    - name: Install Node.js CLI tools globally (user-level)
      community.general.npm:
        name: "{{ item }}"
        global: true  # Install globally within user's npm environment
      loop:
        - '@openai/codex'
        # - '@anthropic-ai/claude-code'  # Now installed via official script below
        - '@bazel/bazelisk'
        - '@ast-grep/cli'  # For semantic code queries across multiple languages
        - 'jscpd'  # Copy/paste detector for 150+ languages including Python, TypeScript
        - 'madge'  # Dependency graph visualization tool
        - 'pyright'  # Python language server for static type checking

    # Check for npm-global Claude installation
    - name: Check if Claude is installed via npm-global
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.npm-global/bin/claude"
      register: npm_global_claude
      changed_when: false

    - name: Fail if npm-global Claude installation exists
      ansible.builtin.fail:
        msg: |
          ERROR: Claude is installed via npm-global at ~/.npm-global/bin/claude
          This conflicts with the native installation.
          Remove it with: npm uninstall -g @anthropic-ai/claude-code
          Then re-run this playbook.
      when: npm_global_claude.stat.exists

    # Check if claude binary is actually executable
    - name: Check if Claude binary exists and is executable
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.local/bin/claude"
      register: claude_binary_check

    # Install Claude via official installation script
    # TODO: Not super fond of curl|bash pattern but eh ... *cringe and look away*
    # Note: Native official Claude avoids issues with built-in ripgrep.node breakage
    - name: Install Claude Code via official script
      ansible.builtin.shell: |
        curl -fsSL https://claude.ai/install.sh | bash -s latest
      environment:
        HOME: "{{ ansible_user_dir }}"
      when: not claude_binary_check.stat.exists or not claude_binary_check.stat.executable

    # Verify installation succeeded
    - name: Verify Claude installation
      ansible.builtin.command: "{{ ansible_user_dir }}/.local/bin/claude --version"
      register: claude_version_check
      changed_when: false
      failed_when: claude_version_check.rc != 0

    # Install Rust development tools
    - name: Check if cargo is installed
      command: which cargo
      register: cargo_check
      failed_when: false
      changed_when: false

    - name: Install Rust via rustup
      shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "~/.cargo/bin/cargo"
      when: cargo_check.rc != 0

    - name: Ensure cargo bin directory exists
      ansible.builtin.file:
        path: "~/.cargo/bin"
        state: directory
        mode: '0755'

    - name: Install sccache via cargo
      ansible.builtin.shell: |
        source ~/.profile
        # Temporarily disable RUSTC_WRAPPER since ~/.cargo/config.toml configures
        # cargo to use sccache, but sccache is not installed yet (chicken-and-egg)
        RUSTC_WRAPPER="" cargo install sccache --locked
      args:
        creates: "~/.cargo/bin/sccache"
        executable: /bin/bash
      # Note: Cargo is configured to use sccache via ~/.cargo/config.toml dotfile

    - name: Install atuin via cargo
      ansible.builtin.command: cargo install atuin --locked
      args:
        creates: "~/.cargo/bin/atuin"

    # Import claude-mcp after Claude Code is installed
    - import_role:
        name: claude-mcp
      tags: [claude, mcp]

# Install comby for structural code search and replace
- import_tasks: comby.yml
  tags: [comby, dev-tools]

# Install GitHub CLI (gh) for GitHub operations
- import_tasks: github_cli.yml
  tags: [gh, github, dev-tools]

# Install GitLab CLI (glab) for GitLab operations
- import_tasks: glab.yml
  tags: [glab, gitlab, dev-tools]

# Install gitstatus for wt tool
- import_tasks: gitstatus.yml
  tags: [gitstatus, dev-tools]

# Install kubeseal for Sealed Secrets
- import_tasks: kubeseal.yml
  tags: [kubeseal, k8s, dev-tools]
