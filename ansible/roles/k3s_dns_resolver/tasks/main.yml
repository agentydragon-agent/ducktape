---
# Configure systemd-resolved to forward cluster.local queries to k3s CoreDNS
# This enables all cluster DNS names to work from the host

- name: Create systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'
  tags: [k3s, dns]

- name: Configure DNS forwarding for cluster.local domains
  ansible.builtin.copy:
    content: |
      # Forward k8s cluster DNS queries to CoreDNS
      [Resolve]
      DNS=10.43.0.10
      Domains=~cluster.local ~svc.cluster.local ~pod.cluster.local
    dest: /etc/systemd/resolved.conf.d/k3s-cluster.conf
    mode: '0644'
  notify: restart systemd-resolved
  tags: [k3s, dns]

- name: Restart and enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
    enabled: true
    daemon_reload: true
  tags: [k3s, dns]

- name: Wait for systemd-resolved to be ready
  ansible.builtin.pause:
    seconds: 2
  tags: [k3s, dns]

- name: Verify cluster DNS resolution works
  ansible.builtin.shell: |
    systemd-resolve registry.registry.svc.cluster.local || \
    resolvectl query registry.registry.svc.cluster.local || \
    nslookup registry.registry.svc.cluster.local 10.43.0.10
  register: dns_test
  changed_when: false
  failed_when: false
  tags: [k3s, dns]

- name: Display DNS test result
  ansible.builtin.debug:
    msg: "{{ dns_test.stdout_lines }}"
  when: dns_test.rc == 0
  tags: [k3s, dns]
