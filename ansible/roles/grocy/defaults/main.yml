---
# Default variables for the Grocy role.

# Port on the host (localhost) to bind the Grocy container to. The container
# exposes port 80 internally which will be mapped to this port on 127.0.0.1 so
# that a reverse-proxy (e.g. nginx) can forward external requests.

grocy_localhost_http_port: 9283

# Time-zone that will be passed to the container via the TZ environment
# variable.  Override from inventory or the playbook if necessary.

grocy_timezone: "America/Los_Angeles"

# Whether Grocy should be deployed and exposed.
#
# true  => Ansible provisions the Grocy Docker container and nginx reverse
#         -proxy configuration.
# false => Ansible makes sure the Grocy container is stopped/removed **and**
#          the nginx site configuration is absent.  Any data stored on the
#          host (e.g. in /srv/grocy) is left untouched so that the service can
#          be re-enabled later without data loss.

# Desired state of the Grocy service.
# "present" – the service is installed/running and nginx reverse-proxy site is
#             present.
# "absent"  – the service is stopped/removed and the nginx site configuration
#             is absent.  On-disk data in /srv/grocy is kept intact.

grocy_state: "present"
