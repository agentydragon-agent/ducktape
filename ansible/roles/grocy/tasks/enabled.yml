---
# Grocy enabled – install and run the service.

# ---------------------------------------------------------------------------
# Obtain / renew TLS certificate *before* nginx picks up the site config so
# that nginx does not fail to start due to missing files.
# ---------------------------------------------------------------------------

- name: "Grocy | Obtain Let’s Encrypt certificate"
  ansible.builtin.import_role:
    name: letsencrypt
  vars:
    letsencrypt_cert_name: "grocy.agentydragon.com"
    letsencrypt_domains:
      - "grocy.agentydragon.com"
# e-mail handled inside letsencrypt role

# Most of these tasks must run with elevated privileges because they manage
# system users/groups and interact with the Docker daemon.  The playbook
# calling this role is expected to execute as root (remote_user: root) or use
# become: true.

- name: Ensure python3-pip is present (required for the Docker SDK)
  ansible.builtin.apt:
    name: python3-pip
    state: present

# - name: Ensure docker Python package is present (dependency of docker_container)
#   ansible.builtin.pip:
#     name: docker

- name: Create Grocy system group
  ansible.builtin.group:
    name: grocy
    state: present

- name: Create Grocy service account
  ansible.builtin.user:
    name: grocy
    group: grocy
  register: _grocy_user

# Retrieve the group information to get its numeric GID which will be supplied
# to the container through the PGID environment variable.
- name: Fetch Grocy group information
  ansible.builtin.getent:
    database: group
    key: grocy
  register: _grocy_group

- name: Ensure Grocy data directory exists
  ansible.builtin.file:
    path: /srv/grocy
    state: directory
    owner: grocy
    group: grocy
    mode: "0700"

- name: Start Grocy Docker container
  community.docker.docker_container:
    container_default_behavior: no_defaults
    detach: true
    init: false
    interactive: false

    # The linuxserver.io image unfortunately expects to run as root inside the
    # container, so we keep that.  File-system permissions are handled by
    # PUID/PGID environment variables.
    user: root

    paused: false
    privileged: false
    read_only: false
    tty: false

    name: grocy
    image: lscr.io/linuxserver/grocy:latest

    env:
      TZ: "{{ grocy_timezone }}"
      PUID: "{{ _grocy_user.uid }}"
      PGID: "{{ _grocy_group.ansible_facts.getent_group['grocy'][2] }}"

    published_ports:
      # Expose Grocy on localhost only.
      - "127.0.0.1:{{ grocy_localhost_http_port }}:80"

    volumes:
      - /srv/grocy:/config

    restart: true
    restart_policy: unless-stopped

    pull: true

  tags:
    - grocy

# ---------------------------------------------------------------------------
# nginx reverse-proxy site
# ---------------------------------------------------------------------------

- name: Install nginx site configuration for Grocy (available)
  ansible.builtin.template:
    src: grocy.agentydragon.com.j2
    dest: /etc/nginx/sites-available/grocy.agentydragon.com
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site for Grocy (create symlink)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/grocy.agentydragon.com
    dest: /etc/nginx/sites-enabled/grocy.agentydragon.com
    state: link
  notify: Reload nginx
