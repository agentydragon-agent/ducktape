---
# Grocy disabled – ensure the service is **not** running and is not exposed
# by nginx.  Any on-disk data is retained so that the service can be re-enabled
# later without loss.

- name: Stop and remove Grocy Docker container if present
  community.docker.docker_container:
    name: grocy
    state: absent

- name: Remove Grocy nginx site configuration (available)
  ansible.builtin.file:
    path: /etc/nginx/sites-available/grocy.agentydragon.com
    state: absent
  notify: Reload nginx

- name: Remove Grocy nginx site configuration (enabled symlink)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/grocy.agentydragon.com
    state: absent
  notify: Reload nginx
