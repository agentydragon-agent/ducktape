---
# Dispatcher which decides whether Grocy should be enabled or disabled based
# on the `grocy_state` variable ("present"/"absent").  Using a string mirrors
# the familiar `state` parameter pattern found in many Ansible modules.

- name: Include tasks to **enable** Grocy
  ansible.builtin.include_tasks: enabled.yml
  when: (grocy_state | default('present')) in ['present', 'enabled', 'on']

- name: Include tasks to **disable** Grocy
  ansible.builtin.include_tasks: disabled.yml
  when: (grocy_state | default('present')) in ['absent', 'disabled', 'off']
