---
# Install GitLab CLI (glab) using GitHub release plugins
- name: Install GitLab CLI
  github_release_install:
    release_spec:
      repo: "profclems/glab"
      version: "latest"
      asset_pattern: ".*Linux_x86_64\\.deb$"
    method: deb
  become: true
  when: common_dpkg_arch == "amd64"
  tags: glab
