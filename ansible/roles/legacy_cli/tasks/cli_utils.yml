---
# CLI utilities moved from main cli role (2024-11-13)
# These are now provided by Nix home-manager

- name: Install legacy CLI utilities for non-Nix systems
  become: true
  ansible.builtin.apt:
    pkg:
      - mc # Midnight Commander (file manager)
      - xxd # Hex dump utility
      - nethogs # Network bandwidth monitoring
      - mmv # Multiple move/rename utility
      - gnuplot # Plotting program
      - screen # Terminal multiplexer (deprecated, use tmux)
    state: present
