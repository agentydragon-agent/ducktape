---
# These tools are now installed via home.nix but kept here for non-Nix systems

- name: Install sccache via cargo
  ansible.builtin.shell: |
    source ~/.profile
    # Temporarily disable RUSTC_WRAPPER since ~/.cargo/config.toml configures
    # cargo to use sccache, but sccache is not installed yet (chicken-and-egg)
    RUSTC_WRAPPER="" cargo install sccache --locked
  args:
    creates: "~/.cargo/bin/sccache"
    executable: /bin/bash
  # Note: Cargo is configured to use sccache via ~/.cargo/config.toml dotfile
