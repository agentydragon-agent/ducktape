---
# These Python tools are now installed via home.nix but kept here for non-Nix systems
# Pipx infrastructure moved from cli role (2024-11-13)

# Modern systems require using pipx or apt for Python CLI tools
- name: Install pipx for Python CLI tools
  become: true
  ansible.builtin.apt:
    pkg:
      - pipx
    state: latest

# Upgrade pipx to latest version via pip (Ubuntu package is too old)
- name: Upgrade pipx to latest version via pip
  become: true
  become_user: "{{ legacy_cli_user | default(ansible_user_id) }}"
  ansible.builtin.pip:
    name: pipx
    state: latest
    extra_args: --user --upgrade --force-reinstall

# Ensure the user's pipx is in PATH for subsequent tasks
- name: Add user's local bin to PATH for pipx
  ansible.builtin.set_fact:
    ansible_env: "{{ ansible_env | combine({'PATH': ansible_env.PATH + ':' + ansible_user_dir + '/.local/bin'}) }}"

- name: Force reinstall ansible if it has broken metadata
  community.general.pipx:
    name: ansible
    state: reinstall
  failed_when: false

- name: Install dev env PyPI packages via pipx
  community.general.pipx:
    name: "{{ item }}"
    state: present
  loop:
    - speedtest-cli
    - autopep8
    # - libcst  # Python concrete syntax tree library for refactoring ... doesn't seem to exist in pipx:w
    - pydeps # Python dependency graph visualization
