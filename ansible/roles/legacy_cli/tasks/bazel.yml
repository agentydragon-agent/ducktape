---
# Bazel installation moved from main cli role (2024-11-13)
# Now provided by bazelisk in Nix home-manager

- name: Manage Bazel for non-Nix systems
  when: ansible_architecture == "amd64"
  tags:
    - bazel
  become: true
  block:
    - name: Manage Bazel APT repository
      ansible.builtin.deb822_repository:
        name: bazel
        types: [deb]
        uris:
          - https://storage.googleapis.com/bazel-apt
        signed_by: https://bazel.build/bazel-release.pub.gpg
        suites: [stable]
        components: [jdk1.8]
        architectures: [amd64] # no i386 included
        state: "{{ legacy_bazel_state | default('present') }}"
        enabled: "{{ legacy_bazel_state | default('present') == 'present' }}"

    - name: Manage Bazel package
      ansible.builtin.apt:
        pkg: bazel
        state: "{{ legacy_bazel_state | default('present') }}"
        update_cache: true # deb822_repository doesn't reliably trigger apt cache update
