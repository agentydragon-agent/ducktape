---
# Neovim installation for non-Nix systems
# Nix systems use unstablePkgs.neovim instead

# Install Neovim from unstable PPA to get version 0.11+
- name: Add Neovim unstable PPA
  become: true
  ansible.builtin.deb822_repository:
    name: neovim-unstable
    uris: https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    architectures: ["{{ common_dpkg_arch }}"]
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x9DBB0BE9366964F134855E2255F96FCF8231B6DD
  when: not (skip_ubuntu_ppas | default(false))

# Install Neovim separately to ensure it updates from PPA
- name: Install/Update Neovim from unstable PPA
  become: true
  ansible.builtin.apt:
    name: neovim
    state: latest

# Neovim version validation (moved from cli role)
- name: Check Neovim is >= 0.11 (for DEC mode 2031 for auto color scheme switching)
  block:
    - name: Get Neovim version
      ansible.builtin.command: nvim --version
      register: raw_nvim_version
      changed_when: false

    - name: Parse clean Neovim version string (strip prefix and suffix)
      ansible.builtin.set_fact:
        nvim_version_string: >-
          {{ raw_nvim_version.stdout_lines[0] |
             regex_replace('^NVIM v(\\d+\\.\\d+(?:\\.\\d+)?).*', '\\1') }}

    - name: Fail if version parsing failed
      ansible.builtin.fail:
        msg: "Couldn't parse Neovim version from: {{ raw_nvim_version }}"
      when: nvim_version_string is not defined or nvim_version_string == ''

    - name: Assert Neovim is at least 0.11
      ansible.builtin.assert:
        that:
          - "nvim_version_string is version('0.11', '>=')"
        fail_msg: "Neovim must be at least 0.11, got {{ nvim_version_string }}"

