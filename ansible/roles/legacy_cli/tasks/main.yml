---
# Migrated to Nix: autopep8, ruff, pre-commit, speedtest-cli, ansible, pydeps,
# atuin, sccache, bazelisk, ast-grep, pyright, comby

# Tasks migrated to Nix home-manager
# These are kept here for non-Nix systems but skipped on machines using home-manager

- name: Install Node.js tools via pnpm
  ansible.builtin.include_tasks: pnpm_tools.yml
  tags: [pnpm]

- name: Install Rust tools via cargo
  ansible.builtin.include_tasks: cargo_tools.yml
  tags: [cargo]

# oh_my_zsh.yml moved to Nix home-manager (programs.zsh.oh-my-zsh)

# Development tools installed via various methods
- name: Install Comby code transformation tool
  ansible.builtin.include_tasks: comby.yml
  tags: [comby, dev-tools]

- name: Install GitLab CLI
  ansible.builtin.include_tasks: glab.yml
  tags: [glab, gitlab, dev-tools]

- name: Install gitstatus for fast git prompt
  ansible.builtin.include_tasks: gitstatus.yml
  tags: [gitstatus, dev-tools]

- name: Install Node.js runtime
  ansible.builtin.include_tasks: nodejs.yml
  tags: [nodejs]

- name: Install Rust toolchain
  ansible.builtin.include_tasks: rust.yml
  tags: [rust]

# CLI utilities moved from main cli role
- name: Install CLI utilities for non-Nix systems
  ansible.builtin.include_tasks: cli_utils.yml
  tags: [cli_utils]

# Claude MCP configuration (legacy setup)
- name: Apply Claude MCP role
  ansible.builtin.import_role:
    name: legacy_claude_mcp
  tags: [claude, mcp]
