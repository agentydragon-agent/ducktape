---
# Default variables for the llm_html role

# Fully-qualified domain name under which the service is reachable
llm_html_domain: "llm.agentydragon.com"

# Host port where the container's HTTP interface is exposed
llm_html_host_port: 9000

# Directory that holds data and configuration
llm_html_data_dir: "/opt/llm-html"