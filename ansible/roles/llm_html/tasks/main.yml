---
# Deploy llm_html behind nginx on its own sub-domain:
#   1. Obtain / renew Let's Encrypt certificate for the sub-domain
#   2. Build (or pull) the Docker image from Git
#   3. Run / update the container
#   4. Install nginx reverse-proxy site and reload nginx

# ---------------------------------------------------------------------------
# Certificate (must exist before nginx site is enabled)
# ---------------------------------------------------------------------------

- name: "obtain Let's Encrypt certificate"
  ansible.builtin.import_role:
    name: letsencrypt
  vars:
    letsencrypt_cert_name: "{{ llm_html_domain }}"
    letsencrypt_domains:
      - "{{ llm_html_domain }}"

# ---------------------------------------------------------------------------
# Persistent data directory
# ---------------------------------------------------------------------------

- name: "Create data directory"
  ansible.builtin.file:
    path: "{{ llm_html_data_dir }}"
    state: directory
    mode: "0755"

# ---------------------------------------------------------------------------
# Build latest image from Git
# ---------------------------------------------------------------------------

- name: "Build llm_html image from Git"
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - build
      - -f
      - Dockerfile
      - -t
      - llm-html:latest
      - https://gitlab.com/agentydragon/ducktape.git#devel:llm/html
    chdir: /tmp
  register: _build_result
  changed_when: false

# ---------------------------------------------------------------------------
# Run / update container
# ---------------------------------------------------------------------------

- name: "Run llm_html container"
  community.docker.docker_container:
    name: llm_html
    image: llm-html:latest
    recreate: yes
    restart_policy: unless-stopped
    volumes:
      - "{{ llm_html_data_dir }}:/data"
    published_ports:
      - "{{ llm_html_host_port }}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ---------------------------------------------------------------------------
# nginx reverse-proxy site
# ---------------------------------------------------------------------------

- name: "Install nginx site configuration (available)"
  ansible.builtin.template:
    src: llm_html.nginx.j2
    dest: "/etc/nginx/sites-available/{{ llm_html_domain }}"
    mode: "0644"
  notify: Reload nginx

- name: "Enable nginx site (symlink)"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ llm_html_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ llm_html_domain }}"
    state: link
  notify: Reload nginx