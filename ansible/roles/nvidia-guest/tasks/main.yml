---
# NVIDIA driver installation for guest VM (wyrm)
# This role installs NVIDIA drivers and utilities in the VM

- name: Check if running in VM with GPU passthrough
  ansible.builtin.shell: |
    lspci | grep -i nvidia || true
  register: nvidia_gpu_present
  changed_when: false
  tags: [nvidia, detect]

- name: Add NVIDIA driver repository
  become: true
  ansible.builtin.apt_repository:
    repo: "ppa:graphics-drivers/ppa"
    state: present
    update_cache: yes
  when:
    - nvidia_gpu_present.stdout != ""
    - ansible_distribution == "Ubuntu" or ansible_distribution == "Pop!_OS"
  tags: [nvidia, repository]

- name: Install NVIDIA drivers and utilities
  become: true
  ansible.builtin.apt:
    name:
      - nvidia-driver-550  # Latest stable driver
      - nvidia-utils-550
      - nvidia-cuda-toolkit
      - nvidia-container-toolkit  # For Docker GPU support
      - nvtop  # GPU monitoring tool
    state: present
    update_cache: yes
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, drivers]

- name: Configure X11 for NVIDIA
  become: true
  ansible.builtin.copy:
    content: |
      Section "Device"
          Identifier     "Device0"
          Driver         "nvidia"
          VendorName     "NVIDIA Corporation"
          Option         "AllowEmptyInitialConfiguration" "True"
      EndSection
    dest: /etc/X11/xorg.conf.d/10-nvidia.conf
    owner: root
    group: root
    mode: '0644'
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, x11]

- name: Configure Docker for GPU support
  become: true
  ansible.builtin.copy:
    content: |
      {
        "runtimes": {
          "nvidia": {
            "path": "nvidia-container-runtime",
            "runtimeArgs": []
          }
        },
        "default-runtime": "nvidia"
      }
    dest: /etc/docker/daemon.json.d/nvidia.json
    owner: root
    group: root
    mode: '0644'
  when:
    - nvidia_gpu_present.stdout != ""
    - "'docker' in ansible_facts.packages"
  notify: restart docker
  tags: [nvidia, docker]

- name: Create nvidia-persistenced systemd service
  become: true
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=NVIDIA Persistence Daemon
      Wants=syslog.target

      [Service]
      Type=forking
      ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced
      ExecStopPost=/bin/rm -rf /var/run/nvidia-persistenced
      Restart=always

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/nvidia-persistenced.service
    owner: root
    group: root
    mode: '0644'
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, systemd]

- name: Create nvidia-persistenced user
  become: true
  ansible.builtin.user:
    name: nvidia-persistenced
    system: yes
    shell: /usr/sbin/nologin
    home: /var/run/nvidia-persistenced
    create_home: no
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, users]

- name: Enable nvidia-persistenced service
  become: true
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: yes
    daemon_reload: yes
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, systemd]

- name: Install machine learning GPU libraries
  become: true
  ansible.builtin.apt:
    name:
      - libcudnn8
      - libcudnn8-dev
      - libnccl2
      - libnccl-dev
    state: present
  when:
    - nvidia_gpu_present.stdout != ""
    - include_ml_libraries | default(false)
  tags: [nvidia, ml]

- name: Set CUDA environment variables
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.profile"
    block: |
      # CUDA configuration
      export PATH=/usr/local/cuda/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
    marker: "# {mark} ANSIBLE MANAGED BLOCK - CUDA"
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, environment]

- name: Display GPU status
  ansible.builtin.shell: |
    nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || echo "NVIDIA driver not loaded yet"
  register: gpu_status
  changed_when: false
  when: nvidia_gpu_present.stdout != ""
  tags: [nvidia, status]

- name: Show GPU configuration status
  ansible.builtin.debug:
    msg: |
      NVIDIA GPU Configuration:
      {% if nvidia_gpu_present.stdout != "" %}
      GPU Detected: Yes
      Status: {{ gpu_status.stdout }}

      To test GPU:
      - Run: nvidia-smi
      - Test CUDA: nvcc --version
      - Monitor GPU: nvtop
      {% else %}
      GPU Detected: No
      Make sure GPU passthrough is configured on the host.
      {% endif %}
  tags: [nvidia, status]
