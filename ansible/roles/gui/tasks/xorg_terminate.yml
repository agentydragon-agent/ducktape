- name: Enable Ctrl+Alt+Backspace to terminate X server
  become: true
  tags:
    - xorg_terminate
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/20-enable-ctrl-alt-backspace.conf
    content: |
      Section "InputClass"
          Identifier "Keyboard Defaults"
          MatchIsKeyboard "yes"
          Option "XkbOptions" "terminate:ctrl_alt_bksp"
      EndSection
    owner: root
    group: root
    mode: '0644'
