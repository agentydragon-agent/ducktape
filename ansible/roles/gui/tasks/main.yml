---
- include_tasks: tasks/night_theme_switcher_gnome_terminal.yaml
- include_tasks: tasks/gnome_panel_iso8601.yaml
- name: Ensure no retired packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - xtermcontrol  # 2025-04-13: not needed anymore, was for Vim bg color auto-switch
      - qshutdown     # 2025-04-13: was trying as timekpr alrernative, no longer needed

- name: Install GUI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # Already default in Pop! OS: gnome-shell  locate
      - android-tools-adb
      - blender
      - chrome-gnome-shell
      - dconf-editor
      - flameshot  # Nice screenshot tool.
      - geeqie
      - gimp
      - gnome-tweaks
      - gnupg-agent
      - kicad # Some hacking stuff
      - kiwix # For offline Wikipedia etc.
      - krita
      - libreoffice
      - mplayer
      - mpv
      - openjdk-8-jdk
      - snapd # For Telegram etc.
      - torbrowser-launcher
      - transmission-gtk
      - tuxguitar
      - virtualbox
      - virtualbox-dkms
      - vlc
      - wine-stable
      - wireshark
      - xclip
      - xournal

      # TODO: add Ubuntu startup programs, like Flameshot etc.

- name: VSCode
  install_handler:
    apt: code
    snap: { name: code, classic: true }
    use: snap

- name: FreeCAD
  install_handler:
    apt: freecad
    snap: freecad
    use: snap

- name: Install Rescuetime
  tags:
    - rescuetime
  become: true
  when: ansible_architecture in ["amd64", "x86_64"]
  ansible.builtin.apt:
    deb: https://www.rescuetime.com/installers/rescuetime_current_amd64.deb

- name: Install snaps
  become: true
  snap:
    name:
    - whatsdesk
    - yt-dlp

- name: Ensure no youtube-dl (deprecated)
  become: true
  snap:
    name: youtube-dl
    state: absent

- name: Telegram
  install_handler:
    apt: telegram-desktop
    snap: telegram-desktop
    # trying out on 2023-11-24: install Telegram as snap
    # if it still works in a couple months, keep it like this
    # 2025-04-13 seems to work at least on gpd?
    use: snap

- name: Slack
  install_handler:
    apt: slack-desktop
    snap: slack
    # Slack has to be installed as an APT package, not as a Snap.
    #
    # Slack Snap on Pop OS won't start because it's confined from reading
    # Pop OS's bespoke /etc/os-release location - /etc/pop-os/os-release.
    # See: https://forum.snapcraft.io/t/apparmor-blocking-the-opening-of-slack/29212
    use: apt

- include_tasks: tasks/discord-minimized.yaml

- name: Update githooks
  tags:
    - githooks
  # should only succeed if we don't need to update
  ansible.builtin.shell: git hooks update --no


- include_tasks: tasks/wezterm.yaml

- name: Hide gnome-terminal menu
  tags:
    - gnome-terminal
  ansible.builtin.command: |
    gsettings set
      org.gnome.Terminal.Legacy.Settings default-show-menubar false

- name: Set GNOME default terminal to gnome-terminal
  tags:
  - gnome-terminal
  block:
  - name: Set GNOME default terminal to gnome-terminal.wrapper
    community.general.gsettings:
      schema: org.gnome.desktop.default-applications.terminal
      key: exec
      value: "'gnome-terminal.wrapper'"
  - name: Expicitly set GNOME default terminal exec-arg empty
    community.general.gsettings:
      schema: org.gnome.desktop.default-applications.terminal
      key: exec-arg
      value: "''"

- include_tasks: tasks/wm_datetime_format.yaml
- include_tasks: tasks/gnome_preferences.yaml
- include_tasks: tasks/xorg_terminate.yaml
- include_tasks: tasks/element.yaml
  tags: element

- name: Google Chrome
  when: ansible_architecture in ["amd64", "x86_64"]
  block:
  - name: Add google APT repository
    become: true
    ansible.builtin.deb822_repository:
      name: google
      types: [deb]
      uris:
        - http://dl.google.com/linux/chrome/deb
      signed_by: https://dl-ssl.google.com/linux/linux_signing_key.pub
      suites: [stable]
      components: [main]
      architectures: [amd64]  # no i386 included
      state: present
      enabled: yes

  - name: Install Google Chrome apt package
    become: true
    ansible.builtin.apt:
      pkg:
        - google-chrome-stable

