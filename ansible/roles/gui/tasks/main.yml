---
- include_tasks: tasks/night_theme_switcher_gnome_terminal.yml
- include_tasks: tasks/gnome_panel_iso8601.yml
- name: Ensure no retired packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - firefox-locale-cs
      - firefox-locale-de
      - gnome-getting-started-docs-cs
      - gnome-getting-started-docs-de
      - gnome-user-docs-cs
      - gnome-user-docs-de
      - language-pack-cs
      - language-pack-cs-base
      - language-pack-de
      - language-pack-gnome-cs
      - language-pack-gnome-cs-base
      - language-pack-gnome-de
      - libreoffice-help-cs
      - libreoffice-help-de
      - libreoffice-help-en-gb
      # libreoffice-help-en-us OK
      - libreoffice-l10n-cs
      - libreoffice-l10n-de
      - libreoffice-l10n-en-gb
      - qshutdown     # 2025-04-13: was trying as timekpr alrernative, no longer needed
      - xournal       # 2025-04-14: replace with xournalpp
      - xtermcontrol  # 2025-04-13: not needed anymore, was for Vim bg color auto-switch
      - youtube-dl    # 2025-04-14: replace with yt-dlp


- name: Install GUI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # Already default in Pop! OS: gnome-shell
      - audacity
      - blender
      - chrome-gnome-shell
      - dconf-editor
      - flameshot  # Nice screenshot tool.
      - geeqie
      - gimp
      - gnome-tweaks
      - kdenlive  # Video editor
      - kiwix # For offline Wikipedia etc.
      - krita
      - libreoffice
      - mplayer
      - psensor
      - mpv
      - openjdk-8-jdk
      - openscad
      - snapd # For Telegram etc.
      - torbrowser-launcher
      - transmission-gtk
      - tuxguitar
      - vinagre  # VNC client
      - virtualbox
      - virtualbox-dkms
      - vlc
      - wine-stable
      - winetricks
      - wireshark
      - xclip
      - xournalpp
      # TODO: add Ubuntu startup programs, like Flameshot etc.

      - fonts-bebas-neue
      - fonts-roboto

- include_tasks: tasks/obs_studio.yml
- include_tasks: tasks/kicad.yml

- name: VSCode
  install_handler:
    apt: code
    snap: { name: code, classic: true }
    use: snap

- name: FreeCAD
  install_handler:
    apt: freecad
    snap: freecad
    use: snap


- name: Install Rescuetime
  tags: [rescuetime]
  become: true
  when: ansible_architecture in ["amd64", "x86_64"]
  ansible.builtin.apt:
    deb: "https://www.rescuetime.com/installers/rescuetime_current_{{ dpkg_arch }}.deb"

- name: Install snaps
  become: true
  snap:
    name:
    - whatsdesk
    - yt-dlp

- name: Ensure no youtube-dl (deprecated)
  become: true
  snap:
    name: youtube-dl
    state: absent

- name: Telegram
  install_handler:
    apt: telegram-desktop
    snap: telegram-desktop
    # trying out on 2023-11-24: install Telegram as snap
    # if it still works in a couple months, keep it like this
    # 2025-04-13 seems to work at least on gpd?
    use: snap

- name: Slack
  install_handler:
    apt: slack-desktop
    snap: slack
    # Slack has to be installed as an APT package, not as a Snap.
    #
    # Slack Snap on Pop OS won't start because it's confined from reading
    # Pop OS's bespoke /etc/os-release location - /etc/pop-os/os-release.
    # See: https://forum.snapcraft.io/t/apparmor-blocking-the-opening-of-slack/29212
    use: apt

- include_tasks: tasks/discord-minimized.yml
- include_tasks: tasks/wezterm.yml

- name: Hide gnome-terminal menu
  tags:
    - gnome-terminal
  community.general.dconf:
    key: "/org/gnome/terminal/legacy/default-show-menubar"
    value: false

- name: Set GNOME default terminal to gnome-terminal
  tags: [gnome-terminal]
  block:
  - name: Set GNOME default terminal to gnome-terminal.wrapper
    community.general.dconf:
      key: "/org/gnome/desktop/applications/terminal/exec"
      value: "'gnome-terminal.wrapper'"
  - name: Expicitly set GNOME default terminal exec-arg empty
    community.general.dconf:
      key: "/org/gnome/desktop/applications/terminal/exec-arg"
      state: absent

- include_tasks: tasks/wm_datetime_format.yml
- include_tasks: tasks/gnome_preferences.yml
- include_tasks: tasks/xorg_terminate.yml
- include_tasks: tasks/element.yml
  tags: element
- include_tasks: tasks/google_chrome.yml


# TODO: install Tana from: https://github.com/tanainc/tana-desktop-releases
# -> install 'tana_1.0.26_amd64.deb' from last release
