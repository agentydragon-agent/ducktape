---
- name: Ensure no retired packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - firefox-locale-cs
      - firefox-locale-de
      - gnome-getting-started-docs-cs
      - gnome-getting-started-docs-de
      - gnome-user-docs-cs
      - gnome-user-docs-de
      - language-pack-cs
      - language-pack-cs-base
      - language-pack-de
      - language-pack-gnome-cs
      - language-pack-gnome-cs-base
      - language-pack-gnome-de
      - libreoffice-help-cs
      - libreoffice-help-de
      - libreoffice-help-en-gb
      # libreoffice-help-en-us OK
      - libreoffice-l10n-cs
      - libreoffice-l10n-de
      - libreoffice-l10n-en-gb
      - qshutdown     # 2025-04-13: was trying as timekpr alrernative, no longer needed
      - xournal       # 2025-04-14: replace with xournalpp
      - xtermcontrol  # 2025-04-13: not needed anymore, was for Vim bg color auto-switch
      - youtube-dl    # 2025-04-14: replace with yt-dlp


- name: Install GUI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # Already default in Pop! OS: gnome-shell
      - audacity
      - blender
      - chrome-gnome-shell
      - dconf-editor
      - geeqie
      - gimp
      - gnome-tweaks
      - kdenlive  # Video editor
      - kiwix # For offline Wikipedia etc.
      - krita
      - libreoffice
      - mplayer
      - mpv
      - openjdk-8-jdk
      - openscad
      - psensor
      - virt-viewer  # SPICE/VNC viewer for virtual machines (Proxmox viewer)
      - scrcpy # Android screen mirroring
      - snapd # For Telegram etc.
      - syncthing-gtk
      - torbrowser-launcher
      - transmission-gtk
      - tuxguitar
      - vinagre  # VNC client
      - virtualbox
      - virtualbox-dkms
      - vlc
      - wine-stable
      - winetricks
      - wireshark
      - xclip
      - xournalpp
      # TODO: add Ubuntu startup programs, like Flameshot etc.

      - fonts-bebas-neue
      - fonts-roboto

- include_tasks: obs_studio.yml
- include_tasks: kicad.yml

- name: VSCode
  install_handler:
    apt: code
    snap: { name: code, classic: true }
    use: snap

- name: FreeCAD
  install_handler:
    apt: freecad
    snap: freecad
    use: snap


- name: Install Rescuetime
  tags: [rescuetime]
  become: true
  when: ansible_architecture in ["amd64", "x86_64"]
  ansible.builtin.apt:
    deb: "https://www.rescuetime.com/installers/rescuetime_current_{{ dpkg_arch }}.deb"

- name: Install snaps
  become: true
  snap:
    name:
    - whatsdesk
    - yt-dlp

- name: Ensure no youtube-dl (deprecated)
  become: true
  snap:
    name: youtube-dl
    state: absent

- name: Telegram
  install_handler:
    apt: telegram-desktop
    snap: telegram-desktop
    flatpak: com.telegram.desktop
    # trying out on 2023-11-24: install Telegram as snap
    # if it still works in a couple months, keep it like this
    # 2025-04-13 seems to work at least on gpd?
    #
    # 2025-05-05: bug in snap: https://github.com/telegramdesktop/tdesktop/issues/29208
    # (missing tray icon due to AppArmor)
    use: snap

- name: Slack
  install_handler:
    apt: slack-desktop
    snap: slack
    # Slack has to be installed as an APT package, not as a Snap.
    #
    # Slack Snap on Pop OS won't start because it's confined from reading
    # Pop OS's bespoke /etc/os-release location - /etc/pop-os/os-release.
    # See: https://forum.snapcraft.io/t/apparmor-blocking-the-opening-of-slack/29212
    use: apt

# Discord autostart migrated to gui_nix_migrated, but package install remains:
- name: Ensure Discord is installed
  become: true
  apt:
    name: discord
    state: present
- include_tasks: wezterm.yml

# GNOME terminal configuration moved to gui_nix_migrated role

# wm_datetime_format.yml removed - datetime configuration moved to gui_nix_migrated role
- include_tasks: xorg_terminate.yml
- include_tasks: element.yml
  tags: element
- include_tasks: google_chrome.yml


# Install Tana desktop application
- import_tasks: tana.yml
  tags: tana

# AppImageLauncher installation with version acknowledgment
- name: Install AppImageLauncher
  github_release_install:
    release_spec:
      repo: "TheAssassin/AppImageLauncher"
      version: "v3.0.0-alpha-4"  # Pinned version
      acknowledged_version: "v3.0.0-alpha-4"
      asset_pattern: ".*_{{ dpkg_arch }}\\.deb$"
    method: deb
  become: true
  when: dpkg_arch == "amd64"
  tags: appimagelauncher

- import_tasks: syncthing.yml
  tags: syncthing

- import_tasks: login_event_webhook_reporter.yml
  tags: login_event_webhook_reporter

- import_tasks: tunneled_activitywatch.yml
  tags: activitywatch

- import_tasks: xdg_mime_types.yml
  tags: [mime, xdg]
