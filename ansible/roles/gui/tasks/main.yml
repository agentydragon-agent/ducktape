---
- name: Ensure no retired packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - firefox-locale-cs
      - firefox-locale-de
      - gnome-getting-started-docs-cs
      - gnome-getting-started-docs-de
      - gnome-user-docs-cs
      - gnome-user-docs-de
      - language-pack-cs
      - language-pack-cs-base
      - language-pack-de
      - language-pack-gnome-cs
      - language-pack-gnome-cs-base
      - language-pack-gnome-de
      - libreoffice-help-cs
      - libreoffice-help-de
      - libreoffice-help-en-gb
      # libreoffice-help-en-us OK
      - libreoffice-l10n-cs
      - libreoffice-l10n-de
      - libreoffice-l10n-en-gb
      - qshutdown # 2025-04-13: was trying as timekpr alrernative, no longer needed
      - xournal # 2025-04-14: replace with xournalpp
      - xtermcontrol # 2025-04-13: not needed anymore, was for Vim bg color auto-switch
      - youtube-dl # 2025-04-14: replace with yt-dlp

- name: Install GUI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # Already default in Pop! OS: gnome-shell
      # Moved to Nix: audacity, dconf-editor, discord, element-desktop, flameshot
      #   fonts-roboto, freecad, geeqie, gimp, gnome-tweaks, krita, mplayer, mpv
      #   openscad, scrcpy, transmission-gtk, virt-viewer, vlc, vscode, wireshark
      #   xclip, xournalpp, yt-dlp
      - blender
      - chrome-gnome-shell
      - kdenlive # Video editor
      - kiwix # For offline Wikipedia etc.
      - libreoffice
      - openjdk-8-jdk
      - psensor
      - snapd # For Telegram etc.
      - syncthing-gtk # Not available in nixpkgs, kept in apt
      - torbrowser-launcher
      - tuxguitar # Broken in nixpkgs (swt build failure), kept in apt
      - vinagre # VNC client
      - virtualbox
      - virtualbox-dkms
      - wine-stable
      - winetricks

      - fonts-bebas-neue

- name: Install OBS Studio
  ansible.builtin.include_tasks: obs_studio.yml
- name: Install KiCad
  ansible.builtin.include_tasks: kicad.yml

# Snaps now managed by Nix home-manager (nix/home/home.nix)
- name: Uninstall Nix-managed snaps
  become: true
  community.general.snap:
    name:
      - code # VSCode
      - freecad # FreeCAD
      - yt-dlp # YouTube downloader
    state: absent

- name: Install Rescuetime
  tags: [rescuetime]
  become: true
  when: ansible_architecture in ["amd64", "x86_64"]
  ansible.builtin.apt:
    deb: "https://www.rescuetime.com/installers/rescuetime_current_{{ common_dpkg_arch }}.deb"

- name: Install snaps
  become: true
  community.general.snap:
    name:
      - whatsdesk
      # yt-dlp moved to Nix

- name: Ensure no youtube-dl (deprecated)
  become: true
  community.general.snap:
    name: youtube-dl
    state: absent

- name: Telegram
  install_handler:
    apt: telegram-desktop
    snap: telegram-desktop
    flatpak: com.telegram.desktop
    # trying out on 2023-11-24: install Telegram as snap
    # if it still works in a couple months, keep it like this
    # 2025-04-13 seems to work at least on gpd?
    #
    # 2025-05-05: bug in snap: https://github.com/telegramdesktop/tdesktop/issues/29208
    # (missing tray icon due to AppArmor)
    use: snap

- name: Slack
  install_handler:
    apt: slack-desktop
    snap: slack
    # Slack has to be installed as an APT package, not as a Snap.
    #
    # Slack Snap on Pop OS won't start because it's confined from reading
    # Pop OS's bespoke /etc/os-release location - /etc/pop-os/os-release.
    # See: https://forum.snapcraft.io/t/apparmor-blocking-the-opening-of-slack/29212
    use: apt

# Packages now managed by Nix home-manager (nix/home/home.nix)
- name: Uninstall Nix-managed packages
  become: true
  ansible.builtin.apt:
    pkg:
      - audacity
      - dconf-editor
      - discord
      - element-desktop
      - flameshot
      - geeqie
      - gimp
      - gnome-tweaks
      - krita
      - mplayer
      - mpv
      - vlc
      - openscad
      - scrcpy
      - transmission-gtk
      - virt-viewer
      - wireshark
      - xclip
      - xournalpp
      - fonts-roboto
    state: absent

# Element external repository cleanup
- name: Remove Element.io repository and keyring
  tags: element
  become: true
  block:
    - name: Remove Element.io repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/element-io-archive-keyring.gpg]
          https://packages.element.io/debian/ default main
        filename: element-io
        state: absent
    - name: Remove Element keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/element-io-archive-keyring.gpg
        state: absent

# GNOME terminal configuration moved to legacy_without_home_manager/gui role
# Datetime format now managed by Nix: nix/home/modules/datetime-format.nix

- name: Configure X.org terminate shortcut
  ansible.builtin.include_tasks: xorg_terminate.yml
- name: Install Google Chrome
  ansible.builtin.include_tasks: google_chrome.yml

# Install Tana desktop application
- name: Install Tana desktop application
  ansible.builtin.import_tasks: tana.yml
  tags: tana

# AppImageLauncher installation with version acknowledgment
- name: Install AppImageLauncher
  github_release_install:
    release_spec:
      repo: "TheAssassin/AppImageLauncher"
      version: "v3.0.0-alpha-4" # Pinned version
      acknowledged_version: "v3.0.0-alpha-4"
      asset_pattern: ".*_{{ common_dpkg_arch }}\\.deb$"
    method: deb
  become: true
  when: common_dpkg_arch == "amd64"
  tags: appimagelauncher

# ActivityWatch is now managed by Nix home-manager
# See: nix/home/services/activitywatch.nix
# This task uninstalls the old system-level .deb package
- name: Uninstall system-level ActivityWatch package
  become: true
  ansible.builtin.apt:
    name: activitywatch
    state: absent
  tags: activitywatch

- name: Configure XDG MIME type associations
  ansible.builtin.import_tasks: xdg_mime_types.yml
  tags: [mime, xdg]
