- name: Install Tana desktop
  github_release_install:
    release_spec:
      repo: "tanainc/tana-desktop-releases"
      version: "latest"
      acknowledged_version: v1.0.51 # 1.0.33 = used for RE
      asset_pattern: "tana_.*_{{ common_dpkg_arch }}\\.deb$"
    method: deb
  become: true
  when: common_dpkg_arch == "amd64"
