---
# Dependencies of dconf module.
# https://docs.ansible.com/ansible/latest/collections/community/general/dconf_module.html#notes
- ansible.builtin.apt:
    pkg:
      - python3-pip
- ansible.builtin.pip:
    name:
      - psutil

# TODO: hmm, what WM did I write this for again?

- name: Set custom datetime indicator
  block:
  - name: Set date format to custom
    dconf:
      key: /com/canonical/indicator/datetime/time-format
      value: "'custom'"
  - name: Set date format in datetime indicator
    dconf:
      key: /com/canonical/indicator/datetime/custom-time-format
      value: "'%Y-%m-%d %H:%M:%S'"
  - name: Do show week numbers in datetime indicator
    dconf:
      key: /com/canonical/indicator/datetime/show-week-numbers
      value: "true"
