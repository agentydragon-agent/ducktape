# Discord is in Pop!_OS proprietary repo: http://apt.pop-os.org/properietaryI
- name: Set Discord to autostart, minimized
  block:
  - name: Ensure Discord is installed
    become: true
    apt:
      name: discord
      state: present

  - name: Install minimized Discord autostart entry
    autostart_entry:
      desktop_file_name: discord-minimized
      name: "Discord (minimized)"
      exec: "discord --start-minimized"
    register: discord_autostart_result

  - name: Check no conflicting Discord autostarts
    block:
    - name: List systemwide and per-user autostarts
      find:
        paths:
          - "{{ ansible_env.HOME }}/.config/autostart"
          - /etc/xdg/autostart
        patterns: "*.desktop"
      register: autostart_files

    - name: Read autostart file contents
      slurp:
        src: "{{ item.path }}"
      register: autostart_contents
      loop: "{{ autostart_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: item.path != discord_autostart_result.desktop_file_path

    - name: Fail if any other autostart launches Discord
      fail:
        msg: "Conflicting Discord autostart found: {{ item.item.path }}"
      loop: "{{ autostart_contents.results }}"
      loop_control:
        label: "{{ item.item.path | default('skipped') }}"
      when:
        - item.skipped is not defined or not item.skipped
        - item.content is defined
        - (item.content | b64decode) is search('^Exec=.*\bdiscord\b', multiline=True)
