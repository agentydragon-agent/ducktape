---
# Install Trilium client using GitHub release plugins
- name: Install Trilium client
  github_release_install:
    release_spec:
      repo: "zadam/trilium"
      version: "latest"
      asset_pattern: ".*_amd64\\.deb$"
    method: deb
  become: true
  when: common_dpkg_arch == "amd64"
  tags: trilium
