- name: OBS Studio
  block:
    - name: Enable OBS Studio PPA
      ansible.builtin.deb822_repository:
        name: obs-studio-ppa
        uris: https://ppa.launchpadcontent.net/obsproject/obs-studio/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [main]
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF425E228
      become: true

    - name: Install OBS Studio
      become: true
      ansible.builtin.apt:
        name: obs-studio
        state: present
        update_cache: true # deb822_repository doesn't reliably trigger apt cache update
