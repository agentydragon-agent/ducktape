- name: Workaround for black screen caused by Pop!_OS extensions
  block:
    - name: Disable possible culprit extensions
      include_role:
        name: disable_gnome_shell_extensions
      vars:
        gnome_shell_disable_extensions:
          - cosmic-workspaces@system76.com
          - popx11gestures@system76.com

    - name: Empty default Pop!_OS workspace/monitor shortcuts to free up Ctrl+Alt+Arrow
      ansible.builtin.dconf:
        key: "/org/gnome/shell/extensions/pop-shell/{{ item }}"
        value: "[]"
      loop:
        - pop-workspace-up
        - pop-workspace-down
        - pop-monitor-left
        - pop-monitor-right
        - pop-monitor-up
        - pop-monitor-down

    - name: Set GNOME Shell horizontal workspace switch shortcuts to Ctrl+Alt+Arrow
      ansible.builtin.dconf:
        key: "/org/gnome/desktop/wm/keybindings/{{ item.action }}"
        value: "['{{ item.binding }}']"
      loop:
        - { action: switch-to-workspace-left,  binding: "<Primary><Alt>Up" }
        - { action: switch-to-workspace-right, binding: "<Primary><Alt>Down" }
        - { action: move-to-workspace-left,    binding: "<Primary><Shift><Alt>Up" }
        - { action: move-to-workspace-right,   binding: "<Primary><Shift><Alt>Down" }
