# See:
#   - https://chatgpt.com/c/67fc3dbb-e81c-8011-9293-0b56569bc501
#   - https://chatgpt.com/c/680dcf24-9584-8011-a857-e7bda48399ea

- name: Disable possible culprit extensions for Pop!_OS black screen bug
  include_role:
    name: disable_gnome_shell_extensions
  vars:
    gnome_shell_disable_extensions:
      - cosmic-workspaces@system76.com
      - popx11gestures@system76.com

- name: Set up alternate Ctrl+Alt+(Shift+)Up/Down workspace switch+move shortcuts
  block:
  - name: Clear default Pop!_OS workspace/monitor shortcuts to free up Ctrl+Alt+↑/↓
    notify: reload pop-shell extension
    ansible.builtin.dconf:
      key: "/org/gnome/shell/extensions/pop-shell/{{ item }}"
      value: "@as []"
    loop:
      - pop-workspace-up
      - pop-workspace-down
      - pop-monitor-left
      - pop-monitor-right
      - pop-monitor-up
      - pop-monitor-down

  # (Should apply instantly. https://chatgpt.com/c/681aa95e-54e8-8011-afc0-6e010a4993a3)
  - name: Clear GNOME Shell vertical workspace switch+move shortcuts
    ansible.builtin.dconf:
      key: "/org/gnome/desktop/wm/keybindings/{{ item }}"
      value: "@as []"
    loop:
      - switch-to-workspace-up
      - switch-to-workspace-down
      - move-to-workspace-up
      - move-to-workspace-down

  # (Should apply instantly. https://chatgpt.com/c/681aa95e-54e8-8011-afc0-6e010a4993a3)
  - name: Set GNOME Shell horizontal workspace left/right switch+move shortcuts to Ctrl+Alt+(Shift+)↑/↓
    ansible.builtin.dconf:
      key: "/org/gnome/desktop/wm/keybindings/{{ item.action }}"
      value: "['{{ item.binding }}']"
    loop:
      - { action: switch-to-workspace-left,  binding: "<Primary><Alt>Up" }
      - { action: switch-to-workspace-right, binding: "<Primary><Alt>Down" }
      - { action: move-to-workspace-left,    binding: "<Primary><Shift><Alt>Up" }
      - { action: move-to-workspace-right,   binding: "<Primary><Shift><Alt>Down" }
