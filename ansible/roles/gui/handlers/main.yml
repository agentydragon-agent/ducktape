- name: Reload pop-shell
  listen: reload pop-shell extension
  # TODO: GNOME 42+: might have one-shot reload? (gnome-extensions reload pop-shell@...)
  ansible.builtin.command: >-
    gnome-extensions enable pop-shell@system76.com &&
    gnome-extensions disable pop-shell@system76.com
  register: gui_reload
  failed_when: gui_reload.rc != 0
  changed_when: gui_reload.rc == 0
