---
# k3s role defaults

# VM Configuration
k3s_vms:
  - name: k3s-master
    vmid: 200
    cores: 2
    memory: 4096
    disk_size: 50G
    role: master
    ip: 10.0.200.200
  - name: k3s-worker
    vmid: 201
    cores: 2
    memory: 4096
    disk_size: 50G
    role: worker
    ip: 10.0.200.201

# Network Configuration
k3s_network_bridge: vmbr0
k3s_network_gateway: 10.0.0.1
k3s_network_cidr: 16
k3s_nameserver: 8.8.8.8

# VM Template Configuration
k3s_vm_template: ubuntu-22.04-cloudinit-template
k3s_vm_storage: local-zfs
k3s_cloudinit_storage: local-zfs

# k3s Configuration
k3s_version: v1.29.0+k3s1
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_cluster_dns: 10.43.0.10

# SSH Configuration
k3s_ssh_user: ubuntu
k3s_ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

# Proxmox API Configuration
k3s_proxmox_api_host: "{{ ansible_host }}"
k3s_proxmox_api_user: root@pam
k3s_proxmox_node: atlas
