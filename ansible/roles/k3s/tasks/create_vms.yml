---
# Create k3s VMs from template

- name: Clone VMs from template
  ansible.builtin.shell: |
    qm clone {{ k3s_vm_template | default(9000) }} {{ item.vmid }} --name {{ item.name }} --full
  loop: "{{ k3s_vms }}"
  register: k3s_clone_result
  failed_when:
    - k3s_clone_result.rc != 0
    - "'already exists' not in k3s_clone_result.stderr"
  changed_when: k3s_clone_result.rc == 0
  tags: [k3s, vm-clone]

- name: Configure VM resources
  ansible.builtin.shell: |
    qm set {{ item.vmid }} --cores {{ item.cores }} --memory {{ item.memory }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Resize VM disks
  ansible.builtin.shell: |
    qm resize {{ item.vmid }} scsi0 {{ item.disk_size }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Configure cloud-init settings
  ansible.builtin.shell: |
    qm set {{ item.vmid }} \
      --ipconfig0 ip={{ item.ip }}/{{ k3s_network_cidr }},gw={{ k3s_network_gateway }} \
      --nameserver {{ k3s_nameserver }} \
      --sshkeys /root/.ssh/id_rsa.pub \
      --ciuser {{ k3s_ssh_user }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Start VMs
  ansible.builtin.shell: |
    qm start {{ item.vmid }}
  loop: "{{ k3s_vms }}"
  register: k3s_start_result
  failed_when:
    - k3s_start_result.rc != 0
    - "'already running' not in k3s_start_result.stderr"
  changed_when: k3s_start_result.rc == 0
  tags: [k3s, vm-start]

- name: Wait for cloud-init to complete
  ansible.builtin.pause:
    seconds: 60
  tags: [k3s, vm-start]
