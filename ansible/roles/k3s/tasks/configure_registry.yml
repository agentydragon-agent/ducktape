---
# Configure k3s nodes to use insecure registry

- name: Create k3s registries config directory on all nodes
  delegate_to: "{{ item.name }}"
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
  become: true
  loop: "{{ k3s_vms }}"
  tags: [k3s, registry]

- name: Configure insecure registry on all nodes
  delegate_to: "{{ item.name }}"
  ansible.builtin.copy:
    content: |
      mirrors:
        "registry.registry.svc.cluster.local:5000":
          endpoint:
            - "http://registry.registry.svc.cluster.local:5000"
    dest: /etc/rancher/k3s/registries.yaml
    mode: '0644'
  become: true
  loop: "{{ k3s_vms }}"
  register: k3s_registry_config
  tags: [k3s, registry]

  notify:
    - restart k3s master
    - restart k3s workers
    - wait for k3s nodes
