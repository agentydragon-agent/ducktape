---
# Configure kubectl access on Proxmox host

- name: Create .kube directory
  ansible.builtin.file:
    path: "/home/{{ my_user }}/.kube"
    state: directory
    owner: "{{ my_user }}"
    group: "{{ my_user }}"
    mode: '0755'
  tags: [k3s, kubectl]

- name: Copy kubeconfig from master
  delegate_to: "{{ (k3s_vms | selectattr('role', 'equalto', 'master') | first).name }}"
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: yes
  tags: [k3s, kubectl]

- name: Update kubeconfig with correct server address
  ansible.builtin.replace:
    path: /tmp/k3s.yaml
    regexp: 'https://127.0.0.1:6443'
    replace: "https://{{ k3s_master_ip }}:6443"
  tags: [k3s, kubectl]

- name: Copy kubeconfig to user directory
  ansible.builtin.copy:
    src: /tmp/k3s.yaml
    dest: "/home/{{ my_user }}/.kube/config"
    owner: "{{ my_user }}"
    group: "{{ my_user }}"
    mode: '0600'
  tags: [k3s, kubectl]

- name: Install kubectl on Proxmox host
  ansible.builtin.shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/
  args:
    creates: /usr/local/bin/kubectl
  tags: [k3s, kubectl]

- name: Verify cluster access
  ansible.builtin.shell: |
    kubectl get nodes
  become: true
  become_user: "{{ my_user }}"
  register: nodes_output
  tags: [k3s, kubectl]

- name: Display cluster status
  ansible.builtin.debug:
    msg: "{{ nodes_output.stdout_lines }}"
  tags: [k3s, kubectl]