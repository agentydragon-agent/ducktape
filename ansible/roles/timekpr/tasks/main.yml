- name: Timekpr
  tags:
    - timekpr
  block:
    - name: Add timekpr-next PPA
      apt_repository:
        repo: ppa:mjasnik/ppa
      become: true
    - name: Install timekpr-next
      ansible.builtin.apt:
        pkg:
          # TODO(agentydragon): As of 2020-09-24, mainline does not have suspend
          # option yet.
          - timekpr-next-beta
      become: true
    - name: Set up timekpr allowed hours
      become: true
      command: >
        timekpra --setallowedhours agentydragon ALL
        "5[0-60];6[0-60];7[0-60];8[0-60];9[0-60];10[0-60];11[0-60];
        12[0-60];13[0-60];14[0-60];15[0-60];16[0-60];17[0-60];18[0-60];
        19[0-60];20[0-60];21[0-60];22[0-60];23[0-60]"
        # with forced 5-minute pauses on start of every hour:
        # "5[5-60];6[5-60];7[5-60];8[5-60];9[5-60];10[5-60];11[5-60];
        # 12[5-60];13[5-60];14[5-60];15[5-60];16[5-60];17[5-60];18[5-60];
        # 19[5-60];20[5-60];21[5-60];22[5-60];23[20-60]"
    - name: Set up timekpr lockout to lock screen
      become: true
      command: timekpra --setlockouttype agentydragon lock
