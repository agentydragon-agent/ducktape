---
- name: Timekpr
  tags: [timekpr]
  vars:
    timekpr_user: agentydragon
    allowed_defs:
      # 01:00-05:00 allow :00-:50
      - hours: [22, 23, 0]
        # NOTE: timekpr expects two-digit minute counts!
        range: "00-50"
      # 01:00-05:00 allow :00-:15
      - hours: "{{ range(1, 5) | list }}"
        range: "00-15"
      # 05:00-22:00 free run
      - hours: "{{ range(5, 22) | list }}"
        range: "00-60"

    # Render to the monster string Timekpr expects
    allowed_hours: >-
      {%- set segs = [] -%}
      {%- for block in allowed_defs -%}
        {%- for h in block.hours -%}
          {%- set _ = segs.append(h|string ~ '[' ~ block.range ~ ']') -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ segs | join(';') }}
  block:
    - name: Add mjasnip PPA for timekpr-next
      deb822_repository:
        name: mjasnik-ppa
        uris: https://ppa.launchpadcontent.net/mjasnik/ppa/ubuntu
        suites: [ "{{ ansible_distribution_release }}" ]
        components: [main]
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xAF91A06147FA1307
      become: true
    - name: Install timekpr-next
      ansible.builtin.apt:
        # TODO(agentydragon): As of 2020-09-24, mainline does not have suspend
        # option yet.
        pkg: [timekpr-next-beta]
      become: true
    - name: Set up timekpr allowed hours
      become: true
      command: >
        timekpra --setallowedhours {{ timekpr_user }} ALL "{{ allowed_hours }}"
      # Forced 5-minute pauses on start of every hour:
      #   "5[5-60];6[5-60];7[5-60];8[5-60];9[5-60];10[5-60];11[5-60];
      #   12[5-60];13[5-60];14[5-60];15[5-60];16[5-60];17[5-60];18[5-60];
      #   19[5-60];20[5-60];21[5-60];22[5-60];23[20-60]"
    - name: Lock on lockout
      become: true
      command: timekpra --setlockouttype {{ timekpr_user }} lock
