# Check glibc version - newer Anki requires glibc 2.36+
- name: Check glibc version
  ansible.builtin.command: ldd --version
  register: anki_glibc_version_check
  changed_when: false

- name: Extract glibc version
  ansible.builtin.set_fact:
    anki_glibc_version: "{{ anki_glibc_version_check.stdout_lines[0] | regex_search('\\d+\\.\\d+') }}"

- name: Skip Anki installation on systems with older glibc
  ansible.builtin.debug:
    msg: "Skipping Anki installation - requires glibc 2.36+ but system has {{ anki_glibc_version }}"
  when: anki_glibc_version is version('2.36', '<')

- name: End play if glibc is too old
  ansible.builtin.meta: end_play
  when: anki_glibc_version is version('2.36', '<')

# Install Anki (only runs on systems with glibc 2.36+)
- name: Remove system-installed Anki
  become: true
  ansible.builtin.apt:
    pkg: anki
    state: absent
- name: Install Anki card dependencies
  become: true
  ansible.builtin.apt:
    pkg:
      - dvipng
      - fonts-roboto
      - youtube-dl
      # Instead of installing a big texlive-full.
      - texlive
      - texlive-lang-english
      - texlive-lang-german
      - texlive-latex-extra
      - texlive-latex-recommended
      - texlive-science
- name: Install latest Anki
  vars:
    anki_binary_path: /usr/local/bin/anki
  block:
    - name: Install Anki dependencies
      # See https://docs.ankiweb.net/platform/linux/installing.html
      become: true
      ansible.builtin.apt:
        pkg:
          - libxcb-xinerama0
          - libxcb-cursor0
    - name: Create temp directory
      ansible.builtin.tempfile:
        state: directory
        suffix: anki-release
      register: anki_tmp_dir
      changed_when: false

    - name: Set temporary dir path
      ansible.builtin.set_fact:
        anki_tmp_path: "{{ anki_tmp_dir.path }}"
      changed_when: false

    - name: Download info about Anki's latest release
      ansible.builtin.get_url:
        url: https://api.github.com/repos/ankitects/anki/releases/latest
        dest: "{{ anki_tmp_path }}/latest-release.json"
        mode: "0644"
      changed_when: false

    - name: Get latest Anki release version
      ansible.builtin.shell: |
        set -o pipefail
        jq --raw-output '.tag_name' {{ anki_tmp_path }}/latest-release.json
      args:
        executable: /bin/bash
      register: anki_latest_release_version
      changed_when: false

    - name: Debug latest Anki release version
      ansible.builtin.debug:
        var: anki_latest_release_version
        verbosity: 1

    - name: Assert latest release version was found
      ansible.builtin.assert:
        that:
          - anki_latest_release_version != ""

    - name: Get latest Anki release URL
      ansible.builtin.shell: |
        set -o pipefail
        jq --raw-output '
          .assets[]
          | select(.name | test("anki-launcher.tar.zst"))
          | .browser_download_url
        ' {{ anki_tmp_path }}/latest-release.json
      args:
        executable: /bin/bash
      register: anki_latest_release_url_raw
      changed_when: false

    - name: Assert latest release URL found
      ansible.builtin.assert:
        that:
          - anki_latest_release_url_raw != ""

    - name: Set latest release URL
      ansible.builtin.set_fact:
        anki_latest_release_url: "{{ anki_latest_release_url_raw.stdout }}"
      changed_when: false

    # Check if Anki is installed and get its version
    - name: Get version of installed Anki
      ansible.builtin.script: get_anki_version.py
      args:
        executable: python3
      register: anki_version_result
      changed_when: false

    - name: Parse Anki version result
      ansible.builtin.set_fact:
        anki_version_data: "{{ anki_version_result.stdout | from_json }}"
      changed_when: false

    # - ansible.builtin.debug:
    #     var: anki_version_data
    - name: Debug latest Anki release URL
      ansible.builtin.debug:
        var: anki_latest_release_url

    - name: Install latest Anki
      when: >-
        (not anki_version_data.installed) or
        (anki_version_data.installed and
         anki_version_data.version != anki_latest_release_version.stdout)
      block:
        - name: Download Anki
          ansible.builtin.unarchive:
            remote_src: true
            src: "{{ anki_latest_release_url }}"
            dest: "{{ anki_tmp_path }}"
          changed_when: false

        - name: Run ./install.sh
          changed_when: true
          become: true
          ansible.builtin.command:
            cmd: ./install.sh
            chdir: "{{ anki_tmp_path }}/anki-launcher"

    - name: Stat anki binary at {{ anki_binary_path }}
      ansible.builtin.stat:
        path: "{{ anki_binary_path }}"
      register: anki_installed_binary

    - name: Check Anki binary now exists at {{ anki_binary_path }}
      ansible.builtin.assert:
        that:
          - anki_installed_binary.stat.exists


