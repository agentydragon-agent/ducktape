---
# k3s-client role - Install kubectl and kubeconfig on client machines

- name: Create .kube directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'
  tags: [k3s-client]

- name: Install kubectl
  ansible.builtin.shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    sudo mv kubectl /usr/local/bin/
  args:
    creates: /usr/local/bin/kubectl
  tags: [k3s-client, kubectl]

- name: Copy k3s kubeconfig from atlas
  ansible.builtin.shell: |
    scp -o StrictHostKeyChecking=no 10.13.13.30:/home/{{ my_user }}/.kube/config ~/.kube/config
  tags: [k3s-client]

- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube/config"
    mode: '0600'
  tags: [k3s-client]

- name: Verify cluster access
  ansible.builtin.shell: kubectl get nodes
  register: nodes_output
  tags: [k3s-client, verify]

- name: Display cluster status
  ansible.builtin.debug:
    msg: "{{ nodes_output.stdout_lines }}"
  tags: [k3s-client, verify]