- name: Ensure extensions are disabled via dconf arrays
  block:
    # Remove requested extensions from the *enabled-extensions* list
    - name: Remove extensions from GNOME Shell enabled list
      dconf_append:
        key: /org/gnome/shell/enabled-extensions
        remove: "{{ gnome_shell_disable_extensions }}"
      notify: Restart GNOME Shell

    # Add requested extensions to the *disabled-extensions* list
    - name: Add extensions to GNOME Shell disabled list
      dconf_append:
        key: /org/gnome/shell/disabled-extensions
        add: "{{ gnome_shell_disable_extensions }}"
      notify: Restart GNOME Shell

  when: gnome_shell_disable_extensions | length > 0
