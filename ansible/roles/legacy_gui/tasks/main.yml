- name: Configure Discord minimized autostart
  ansible.builtin.include_tasks: discord_minimized_autostart.yml
- name: Configure Syncthing autostart
  ansible.builtin.include_tasks: syncthing_autostart.yml
- name: Configure Flameshot autostart
  ansible.builtin.include_tasks: flameshot_autostart.yml
