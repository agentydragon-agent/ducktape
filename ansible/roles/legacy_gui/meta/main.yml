dependencies:
  - role: common
  - role: petermosmans.customize-gnome
    vars:
      gnome_extensions:
        # Desaturate All – https://extensions.gnome.org/extension/1102/desaturate-all/
        - id: 1102

        # Panel Date Format – https://extensions.gnome.org/extension/1462/panel-date-format/
        - id: 1462

        # Night Theme Switcher – https://extensions.gnome.org/extension/2236/night-theme-switcher/
        - id: 2236

        # V-Shell - https://extensions.gnome.org/extension/5177/vertical-workspaces/
        # (Replace vertical workspaces of Cosmic UI from Pop!_OS; it tends to freeze up)
        - id: 5177

        # Cronomix - https://extensions.gnome.org/extension/6003/cronomix/
        # (timer/stopwatch/Pomodoro/alarms/todo)
        - id: 6003

  # Fonts managed by Nix home-manager
  # gnome-terminal-solarized now managed by Nix: nix/home/modules/solarized.nix
  - role: timekpr
  # - role: google_drive_client  # Temporarily disabled for wyrm
