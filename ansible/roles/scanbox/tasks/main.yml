---
- name: install samba
  apt:
    name:
    - samba
    state: present
  become: yes

- name: create loop-back sparse file
  command: fallocate -l {{ scanbox_size }} {{ scanbox_img }}
  args:
    creates: "{{ scanbox_img }}"
  become: yes

- name: make ext4 FS on loop-file
  filesystem:
    fstype: ext4
    dev: "{{ scanbox_img }}"
    opts: "-m0 -L SCANBOX"
  become: yes

- name: create mount point
  file:
    path: "{{ scanbox_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: mount loop-file
  mount:
    path: "{{ scanbox_mount }}"
    src: "{{ scanbox_img }}"
    fstype: ext4
    opts: loop,noexec,nosuid,nodev
    state: mounted
  become: yes

- name: ensure scanbox system account
  user:
    name: "{{ scanbox_user }}"
    system: yes
    create_home: no
  become: yes

- name: own mount point
  file:
    path: "{{ scanbox_mount }}"
    owner: "{{ scanbox_user }}"
    group: "{{ scanbox_user }}"
    mode: "0750"
  become: yes

- name: append ScanBox share to smb.conf
  blockinfile:
    path: /etc/samba/smb.conf
    marker: ";-- ANSIBLE SCANBOX --"
    block: |
      [ScanBox]
         path = {{ scanbox_mount }}
         browsable = yes
         read only = no
         guest ok = no
         force user = {{ scanbox_user }}
         force group = {{ scanbox_user }}
         create mask = 0640
         directory mask = 0770
         hosts allow = 127. {{ scanbox_printer_ip }}
         veto files = /*.exe/*.bat/*.cmd/
  notify: restart smbd
  become: yes

- name: add {{ ansible_user_id }} to {{ scanbox_user }} group
  user:
    name: "{{ ansible_user_id }}"
    groups: "{{ scanbox_user }}"
    append: yes
  become: yes

- name: widen dir perms for group write
  file:
    path: "{{ scanbox_mount }}"
    mode: "0770"
  become: yes
