---
- name: Install samba
  ansible.builtin.apt:
    name:
      - samba
    state: present
  become: true

- name: Create loop-back sparse file
  ansible.builtin.command: fallocate -l {{ scanbox_size }} {{ scanbox_img }}
  args:
    creates: "{{ scanbox_img }}"
  become: true

- name: Make ext4 FS on loop-file
  community.general.filesystem:
    fstype: ext4
    dev: "{{ scanbox_img }}"
    opts: "-m0 -L SCANBOX"
  become: true

- name: Create mount point
  ansible.builtin.file:
    path: "{{ scanbox_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Mount loop-file
  ansible.posix.mount:
    path: "{{ scanbox_mount }}"
    src: "{{ scanbox_img }}"
    fstype: ext4
    opts: loop,noexec,nosuid,nodev
    state: mounted
  become: true

- name: Ensure scanbox system account
  ansible.builtin.user:
    name: "{{ scanbox_user }}"
    system: true
    create_home: false
  become: true

- name: Own mount point
  ansible.builtin.file:
    path: "{{ scanbox_mount }}"
    owner: "{{ scanbox_user }}"
    group: "{{ scanbox_user }}"
    mode: "0750"
  become: true

- name: Append ScanBox share to smb.conf
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: ";-- ANSIBLE SCANBOX --"
    block: |
      [ScanBox]
         path = {{ scanbox_mount }}
         browsable = yes
         read only = no
         guest ok = no
         force user = {{ scanbox_user }}
         force group = {{ scanbox_user }}
         create mask = 0640
         directory mask = 0770
         hosts allow = 127. {{ scanbox_printer_ip }}
         veto files = /*.exe/*.bat/*.cmd/
  notify: restart smbd
  become: true

- name: Add current user to scanbox group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: "{{ scanbox_user }}"
    append: true
  become: true

- name: Widen dir perms for group write
  ansible.builtin.file:
    path: "{{ scanbox_mount }}"
    mode: "0770"
  become: true
