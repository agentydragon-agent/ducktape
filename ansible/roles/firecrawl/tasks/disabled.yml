---
# Disable (stop & remove) Firecrawl

- name: Stop and remove Firecrawl containers
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ firecrawl_project_path }}"
    state: absent
  when: firecrawl_project_path is defined and firecrawl_project_path != ""
  ignore_errors: true

- name: Remove Firecrawl project directory
  become: true
  ansible.builtin.file:
    path: "{{ firecrawl_project_path }}"
    state: absent
  when: firecrawl_project_path is defined and firecrawl_project_path != ""