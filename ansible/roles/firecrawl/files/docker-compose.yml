services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - firecrawl

  playwright-service:
    build:
      context: https://github.com/mendableai/firecrawl.git#main:apps/playwright-service-ts
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - firecrawl

  api:
    build:
      context: https://github.com/mendableai/firecrawl.git#main:apps/api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - USE_DB_AUTHENTICATION=false
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - NUM_WORKERS_PER_QUEUE=8
      - LOGGING_LEVEL=info
      - FLY_PROCESS_GROUP=api  # Explicitly set this is API mode
    depends_on:
      - redis
      - playwright-service
    networks:
      - firecrawl

  worker:
    build:
      context: https://github.com/mendableai/firecrawl.git#main:apps/api
    restart: unless-stopped
    environment:
      - USE_DB_AUTHENTICATION=false
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - NUM_WORKERS_PER_QUEUE=8
      - LOGGING_LEVEL=info
      - FLY_PROCESS_GROUP=worker
      - PORT=8080  # Ensure worker uses different port
      - HOST=0.0.0.0
    depends_on:
      - redis
      - playwright-service
    networks:
      - firecrawl

networks:
  firecrawl:
    driver: bridge

volumes:
  redis-data:
