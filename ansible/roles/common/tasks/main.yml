- name: Check Neovim is >= 0.11 (for DEC mode 2031 for auto color scheme switching)
  block:
  - name: Get Neovim version
    command: nvim --version
    register: raw_nvim_version
    changed_when: false

  - name: Parse clean Neovim version string (strip prefix and suffix)
    set_fact:
      nvim_version_string: "{{ raw_nvim_version.stdout_lines[0] | regex_replace('^NVIM v(\\d+\\.\\d+(?:\\.\\d+)?).*', '\\1') }}"

  - name: Fail if version parsing failed
    fail:
      msg: "Couldn't parse Neovim version from: {{ raw_nvim_version }}"
    when: nvim_version_string is not defined or nvim_version_string == ''

  - name: Assert Neovim is at least 0.11
    assert:
      that:
        - "nvim_version_string is version('0.11', '>=')"
      fail_msg: "Neovim must be at least 0.11, got {{ nvim_version_string }}"

# TODO: update Neovim Lazy plugins?

- name: Hide gnome-terminal menu
  tags:
    - gnome-terminal
    - solarized
  ansible.builtin.command: |
    gsettings set
      org.gnome.Terminal.Legacy.Settings default-show-menubar false
