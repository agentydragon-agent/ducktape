---

- name: Include glab
  include_tasks: tasks/glab.yaml
- name: Include Trilium client
  include_tasks: tasks/trilium_client.yaml

# google-repos need to come before update - in case Google's keys changed.
- include_tasks: tasks/google-repos.yaml

- name: Update everything
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
- include_tasks: tasks/common-packages.yaml
- include_tasks: tasks/anki.yaml
  tags:
    - anki
- name: Install zprint
  tags:
    - zprint
  block:
    - name: Create temp directory
      ansible.builtin.tempfile:
        state: directory
        suffix: zprint
      register: tmp_dir
      changed_when: false

    - name: Build up URL of zprint last release info
      ansible.builtin.set_fact:
        release_json_path: "{{ tmp_dir.path }}/latest-release.json"
      changed_when: false

    - name: Download latest release info
      ansible.builtin.get_url:
        url: https://api.github.com/repos/kkinnear/zprint/releases/latest
        dest: "{{ release_json_path }}"
        mode: 0644
      changed_when: false

    - name: Get latest release
      ansible.builtin.shell: |
        cat {{ release_json_path }} | \
        jq --raw-output '.assets[] | select(.name | test("zprintl")) | .browser_download_url'
      register: latest_release_url
      changed_when: false

    - name: Download zprint
      ansible.builtin.get_url:
        url: "{{ latest_release_url.stdout }}"
        dest: "{{ local_scripts_path }}/zprint"
        # Include executable bit.
        mode: 0755

- include_tasks: tasks/dev-env.yaml
- include_tasks: tasks/dotfiles.yaml

- name: Set up Neovim
  tags: vim
  block:
    # sh -c 'curl -fLo "${XDG_DATA_HOME:-$HOME/.local/share}"/nvim/site/autoload/plug.vim --create-dirs \
    #  https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim'
    - name: Get Plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "/home/{{ my_user }}/.local/share/nvim/site/autoload/plug.vim"
        mode: 0644
    - name: Install plugins
      ansible.builtin.command: >
        nvim -E -c PlugInstall -c PlugUpdate -c qall

- name: Gnome-terminal
  tags:
    - gnome-terminal
    - solarized
  block:
    - ansible.builtin.include_tasks: gnome-terminal-solarized.yaml
    - name: Hide gnome-terminal menu
      ansible.builtin.command: |
        gsettings set
          org.gnome.Terminal.Legacy.Settings default-show-menubar false
- include_tasks: tasks/datetime-format.yaml
- name: Install Telegram Desktop, youtube-dl
  become: true
  tags: snap
  ansible.builtin.snap:
    name:
      - telegram-desktop
      - youtube-dl
- name: Install Slack
  become: true
  tags: snap
  ansible.builtin.snap:
    classic: true
    name:
      - slack
- include_tasks: tasks/dev-env.yaml
- name: Set sloppy focus (focus follows mouse)
  ansible.builtin.dconf:
    key: /org/gnome/desktop/wm/preferences/focus-mode
    value: "'sloppy'"
- name: Minimize - maximize - close buttons
  ansible.builtin.dconf:
    key: /org/gnome/desktop/wm/preferences/button-layout
    value: "':minimize,maximize,close'"
- name: Set Ctrl+Alt+T shortcut to open terminal
  ansible.builtin.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/terminal
    value: "['<Primary><Alt>t']"
