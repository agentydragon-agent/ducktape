---

# - name: Include glab
#   include_tasks: tasks/glab.yaml
#- name: Include Trilium client
#  include_tasks: tasks/trilium_client.yaml

# google-repos need to come before update - in case Google's keys changed.
- include_tasks: tasks/google-repos.yaml

- name: Update everything
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
- include_tasks: tasks/common-packages.yaml

- include_tasks: tasks/dev-env.yaml
- include_tasks: tasks/dotfiles.yaml

- name: Set up Neovim
  tags: vim
  block:
    # sh -c 'curl -fLo "${XDG_DATA_HOME:-$HOME/.local/share}"/nvim/site/autoload/plug.vim --create-dirs \
    #  https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim'
    - ansible.builtin.file:
        path: "/home/{{ my_user }}/.local/share/nvim/site/autoload"
        state: directory
    - name: Get Plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "/home/{{ my_user }}/.local/share/nvim/site/autoload/plug.vim"
        mode: 0644
    - name: Install plugins
      ansible.builtin.command: >
        nvim -E -c PlugInstall -c PlugUpdate -c qall

- name: Hide gnome-terminal menu
  tags:
    - gnome-terminal
    - solarized
  ansible.builtin.command: |
    gsettings set
      org.gnome.Terminal.Legacy.Settings default-show-menubar false
- include_tasks: tasks/datetime-format.yaml
