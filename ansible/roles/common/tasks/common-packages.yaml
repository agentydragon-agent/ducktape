- name: Install packages
  become: true
  ansible.builtin.apt:
    pkg:
      # TODO: remove cinnamon
      #- cinnamon-desktop-environment
      - curl
      - diffutils
      #- fonts-powerline
      - geeqie
      - gimp
      - git
      - htop
      - iftop
      - iotop
      - iputils-ping
      - libreoffice
      - mc
      - mmv
      - mosh
      - mplayer
      - mpv
      - neovim
      - netcat-openbsd
      - nethogs
      - pkg-config
      - pv
      - pwgen
      - rcm
      - screen
      - sed
      - tree
      - vinagre
      - wget
      - xclip
      - zsh
- name: Install amd64-specific packages
  when: ansible_architecture == "amd64"
  become: true
  ansible.builtin.apt:
    pkg:
      - google-chrome-stable
