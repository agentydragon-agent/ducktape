---
# Check for deprecated zprint installation
- name: Check if zprint is installed
  ansible.builtin.stat:
    path: "{{ local_scripts_path }}/zprint"
  register: dev_clojure_zprint_binary
  tags: [zprint, deprecated]

- name: Fail if zprint is still installed
  ansible.builtin.fail:
    msg: |
      WARNING: zprint is deprecated and should be uninstalled.

      This playbook no longer installs or maintains zprint as Clojure
      development has been discontinued in this environment.

      Please remove it manually:
        rm {{ local_scripts_path }}/zprint

      Then re-run this playbook.
  when: dev_clojure_zprint_binary.stat.exists
  tags: [zprint, deprecated]
