---
# Install and configure headscale

- name: Create headscale group
  ansible.builtin.group:
    name: headscale
    system: yes
  tags: [headscale, install]

- name: Create headscale user
  ansible.builtin.user:
    name: headscale
    group: headscale
    home: /var/lib/headscale
    shell: /bin/false
    system: yes
    create_home: yes
  tags: [headscale, install]

- name: Create headscale config directory
  ansible.builtin.file:
    path: /etc/headscale
    state: directory
    owner: headscale
    group: headscale
    mode: '0755'
  tags: [headscale, install]

- name: Download headscale binary
  ansible.builtin.get_url:
    url: "https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}/headscale_{{ headscale_version }}_linux_amd64"
    dest: /usr/local/bin/headscale
    owner: root
    group: root
    mode: '0755'
  tags: [headscale, install]

- name: Generate noise private key
  ansible.builtin.shell: |
    if [ ! -f /var/lib/headscale/noise_private.key ]; then
      /usr/local/bin/headscale generate private-key > /var/lib/headscale/noise_private.key
      chown headscale:headscale /var/lib/headscale/noise_private.key
      chmod 600 /var/lib/headscale/noise_private.key
    fi
  tags: [headscale, config]

- name: Generate headscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: '0644'
  notify: restart headscale
  tags: [headscale, config]

- name: Create headscale systemd service
  ansible.builtin.template:
    src: headscale.service.j2
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart headscale
  tags: [headscale, service]

- name: Enable and start headscale service
  ansible.builtin.systemd:
    name: headscale
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [headscale, service]

- name: Check headscale service status
  ansible.builtin.systemd:
    name: headscale
  register: headscale_status
  tags: [headscale, service]

- name: Display headscale service status
  ansible.builtin.debug:
    var: headscale_status.status
  tags: [headscale, service]

- name: Wait for headscale to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/health"
    method: GET
  register: headscale_health
  until: headscale_health.status == 200
  retries: 10
  delay: 3
  failed_when: false
  tags: [headscale, service]