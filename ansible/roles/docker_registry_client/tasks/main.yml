---
# Configure Docker on build hosts (e.g. wyrm) to trust the homelab registry

- name: Ensure Docker cert directory exists for registry
  ansible.builtin.file:
    path: /etc/docker/certs.d/registry.k3s.agentydragon.com
    state: directory
    mode: "0755"
  become: true

- name: Install homelab CA certificate for Docker
  ansible.builtin.copy:
    src: ../../../../infra/certs/homelab-ca.crt
    dest: /etc/docker/certs.d/registry.k3s.agentydragon.com/ca.crt
    mode: "0644"
  become: true

- name: Install homelab CA in system trust store
  ansible.builtin.copy:
    src: ../../../../infra/certs/homelab-ca.crt
    dest: /usr/local/share/ca-certificates/homelab-ca.crt
    mode: "0644"
  become: true

- name: Update CA certificates
  ansible.builtin.command: update-ca-certificates
  register: docker_registry_client_update_ca
  changed_when: ".crt in docker_registry_client_update_ca.stdout"
  become: true

- name: Ensure docker daemon config exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_registry_client_daemon_json
  become: true

- name: Read existing docker daemon config
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_registry_client_daemon_raw
  when: docker_registry_client_daemon_json.stat.exists
  become: true

- name: Build merged docker daemon configuration
  ansible.builtin.set_fact:
    docker_registry_client_daemon_config: >-
      {{
        (
          docker_registry_client_daemon_raw[content] | b64decode | from_json
          if docker_registry_client_daemon_json.stat.exists else {}
        )
        | combine(
            {
              tlscacert: /etc/docker/certs.d/registry.k3s.agentydragon.com/ca.crt,
              registry-mirrors: [],
              insecure-registries: []
            },
            recursive=True
          )
      }}

- name: Write docker daemon configuration
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_registry_client_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    enabled: true
  become: true
