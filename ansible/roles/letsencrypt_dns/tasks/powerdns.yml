---
# RFC 2136 (Dynamic DNS) provider configuration for Let's Encrypt with PowerDNS

- name: Create RFC 2136 credentials file
  ansible.builtin.copy:
    content: |
      dns_rfc2136_server = {{ powerdns_dns_bind_address }}
      dns_rfc2136_port = 53
      dns_rfc2136_name = certbot
      dns_rfc2136_secret = {{ vault_powerdns_tsig_secret }}
      dns_rfc2136_algorithm = HMAC-MD5
    dest: /etc/letsencrypt/rfc2136.ini
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Test DNS resolution to PowerDNS
  ansible.builtin.command:
    cmd: dig @{{ powerdns_dns_bind_address }} k3s.agentydragon.com NS
  register: letsencrypt_dns_powerdns_test
  failed_when: "'NOERROR' not in letsencrypt_dns_powerdns_test.stdout"
  changed_when: false
