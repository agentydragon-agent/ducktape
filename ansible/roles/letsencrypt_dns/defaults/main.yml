---
# Let's Encrypt DNS validation role defaults

# Certificate configuration
letsencrypt_dns_domains: []
letsencrypt_dns_cert_name: ""
letsencrypt_dns_email: ""

# DNS provider configuration
letsencrypt_dns_provider: "powerdns" # powerdns, route53, cloudflare, etc.

# PowerDNS specific configuration
letsencrypt_dns_powerdns_api_url: "http://127.0.0.1:8081"
letsencrypt_dns_powerdns_api_key: "{{ vault_powerdns_api_key }}"

# Route53 specific configuration (if using Route53)
# letsencrypt_route53_access_key: ""
# letsencrypt_route53_secret_key: ""

# Certificate renewal
letsencrypt_dns_auto_renew: true
