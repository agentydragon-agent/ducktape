---
# Disable Trilium – stop container and remove nginx site configs.

- name: Remove Trilium server container if present
  ansible.builtin.docker_container:
    name: trilium-server
    state: absent

- name: Remove nginx site (available)
  ansible.builtin.file:
    path: /etc/nginx/sites-available/trilium.agentydragon.com
    state: absent
  notify: Reload nginx

- name: Remove nginx site (enabled)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/trilium.agentydragon.com
    state: absent
  notify: Reload nginx
