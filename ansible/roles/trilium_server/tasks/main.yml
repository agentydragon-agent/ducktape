---
- name: Include tasks to enable Trilium
  ansible.builtin.include_tasks: enabled.yml
  when: (trilium_server_state | default('present')) in ['present', 'enabled', 'on']

- name: Include tasks to disable Trilium
  ansible.builtin.include_tasks: disabled.yml
  when: (trilium_server_state | default('present')) in ['absent', 'disabled', 'off']
