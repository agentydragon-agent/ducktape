---
- name: Create Trilium data directory
  ansible.builtin.file:
    path: /srv/trilium-data
    state: directory
    owner: trilium
    group: trilium
    mode: 0700
  tags:
    - trilium

- name: "Install pip"
  ansible.builtin.apt:
    pkg:
      - python3-pip
# - acl  # for setfacl

# Python package 'docker' is a dependency of running the docker_container rule
# on host.
- name: Install docker Python package
  ansible.builtin.pip:
    name: docker

# After every certificate renewal, copy over the certificate data into Trilium's
# data directory.
# TODO: according to:
#   https://community.letsencrypt.org/t/best-practice-for-exposing-private-key-to-locally-installed-programs/88158
# maybe this should work?
#   $ setfacl -R -m u:trilium:rX /etc/letsencrypt/{live,archive}/trilium.agentdragon.com
- name: Set content of cert-post-hook.sh
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/trilium.sh
    mode: 0755
    content: |
      #!/bin/sh
      # TODO: should I check that the particular trilium.agentydragon.com domain
      # was renewed?
      rm -rf /srv/trilium-data/cert
      mkdir -p /srv/trilium-data/cert
      cp --dereference --recursive /etc/letsencrypt/live/{{ trilium_host }}/* /srv/trilium-data/cert
      chmod -R 700 /srv/trilium-data/cert
      chown -R trilium:trilium /srv/trilium-data/cert
      # TODO: do I maybe also need to restart the Trilium container?
  tags:
    - trilium

# certbot renew --force-renewal
# certbot renew -q   <- quiet
- name: Set content of Trilium config.ini
  ansible.builtin.copy:
    dest: /srv/trilium-data/config.ini
    owner: trilium
    mode: 0700
    content: |
      [Network]
      port=8080
      https=true
      certPath=/home/node/trilium-data/cert/fullchain.pem
      keyPath=/home/node/trilium-data/cert/privkey.pem
  tags:
    - trilium

- name: Create Trilium container
  become: true
  # TODO: this should be possible to run without root...
  # Assumes that the trilium user has UID = GID = 1000.
  # See https://github.com/zadam/trilium/wiki/Docker-server-installation#note-about---user-directive=.
  ansible.builtin.docker_container:
    name: trilium-server
    image: zadam/trilium:0.57-latest
    user: root  # TODO: argh
    volumes:
      - /srv/trilium-data:/home/node/trilium-data
    published_ports:
      # Publish Trilium's port 8080 as trilium_ssl_port.
      - "{{ trilium_ssl_port }}:8080"
    state: started
    restart: true
    restart_policy: always
    # Always pull latest version of the image.
    pull: true

    # TODO: get rid of this one
    container_default_behavior: compatibility
  tags:
    - trilium
