# Ensure system group/user
# ---------------------------------------------------------------------------
# Obtain / renew TLS certificate so that nginx can reference it later.
# ---------------------------------------------------------------------------

- name: "Trilium | Obtain Let’s Encrypt certificate"
  ansible.builtin.import_role:
    name: letsencrypt
  vars:
    letsencrypt_cert_name: "{{ trilium_host }}"
    letsencrypt_domains:
      - "{{ trilium_host }}"
# e-mail handled inside letsencrypt role

- name: Create Trilium group
  ansible.builtin.group:
    name: trilium
    state: present

- name: Create Trilium user
  ansible.builtin.user:
    name: trilium
    group: trilium

# (file content migrated from original tasks/main.yml)

- name: Create Trilium data directory
  ansible.builtin.file:
    path: /srv/trilium-data
    state: directory
    owner: trilium
    group: trilium
    mode: "0700"
  tags:
    - trilium

- name: "Install pip"
  ansible.builtin.apt:
    pkg:
      - python3-pip

- name: Install docker Python package
  ansible.builtin.pip:
    name: docker

- name: Set content of cert-post-hook.sh
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/trilium.sh
    mode: "0755"
    content: |
      #!/bin/sh
      rm -rf /srv/trilium-data/cert
      mkdir -p /srv/trilium-data/cert
      cp --dereference --recursive /etc/letsencrypt/live/{{ trilium_host }}/* /srv/trilium-data/cert
      chmod -R 700 /srv/trilium-data/cert
      chown -R trilium:trilium /srv/trilium-data/cert
  tags:
    - trilium

- name: Set content of Trilium config.ini
  ansible.builtin.copy:
    dest: /srv/trilium-data/config.ini
    owner: trilium
    mode: "0700"
    content: |
      [Network]
      port=8080
      https=true
      certPath=/home/node/trilium-data/cert/fullchain.pem
      keyPath=/home/node/trilium-data/cert/privkey.pem
  tags:
    - trilium

- name: Create Trilium container
  community.docker.docker_container:
    name: trilium-server
    image: zadam/trilium:0.57-latest
    user: root
    volumes:
      - /srv/trilium-data:/home/node/trilium-data
    published_ports:
      - "{{ trilium_ssl_port }}:8080"
    state: started
    restart: true
    restart_policy: always
    pull: true
    container_default_behavior: compatibility
  tags:
    - trilium

# ---------------------------------------------------------------------------
# nginx site
# ---------------------------------------------------------------------------

- name: Install nginx site configuration for Trilium (available)
  ansible.builtin.template:
    src: trilium.agentydragon.com.j2
    dest: /etc/nginx/sites-available/trilium.agentydragon.com
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site for Trilium (symlink)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/trilium.agentydragon.com
    dest: /etc/nginx/sites-enabled/trilium.agentydragon.com
    state: link
  notify: Reload nginx
