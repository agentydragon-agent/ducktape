---
- name: Update font version file
  ansible.builtin.copy:
    content: "{{ legacy_nerd_fonts_version.stdout }}"
    dest: "{{ installed_version_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Mark fonts updated
  ansible.builtin.set_fact:
    legacy_nerd_fonts_fonts_updated: true
