---
# Install GitHub CLI (gh) using the new GitHub release plugins
- name: Install GitHub CLI
  github_release_install:
    release_spec:
      repo: "cli/cli"
      version: "latest"
      asset_pattern: ".*linux_{{ dpkg_arch }}\\.deb$"
    method: deb
  register: gh_install
  become: true
  when: dpkg_arch in ["amd64", "arm64"]
