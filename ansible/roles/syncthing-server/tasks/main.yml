- name: Install syncthing package
  apt:
    name: syncthing
    update_cache: yes
    state: latest

- name: Create SyncThing group
  ansible.builtin.group:
    name: syncthing
    state: present

- name: Create SyncThing user
  ansible.builtin.user:
    name: syncthing
    group: syncthing
    comment: Syncthing service account
    system: no   # regular user, gets /etc/passwd entry
    home: /srv/syncthing
    shell: /bin/bash
    create_home: yes
    state: present

- name: Create SyncThing /srv directory
  ansible.builtin.file:
    path: /srv/syncthing
    state: directory
    owner: syncthing
    group: syncthing
    mode: 0700

- name: check if config.xml already exists
  stat:
    path: /srv/syncthing/.local/state/syncthing/config.xml
  register: st_cfg

- name: bail out if config.xml did not exist
  when: not st_cfg.stat.exists
  fail:
    msg: Syncthing config not found. Generate one.

- name: enable & start syncthing system service
  become: true
  systemd:
    name: syncthing@syncthing   # template instance for the “syncthing” user
    enabled: yes
    state: started

