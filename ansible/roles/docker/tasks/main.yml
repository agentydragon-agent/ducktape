# xxx: if architecture in deb822 below not specified -> tries to download i386, which isn't included.
# if set to {{ ansible_architecture }} -> that resolves to "x86_64" instead, != "amd64".

- name: Check if Docker should be installed
  ansible.builtin.debug:
    msg: "Docker state is {{ docker_state | default('present') }}"

- name: Set up Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: [ "{{ ansible_lsb.codename }}" ]
    components: [stable]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    architectures: ["{{ dpkg_arch }}"]
  become: true
  when: (docker_state | default('present')) != 'absent'

# 2. Engine + extras (compose v2 plugin, buildx)
- name: Install Docker packages  # noqa: package-latest
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: yes  # deb822_repository doesn't reliably trigger apt cache update
  become: true
  when: (docker_state | default('present')) != 'absent'

# 3. User convenience
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
  when: (docker_state | default('present')) != 'absent'

# 4. Service
- name: Start and enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
  when: (docker_state | default('present')) != 'absent'
