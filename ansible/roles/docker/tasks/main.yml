# 1. Base deps
- deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: [ "{{ ansible_lsb.codename }}" ]
    components: [stable]
    architectures: [ "{{ ansible_architecture }}" ]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true

# 2. Engine + extras (compose v2 plugin, buildx)
- apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: yes
  become: true

# 3. User convenience
- user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true

# 4. Service
- service:
    name: docker
    state: started
    enabled: true
  become: true

