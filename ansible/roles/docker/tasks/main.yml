# xxx: if architecture in deb822 below not specified -> tries to download i386, which isn't included.
# if set to {{ ansible_architecture }} -> that resolves to "x86_64" instead, != "amd64".


- name: Set up Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: [ "{{ ansible_lsb.codename }}" ]
    components: [stable]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    architectures: ["{{ dpkg_arch }}"]
  become: true

# 2. Engine + extras (compose v2 plugin, buildx)
- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    # no need to update apt cache, deb822_repository triggers that
  become: true

# 3. User convenience
- ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true

# 4. Service
- service:
    name: docker
    state: started
    enabled: true
  become: true

