---
# Install gitstatus - fast git status tool
# gitstatus automatically downloads pre-built binaries on first use
# We clone it to ~/.local/share/gitstatus for shell integration

- name: Create ~/.local/share directory for gitstatus
  ansible.builtin.file:
    path: "~/.local/share"
    state: directory
    mode: '0755'
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"

- name: Clone gitstatus repository
  ansible.builtin.git:
    repo: https://github.com/romkatv/gitstatus.git
    dest: "~/.local/share/gitstatus"
    depth: 1
    force: true
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"

# The install script will download pre-built binaries on first run
# Users can source gitstatus.prompt.zsh or gitstatus.prompt.sh in their shell config
- name: Run gitstatus install to pre-download binaries
  ansible.builtin.shell: |
    cd ~/.local/share/gitstatus
    ./install -f
  args:
    creates: "~/.cache/gitstatus/gitstatusd-{{ ansible_system | lower }}-{{ ansible_machine }}"
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  register: gitstatus_install
  ignore_errors: true  # May fail on unsupported platforms

- name: Find downloaded gitstatusd binary
  ansible.builtin.find:
    paths: "~/.cache/gitstatus"
    patterns: "gitstatusd-*"
    file_type: file
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  register: gitstatusd_files

- name: Create symlink in ~/.local/bin for gitstatusd
  ansible.builtin.file:
    src: "{{ gitstatusd_files.files[0].path }}"
    dest: "~/.local/bin/gitstatusd"
    state: link
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"
  when:
    - gitstatusd_files.files | length > 0
    - gitstatusd_files.files[0].path is defined
