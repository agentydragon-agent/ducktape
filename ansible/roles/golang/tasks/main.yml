---
- name: Check for system Go installation
  ansible.builtin.command: which go
  register: system_go_check
  failed_when: false
  changed_when: false

- name: Fail if system Go is installed
  ansible.builtin.fail:
    msg: |
      System Go installation detected at {{ system_go_check.stdout }}
      Please remove it first with:
      sudo apt remove --purge golang golang-go golang-1.* golang-doc golang-src
      sudo apt autoremove
  when:
    - system_go_check.rc == 0
    - system_go_check.stdout.startswith('/usr')

- name: Check if Go is installed in user directory
  ansible.builtin.stat:
    path: "{{ golang_install_dir }}/go/bin/go"
  register: go_binary

- name: Check installed Go version
  ansible.builtin.command: "{{ golang_install_dir }}/go/bin/go version"
  register: installed_golang_version
  when: go_binary.stat.exists
  changed_when: false

- name: Fail if wrong Go version is installed
  ansible.builtin.fail:
    msg: |
      Wrong Go version installed!
      Expected: go{{ golang_version }}
      Found: {{ installed_golang_version.stdout }}

      Manual resolution required:
      rm -rf {{ golang_install_dir }}/go
      Then re-run this playbook
  when:
    - go_binary.stat.exists
    - "'go' + golang_version not in installed_golang_version.stdout"

- name: Install Go {{ golang_version }}
  when: not go_binary.stat.exists
  block:
    - name: Create install directory
      ansible.builtin.file:
        path: "{{ golang_install_dir }}"
        state: directory
        mode: '0755'

    - name: Download and extract Go tarball directly
      ansible.builtin.unarchive:
        src: "{{ golang_download_url }}"
        dest: "{{ golang_install_dir }}"
        remote_src: yes
        creates: "{{ golang_install_dir }}/go/bin/go"

- name: Verify Go installation
  ansible.builtin.command: "{{ golang_install_dir }}/go/bin/go version"
  register: golang_version_output
  changed_when: false

- name: Display Go version
  ansible.builtin.debug:
    msg: "Installed: {{ golang_version_output.stdout }}"
