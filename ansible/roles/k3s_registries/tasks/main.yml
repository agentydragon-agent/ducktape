---
# Configure containerd mirrors for in-cluster registry on k3s nodes

- name: Ensure k3s registries config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  tags: [k3s, registries]

- name: Install /etc/rancher/k3s/registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
  tags: [k3s, registries]

- name: Restart k3s services to apply registries config
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - k3s
    - k3s-agent
  failed_when: false
  tags: [k3s, registries]
