---
# Enable (install & run) InvenTree via Docker Compose and expose through nginx.

# Obtain / renew TLS certificate first so nginx finds it when the site config
# is written later in this file.

- name: "InvenTree | Obtain Let’s Encrypt certificate"
  ansible.builtin.import_role:
    name: letsencrypt
  vars:
    letsencrypt_cert_name: "inventree.agentydragon.com"
    letsencrypt_domains:
      - "inventree.agentydragon.com"
# e-mail handled inside letsencrypt role

- name: Ensure python3-pip is present (docker SDK dep)
  ansible.builtin.apt:
    name: python3-pip
    state: present

# - name: Install docker Python package
#   ansible.builtin.pip:
#     name: docker

# ---------------------------------------------------------------------------
# Prepare project directory with compose files
# ---------------------------------------------------------------------------

- name: Create InvenTree Docker Compose directory on host
  ansible.builtin.file:
    path: "{{ inventree_project_path }}"
    state: directory
    mode: "0700"

- name: Copy docker-compose files for InvenTree
  ansible.builtin.copy:
    src: "{{ inventree_compose_source }}/{{ item }}"
    dest: "{{ inventree_project_path }}/{{ item }}"
    mode: '0644'
  loop:
    - docker-compose.yml

# ---------------------------------------------------------------------------
# Start / recreate the stack (pull latest images, etc.)
# ---------------------------------------------------------------------------

- name: Docker compose up for InvenTree
  community.docker.docker_compose_v2:
    project_src: "{{ inventree_project_path }}"
    pull: always     # pull updated images for stable tag
    recreate: always # pick up any env / compose modifications
  register: inventree_compose

- name: Show compose output (verbosity 1)
  ansible.builtin.debug:
    var: inventree_compose
    verbosity: 1

# ---------------------------------------------------------------------------
# nginx reverse proxy site
# ---------------------------------------------------------------------------

- name: Install nginx site configuration for InvenTree (available)
  ansible.builtin.template:
    src: inventree.agentydragon.com.j2
    dest: /etc/nginx/sites-available/inventree.agentydragon.com
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site for InvenTree (symlink)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/inventree.agentydragon.com
    dest: /etc/nginx/sites-enabled/inventree.agentydragon.com
    state: link
  notify: Reload nginx
