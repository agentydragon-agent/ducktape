---
# Disable InvenTree – shut down containers & remove nginx site.  Data in the
# compose project directory is left untouched so service can be re-enabled.

- name: Ensure InvenTree containers are stopped & removed
  community.docker.docker_compose_v2:
    project_src: "{{ inventree_project_path }}"
    state: absent
  register: inventree_removed

- name: Remove InvenTree nginx site (available)
  ansible.builtin.file:
    path: /etc/nginx/sites-available/inventree.agentydragon.com
    state: absent
  notify: Reload nginx

- name: Remove InvenTree nginx site (enabled symlink)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/inventree.agentydragon.com
    state: absent
  notify: Reload nginx
