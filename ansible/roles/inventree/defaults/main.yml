---
# Desired state of the InvenTree service managed by this role.
# "present" – install & run, expose via nginx
# "absent"  – stop/remove containers and nginx site (data persists)

inventree_state: "present"

# Paths ----------------------------------------------------------------------

# Where the compose project will live on the target host
inventree_project_path: "/srv/inventree/docker-compose"

# Directory in this repository that contains the docker-compose files to copy.
# (playbook_dir points at ansible/playbooks, so go one level up.)
inventree_compose_source: "{{ playbook_dir | dirname }}/inventree"
# Host port is fixed/present inside compose files, so no variable here yet.
