---
# Dispatcher for Bazel remote cache service.

- name: Include tasks to enable Bazel cache
  ansible.builtin.include_tasks: enabled.yml
  when: (bazel_cache_state | default('absent')) in ['present', 'enabled', 'on']

- name: Include tasks to disable Bazel cache
  ansible.builtin.include_tasks: disabled.yml
  when: (bazel_cache_state | default('absent')) in ['absent', 'disabled', 'off']
