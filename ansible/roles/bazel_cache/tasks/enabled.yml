---
# Minimal implementation that ensures Bazel Remote Cache container is running.
# The earlier full setup was commented out in the playbook; this role can be
# expanded, but for now we create the data directory (if desired) and inform
# the operator.

- name: Ensure bazel-remote-cache data directory exists
  ansible.builtin.file:
    path: /srv/bazel-remote-cache/data
    state: directory
    mode: "0700"

- name: Stub – Bazel cache not yet fully implemented
  ansible.builtin.debug:
    msg: "Bazel remote cache enable logic not yet implemented."
