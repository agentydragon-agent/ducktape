---
# Default MCP servers configuration for Claude Code
# Override these in your playbook or host_vars
#
# Each server can have:
#   - command: The command to run
#   - args: List of arguments
#   - env: Environment variables (optional)
#   - type: Server type (optional, defaults to "stdio")

legacy_claude_mcp_servers:
  memory:
    ansible.builtin.command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"

  firecrawl:
    ansible.builtin.command: npx
    args:
      - "-y"
      - "firecrawl-mcp"
    env:
      FIRECRAWL_API_URL: "http://localhost:3002"

  arxiv:
    ansible.builtin.command: uvx
    args:
      - "--from"
      - "git+https://github.com/blazickjp/arxiv-mcp-server.git"
      - "arxiv-mcp-server"

  probe:
    ansible.builtin.command: npx
    args:
      - "-y"
      - "@buger/probe-mcp"

# Whether to automatically apply the configuration
# If false, will only check and fail if not configured
legacy_claude_mcp_auto_apply: false

# Claude config file location
legacy_claude_mcp_config_path: "{{ ansible_env.HOME }}/.claude.json"
