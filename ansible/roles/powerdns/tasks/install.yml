---
# PowerDNS Docker installation tasks

- name: Create PowerDNS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - /opt/powerdns
    - /opt/powerdns/sqlite-data
    - /opt/powerdns/config

- name: Create PowerDNS docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/powerdns/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart powerdns

- name: Create PowerDNS configuration file
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /opt/powerdns/config/pdns.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart powerdns

- name: Start PowerDNS containers
  community.docker.docker_compose_v2:
    project_src: /opt/powerdns
    state: present
  become: true
