---
# PowerDNS configuration tasks

- name: Configure firewall for PowerDNS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: "{{ 'tcp' if item == powerdns_webserver_port else 'any' }}"
  become: true
  loop:
    - "53"
    - "{{ powerdns_webserver_port }}"

# Ensure any pending handlers (like restart powerdns) are run before health check
- name: Flush handlers to ensure PowerDNS is restarted if needed
  ansible.builtin.meta: flush_handlers

- name: Wait for PowerDNS DNS port
  ansible.builtin.wait_for:
    host: "{{ powerdns_dns_bind_address }}"
    port: 53
    state: started
    timeout: 60
  tags: [powerdns, letsencrypt]

- name: Wait for PowerDNS HTTP API to be ready
  ansible.builtin.uri:
    url: "http://{{ powerdns_webserver_address }}:{{ powerdns_webserver_port }}/api/v1/servers"
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    method: GET
  register: powerdns_health_check
  until: powerdns_health_check.status == 200
  retries: 30
  delay: 2
