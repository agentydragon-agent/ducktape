---
# PowerDNS-Admin tasks

- name: Configure firewall for PowerDNS-Admin
  community.general.ufw:
    rule: allow
    port: "{{ powerdns_admin_port }}"
    proto: tcp
  become: true

- name: Wait for PowerDNS-Admin to be ready
  ansible.builtin.uri:
    url: "http://{{ powerdns_webserver_address }}:{{ powerdns_admin_port }}/"
    method: GET
  register: powerdns_admin_health_check
  until: powerdns_admin_health_check.status == 200
  retries: 30
  delay: 2
