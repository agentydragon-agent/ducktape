---
# PowerDNS removal tasks

- name: Stop PowerDNS containers
  community.docker.docker_compose_v2:
    project_src: /opt/powerdns
    state: absent
  become: true
  ignore_errors: yes

- name: Remove PowerDNS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /opt/powerdns

- name: Remove firewall rules
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: "{{ 'tcp' if item == powerdns_webserver_port else 'any' }}"
    delete: yes
  become: true
  ignore_errors: yes
  loop:
    - "53"
    - "{{ powerdns_webserver_port }}"
    - "{{ powerdns_admin_port }}"
