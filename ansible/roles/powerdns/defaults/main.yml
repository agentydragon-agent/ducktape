---
# PowerDNS role default variables

# PowerDNS state management
powerdns_state: present  # present, absent

# Database configuration
powerdns_db_type: mysql
powerdns_db_name: powerdns
powerdns_db_user: powerdns
powerdns_db_password: "{{ vault_powerdns_db_password }}"
powerdns_db_host: localhost

# PowerDNS configuration
powerdns_api_key: "{{ vault_powerdns_api_key }}"
powerdns_webserver_address: "127.0.0.1"
powerdns_webserver_port: 8081
powerdns_webserver_allow_from: "127.0.0.1,::1"

# PowerDNS-Admin configuration
powerdns_admin_state: present
powerdns_admin_port: 8082
powerdns_admin_secret_key: "{{ vault_powerdns_admin_secret_key }}"

# Domains to manage
powerdns_domains: []
# Example:
# powerdns_domains:
#   - name: "example.com"
#     type: "NATIVE"
#     records:
#       - name: "@"
#         type: "A"
#         content: "192.168.1.1"
#         ttl: 300
