---
# Install zprint using GitHub release plugins
- name: Install zprint
  tags: zprint
  block:
    - name: Check if zprint is installed
      ansible.builtin.stat:
        path: "{{ local_scripts_path }}/zprint"
      register: zprint_binary
      
    - name: Check zprint latest release
      github_release_info:
        repo: "kkinnear/zprint"
        version: "latest"
        asset_pattern: "zprintl$"
      register: zprint_info

    - name: Install or update zprint
      github_release_install:
        method: binary
        release_info: "{{ zprint_info }}"
        dest_path: "{{ local_scripts_path }}/zprint"
      when: not zprint_binary.stat.exists
