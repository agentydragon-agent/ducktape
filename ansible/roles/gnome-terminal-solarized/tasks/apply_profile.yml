---
- name: "Apply profile {{ profile_name }}"
  ansible.builtin.script: >
    apply.py
    apply '{{ profile_name }}' "{{ dir }}"
    --font "{{ font }}"
    {% if ansible_verbosity >= 1 %}--debug{% endif %}
  register: apply_result
  failed_when: apply_result.rc != 0
  changed_when: (apply_result.stdout | from_json).changed

- block:
  - name: Debug stdout
    debug:
      var: apply_result.stdout_lines
  - name: Debug stderr
    debug:
      var: apply_result.stderr_lines
  when: ansible_verbosity >= 1 | default(False)
