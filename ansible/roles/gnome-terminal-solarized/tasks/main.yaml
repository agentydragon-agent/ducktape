---
- name: Set default variables
  set_fact:
    font: "{{ font_family }} {{ font_size }}"

- name: Install any missing dependencies of gnome-terminal theme update script
  become: true
  ansible.builtin.apt:
    pkg:
    - python3-gi
    - gir1.2-glib-2.0
    - git  # for cloning the theme; TODO: use a submodule or something
    state: present

# TODO: fontconfig is needed for fc-list
# fonts-ubuntu

- name: Check {{ font_family }} is installed
  ansible.builtin.shell: fc-list | grep -i '{{ font_family }}'
  register: font_check
  failed_when: font_check.rc != 0
  changed_when: false

- name: Create temp directory for gnome-terminal-solarized
  ansible.builtin.tempfile:
    state: directory
    suffix: gnome-terminal-solarized
  register: temp_dir
  changed_when: false

- name: Clone gnome-terminal-colors-solarized
  ansible.builtin.git:
    repo: https://github.com/aruhier/gnome-terminal-colors-solarized
    dest: "{{ temp_dir.path }}"
    depth: 1
    version: master
  changed_when: false

- name: Apply Solarized profiles
  include_tasks: apply_profile.yaml
  vars:
    profile_name: "{{ item.profile_name }}"
    dir: "{{ temp_dir.path }}/colors/{{ item.variant }}"
  loop:
    - { profile_name: 'Solarized Light', variant: 'light' }
    - { profile_name: 'Solarized Dark',  variant: 'dark' }

- name: Set Solarized Light as the default profile
  ansible.builtin.script: >
    apply.py
    set-default 'Solarized Light'
    {% if debug | default(False) %}--debug{% endif %}
  register: set_default
  changed_when: (set_default.stdout | from_json).changed

- debug:
    msg: "stdout: {{ set_default.stdout }}"
  when: debug | default(False)
- debug:
    msg: "stderr: {{ set_default.stderr_lines }}"
  when: debug | default(False)
