---
# User to grant passwordless sudo for system inspection tools
system_inspection_nopasswd_user: "{{ my_user }}"

# List of read-only system inspection commands that NEED passwordless sudo
# KEEP IN SYNC - BEGIN: Update Claude Code permissions in:
#   nix/home/claude-code.nix (simpleInspectionCommands, specificSubcommands)
#
# IMPORTANT:
# - Only include commands that cannot cause irreversible operations
# - Only include commands that actually NEED sudo (not user-accessible commands)
# - YES: dmidecode (needs root), docker ps (needs sudo/group), fdisk -l (needs root)
# - NO: lspci (user can run), df (user can run), ps (user can run)
system_inspection_nopasswd_commands:
  # Hardware information (needs sudo for full access)
  - /usr/sbin/dmidecode
  - /usr/sbin/hwinfo
  - /usr/bin/inxi
  - /usr/bin/acpi
  - /usr/bin/acpitool
  - /usr/sbin/biosdecode
  - /usr/sbin/ownership
  - /usr/sbin/vpddecode
  - /usr/sbin/sensors-detect
  - /usr/bin/ipmitool
  - /usr/sbin/ipmi-sensors
  - /usr/sbin/fwupdmgr
  - /usr/bin/nvidia-smi
  - /usr/bin/nvidia-settings
  # System information
  - /usr/bin/uname
  - /usr/bin/hostnamectl
  - /usr/bin/timedatectl
  - /usr/bin/localectl
  - /usr/bin/loginctl
  - /usr/bin/bootctl
  # Process information (sudo for all processes)
  - /usr/bin/iotop
  - /usr/bin/pidstat
  # Memory information
  - /usr/bin/slabtop
  - /proc/meminfo
  # Disk information
  - /usr/sbin/fdisk -l
  - /usr/sbin/parted -l
  - /usr/sbin/blkid
  - /usr/sbin/smartctl -a *
  - /usr/sbin/smartctl -H *
  - /usr/sbin/smartctl -i *
  - /usr/sbin/smartctl -l *
  - /usr/sbin/nvme list
  - /usr/sbin/nvme smart-log *
  - /usr/sbin/nvme id-ctrl *
  - /usr/sbin/nvme id-ns *
  # Network information (sudo for full interface stats)
  - /usr/bin/ip addr show
  - /usr/bin/ip -s addr show
  - /usr/bin/ip route show
  - /usr/bin/ip -s route show
  - /usr/bin/ip link show
  - /usr/bin/ip -s link show
  - /usr/bin/ip neighbor show
  - /usr/bin/ip netns list
  # Service information
  - /usr/bin/systemctl status *
  - /usr/bin/systemctl list-units
  - /usr/bin/systemctl list-unit-files
  - /usr/bin/systemctl list-timers
  - /usr/bin/systemctl list-sockets
  - /usr/bin/systemctl show *
  - /usr/bin/journalctl
  # File system information
  - /usr/bin/findmnt
  - /usr/sbin/zfs list
  - /usr/sbin/zpool status
  - /usr/sbin/zpool list
  - /usr/sbin/btrfs filesystem show
  - /usr/sbin/btrfs device stats
  - /usr/sbin/lvdisplay
  - /usr/sbin/vgdisplay
  - /usr/sbin/pvdisplay
  # Package information
  - /usr/bin/apt list
  - /usr/bin/dpkg -l
  - /usr/bin/snap list
  - /usr/bin/flatpak list
  # Kernel and module information
  - /usr/sbin/modinfo *
  - /usr/bin/dmesg
  - /usr/sbin/sysctl -a
  - /usr/sbin/sysctl -n *
  - /usr/sbin/sysctl -N
  # Security information
  - /usr/bin/lastlog
  - /usr/sbin/aa-status
  - /usr/sbin/sestatus
  - /usr/bin/firewall-cmd --list-all
  - /usr/sbin/iptables -L
  - /usr/sbin/iptables -S
  - /usr/sbin/ip6tables -L
  - /usr/sbin/ip6tables -S
  - /usr/sbin/nft list ruleset
  # Container/VM information
  - /usr/bin/docker ps
  - /usr/bin/docker images
  - /usr/bin/docker info
  - /usr/bin/docker version
  - /usr/bin/podman ps
  - /usr/bin/podman images
  - /usr/bin/virsh list
  - /usr/bin/qm list
  - /usr/bin/pvesh get /nodes
  # Performance monitoring
  - /usr/bin/iostat
  - /usr/bin/mpstat
  - /usr/bin/sar
  - /usr/bin/perf stat
  - /usr/bin/perf top
  # Log viewing
  - /usr/bin/tail -f /var/log/*
  - /usr/bin/head /var/log/*
  - /usr/bin/cat /var/log/*
  - /usr/bin/less /var/log/*
  - /usr/bin/zcat /var/log/*.gz
  - /usr/bin/bzcat /var/log/*.bz2
# KEEP IN SYNC - END
