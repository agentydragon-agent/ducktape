---
# User to grant passwordless sudo for system inspection tools
system_inspection_user: "{{ my_user }}"

# List of read-only system inspection commands
system_inspection_commands:
  # Hardware information
  - /usr/bin/lspci
  - /usr/bin/lsusb
  - /usr/bin/lscpu
  - /usr/bin/lsblk
  - /usr/bin/lshw
  - /usr/sbin/dmidecode
  - /usr/bin/inxi
  - /usr/sbin/hwinfo
  - /usr/bin/acpi
  - /usr/bin/acpitool
  - /usr/sbin/biosdecode
  - /usr/sbin/ownership
  - /usr/sbin/vpddecode
  - /usr/bin/sensors
  - /usr/sbin/sensors-detect
  - /usr/bin/ipmitool
  - /usr/sbin/ipmi-sensors
  - /usr/sbin/fwupdmgr
  - /usr/bin/lsscsi
  - /usr/bin/lsipc
  - /usr/bin/lslocks
  - /usr/bin/lsns
  - /usr/bin/lsirq
  - /usr/bin/lstopo
  - /usr/bin/numactl
  - /usr/bin/numastat
  - /usr/sbin/mcelog
  - /usr/bin/turbostat
  - /usr/bin/cpupower
  - /usr/bin/powertop
  - /usr/bin/nvidia-smi
  - /usr/bin/nvidia-settings
  - /usr/bin/radeontop
  - /usr/bin/intel_gpu_top

  # System information
  - /usr/bin/uname
  - /usr/bin/hostnamectl
  - /usr/bin/timedatectl
  - /usr/bin/localectl
  - /usr/bin/loginctl
  - /usr/bin/bootctl

  # Process information
  - /usr/bin/ps
  - /usr/bin/pstree
  - /usr/bin/top
  - /usr/bin/htop
  - /usr/bin/iotop
  - /usr/bin/pidstat
  - /usr/bin/pgrep

  # Memory information
  - /usr/bin/free
  - /usr/bin/vmstat
  - /usr/bin/slabtop
  - /proc/meminfo

  # Disk information
  - /usr/bin/df
  - /usr/bin/du
  - /usr/bin/findmnt
  - /usr/sbin/fdisk -l
  - /usr/sbin/parted -l
  - /usr/sbin/blkid
  - /usr/bin/lsblk
  - /usr/sbin/smartctl
  - /usr/sbin/nvme

  # Network information
  - /usr/bin/ip
  - /usr/sbin/ifconfig
  - /usr/bin/netstat
  - /usr/bin/ss
  - /usr/sbin/route
  - /usr/sbin/arp
  - /usr/sbin/ethtool
  - /usr/sbin/iwconfig
  - /usr/sbin/iw
  - /usr/bin/nmap
  - /usr/bin/dig
  - /usr/bin/nslookup
  - /usr/bin/host
  - /usr/bin/traceroute
  - /usr/bin/mtr

  # Service information
  - /usr/bin/systemctl status *
  - /usr/bin/systemctl list-units
  - /usr/bin/systemctl list-unit-files
  - /usr/bin/systemctl list-timers
  - /usr/bin/systemctl list-sockets
  - /usr/bin/systemctl show *
  - /usr/bin/journalctl
  - /usr/bin/service * status

  # File system information
  - /usr/bin/mount
  - /usr/bin/findmnt
  - /usr/sbin/zfs list
  - /usr/sbin/zpool status
  - /usr/sbin/zpool list
  - /usr/sbin/btrfs filesystem show
  - /usr/sbin/btrfs device stats
  - /usr/sbin/lvdisplay
  - /usr/sbin/vgdisplay
  - /usr/sbin/pvdisplay

  # Package information
  - /usr/bin/apt list
  - /usr/bin/dpkg -l
  - /usr/bin/snap list
  - /usr/bin/flatpak list

  # Kernel and module information
  - /usr/sbin/lsmod
  - /usr/sbin/modinfo *
  - /usr/bin/dmesg
  - /usr/sbin/sysctl -a

  # Security information
  - /usr/bin/last
  - /usr/bin/lastlog
  - /usr/bin/w
  - /usr/bin/who
  - /usr/bin/users
  - /usr/bin/id
  - /usr/bin/groups
  - /usr/sbin/aa-status
  - /usr/sbin/sestatus
  - /usr/bin/firewall-cmd --list-all
  - /usr/sbin/iptables -L
  - /usr/sbin/iptables -S
  - /usr/sbin/ip6tables -L
  - /usr/sbin/ip6tables -S
  - /usr/sbin/nft list ruleset

  # Container/VM information
  - /usr/bin/docker ps
  - /usr/bin/docker images
  - /usr/bin/docker info
  - /usr/bin/docker version
  - /usr/bin/podman ps
  - /usr/bin/podman images
  - /usr/bin/virsh list
  - /usr/bin/qm list
  - /usr/bin/pvesh get /nodes

  # Performance monitoring
  - /usr/bin/iostat
  - /usr/bin/mpstat
  - /usr/bin/sar
  - /usr/bin/perf stat
  - /usr/bin/perf top

  # Log viewing
  - /usr/bin/tail -f /var/log/*
  - /usr/bin/head /var/log/*
  - /usr/bin/cat /var/log/*
  - /usr/bin/less /var/log/*
  - /usr/bin/zcat /var/log/*.gz
  - /usr/bin/bzcat /var/log/*.bz2
