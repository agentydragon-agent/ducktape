---
- name: Configure atlas Proxmox host
  hosts: atlas
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: atlas
    docker_state: absent # Proxmox host doesn't need Docker
    skip_ubuntu_ppas: true # Debian-based Proxmox can't use Ubuntu PPAs
    include_heavy_dev_packages: false
    # Headscale server for /etc/hosts bootstrap entry (see tailscale task below)
    headscale_server_hostname: "agentydragon.com"
    headscale_server_ip: "172.235.48.86"
  remote_user: root

  tasks:
    # Fix Proxmox repository issues
    - name: Remove Proxmox enterprise repositories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
      tags: [repositories]

    - name: Add Proxmox no-subscription repository
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
        state: present
      tags: [repositories]

    - name: Configure local datastore content types for Terraform
      ansible.builtin.command:
        cmd: pvesm set local --content backup,iso,vztmpl,snippets,images,import
      register: datastore_result
      changed_when: datastore_result.rc == 0
      failed_when: datastore_result.rc != 0 and 'already exists' not in datastore_result.stderr
      tags: [proxmox, terraform]

    - name: Configure Proxmox SPICE proxy hostname
      ansible.builtin.lineinfile:
        path: /etc/pve/datacenter.cfg
        regexp: "^spice_proxy:"
        line: "spice_proxy: atlas.agentydragon.com"
        state: present
      tags: [proxmox, spice]

    - name: Update apt cache after repository changes
      ansible.builtin.apt:
        update_cache: true
      tags: [repositories]

    - name: Ensure ducktape directory parent exists
      ansible.builtin.file:
        path: "/home/{{ my_user }}/code"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: "0755"
      tags: [dotfiles]

    - name: Clone ducktape repository if not present # noqa: latest[git]
      ansible.builtin.git:
        repo: "git@gitlab.com:agentydragon/ducktape"
        dest: "{{ cli_ducktape_path }}"
        accept_hostkey: true
      become: true
      become_user: "{{ my_user }}"
      async: "{{ git_async_timeout }}"
      poll: 0
      register: ducktape_git_job
      tags: [dotfiles]
      failed_when: false # In case SSH keys aren't set up yet

    - name: Wait for ducktape repository clone
      ansible.builtin.async_status:
        jid: "{{ ducktape_git_job.ansible_job_id }}"
      register: ducktape_git_status
      until: ducktape_git_status.finished
      retries: "{{ (git_async_timeout // apt_async_poll_interval) | int }}"
      delay: "{{ apt_async_poll_interval }}"
      failed_when: ducktape_git_status.rc is defined and ducktape_git_status.rc != 0
      tags: [dotfiles]

    - name: Install Firefox
      ansible.builtin.package:
        name: firefox-esr
        state: present
      tags: [packages]

    - name: Install desktop and virtualization packages
      ansible.builtin.apt:
        name:
          - gnome
          - virt-viewer
          - libvirt-daemon-system
          - libvirt-clients
          - gdm3 # GNOME Display Manager
          - zsh
          - spice-client-gtk # For SPICE console connections
          - ydotool # For input automation on Wayland (SPICE latency measurement)
          - ydotoold # ydotool daemon (separate package on bookworm)
          - gstreamer1.0-pipewire # For GNOME screencast recording
          - gstreamer1.0-plugins-good # For GNOME screencast recording
        state: present
        install_recommends: false
      tags: [packages, desktop, virtualization]

    - name: Ensure libvirt service is started
      ansible.builtin.systemd:
        name: libvirtd
        state: started
        enabled: true
      tags: [virtualization]

    - name: Create primary user
      ansible.builtin.user:
        name: "{{ my_user }}"
        comment: Primary user account
        shell: /usr/bin/zsh
        home: "/home/{{ my_user }}"
        create_home: true
        groups:
          - sudo
          - libvirt # for virt-manager access
          - input # for /dev/uinput access (ydotool)
        append: true
        state: present
      tags: [users]

    - name: Allow input group access to /dev/uinput
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-uinput.rules
        content: 'KERNEL=="uinput", GROUP="input", MODE="0660", OPTIONS+="static_node=uinput"'
        mode: "0644"
      notify: Reload udev rules
      tags: [ydotool]

    - name: Enable GDM display manager
      ansible.builtin.systemd:
        name: gdm3
        enabled: true
        state: started
      tags: [desktop]

    - name: Apply system inspection nopasswd role
      ansible.builtin.import_role:
        name: system_inspection_nopasswd
      tags: [sudo, system]

    # Install resolvconf before tailscale so MagicDNS works automatically
    # Proxmox uses isc-dhcp-client without systemd-resolved; resolvconf
    # provides the integration layer that tailscale needs to manage DNS
    - name: Install resolvconf for Tailscale MagicDNS integration
      ansible.builtin.apt:
        name: resolvconf
        state: present
      tags: [tailscale, dns]

    # Headscale bootstrap DNS workaround: Tailscale's bootstrap DNS (DERP servers)
    # only resolves tailscale.com domains. With headscale using agentydragon.com,
    # clients can't resolve the control server on boot (DNS set to 100.100.100.100
    # which requires the tunnel to be up first). Static /etc/hosts entry fixes this.
    # See cluster/docs/plan.md "Headscale Bootstrap DNS Workaround" for details.
    - name: Add headscale server to /etc/hosts for bootstrap DNS
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*\s+{{ headscale_server_hostname }}$'
        line: "{{ headscale_server_ip }} {{ headscale_server_hostname }}"
        state: present
      tags: [tailscale, dns]

    - name: Apply Tailscale client role
      ansible.builtin.import_role:
        name: tailscale_client
      tags: [tailscale]

    - name: Apply CLI role
      ansible.builtin.import_role:
        name: cli
      tags: [cli]
    # legacy_without_home_manager/cli excluded - atlas uses Nix/home-manager for these tools

    - name: Apply Nix role
      ansible.builtin.import_role:
        name: nix
      tags: [nix]
      vars:
        nix_trusted_users: "root {{ my_user }}"

    # GPU Passthrough Configuration
    #
    # Atlas boots via systemd-boot (UEFI), NOT GRUB. Kernel cmdline lives in
    # /etc/kernel/cmdline and is applied via `proxmox-boot-tool refresh`.
    #
    # pcie_aspm=off: Disable PCIe Active State Power Management to prevent
    # passed-through GPUs from entering low-power states that VFIO can't
    # recover from, causing "RC watchdog: GPU is probably locked!" errors.
    # See investigations/wyrm-gpu-lockup.md for details.
    - name: Configure kernel cmdline for IOMMU and GPU passthrough
      ansible.builtin.copy:
        dest: /etc/kernel/cmdline
        content: "root=ZFS=rpool/ROOT/pve-1 boot=zfs amd_iommu=on iommu=pt pcie_aspm=off"
        mode: "0644"
        backup: true
      notify: Refresh proxmox boot
      tags: [gpu_passthrough, iommu]

    - name: Add VFIO modules to /etc/modules
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop:
        - vfio
        - vfio_iommu_type1
        - vfio_pci
        - vfio_virqfd
      tags: [gpu_passthrough, vfio]

    - name: Blacklist NVIDIA drivers on host
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nvidia.conf
        content: |
          blacklist nouveau
          blacklist nvidia
          blacklist nvidiafb
          blacklist nvidia_drm
        mode: "0644"
      tags: [gpu_passthrough, nvidia]

    - name: Update initramfs after module changes
      ansible.builtin.command:
        cmd: update-initramfs -u
      register: initramfs_result
      changed_when: initramfs_result.rc == 0
      tags: [gpu_passthrough]

    # TODO: WiFi Configuration - MediaTek MT7927 (14c3:7927)
    # The atlas host has a MediaTek MT7927 WiFi 7 card, but it's not supported
    # by the mt7921e driver in kernel 6.8.12. The driver only supports MT7961/MT7922.
    # Solutions:
    # 1. Wait for Proxmox kernel update to 6.10+ which should include MT7927 support
    # 2. Try force-binding: echo "14c3 7927" > /sys/bus/pci/drivers/mt7921e/new_id
    # 3. Install newer mainline kernel with MT7927 support
    # Required packages when driver support is available:
    # - wireless-tools, wpasupplicant, iw (pve-firmware already has MediaTek firmware)

    # TODO: Manage Proxmox VM configurations in Ansible
    # Currently VM configs live only in /etc/pve/qemu-server/*.conf
    # Key VM to manage:
    # - VM 100 (wyrm): vga=virtio-gl, hostpci0=01:00,hostpci1=03:00 (2x NVIDIA 5090), 32 cores, 64GB RAM
    # Consider using community.general.proxmox_kvm module or templating .conf files

  handlers:
    - name: Refresh proxmox boot
      ansible.builtin.command:
        cmd: proxmox-boot-tool refresh
      register: boot_result
      changed_when: boot_result.rc == 0

    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      register: udev_result
      changed_when: udev_result.rc == 0
