---
- hosts: atlas
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: atlas
    ducktape_path: "/home/{{ my_user }}/code/ducktape"
    docker_state: absent  # Proxmox host doesn't need Docker
    skip_ubuntu_ppas: true  # Debian-based Proxmox can't use Ubuntu PPAs
    include_heavy_dev_packages: false
  remote_user: root

  tasks:
    # Fix Proxmox repository issues
    - name: Remove Proxmox enterprise repositories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
      tags: [repositories]

    - name: Add Proxmox no-subscription repository
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
        state: present
        filename: pve-no-subscription
      tags: [repositories]

    - name: Update apt cache after repository changes
      ansible.builtin.apt:
        update_cache: yes
      tags: [repositories]

    - name: Ensure ducktape directory parent exists
      ansible.builtin.file:
        path: "/home/{{ my_user }}/code"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: '0755'
      tags: [dotfiles]

    - name: Clone ducktape repository if not present
      ansible.builtin.git:
        repo: "git@gitlab.com:agentydragon/ducktape"
        dest: "{{ ducktape_path }}"
        accept_hostkey: yes
      become: true
      become_user: "{{ my_user }}"
      tags: [dotfiles]
      ignore_errors: yes  # In case SSH keys aren't set up yet

    - name: Install Firefox
      ansible.builtin.package:
        name: firefox-esr
        state: present
      tags: [packages]

    - name: Install desktop and virtualization packages
      ansible.builtin.apt:
        name:
          - gnome
          - virt-viewer
          - libvirt-daemon-system
          - libvirt-clients
          - gdm3  # GNOME Display Manager
          - zsh
          - spice-client-gtk  # For SPICE console connections
        state: present
        install_recommends: no
      tags: [packages, desktop, virtualization]

    - name: Ensure libvirt service is started
      ansible.builtin.systemd:
        name: libvirtd
        state: started
        enabled: yes
      tags: [virtualization]

    - name: Create primary user
      ansible.builtin.user:
        name: "{{ my_user }}"
        comment: Primary user account
        shell: /usr/bin/zsh
        home: "/home/{{ my_user }}"
        create_home: yes
        groups: 
          - sudo
          - libvirt  # for virt-manager access
        append: yes
        state: present
      tags: [users]

    - name: Enable GDM display manager
      ansible.builtin.systemd:
        name: gdm3
        enabled: yes
        state: started
      tags: [desktop]

    - import_role:
        name: tailscale-client
      tags: [tailscale]

    - import_role:
        name: cli
      tags: [cli]

    - import_role:
        name: k3s
      tags: [k3s]

