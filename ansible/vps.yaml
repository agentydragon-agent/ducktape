# Certbot renewal is done via the nginx *authenticator*.
# See https://eff-certbot.readthedocs.io/en/latest/using.html#getting-certificates-and-choosing-plugins.
# Looks like the authenticator does this via /.well-known/acme-challenge:
#   https://github.com/certbot/certbot/blob/619654f3175687fc02dbbf34754e43c067303c3b/certbot-nginx/certbot_nginx/_internal/http_01.py#L237C9-L237C9
#
# TODO: check if the configurator does a good job too.
#
# Certbot comes with a built-in systemd timer: systemctl show certbot.timer.
# That runs `certbot renew`. I can check in journalctl that it does the right
# thing. It runs ~2x/day by default.

---
- hosts: linode
  remote_user: root

  vars:
    ## 2025-02-07 disable trilium
    ## trilium_ssl_port: 3000
    grocy_localhost_http_port: 9283

  tasks:
    # Needs to run before Docker, which tries to install gnupg2
    - name: Update everything
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    ## 2025-02-07 don't need bazel cache, trilium atm
    ## - name: Create Trilium group
    ##   tags:
    ##     - trilium-server
    ##   ansible.builtin.group:
    ##     name: trilium
    ##     state: present
    ##
    ## - name: Create Trilium user
    ##   tags:
    ##     - trilium-server
    ##   ansible.builtin.user:
    ##     name: trilium
    ##     group: trilium
    ##
    ## - name: Create Bazel remote cache group
    ##   ansible.builtin.group:
    ##     name: bazel-remote-cache
    ##     state: present
    ##   tags:
    ##     - bazel-remote-cache
    ##
    ## - name: Create Bazel remote cache user
    ##   ansible.builtin.user:
    ##     name: bazel-remote-cache
    ##     group: bazel-remote-cache
    ##   tags:
    ##     - bazel-remote-cache
    ##   register: bazel_remote_cache_user

    - name: Create Grocy group
      ansible.builtin.group:
        name: grocy
        state: present
      tags:
        - grocy

    - name: Create Grocy user
      ansible.builtin.user:
        name: grocy
        group: grocy
      tags:
        - grocy
      register: grocy_user

    # 2024-07-01 deleted -- adds wrong repo entry
    #
    # - name: Include docker role for Docker users
    #   ansible.builtin.include_role:
    #     name: geerlingguy.docker
    #   vars:
    #     docker_service_state: started
    #     docker_service_enabled: true
    #     docker_users:
    #       - trilium
    #       - bazel-remote-cache
    #   tags:
    #     - bazel-remote-cache
    #     - docker

    # TODO: maybe we should restart Docker server if we added users here

    ## 2025-02-07 disable trilium
    # - name: Trilium role
    #   ansible.builtin.include_role:
    #     name: trilium_server
    #   vars:
    #     trilium_host: trilium.agentydragon.com
    #     # also uses trilium_ssl_port

    - name: Enable Fail2Ban role
      ansible.builtin.include_role:
        name: nbigot.ansible-fail2ban
      tags:
        - fail2ban

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install packages
      apt:
        name:
          - mosh
          - ncdu
          - nginx
          # certbot nginx plugin for autorenewing certs nicely
          - python3-certbot-nginx
        state: latest

    - name: Create user
      user:
        name: agentydragon
        createhome: true
        # NOTE: still need to ssh-copy-id over to the user manually.

    - name: Install & update convenience use packages
      apt:
        name:
          - ncdu
        state: latest

    - name: Install & update nginx
      apt:
        name:
          - nginx
        state: latest

    - set_fact:
        letsencrypt_certificate_names:
          # Presented by nginx to serve my website from static files.
          - agentydragon.com,www.agentydragon.com
          - adgn.link,www.adgn.link
          - grocy.agentydragon.com
          # 2025-02-07 disable bazel-cache, trilium
          ## # Presented by nginx to proxy requests to the Trilium server.
          ## - trilium.agentydragon.com
          ## # Presented by Bazel cache Docker container which has ports
          ## # exposed to public internet.
          ## - bazel-cache.agentydragon.com
          - inventree.agentydragon.com

        # This seems to be what we need to present to certbot install.
        # Looks like certbot install doesn't take the same parameters,
        # if you request a certificate for multiple domains, it'll only
        # then be installable under one name... :(
        letsencrypt_certificate_names_to_install:
          - agentydragon.com
          - adgn.link
          - grocy.agentydragon.com
          - inventree.agentydragon.com
          # 2025-02-07 disable bazel-cache, trilium
          ###- trilium.agentydragon.com
          # bazel-cache.agentydragon.com deliberately not included,
          # because it's not for installation in nginx.
          - inventree.agentydragon.com

    - name: Let's Encrypt certificates
      block:
      - name: Install & update certbot nginx plugin
        apt:
          name:
            # certbot nginx plugin for autorenewing certs nicely
            - python3-certbot-nginx
          state: latest

      # We need to obtain these certificates before updating nginx
      # configuration in case the nginx configuration depends on certificates
      # we didn't obtain yet.
      #
      # TODO: only mark as "changed" if the cert was actually renewed.
      # TODO: only trigger installing a cert if it was changed.
      - name: Obtain Let's Encrypt certificates
        command: certbot certonly --non-interactive --agree-tos --nginx -d {{ item }}
        loop: "{{ letsencrypt_certificate_names }}"

      #### 2025-02-07 disable bazel-cache, trilium
      #### for mutual TLS with client certificates: --tls_ca_file
      #### sudo apt install apache2-utils -- for htpasswd utility
      #### TODO: this also needs to be run if certificate is already in /etc, but
      #### not yet in /srv/bazel-remote-cache.
      ###- name: Set Bazel remote cache certificate post hook
      ###  tags:
      ###    - bazel-remote-cache
      ###  ansible.builtin.copy:
      ###    dest: /etc/letsencrypt/renewal-hooks/post/bazel-remote-cache.sh
      ###    mode: 0755
      ###    content: |
      ###      #!/bin/sh
      ###      rm -rf /srv/bazel-remote-cache/certs
      ###      mkdir -p /srv/bazel-remote-cache/certs
      ###      cp --dereference --recursive /etc/letsencrypt/live/bazel-cache.agentydragon.com/* /srv/bazel-remote-cache/certs
      ###      chmod -R 700 /srv/bazel-remote-cache/certs
      ###      chown -R bazel-remote-cache:bazel-remote-cache /srv/bazel-remote-cache/certs
      ###      # TODO: do I maybe also need to restart the bazel-remote-cache container?

      ###- name: Check that Bazel remote cache certificate exists
      ###  tags:
      ###    - bazel-remote-cache
      ###  block:
      ###    - stat:
      ###        path: /etc/letsencrypt/live/bazel-cache.agentydragon.com/fullchain.pem
      ###      register: bazel_cache_cert
      ###    - assert:
      ###        that:
      ###          - bazel_cache_cert.stat.exists

    - name: nginx website configs
      block:
      - name: "Create nginx configuration from template"
        template:
          src: "nginx-sites/{{ item }}.j2"
          dest: "/etc/nginx/sites-available/{{ item }}"
        tags:
          - nginx
        notify:
          - Reload nginx
        loop:
          - grocy.agentydragon.com
          ## 2025-02-07 disable trilium server
          # - trilium.agentydragon.com
          - trilium.agentydragon.com
          - inventree.agentydragon.com

      - name: "Create static nginx configuration"
        ansible.builtin.copy:
          src: nginx-sites/{{ item }}
          dest: /etc/nginx/sites-available/{{ item }}
        tags:
          - nginx
        with_items:
          - agentydragon.com
          - adgn.link

      # The nginx default website takes priority over my http://agentydragon.com
      # redirect, so disable it.
      - name: Disable nginx default website
        file:
          state: absent
          dest: /etc/nginx/sites-enabled/default
        tags:
          - nginx
        notify:
          - Reload nginx

      - name: Enable nginx websites
        file:
          state: link
          src: /etc/nginx/sites-available/{{ item }}
          dest: /etc/nginx/sites-enabled/{{ item }}
        with_items:
          - agentydragon.com
          - adgn.link
          - grocy.agentydragon.com
          ## 2025-02-07 disable trilium server
          # - trilium.agentydragon.com
          - inventree.agentydragon.com
        tags:
          - nginx
        notify:
          - Reload nginx

    # Now that we obtained the certificates and have configurations for
    # servers that use them, install them.
    - name: Install Let's Encrypt certificates
      command: certbot install --non-interactive --agree-tos --nginx --cert-name {{ item }}
      loop: "{{ letsencrypt_certificate_names_to_install }}"

    # 2025-02-07 disable bazel cache
    ###- name: Copy Bazel remote cache htpasswd on server
    ###  ansible.builtin.copy:
    ###    src: bazel_remote_cache.htpasswd
    ###    dest: /srv/bazel-remote-cache/htpasswd
    ###    owner: bazel-remote-cache
    ###    group: bazel-remote-cache
    ###    mode: 0600
    ###  tags:
    ###    - bazel-remote-cache

    ###- name: Create Bazel remote cache directory
    ###  ansible.builtin.file:
    ###    path: /srv/bazel-remote-cache/data
    ###    state: directory
    ###    owner: bazel-remote-cache
    ###    group: bazel-remote-cache
    ###    mode: 0700
    ###  tags:
    ###    - bazel-remote-cache

    ###- name: Create Bazel remote cache container
    ###  ansible.builtin.docker_container:
    ###    name: bazel-remote-cache
    ###    user: "{{ bazel_remote_cache_user.uid }}"
    ###    # TODO: pin to a specific version of bazel-remote-server?
    ###    image: buchgr/bazel-remote-cache:latest
    ###    # TODO: BAZEL_REMOTE_CONFIG_FILE env variable can be set to a YAML
    ###    # configuration file. might be potentially easier than specifying
    ###    # command-line options.
    ###    entrypoint:
    ###      - /app/bazel-remote-base.binary
    ###      - --tls_cert_file=/data/certs/fullchain.pem
    ###      - --tls_key_file=/data/certs/privkey.pem
    ###      - --http_address=:9090
    ###      - --grpc_address=:9092
    ###      - --dir=/data/data
    ###      # Allow unauthenticated reads - just not unauthenticated writes.
    ###      # This assumes I'll be only using this for public projects.
    ###      - --allow_unauthenticated_reads
    ###      # Maximum size: 20 GB (default is 5 GB)
    ###      - --max_size=20
    ###      - --htpasswd_file=/data/htpasswd
    ###    volumes:
    ###      - /srv/bazel-remote-cache:/data
    ###    published_ports:
    ###      # Default ports: 9090 for HTTP, 9092 for gRPC.
    ###      # TODO: would be nice to set up reverse proxy, so I don't have
    ###      # to specify port in --remote_cache param. The syntax is:
    ###      # (container-internal port):(host port).
    ###      - "9090:9090"
    ###      - "9092:9092"
    ###    state: started
    ###    restart: true
    ###    restart_policy: always
    ###    # Always pull latest version of the image.
    ###    pull: true
    ###  tags:
    ###    - bazel-remote-cache

    - name: Create Grocy directory
      ansible.builtin.file:
        path: /srv/grocy
        state: directory
        owner: grocy
        group: grocy
        mode: 0700
      tags:
        - grocy

    - name: Create Grocy container
      tags:
        - grocy
      ansible.builtin.docker_container:
        container_default_behavior: no_defaults
        detach: true
        init: false
        interactive: false

        # ugh, looks like linuxserver.io requires running as root...
        # probably something having to do with permissions on files inside
        # the container?
        user: root

        #memory: "512M"
        #memory_swap: -1  # unlimited swap
        paused: false
        privileged: false
        read_only: false
        tty: false
        auto_remove: false
        name: grocy
        # TODO: pin to specific version?
        image: lscr.io/linuxserver/grocy:latest
        env:
          TZ: America/Los_Angeles
          PUID: "{{ grocy_user.uid }}"
          PGID: "{{ grocy_user.group }}"
        published_ports:
          # Expose internal port 80 as external port 9283 on localhost.
          # Only expose to localhost, not externally.
          - "127.0.0.1:{{ grocy_localhost_http_port }}:80"
        volumes:
          - /srv/grocy:/config
        restart: true
        restart_policy: unless-stopped

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true
      tags:
        - nginx
        
    - name: InvenTree setup
      block:
      - name: Create Inventree Docker Compose directory
        ansible.builtin.file:
          path: /srv/inventree/docker-compose
          state: directory
          mode: 0700
        tags:
          - inventree

      - name: copy Docker Compose files
        copy:
          src: inventree/{{ item }}
          dest: /srv/inventree/docker-compose/{{ item }}
        loop:
        - .env
        - docker-compose.yml
        tags:
          - inventree

      - name: docker compose up for inventree
        community.docker.docker_compose_v2:
          project_src: /srv/inventree/docker-compose
          # We're pinned to "stable" tag.
          # If "stable" tag moved, do fetch its new value and fetch the updated
          # container.
          pull: always
          # (recreate to make sure to pick up env changes)
          recreate: always
        register: output
        tags:
          - inventree

      - name: Show results
        ansible.builtin.debug:
          var: output
        tags:
          - inventree

  handlers:
    # Only triggers if nginx config files changed.
    - name: Reload nginx
      systemd:
        state: reloaded
        daemon_reload: true
        name: nginx
        enabled: true
      tags:
        - nginx
