---
- hosts: linode
  remote_user: root

  vars:
    - trilium_ssl_port: 3000

  tasks:
    # Needs to run before Docker, which tries to install gnupg2
    - name: Update everything
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Create Trilium group
      ansible.builtin.group:
        name: trilium
        state: present

    - name: Create Trilium user
      ansible.builtin.user:
        name: trilium
        group: trilium

    - name: Create Bazel remote cache group
      ansible.builtin.group:
        name: bazel-remote-cache
        state: present
      tags:
        - bazel-remote-cache

    - name: Create Bazel remote cache user
      ansible.builtin.user:
        name: bazel-remote-cache
        group: bazel-remote-cache
      tags:
        - bazel-remote-cache
      register: bazel_remote_cache_user

    - name: Include docker role for Trilium user
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_service_state: started
        docker_service_enabled: true
        docker_users:
          - trilium
          - bazel-remote-cache
      tags:
        - bazel-remote-cache
        - docker

    # TODO: maybe we should restart Docker server if we added users here

    - name: Trilium role
      ansible.builtin.include_role:
        name: trilium_server
      vars:
        trilium_host: trilium.agentydragon.com
        # also uses trilium_ssl_port

    - name: Enable Fail2Ban role
      ansible.builtin.include_role:
        name: nbigot.ansible-fail2ban
      tags:
        - fail2ban

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install packages
      apt:
        name:
          - ncdu
          - nginx
          # certbot nginx plugin for autorenewing certs nicely
          - python3-certbot-nginx
        state: latest

    - name: Create user
      user:
        name: agentydragon
        createhome: true
        # NOTE: still need to ssh-copy-id over to the user manually.

    - name: Let's Encrypt installation
      ansible.builtin.include_role:
        name: systemli.letsencrypt
      vars:
        # TODO: maybe remove this?
        letsencrypt_opts_extra: "--register-unsafely-without-email"
        letsencrypt: true

    - name: Stop nginx before obtaining certificates
      systemd:
        state: stopped
        name: nginx

    # TODO: maybe instead use: https://docs.ansible.com/ansible/2.9/modules/acme_certificate_module.html#acme-certificate-module
    # TODO: maybe use with_items for those let's encrypt certs?
    # TODO: https://github.com/systemli/ansible-role-letsencrypt  --  does this
    # allow multiple certs at once or something like that? would be nice.
    - name: Let's Encrypt certificate for trilium.agentydragon.com
      ansible.builtin.include_role:
        name: systemli.letsencrypt
      vars:
        letsencrypt_opts_extra: "--register-unsafely-without-email"
        letsencrypt_cert:
          # TODO: move into a var
          name: "trilium.agentydragon.com"
          domains:
            - "trilium.agentydragon.com"
          challenge: http
          http_auth: standalone
      tags:
        - letsencrypt

    - name: Let's Encrypt certificate for (www.)?agentydragon.com
      ansible.builtin.include_role:
        name: systemli.letsencrypt
      vars:
        letsencrypt_opts_extra: "--register-unsafely-without-email"
        letsencrypt_cert:
          name: "agentydragon.com"
          domains:
            - agentydragon.com
            - www.agentydragon.com
          challenge: http
          http_auth: standalone
          users:
            - trilium
      tags:
        - letsencrypt

    # for mutual TLS with client certificates: --tls_ca_file
    # sudo apt install apache2-utils -- for htpasswd utility
    # TODO: this also needs to be run if certificate is already in /etc, but
    # not yet in /srv/bazel-remote-cache.
    - name: Set Bazel remote cache certificate post hook
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/post/bazel-remote-cache.sh
        mode: 0755
        content: |
          #!/bin/sh
          rm -rf /srv/bazel-remote-cache/certs
          mkdir -p /srv/bazel-remote-cache/certs
          cp --dereference --recursive /etc/letsencrypt/live/bazel-cache.agentydragon.com/* /srv/bazel-remote-cache/certs
          chmod -R 700 /srv/bazel-remote-cache/certs
          chown -R bazel-remote-cache:bazel-remote-cache /srv/bazel-remote-cache/certs
          # TODO: do I maybe also need to restart the bazel-remote-cache container?

    # probably this role is getting skipped cause of the tag...
    - name: Let's Encrypt certificate for bazel-cache.agentydragon.com
      ansible.builtin.include_role:
        name: systemli.letsencrypt
      vars:
        letsencrypt_opts_extra: "--register-unsafely-without-email"
        letsencrypt_cert:
          name: "bazel-cache.agentydragon.com"
          domains:
            - bazel-cache.agentydragon.com
          challenge: http
          http_auth: standalone
          users:
            - bazel-remote-cache
      tags:
        - letsencrypt
        - bazel-remote-cache

    - stat:
        path: /etc/letsencrypt/live/bazel-cache.agentydragon.com/fullchain.pem
      register: bazel_cache_cert

    - assert:
        that:
          - bazel_cache_cert.stat.exists

    - name: Create nginx configuration files
      template:
        src: templates/nginx-sites/{{ item }}.j2
        dest: /etc/nginx/sites-available/{{ item }}
      with_items:
        - agentydragon.com
        - trilium.agentydragon.com
      tags:
        - nginx
      notify:
        - Reload nginx

    - name: Enable nginx websites
      file:
        state: link
        src: /etc/nginx/sites-available/{{ item }}
        dest: /etc/nginx/sites-enabled/{{ item }}
      with_items:
        - agentydragon.com
        - trilium.agentydragon.com
      tags:
        - nginx
      notify:
        - Reload nginx

    - name: Copy Bazel remote cache htpasswd on server
      ansible.builtin.copy:
        src: bazel_remote_cache.htpasswd
        dest: /srv/bazel-remote-cache/htpasswd
        owner: bazel-remote-cache
        group: bazel-remote-cache
        mode: 0600
      tags:
        - bazel-remote-cache

    - name: Create Bazel remote cache directory
      ansible.builtin.file:
        path: /srv/bazel-remote-cache/data
        state: directory
        owner: bazel-remote-cache
        group: bazel-remote-cache
        mode: 0700
      tags:
        - bazel-remote-cache

    - name: Create Bazel remote cache container
      ansible.builtin.docker_container:
        name: bazel-remote-cache
        user: "{{ bazel_remote_cache_user.uid }}"
        # TODO: pin to a specific version of bazel-remote-server?
        image: buchgr/bazel-remote-cache:latest
        # TODO: BAZEL_REMOTE_CONFIG_FILE env variable can be set to a YAML
        # configuration file. might be potentially easier than specifying
        # command-line options.
        entrypoint:
          - /app/bazel-remote-base.binary
          - --tls_cert_file=/data/certs/fullchain.pem
          - --tls_key_file=/data/certs/privkey.pem
          - --http_address=:9090
          - --grpc_address=:9092
          - --dir=/data/data
          # Allow unauthenticated reads - just not unauthenticated writes.
          # This assumes I'll be only using this for public projects.
          - --allow_unauthenticated_reads
          # Maximum size: 20 GB (default is 5 GB)
          - --max_size=20
          - --htpasswd_file=/data/htpasswd
        volumes:
          - /srv/bazel-remote-cache:/data
        published_ports:
          # Default ports: 9090 for HTTP, 9092 for gRPC.
          # TODO: would be nice to set up reverse proxy, so I don't have
          # to specify port in --remote_cache param. The syntax is:
          # (container-internal port):(host port).
          - "9090:9090"
          - "9092:9092"
        state: started
        restart: true
        restart_policy: always
        # Always pull latest version of the image.
        pull: true
      tags:
        - bazel-remote-cache

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true
      tags:
        - nginx

    - name: Create a cron job to renew Let's Encrypt certificates
      cron:
        name: "Renew Let's Encrypt certificates"
        special_time: daily
        job: "certbot renew --quiet --nginx --reloadcmd \"nginx -s reload\""

  handlers:
    # Only triggers if nginx config files changed.
    - name: Reload nginx
      systemd:
        state: reloaded
        daemon_reload: true
        name: nginx
        enabled: true
      tags:
        - nginx
