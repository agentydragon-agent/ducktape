---
- hosts: agentydragon
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: agentydragon
    ducktape_path: "{{ ansible_user_dir }}/code/ducktape"
  # TODO: vars_files: agentydragon_gitlab_token.yml
  remote_user: "{{ my_user }}"

  roles:
    - role: docker
    - role: cli
    - role: gui
    - role: laptop
    - role: dev-ml
    - role: scanbox
    - role: wireguard
      tags: [wireguard]

  tasks:
    - name: Install CUDA (NVidia-specific)
      become: true
      ansible.builtin.apt:
        pkg: system76-cuda-latest

    - name: Install shared development environment
      ansible.builtin.import_role:
        name: dev-env
      tags: [dev-env]


