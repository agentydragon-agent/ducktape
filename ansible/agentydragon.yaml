---
- hosts: localhost
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    scripts_path: "{{ home_path }}/bin"
    local_scripts_path: "{{ home_path }}/.local/bin"
    ducktape_path: "{{ home_path }}/repos/ducktape"
    rcup_computer: "agentydragon"
  # TODO: vars_files:
  # TODO:   - agentydragon_gitlab_token.yml
  remote_user: "{{ my_user }}"
  roles:
    - role: geerlingguy.docker
      become: true
      vars:
        docker_service_state: started
        docker_service_enabled: true
        docker_users:
          - agentydragon
        # Replaces ansible_distribution with ubuntu, because pop!_os is not
        # generally separately supported, apparently.
        docker_apt_repository: >
          deb [arch={{ docker_apt_arch }}] {{ docker_repo_url }}/ubuntu
          {{ ansible_distribution_release }} {{ docker_apt_release_channel }}
      tags:
        - docker
# TODO:
#  - role: lean_delivery.gitlab_runner
#    vars:
#      gitlab_ci_token:
#      gitlab_api_token:
#    #vars:
#      # See https://github.com/ansible-collections/community.general/issues/440
#      # `sudo gitlab-runner register` needs to be done manually.
#      #- gitlab_runner_skip_registration: true
#      # For debugging: - no_logs: False
#    tags:
#    - gitlab-runner

    - role: jaredhocutt.gnome_extensions
      vars:
        gnome_extension_ids:
          ## gTile - https://extensions.gnome.org/extension/28/gtile/
          # Not needed on Pop! OS
          # - 28

          ## Desaturate All
          # https://extensions.gnome.org/extension/1102/desaturate-all/
          - 1102

          ## Panel Date Format
          # https://extensions.gnome.org/extension/1462/panel-date-format/
          # https://github.com/KEIII/gnome-shell-panel-date-format
          - 1462

    - common
    - anki
    - gnome-terminal-solarized
    - timekpr
    - google-drive-client
    - dev-ml
    # - dev-clojure

  tasks:
    - name: Set Night Theme Switcher to also switch gnome-terminal & nvim colors
      # TODO: dedupe
      block:
        - ansible.builtin.dconf:
            key: "/org/gnome/shell/extensions/nightthemeswitcher/commands/enabled"
            value: "true"
        - ansible.builtin.dconf:
            key: "/org/gnome/shell/extensions/nightthemeswitcher/commands/sunrise"
            value: "'set_light_theme'"
        - ansible.builtin.dconf:
            key: "/org/gnome/shell/extensions/nightthemeswitcher/commands/sunset"
            value: "'set_dark_theme'"

    - name: Set Gnome top panel datetime format
      # TODO: dedupe
      ansible.builtin.dconf:
        key: "/org/gnome/shell/extensions/panel-date-format/format"
        value: "'%a %Y-%m-%d %H:%M'"  # e.g.: "Wed 2023-11-15 22:49"
      tags:
        - gnome-shell-datetime-format

    # Cannot be done for cloudragon because of OS Login. ugh.
    - name: Set zsh as login shell
      become: true
      tags:
        - zsh
      user:
        name: "{{ my_user }}"
        shell: /bin/zsh
    - name: Clone oh-my-zsh
      tags:
        - oh-my-zsh
        - zsh
      git:
        # TODO(agentydragon): shallow clone
        repo: https://github.com/robbyrussell/oh-my-zsh
        dest: "/home/{{ my_user }}/.oh-my-zsh"
    - name: Install packages for laptop
      become: true
      ansible.builtin.apt:
        pkg:
          - acpi
          - android-tools-adb
          - blender
          - blueman
          - chrome-gnome-shell
          - flameshot  # Nice screenshot tool.
          - gnome-shell
          - gnome-tweaks
          - gnupg
          - gnupg-agent
          - gnupg-l10n
          - gpgv
          - krita
          - locate
          - openjdk-8-jdk
          - powertop
          - qshutdown
          - steam
          - torbrowser-launcher
          - transmission-gtk
          - tuxguitar
          - virtualbox
          - virtualbox-dkms
          - vlc
          - wine-stable
          - wireshark
          - xournal
          - xserver-xorg-video-amdgpu

          # For getting background color for Vim background color auto-switch.
          - xtermcontrol

          # TODO: add Ubuntu startup programs, like Flameshot etc.

    - name: Install pop os specific packages for laptop
      become: true
      ansible.builtin.apt:
        pkg:
          - system76-cuda-latest

    - name: Install Syncplay
      tags: snap
      become: true
      snap:
        classic: true
        name:
          - syncplay

    - name: Install Rescuetime
      tags:
        - rescuetime
      become: true
      when: ansible_architecture == "amd64" or ansible_architecture == "x86_64"
      ansible.builtin.apt:
        deb: https://www.rescuetime.com/installers/rescuetime_current_amd64.deb

    - name: Enable Gnome Night Light
      tags:
        - nightlight
      block:
        - dconf:
            key: /org/gnome/settings-daemon/plugins/color/night-light-enabled
            value: "true"
        - dconf:
            key: /org/gnome/settings-daemon/plugins/color/night-light-temperature
            value: "uint32 2414"
    # TODO: broken as of 2022-05-29
    # - name: Install Buildifier
    #   tags:
    #     - buildifier
    #   block:
    #     - tempfile:
    #         state: directory
    #         suffix: buildifier-build
    #       register: temp_dir
    #     - environment:
    #         GOPATH: "{{ temp_dir.path }}"
    #         GOBIN: "{{ local_scripts_path }}"
    #       block:
    #         - name: get Buildifier
    #           shell: go get github.com/bazelbuild/buildtools/buildifier
    #         - name: install Buildifier
    #           shell: go install github.com/bazelbuild/buildtools/buildifier@latest
    - name: Update githooks
      tags:
        - githooks
      # should only succeed if we don't need to update
      ansible.builtin.shell: git hooks update --no

