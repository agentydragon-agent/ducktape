# TODO: /etc/sudoers.d/020_agentydragon-nopasswd == "agentydragon ALL=(ALL) NOPASSWD: ALL"
---
- hosts: dustinspacerpi
  vars:
    my_user: agentydragon
    home_path: "/home/{{ my_user }}"
    local_scripts_path: "{{ home_path }}/.local/bin"
    ducktape_path: "{{ home_path }}/repos/ducktape"
    rcup_computer: "raspberry"
  remote_user: "{{ my_user }}"
  roles:
    - cli
  tasks:
    - name: Install packages
      become: true
      ansible.builtin.apt:
        pkg:
          - python3-pip
    - name: Update everything
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
    - name: Install speedtest-cli
      ansible.builtin.pip:
        executable: pip3
        name: speedtest-cli
    - name: Speedtest every 15 minutes
      ansible.builtin.cron:
        name: speedtestin
        hour: "*"
        minute: "*/15"
        job: "/usr/local/bin/speedtest-cli --csv >> /home/agentydragon/speedtest.csv"
