[defaults]
inventory = ./inventory.yaml
vault_identity_list = default@./tools/vault_pass.sh
vault_encrypt_identity = default
# collections_path intentionally left at defaults (~/.ansible/collections, ...)

# Use more human-readable output without deprecated callback
stdout_callback = ansible.builtin.default
result_format = yaml
# Other options: debug, json, minimal, oneline, tree

# Show task timing
callback_whitelist = timer, profile_tasks
