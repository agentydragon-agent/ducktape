user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout   65;
    keepalive_requests  1000;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

# Stream module for TCP/UDP proxy and SNI passthrough
stream {
	# SNI-based HTTPS routing for cluster domains
	map $ssl_server_name $backend_pool {
		~^(.+)\.test-cluster\.agentydragon\.com$ talos_cluster_https;
		default talos_cluster_https;
	}
	
	# Upstream pool for cluster HTTPS (SNI passthrough)
	upstream talos_cluster_https {
		server 10.0.3.2:443 max_fails=3 fail_timeout=30s;
		# Backup NodePorts if needed:
		# server w0:30443 max_fails=3 fail_timeout=30s backup;
		# server w1:30443 max_fails=3 fail_timeout=30s backup;
	}
	
	# HTTPS SNI passthrough for *.test-cluster.agentydragon.com on port 8443
	server {
		listen 8443;
		ssl_preread on;
		proxy_pass $backend_pool;
		proxy_timeout 5s;
		proxy_responses 1;
		error_log /var/log/nginx/test-cluster-sni.error.log;
	}
}

