---
- hosts: gpd
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: gpd
    ducktape_path: "{{ ansible_user_dir }}/code/ducktape"
  remote_user: "{{ my_user }}"

  roles:
    - role: cli
    - role: legacy_without_home_manager/cli
    - role: gui
    - role: gui_nix_migrated
    - role: laptop
    - role: wireguard
      tags: [wireguard]
    - role: tailscale-client
      tags: [tailscale]
    - role: k3s-client
      tags: [k3s-client]
  tasks:
    # TODO: add Ubuntu startup programs, like Flameshot etc.

    - name: Install GPD-specific packages
      become: true
      ansible.builtin.apt:
        pkg:
          - xserver-xorg-video-amdgpu

    # GPD Win Max 2's right tracking stick pretends to be a mouse,
    # which limits the maximum speed that libinput easily allows with it.
    - name: Add udev rule GPD right tracking stick
      become: true
      tags:
        - gpd-quirks
      ansible.builtin.copy:
        content: |
          # This is a pointing stick pretending to be a mouse. Make libinput
          # interpret it as a "pointing stick" (/ "trackpoint"). Keep
          # ID_INPUT_MOUSE=1, because that makes Xorg's MatchIsPointer match
          # it and direct it to libinput for handling.
          ACTION=="add|change", SUBSYSTEMS=="input", \
            ATTRS{id/vendor}=="2f24", ATTRS{id/product}=="0135", \
            ENV{ID_INPUT_POINTINGSTICK}="1"
        dest: /etc/udev/rules.d/99-gpd-trackpoint.rules
        owner: root
        group: root
        mode: '0644'

    - name: Install shared development environment
      ansible.builtin.import_role:
        name: dev-env
      tags: [dev-env]
