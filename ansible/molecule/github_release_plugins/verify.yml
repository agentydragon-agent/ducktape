---
- name: Verify GitHub release plugins and AppImageLauncher installation
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if AppImageLauncher is installed
      command: dpkg-query -W -f='${Status}' appimagelauncher
      register: appimagelauncher_check
      changed_when: false
      failed_when: false

    - name: Verify AppImageLauncher is installed
      assert:
        that: "'install ok installed' in appimagelauncher_check.stdout"
        success_msg: "AppImageLauncher is correctly installed"
        fail_msg: "AppImageLauncher is not installed properly"

    - name: Check AppImageLauncher version
      command: dpkg-query -W -f='${Version}' appimagelauncher
      register: appimagelauncher_version
      changed_when: false

    - name: Display AppImageLauncher version
      debug:
        var: appimagelauncher_version.stdout

    - name: Verify AppImageLauncher binaries exist
      stat:
        path: "{{ item }}"
      register: binary_check
      loop:
        - /usr/bin/AppImageLauncher
        - /usr/bin/appimagelauncherd
      failed_when: not binary_check.results[0].stat.exists or not binary_check.results[1].stat.exists

    - name: Verify GitHub Release info functionality
      block:
        - name: Check release information
          github_release_info:
            repo: "TheAssassin/AppImageLauncher"
            version: "v3.0.0-alpha-4"  # Using a known version
            asset_pattern: ".*_{{ dpkg_arch }}\\.deb$"
          register: verification_check

        - name: Verify GitHub release info returned correct metadata
          assert:
            that:
              - verification_check.latest_version is defined
              - verification_check.asset_url is defined
              - verification_check.release_data is defined
              - verification_check.release_data.version is defined
            success_msg: "GitHub release info returned correct metadata"
            fail_msg: "GitHub release info did not return expected metadata"
