---
- name: Test GitHub release plugins and AppImageLauncher installation
  hosts: all
  gather_facts: true
  tasks:
    # Test 1: Check GitHub release info functionality
    - name: Test GitHub release info plugin
      github_release_info:
        repo: "TheAssassin/AppImageLauncher"
        version: "latest"
        asset_pattern: ".*_{{ dpkg_arch }}\\.deb$"
      register: release_check

    - name: Verify release_check results
      assert:
        that:
          - release_check.latest_version is defined
          - release_check.asset_url is defined
        success_msg: "GitHub release info works correctly"
        fail_msg: "GitHub release info plugin failed"

    # Test 2: Install with pinned version
    - name: Set test version
      set_fact:
        test_version: "v3.0.0-alpha-4"

    - name: Install AppImageLauncher with pinned version
      github_release_install:
        release_spec:
          repo: "TheAssassin/AppImageLauncher"
          version: "{{ test_version }}"
          asset_pattern: ".*_{{ dpkg_arch }}\\.deb$"
        method: deb
      register: install_result
      become: true

    - name: Verify installation success
      assert:
        that:
          - install_result.latest_version is defined
          - install_result.asset_url is defined
          - install_result.asset_url is search(".*_" + dpkg_arch + "\\.deb$")
        success_msg: "GitHub release install installed AppImageLauncher correctly"
        fail_msg: "GitHub release install failed to install AppImageLauncher"

    # Test 3: Version acknowledgment test (should be skipped in test environment)
    - name: Test version acknowledgment (expected to be skipped)
      block:
        - name: Try installing with old acknowledged version
          github_release_install:
            repo: "TheAssassin/AppImageLauncher"
            method: deb
            version: "{{ test_version }}"
            acknowledged_version: "v2.0.0"  # An old version
            asset_pattern: ".*_{{ dpkg_arch }}\\.deb$"
          register: ack_result
          become: true
      rescue:
        - name: Verify version acknowledgment failed as expected
          set_fact:
            version_ack_test_passed: true

    - name: Assert version acknowledgment test passed
      assert:
        that: version_ack_test_passed is defined and version_ack_test_passed
        success_msg: "Version acknowledgment correctly detected new version"
        fail_msg: "Version acknowledgment test failed"
