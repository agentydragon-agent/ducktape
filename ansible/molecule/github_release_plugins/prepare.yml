---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      become: true
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - jq
        state: present

    # Set up common_dpkg_arch for testing
    - name: Get dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: common_dpkg_arch_cmd
      changed_when: false

    - name: Set common_dpkg_arch fact
      ansible.builtin.set_fact:
        common_dpkg_arch: "{{ common_dpkg_arch_cmd.stdout }}"
