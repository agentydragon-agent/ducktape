- name: Verify GNOME Terminal profile configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Dump dconf profiles
      ansible.builtin.shell: |
        set -o pipefail
        dbus-launch dconf dump /org/gnome/terminal/legacy/profiles:/ | grep visible-name
      args:
        executable: /bin/bash
      register: dconf_out
      changed_when: false

    - name: Show visible names
      ansible.builtin.debug:
        var: dconf_out.stdout_lines
        verbosity: 1

    - name: Ensure Solarized Light profile exists
      ansible.builtin.assert:
        that: "'visible-name=\\'Solarized Light\\'' in dconf_out.stdout"

    - name: Ensure Solarized Dark profile exists
      ansible.builtin.assert:
        that: "'visible-name=\\'Solarized Dark\\'' in dconf_out.stdout"
