---
# Deploy tailscale client to k3s cluster nodes so they can be accessed
# via headscale Magic DNS from anywhere on the network
- hosts: k3s_nodes
  vars_files:
    - vars/common_vars.yml
  vars:
    my_user: ubuntu
  remote_user: ubuntu
  become: true

  roles:
    - role: tailscale-client
      tags: [tailscale]
    - role: k3s_dns_resolver
      tags: [k3s, dns]
    - role: k3s_registries
      tags: [k3s, registries]

  tasks:
    - name: Ensure SSH keys are properly set up
      ansible.builtin.debug:
        msg: "SSH access to k3s nodes working"
      tags: [verify]
