name: Bump Nix flake input
description: |
  Updates a flake input to the latest version by running
  `nix flake update <input>`, then commits and pushes the change.
  Used by CI release workflows after uploading a new GitHub Release asset.

inputs:
  flake_input:
    description: "Flake input name to update (e.g., kubespand-bin, ducktape-wheel)"
    required: true
  flake_dir:
    description: "Directory containing flake.nix (e.g., nix)"
    required: true
  package_prefix:
    description: "Package name for commit message (e.g., kubespand, ducktape)"
    required: true
  extra_files:
    description: "Space-separated extra files to stage (optional)"
    required: false
    default: ""
  branch:
    description: "Branch to push to (pass github.ref_name)"
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v30

    - name: Update flake input and push
      shell: bash
      env:
        FLAKE_INPUT: ${{ inputs.flake_input }}
        FLAKE_DIR: ${{ inputs.flake_dir }}
        PACKAGE_PREFIX: ${{ inputs.package_prefix }}
        EXTRA_FILES: ${{ inputs.extra_files }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -x

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Update the flake input — nix computes the correct hash automatically
        nix flake update "$FLAKE_INPUT" --flake "./$FLAKE_DIR"

        # Stage flake.lock + any extra files
        git add "$FLAKE_DIR/flake.lock"
        if [[ -n "$EXTRA_FILES" ]]; then
          # shellcheck disable=SC2086
          git add $EXTRA_FILES
        fi

        # Check if anything changed
        if git diff --cached --quiet; then
          echo "No change needed"
          exit 0
        fi

        git commit -m "chore: bump ${PACKAGE_PREFIX} flake input [skip ci]"

        # Rebase on top of any concurrent pushes before pushing
        if ! git pull --rebase origin "$BRANCH"; then
          echo "::error::Rebase failed. Git status:"
          git status
          echo "Conflicting files:"
          git diff --name-only --diff-filter=U
          exit 1
        fi

        if ! git push origin "HEAD:${BRANCH}"; then
          echo "::error::Push failed. Diagnostics:"
          echo "Git status:"
          git status
          echo "Recent commits:"
          git log --oneline -5
          echo "Remote state:"
          git fetch origin "$BRANCH"
          git log --oneline "HEAD..origin/${BRANCH}"
          exit 1
        fi
