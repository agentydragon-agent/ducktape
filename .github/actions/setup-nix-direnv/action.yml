name: "Setup Nix and Bazelisk"
description: "Install Nix and bazelisk, matching .envrc environment"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v17

    - name: Install bazelisk via Nix
      shell: bash
      run: |
        # Install bazelisk (what .envrc provides via `use nix -p bazelisk`)
        nix profile install nixpkgs#bazelisk

        # Add Nix profile to PATH for subsequent steps
        echo "$HOME/.nix-profile/bin" >> $GITHUB_PATH

        # Create 'bazel' symlink since Nix installs the binary as 'bazelisk'
        ln -sf "$HOME/.nix-profile/bin/bazelisk" "$HOME/.nix-profile/bin/bazel"

    - name: Configure environment
      shell: bash
      run: |
        # Match .envrc: Force Bazel to use system GCC instead of Nix GCC
        # This avoids glibc mismatch issues with rustc and proc-macros
        echo "CC=/usr/bin/gcc" >> $GITHUB_ENV
