name: Pin image digest
description: Fetch pushed image digest, update image_pins.json, commit and push.

inputs:
  image:
    description: Full image name (e.g. ghcr.io/agentydragon/rbe-worker)
    required: true
  tag:
    description: Image tag to inspect for digest (e.g. pin_tag from ghcr-build-push)
    required: true
  pin_name:
    description: Key in image_pins.json (e.g. rbe_worker)
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-devtools
      with:
        package: prettier

    - name: Pin digest and push
      shell: bash
      run: |
        DIGEST=$(docker manifest inspect "${{ inputs.image }}:${{ inputs.tag }}" --verbose | \
          python3 -c "import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d['Descriptor']['digest'])")

        python3 devinfra/update_image_pin.py "${{ inputs.pin_name }}" --digest "$DIGEST"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add devinfra/image_pins.json devinfra/bbr.json

        if git diff --cached --quiet; then
          echo "image_pins.json already up to date"
          exit 0
        fi

        git commit -m "chore: pin ${{ inputs.pin_name }} image digest [skip ci]"

        BRANCH="${GITHUB_REF_NAME}"
        if ! git pull --rebase origin "$BRANCH"; then
          echo "::error::Rebase failed"
          git status
          exit 1
        fi

        git push origin "HEAD:${BRANCH}"
