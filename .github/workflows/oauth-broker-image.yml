# Build and push the OAuth broker container image to Harbor.
#
# Bazel-built OCI image — same inputs → same image digest.
# Compares local digest against remote and skips push when unchanged.
#
# Triggers:
#   - workflow_call (from ci.yml): digest comparison handles skip
#   - workflow_dispatch: manual push
name: OAuth Broker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      HARBOR_ROBOT_USERNAME:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true

concurrency:
  group: oauth-broker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.allegedly.works/oauth-broker/oauth-broker

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and load image
        run: bazel run //oauth_broker:load

      - name: Push if changed
        env:
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          local_id=$(docker inspect --format='{{.Id}}' oauth-broker:latest)
          remote_digest=$(docker manifest inspect "$IMAGE:latest" 2>/dev/null \
            | jq -r '.config.digest // empty' 2>/dev/null || true)

          if [[ -n "$remote_digest" && "$local_id" == "$remote_digest" ]]; then
            echo "oauth-broker: unchanged (local=$local_id, remote=$remote_digest), skipping push"
            exit 0
          fi

          echo "oauth-broker: changed (local=$local_id, remote=${remote_digest:-<none>}), pushing"

          TS="$(date -u +%Y%m%d%H%M%S)"
          TAG="${TS}-${SHA:0:7}"
          TAGS="$IMAGE:$SHA,$IMAGE:$TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            docker tag oauth-broker:latest "$tag"
            docker push --quiet "$tag"
          done
