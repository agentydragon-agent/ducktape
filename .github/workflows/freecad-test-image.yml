name: FreeCAD test image

on:
  push:
    branches: [main, devel]
    paths:
      - "skills/freecad/Dockerfile.test"
      - ".github/workflows/freecad-test-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ghcr-build-push
        id: build
        with:
          image: ghcr.io/${{ github.repository_owner }}/freecad-test
          context: skills/freecad
          file: skills/freecad/Dockerfile.test
          cache_from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/freecad-test:buildcache
          cache_to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/freecad-test:buildcache,mode=max

      - name: Pin digest
        if: github.event_name != 'workflow_call'
        uses: ./.github/actions/pin-image-digest
        with:
          image: ghcr.io/${{ github.repository_owner }}/freecad-test
          tag: ${{ steps.build.outputs.pin_tag }}
          pin_name: freecad_test
