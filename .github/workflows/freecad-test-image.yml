name: FreeCAD test image

on:
  push:
    branches: [devel]
    paths:
      - "skills/freecad/Dockerfile.test"
      - ".github/workflows/freecad-test-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ghcr-build-push
        id: push
        with:
          image: ghcr.io/${{ github.repository_owner }}/freecad-test
          context: skills/freecad
          file: skills/freecad/Dockerfile.test
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin digest in MODULE.bazel
        if: github.event_name != 'workflow_call'
        run: |
          DIGEST=$(docker manifest inspect "ghcr.io/${{ github.repository_owner }}/freecad-test:latest" --verbose | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['Descriptor']['digest'])")

          echo "Pinning freecad_test digest to $DIGEST"

          # Replace digest on the line inside the freecad_test oci.pull block.
          # Match: name = "freecad_test" followed (within 3 lines) by digest = "sha256:..."
          python3 -c "
          import re, pathlib
          p = pathlib.Path('MODULE.bazel')
          text = p.read_text()
          text = re.sub(
              r'(name = \"freecad_test\",\n\s+)digest = \"sha256:[a-f0-9]+\"',
              r'\1digest = \"$DIGEST\"',
              text,
          )
          p.write_text(text)
          "

          grep -q "$DIGEST" MODULE.bazel || {
            echo "::error::Failed to update MODULE.bazel with digest $DIGEST"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel

          if git diff --cached --quiet; then
            echo "MODULE.bazel already has digest $DIGEST"
            exit 0
          fi

          git commit -m "chore: pin freecad-test image digest [skip ci]"

          BRANCH="${{ github.ref_name }}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed"
            git status
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
