name: FreeCAD test image

on:
  push:
    branches: [devel]
    paths:
      - "skills/freecad/Dockerfile.test"
      - ".github/workflows/freecad-test-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/freecad-test
          context: skills/freecad
          file: skills/freecad/Dockerfile.test
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin digest in image_pins.json
        if: github.event_name != 'workflow_call'
        run: |
          DIGEST=$(docker manifest inspect "ghcr.io/${{ github.repository_owner }}/freecad-test:latest" --verbose | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['Descriptor']['digest'])")

          python3 devinfra/update_image_pin.py freecad_test --digest "$DIGEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devinfra/image_pins.json

          if git diff --cached --quiet; then
            echo "image_pins.json already up to date"
            exit 0
          fi

          git commit -m "chore: pin freecad-test image digest [skip ci]"

          BRANCH="${{ github.ref_name }}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed"
            git status
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
