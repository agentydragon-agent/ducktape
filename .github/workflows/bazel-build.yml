# Bazel build reusable workflow
#
# Builds all targets (without lint aspects)
name: Bazel Build

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to build (default: //...)"
        required: false
        type: string
        default: "//..."
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache"
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Build
        run: bazel build --keep_going ${{ inputs.targets }}

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel-cache.outputs.cache-hit }}
          cache-key: ${{ steps.bazel-cache.outputs.cache-key }}
