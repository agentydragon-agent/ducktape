# Bazel build + test + lint reusable workflow
#
# Runs comprehensive Bazel-based checks:
# - Lint + typecheck via aspects (ruff, mypy, eslint)
# - All tests
# - Rust clippy (optional, for finance/)
name: Bazel Build

on:
  workflow_call:
    inputs:
      enable_profiling:
        description: 'Enable Bazel profiling (generates downloadable artifacts)'
        required: false
        type: boolean
        default: false

jobs:
  bazel-build:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false  # keep C compiler for building Python extensions
          docker-images: true
          swap-storage: true

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt') }}
          restore-keys: bazel-${{ runner.os }}-
          save-always: true

      # Pull Docker image needed by agent_server tests (removed by free-disk-space)
      - name: Pull test Docker image
        run: docker pull python:3.12-slim

      # Lint + typecheck (Python ruff + mypy, JS/TS eslint)
      - name: Lint and typecheck
        run: |
          PROFILE_FLAG=""
          if [[ "${{ inputs.enable_profiling }}" == "true" ]]; then
            PROFILE_FLAG="--config=ci-profile"
          fi
          bazel build --keep_going --config=check $PROFILE_FLAG //...

      # All tests
      - name: Run tests
        run: bazel test --keep_going //...

      # Rust lint (separate because finance/ is optional)
      - name: Rust lint
        run: bazel build --keep_going --config=rust-check //finance/... || true

      # Upload profiling artifacts (when enabled)
      - name: Upload Bazel profile
        if: inputs.enable_profiling && always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-profile-${{ github.run_id }}
          path: |
            bazel-profile.gz
            execution-log.json
          retention-days: 14
          if-no-files-found: warn

      - name: Profile summary
        if: inputs.enable_profiling && always()
        run: |
          echo "## Bazel Profiling" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Profile artifacts uploaded: \`bazel-profile-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files included:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`bazel-profile.gz\` - Chrome tracing format (open in chrome://tracing or https://analyzer.engflow.com)" >> $GITHUB_STEP_SUMMARY
          echo "- \`execution-log.json\` - Per-action timing data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To analyze:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Chrome tracing: Open \`chrome://tracing\`, load \`bazel-profile.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "3. EngFlow analyzer: Upload to https://analyzer.engflow.com" >> $GITHUB_STEP_SUMMARY
          echo "4. CLI: \`bazel analyze-profile bazel-profile.gz\`" >> $GITHUB_STEP_SUMMARY
