# Tests requiring privileged Docker containers (WireGuard, nftables, ip rules).
# These cannot run on BuildBuddy RBE or in sandboxed environments.
# GitHub Actions ubuntu-latest runners have Linux 6.x with WireGuard built-in.
name: Privileged Docker Tests

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download targets artifact
        uses: actions/download-artifact@v4
        with:
          name: targets
        continue-on-error: true

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Load kernel modules for WireGuard and nftables
        run: |
          sudo modprobe wireguard
          for mod in nf_tables nf_tables_inet nft_chain_filter nft_chain_route; do
            sudo modprobe "$mod" 2>/dev/null && echo "loaded $mod" || echo "SKIP $mod (not available)"
          done

      - name: Network stack diagnostics
        run: |
          set +e
          echo "===== KERNEL ====="
          uname -a
          cat /proc/version

          echo "===== KERNEL CONFIG (nftables) ====="
          if [ -f /boot/config-$(uname -r) ]; then
            grep -i "NF_TABLES\|NFT_\|NETFILTER" /boot/config-$(uname -r) | sort
          else
            echo "no kernel config at /boot/config-$(uname -r)"
            zcat /proc/config.gz 2>/dev/null | grep -i "NF_TABLES\|NFT_\|NETFILTER" | sort || echo "no /proc/config.gz"
          fi

          echo "===== LOADED MODULES (nf/nft) ====="
          lsmod | grep -iE "nf_|nft_|netfilter" | sort || echo "none"

          echo "===== AVAILABLE MODULES (nf_tables) ====="
          find /lib/modules/$(uname -r)/kernel/net/netfilter -name 'nf_tables*' -o -name 'nft_*' 2>/dev/null | sort || echo "none"

          echo "===== IPTABLES ====="
          which iptables && iptables --version
          readlink -f "$(which iptables)" || true
          which iptables-nft && iptables-nft --version || true
          which iptables-legacy && iptables-legacy --version || true

          echo "===== NFT ====="
          which nft && nft --version || echo "nft not found"

          echo "===== DOCKER ====="
          docker version
          docker info 2>&1 | grep -iE "network|iptables|storage|kernel|cgroup|runtime|version|driver|operating|arch"

          echo "===== HOST NFTABLES STATE ====="
          sudo nft list ruleset 2>&1 | head -100

          echo "===== HOST IPTABLES STATE ====="
          sudo iptables -L -n 2>&1 | head -50
          sudo iptables -t nat -L -n 2>&1 | head -50

          echo "===== HOST IP RULES ====="
          ip rule show
          ip -6 rule show

          echo "===== TEST: nftables on host ====="
          sudo nft add table inet ci_diag_test
          sudo nft add chain inet ci_diag_test ci_route '{ type route hook output priority 0; policy accept; }'
          sudo nft list table inet ci_diag_test
          sudo nft delete table inet ci_diag_test
          echo "Host nftables: OK"

          echo "===== TEST: nftables in privileged container ====="
          # Test nftables inside a privileged container with bridge networking
          # (same setup as kubespand e2e tests). This is the critical test.
          docker run --rm --privileged --name ci-nft-diag debian:bookworm-slim bash -c '
            set +e
            echo "--- container network interfaces ---"
            ip link show
            ip addr show

            echo "--- /proc/self/ns ---"
            ls -la /proc/self/ns/

            echo "--- container iptables (if available) ---"
            which iptables && iptables -L -n -t nat 2>&1 || echo "no iptables in container"

            echo "--- container nftables via /proc ---"
            cat /proc/net/nf_tables 2>/dev/null || echo "no /proc/net/nf_tables"

            echo "--- try nftables via Go netlink (python fallback) ---"
            # We do not have nft here, but we can check kernel nftables state via /proc
            ls -la /proc/net/ | grep nf || echo "no nf entries in /proc/net"

            echo "--- capabilities ---"
            cat /proc/self/status | grep -i cap
          '

          echo "===== TEST: nftables in privileged container (with nft) ====="
          # Use a container that has nft installed
          docker run --rm --privileged --name ci-nft-diag2 ubuntu:24.04 bash -c '
            set +e
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq nftables iproute2 iptables procps >/dev/null 2>&1

            echo "--- iptables backend ---"
            readlink -f "$(which iptables)"
            iptables --version

            echo "--- nft version ---"
            nft --version

            echo "--- existing nftables in container namespace ---"
            nft list ruleset

            echo "--- test: create inet table ---"
            nft add table inet diag_test
            RC=$?
            echo "create table exit code: $RC"
            if [ $RC -ne 0 ]; then
              echo "FAILED to create nftables table in container!"
              echo "--- dmesg (last 20 nftables) ---"
              dmesg 2>/dev/null | grep -i nftab | tail -20 || true
            fi

            echo "--- test: add chain ---"
            nft add chain inet diag_test test_route "{ type route hook output priority 0; policy accept; }"
            echo "add chain exit code: $?"

            echo "--- test: add set + rules ---"
            nft add set inet diag_test test_set "{ type ipv6_addr; flags interval; }"
            echo "add set exit code: $?"

            echo "--- nftables state after adds ---"
            nft list ruleset

            echo "--- cleanup ---"
            nft delete table inet diag_test
            echo "delete table exit code: $?"

            echo "--- all processes in container ---"
            ps aux

            echo "--- network namespaces ---"
            ip netns list 2>/dev/null || echo "no ip netns"
          '
          echo "Container nftables diagnostics complete"

      - name: Run privileged Docker tests
        run: |
          # Use per-workflow target file if available, otherwise test all
          if [[ -f targets-privileged-docker-tests.txt ]] && [[ -s targets-privileged-docker-tests.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets-privileged-docker-tests.txt"
            echo "Using per-workflow targets from targets-privileged-docker-tests.txt"
          elif [[ -f targets-privileged-docker-tests.txt ]] || { [[ -f targets.txt ]] && [[ ! -s targets.txt ]]; }; then
            echo "No privileged Docker test targets affected, skipping"
            exit 0
          elif [[ -f targets.txt ]] && [[ -s targets.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets.txt"
            echo "Using shared targets from targets.txt (no per-workflow file)"
          else
            TARGETS="${{ inputs.targets }}"
            if [[ -z "$TARGETS" ]]; then
              echo "No targets specified, skipping tests"
              exit 0
            fi
            TARGET_ARG="$TARGETS"
            echo "Using targets from input: $TARGET_ARG"
          fi

          bazel test --keep_going \
            --build_metadata=ROLE=ci --build_metadata=TAGS=privileged-docker \
            --test_tag_filters=requires_privileged_docker \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            --strategy=TestRunner=local \
            --test_timeout=300 \
            $TARGET_ARG

      - uses: ./.github/actions/collect-test-logs
        if: always()
        with:
          artifact-name: privileged-docker-test-logs
