# Tests requiring privileged Docker containers (WireGuard, nftables, ip rules).
# These cannot run on BuildBuddy RBE or in sandboxed environments.
# GitHub Actions ubuntu-latest runners have Linux 6.x with WireGuard built-in.
name: Privileged Docker Tests

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download targets artifact
        uses: actions/download-artifact@v4
        with:
          name: targets
        continue-on-error: true

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Load kernel modules for WireGuard and nftables
        run: |
          sudo modprobe wireguard
          # Diagnostics: show kernel version, available nf_tables modules, and
          # which are already loaded. This info is needed to debug nftables
          # failures inside privileged Docker containers.
          uname -r
          find /lib/modules/$(uname -r)/kernel/net/netfilter -name 'nf_tables*' -o -name 'nft_*' 2>/dev/null | sort || true
          lsmod | grep -i nf_tab || true
          # nftables modules needed by KubeSpan: inet family tables, filter and
          # route chain types. Matches Talos kernel config (CONFIG_NF_TABLES_INET,
          # CONFIG_NF_TABLES_IPV4, CONFIG_NF_TABLES_IPV6 etc.).
          for mod in nf_tables nf_tables_inet nft_chain_filter nft_chain_route; do
            sudo modprobe "$mod" 2>/dev/null && echo "loaded $mod" || echo "SKIP $mod (not available)"
          done
          lsmod | grep -i nf_tab || true
          # Verify: create and delete an inet table with a route-type chain,
          # which is the exact pattern kubespand uses.
          sudo nft add table inet test_probe
          sudo nft add chain inet test_probe test_route '{ type route hook output priority 0; policy accept; }'
          sudo nft delete table inet test_probe
          echo "nftables inet route chain: OK"

      - name: Run privileged Docker tests
        run: |
          # Use per-workflow target file if available, otherwise test all
          if [[ -f targets-privileged-docker-tests.txt ]] && [[ -s targets-privileged-docker-tests.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets-privileged-docker-tests.txt"
            echo "Using per-workflow targets from targets-privileged-docker-tests.txt"
          elif [[ -f targets-privileged-docker-tests.txt ]] || { [[ -f targets.txt ]] && [[ ! -s targets.txt ]]; }; then
            echo "No privileged Docker test targets affected, skipping"
            exit 0
          elif [[ -f targets.txt ]] && [[ -s targets.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets.txt"
            echo "Using shared targets from targets.txt (no per-workflow file)"
          else
            TARGETS="${{ inputs.targets }}"
            if [[ -z "$TARGETS" ]]; then
              echo "No targets specified, skipping tests"
              exit 0
            fi
            TARGET_ARG="$TARGETS"
            echo "Using targets from input: $TARGET_ARG"
          fi

          bazel test --keep_going \
            --build_metadata=ROLE=ci --build_metadata=TAGS=privileged-docker \
            --test_tag_filters=requires_privileged_docker \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            --strategy=TestRunner=local \
            --test_timeout=300 \
            $TARGET_ARG

      - uses: ./.github/actions/collect-test-logs
        if: always()
        with:
          artifact-name: privileged-docker-test-logs
