# Tests requiring privileged Docker containers (WireGuard, nftables, ip rules).
# These cannot run on BuildBuddy RBE or in sandboxed environments.
# GitHub Actions ubuntu-latest runners have Linux 6.x with WireGuard built-in.
name: Privileged Docker Tests

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to test"
        required: false
        type: string
        default: "//..."

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download targets artifact
        uses: actions/download-artifact@v4
        with:
          name: targets
        continue-on-error: true

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Load kernel modules for WireGuard and nftables
        run: |
          sudo modprobe wireguard
          for mod in nf_tables nf_tables_inet nft_chain_filter nft_chain_route; do
            sudo modprobe "$mod" 2>/dev/null && echo "loaded $mod" || echo "SKIP $mod (not available)"
          done

      - name: Verify kernel modules
        run: |
          uname -r
          lsmod | grep -iE "wireguard|nf_tables|nft_" | sort || echo "none"

      - name: Enable nftables kernel debug tracing
        run: |
          # Raise kernel log level to capture all messages
          echo 8 | sudo tee /proc/sys/kernel/printk
          # Enable dynamic debug for nf_tables module
          echo "module nf_tables +p" | sudo tee /sys/kernel/debug/dynamic_debug/control 2>/dev/null || echo "dynamic_debug not available"
          echo "module nft_* +p" | sudo tee /sys/kernel/debug/dynamic_debug/control 2>/dev/null || echo "nft_* debug not available"
          # Allow nf_log in all network namespaces (for containers)
          echo 1 | sudo tee /proc/sys/net/netfilter/nf_log_all_netns 2>/dev/null || echo "nf_log_all_netns not available"

          # Enable ftrace function tracing for nftables commit path
          TRACEFS=/sys/kernel/debug/tracing
          if [[ -d "$TRACEFS" ]]; then
            echo "Enabling ftrace for nf_tables_commit and nfnetlink_rcv_batch..."
            # Use function_graph tracer to see call chains
            echo nop | sudo tee $TRACEFS/current_tracer
            # Set up kprobes for nf_tables_commit return value
            sudo sh -c "echo 'r:nft_commit_ret nf_tables_commit \$retval' >> $TRACEFS/kprobe_events" 2>/dev/null || echo "kprobe for nf_tables_commit failed"
            sudo sh -c "echo 'r:nfnl_batch_ret nfnetlink_rcv_batch \$retval' >> $TRACEFS/kprobe_events" 2>/dev/null || echo "kprobe for nfnetlink_rcv_batch failed"
            # Enable the kprobes
            echo 1 | sudo tee $TRACEFS/events/kprobes/enable 2>/dev/null || echo "kprobe enable failed"
            echo 1 | sudo tee $TRACEFS/tracing_on 2>/dev/null || echo "tracing_on failed"
            echo "ftrace kprobes enabled"
            cat $TRACEFS/kprobe_events 2>/dev/null || true
          else
            echo "tracefs not available at $TRACEFS"
          fi

          # Show current nftables state on host
          sudo nft list ruleset 2>/dev/null | head -50 || echo "nft not available on host"
          # Clear dmesg to get clean baseline
          sudo dmesg --clear

      - name: Probe nftables in privileged Docker container
        run: |
          # Test nftables operations inside a privileged Docker container
          # on the same kind of network the test uses (internal bridge).
          docker network create --internal nft-probe-net 2>/dev/null || true
          docker run --rm --privileged --network=nft-probe-net ubuntu:24.04 bash -c '
            apt-get update -qq && apt-get install -qq -y nftables iptables >/dev/null 2>&1
            echo "=== initial nft ruleset ==="
            nft list ruleset
            echo ""
            echo "=== iptables-nft nat ==="
            iptables-nft -L -t nat -n -v 2>/dev/null || echo "(iptables-nft not available)"
            echo ""
            echo "=== canary: table + chain + rule (no sets) ==="
            nft add table inet canary
            nft add chain inet canary test_chain "{ type filter hook input priority 0 ; policy accept ; }"
            nft add rule inet canary test_chain accept
            echo "canary OK"
            nft delete table inet canary
            echo ""
            echo "=== canary: table + chain + anonymous set ==="
            nft add table inet settest
            nft add chain inet settest test_out "{ type route hook output priority -300 ; policy accept ; }"
            nft add set inet settest v4addrs "{ type ipv4_addr ; flags interval,constant ; elements = { 10.0.0.0/24 } ; }"
            nft add rule inet settest test_out ip daddr @v4addrs accept
            echo "set canary OK"
            nft list ruleset
            nft delete table inet settest
            echo ""
            echo "=== dmesg (nftables related) ==="
            dmesg 2>/dev/null | grep -iE "nf_tables|nft|netfilter" | tail -30 || echo "(no relevant dmesg)"
          ' || echo "probe container failed"
          docker network rm nft-probe-net 2>/dev/null || true

      - name: Run privileged Docker tests
        run: |
          # Use per-workflow target file if available, otherwise test all
          if [[ -f targets-privileged-docker-tests.txt ]] && [[ -s targets-privileged-docker-tests.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets-privileged-docker-tests.txt"
            echo "Using per-workflow targets from targets-privileged-docker-tests.txt"
          elif [[ -f targets-privileged-docker-tests.txt ]] || { [[ -f targets.txt ]] && [[ ! -s targets.txt ]]; }; then
            echo "No privileged Docker test targets affected, skipping"
            exit 0
          elif [[ -f targets.txt ]] && [[ -s targets.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets.txt"
            echo "Using shared targets from targets.txt (no per-workflow file)"
          else
            TARGETS="${{ inputs.targets }}"
            if [[ -z "$TARGETS" ]]; then
              echo "No targets specified, skipping tests"
              exit 0
            fi
            TARGET_ARG="$TARGETS"
            echo "Using targets from input: $TARGET_ARG"
          fi

          bazel test --keep_going \
            --build_metadata=ROLE=ci --build_metadata=TAGS=privileged-docker \
            --test_tag_filters=requires_privileged_docker \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            --strategy=TestRunner=local \
            --test_timeout=300 \
            $TARGET_ARG

      - name: Dump kernel debug info (nftables)
        if: always()
        run: |
          echo "=== ftrace kprobe events (nf_tables_commit / nfnetlink_rcv_batch return values) ==="
          TRACEFS=/sys/kernel/debug/tracing
          if [[ -d "$TRACEFS" ]]; then
            # Stop tracing and dump results
            echo 0 | sudo tee $TRACEFS/tracing_on 2>/dev/null || true
            sudo cat $TRACEFS/trace 2>/dev/null | grep -E "nft_commit_ret|nfnl_batch_ret" | tail -500 || echo "(no kprobe events captured)"
            echo ""
            echo "=== full ftrace trace (last 200 lines) ==="
            sudo cat $TRACEFS/trace 2>/dev/null | tail -200 || echo "(no trace data)"
          else
            echo "(tracefs not available)"
          fi
          echo ""
          echo "=== dmesg (nf_tables related) ==="
          sudo dmesg | grep -iE "nf_tables|nft|netfilter|EBUSY|commit_mutex" | tail -200 || true
          echo ""
          echo "=== full dmesg (last 500 lines) ==="
          sudo dmesg | tail -500

      - uses: ./.github/actions/collect-test-logs
        if: always()
        with:
          artifact-name: privileged-docker-test-logs
