# Build and push all props agent images to the props registry.
#
# The props backend image is now pushed via bazel-harbor-images.yml.
#
# Triggers:
#   - workflow_call (from ci.yml, always on push)
#   - workflow_dispatch: manual push of all images
name: Props Images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      PROPS_REGISTRY_USERNAME:
        required: true
      PROPS_REGISTRY_PASSWORD:
        required: true

concurrency:
  group: props-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Props Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.PROPS_REGISTRY_URL }}
          username: ${{ secrets.PROPS_REGISTRY_USERNAME }}
          password: ${{ secrets.PROPS_REGISTRY_PASSWORD }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Build and load agent images
        run: |
          bazel run //props/agents/critic:load
          bazel run //props/agents/grader:load
          bazel run //props/agents/critic_dev/improve:load
          bazel run //props/agents/critic_dev/optimize:load
          bazel run //props/agents/critic/variants:contract_truthfulness_load
          bazel run //props/agents/critic/variants:dead_code_load
          bazel run //props/agents/critic/variants:flag_propagation_load
          bazel run //props/agents/critic/variants:high_recall_load
          bazel run //props/agents/critic/variants:verbose_docs_load

      - name: Push agent images
        env:
          REGISTRY: ${{ vars.PROPS_REGISTRY_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          # Push SHA-pinned tag, then update floating tag only if digest changed.
          push_image() {
            local local_tag="$1" remote_repo="$2" floating_tag="$3" sha_tag="$4"
            docker tag "$local_tag" "$REGISTRY/$remote_repo:$sha_tag"
            docker push --quiet "$REGISTRY/$remote_repo:$sha_tag"
            SHA_DIGEST=$(crane digest "$REGISTRY/$remote_repo:$sha_tag")
            FLOATING_DIGEST=$(crane digest "$REGISTRY/$remote_repo:$floating_tag" 2>/dev/null || echo "")
            if [[ "$SHA_DIGEST" == "$FLOATING_DIGEST" ]]; then
              echo "$remote_repo:$floating_tag unchanged (same digest), skipping"
            else
              echo "$remote_repo: updating :$floating_tag"
              crane tag "$REGISTRY/$remote_repo:$sha_tag" "$floating_tag"
            fi
          }

          push_image critic:latest critic latest "$SHA"
          push_image grader:latest grader latest "$SHA"
          push_image critic_dev_improve:latest critic_dev_improve latest "$SHA"
          push_image critic_dev_optimize:latest critic_dev_optimize latest "$SHA"

          for variant in contract_truthfulness dead_code flag_propagation high_recall verbose_docs; do
            push_image "critic:$variant" critic "$variant" "${variant}-${SHA}"
          done
