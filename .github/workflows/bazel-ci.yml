# Bazel test + build via bbr (runs on BuildBuddy RBE).
# Replaces the BuildBuddy Workflows "CI" action.
name: Bazel CI

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: bazel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Test
        run: |
          bbr test --keep_going \
            --test_tag_filters=-live_openai_api \
            //...

      - name: Build + lint
        run: |
          bbr build --keep_going \
            //...
