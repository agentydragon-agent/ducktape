# Build and push container images to GHCR in parallel, then pin digests atomically.
#
# Images:
#   rbe-worker    — BuildBuddy RBE worker (devinfra/rbe_image/Dockerfile)
#   freecad-test  — FreeCAD test runner (skills/freecad/Dockerfile.test)
#
# On push: builds only images whose paths changed (dorny/paths-filter).
# On workflow_dispatch: builds all images.
# On workflow_call (from ci.yml): builds rbe-worker only (needed by downstream jobs), skips pinning.
name: Container Images

on:
  push:
    branches: [main, devel]
    paths:
      - "devinfra/rbe_image/**"
      - "skills/freecad/Dockerfile.test"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      rbe_image:
        description: "Full RBE image reference (e.g. ghcr.io/.../rbe-worker:<sha>), empty if skipped"
        value: ${{ jobs.rbe-image.outputs.rbe_image }}

concurrency:
  # Hardcoded name to avoid deadlock when called via workflow_call from CI
  # (${{ github.workflow }} resolves to the caller's name, colliding with CI's group).
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RBE_IMAGE: ghcr.io/${{ github.repository_owner }}/rbe-worker
  FREECAD_IMAGE: ghcr.io/${{ github.repository_owner }}/freecad-test

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rbe: ${{ steps.filter.outputs.rbe }}
      freecad: ${{ steps.filter.outputs.freecad }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rbe:
              - 'devinfra/rbe_image/**'
              - '.github/workflows/container-images.yml'
            freecad:
              - 'skills/freecad/Dockerfile.test'
              - '.github/workflows/container-images.yml'

  rbe-image:
    name: RBE Worker
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.rbe == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rbe_image: ${{ env.RBE_IMAGE }}:${{ github.sha }}
      pin_tag: ${{ steps.build.outputs.pin_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/ghcr-build-push
        id: build
        with:
          image: ${{ env.RBE_IMAGE }}
          context: .
          file: devinfra/rbe_image/Dockerfile
          cache_from: type=registry,ref=${{ env.RBE_IMAGE }}:buildcache
          cache_to: type=registry,ref=${{ env.RBE_IMAGE }}:buildcache,mode=max

  freecad-image:
    name: FreeCAD Test
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.freecad == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pin_tag: ${{ steps.build.outputs.pin_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/ghcr-build-push
        id: build
        with:
          image: ${{ env.FREECAD_IMAGE }}
          context: skills/freecad
          file: skills/freecad/Dockerfile.test
          cache_from: type=registry,ref=${{ env.FREECAD_IMAGE }}:buildcache
          cache_to: type=registry,ref=${{ env.FREECAD_IMAGE }}:buildcache,mode=max

  pin-digests:
    name: Pin Digests
    needs: [rbe-image, freecad-image]
    if: >-
      always() && !cancelled()
      && github.event_name != 'workflow_call'
      && (needs.rbe-image.result == 'success' || needs.freecad-image.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: prettier

      # Login needed for docker manifest inspect
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pin rbe_worker
        if: needs.rbe-image.result == 'success'
        run: |
          DIGEST=$(docker manifest inspect "$RBE_IMAGE:${{ needs.rbe-image.outputs.pin_tag }}" --verbose | \
            python3 -c "import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d['Descriptor']['digest'])")
          python3 devinfra/update_image_pin.py rbe_worker --digest "$DIGEST"

      - name: Pin freecad_test
        if: needs.freecad-image.result == 'success'
        run: |
          DIGEST=$(docker manifest inspect "$FREECAD_IMAGE:${{ needs.freecad-image.outputs.pin_tag }}" --verbose | \
            python3 -c "import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d['Descriptor']['digest'])")
          python3 devinfra/update_image_pin.py freecad_test --digest "$DIGEST"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add devinfra/image_pins.json devinfra/bbr.json

          if git diff --cached --quiet; then
            echo "Image pins already up to date"
            exit 0
          fi

          # Build commit message listing which images were pinned
          MSG="chore: pin"
          if [[ "${{ needs.rbe-image.result }}" == "success" ]]; then
            MSG="$MSG rbe_worker"
          fi
          if [[ "${{ needs.freecad-image.result }}" == "success" ]]; then
            MSG="$MSG freecad_test"
          fi
          MSG="$MSG image digest(s) [skip ci]"

          git commit -m "$MSG"

          BRANCH="${GITHUB_REF_NAME}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed"
            git status
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
