# Rebuild ducktape's own pinned artifacts (Python wheels + GNOME Shell
# extension archives) from PR source and run each nix package's check
# against them. DUCKTAPE_ARTIFACT_OVERRIDES (see flake.nix) swaps the released
# pin for the freshly-Bazel-built artifact so nix's `mkWheel` imports check
# runs against PR source — catches "wheel forgot a package" bugs like the
# missing Gmail modules in #2669 at PR time, before release.yml
# publishes a broken artifact and sync-pins.yml rotates the pin onto it.
#
# nix-attic-push.yml still does the full-fleet build against pinned artifacts on
# push to devel/main; this workflow is the fast per-PR gate.
#
# Source of truth for pin → Bazel target + asset filename: devinfra/ci/artifact_targets.json.
# Keep it in sync with the artifact entries in release.yml's matrix (SYNC
# comment there points here).
name: Nix wheel check

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy remote execution and cache credential"
        required: true
      SOPS_AGE_KEY:
        description: "SOPS age key, for decrypting the Attic reader token (nix substituter cache)"
        required: true
    inputs:
      environment:
        description: "Protected GitHub Environment to gate this job (optional)"
        required: false
        type: string
        default: ""
      source_commit:
        description: "Exact commit to check out and build (defaults to github.sha)"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Expected PR head parent when source_commit is a synthetic merge"
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: "Opt in to checkout's pull_request_target fork checkout after the caller establishes trust"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep PR identity stable across revisions. Separate fork event types so the
  # skipped pull_request job cannot cancel its trusted pull_request_target run.
  group: nix-wheel-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Mainline runs publish source-check markers to Attic: let the active run
  # finish, retaining only the newest pending revision during merge bursts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_head_sha != '' }}
  queue: single

permissions:
  contents: read
  pull-requests: read

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  nix-wheel-check:
    name: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'Fork Nix check runs in trusted-fork-pr-ci' ||
          'Build artifacts + imports check' }}
    # Fork revisions are checked by trusted-fork-pr-ci.yml after its caller
    # either recognizes the dedicated agent fork or gates the exact head.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    # A warm run takes ~2 min. After a flake update nothing in the overridden
    # Python set (nix/packages/default.nix) is cached, and the first run
    # rebuilds it from source in ~40 min.
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        name: "Check out source (a failure here means the source was unavailable; no tests or build ran)"
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          # verify-source reads both parents of the synthetic PR merge commit.
          fetch-depth: 2
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      - name: Resolve and verify source revision
        id: source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha || github.event.pull_request.head.sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python3 devinfra/ci/pr_mergeability.py verify-source

      # setup-nix-attic (not setup-nix-devtools) so the checks below can substitute
      # from cache.allegedly.works/main instead of building from source. Packages
      # pinned to nixpkgs-master (e.g. codex, see nix/home/codex/default.nix) have
      # no cache.nixos.org binary — only Hydra-built release channels get one — so
      # without the Attic substituter this job source-builds codex's whole Rust
      # toolchain on every run and blows the timeout (#5749).
      - uses: ./.github/actions/setup-nix-attic
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      # Keep the generated-policy checks parallel with artifact checks. The
      # latter use the verified checkout's local action and helper layout.
      - parallel:
          - name: Check generated command policies
            run: |
              nix build --no-link --print-out-paths \
                .#checks.x86_64-linux.claude-code-permissions \
                .#checks.x86_64-linux.codex-execpolicy-evaluation \
                .#checks.x86_64-linux.gemini-cli-integration

          - name: Check source artifacts
            uses: ./.github/actions/nix-wheel-check
            with:
              source_commit: ${{ steps.source.outputs.sha }}
