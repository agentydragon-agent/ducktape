# Build NixOS VM bootstrap images and publish them to the SeaweedFS S3
# artifact bucket used by CDI imports.
name: VM Images

on:
  push:
    branches: [main, devel]
    paths:
      - ".github/workflows/vm-images.yml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:
    inputs:
      image_output:
        description: "Flake package output to build"
        required: false
        default: "bootstrap-image"
      object_prefix:
        description: "S3 key prefix under vm-images"
        required: false
        default: "bootstrap"

concurrency:
  group: vm-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish bootstrap image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.VM_IMAGES_S3_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VM_IMAGES_S3_SECRET_ACCESS_KEY }}
      IMAGE_OUTPUT: ${{ inputs.image_output || 'bootstrap-image' }}
      OBJECT_PREFIX: ${{ inputs.object_prefix || 'bootstrap' }}
      S3_BUCKET: vm-images
      S3_ENDPOINT: https://vm-images-s3.allegedly.works

    steps:
      - name: Check publish credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VM image S3 credentials are not synced yet; skipping publish."
            exit 0
          fi

          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Check out code
        if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v6

      - name: Install Nix
        if: steps.credentials.outputs.present == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-trusted-public-keys = main:cy5xhwCNq/T7R55I9TaLv0z6SM6EipXvdFhqrbxC7nc= gaffer:Z8sM2kptUUDGk4ARVD/YkcpzWdMgmZX7nVLV5joK7r8=

      - name: Install AWS CLI
        if: steps.credentials.outputs.present == 'true'
        shell: bash
        run: nix profile install nixpkgs#awscli2

      - name: Configure S3 transfer settings
        if: steps.credentials.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.aws
          cat > ~/.aws/config <<'EOF'
          [default]
          region = us-east-1
          cli_connect_timeout = 60
          cli_read_timeout = 3600
          s3 =
              addressing_style = path
              max_concurrent_requests = 2
              multipart_chunksize = 64MB
          EOF

      - name: Build image
        if: steps.credentials.outputs.present == 'true'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          out_path="$(nix build ".#${IMAGE_OUTPUT}" --no-link --print-out-paths | tail -n1)"
          mapfile -t images < <(find "$out_path" -type f -name '*.qcow2' | sort)

          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one qcow2 under ${out_path}, found ${#images[@]}"
            printf '%s\n' "${images[@]}"
            exit 1
          fi

          image="${images[0]}"
          sha256="$(sha256sum "$image" | awk '{print $1}')"
          size_bytes="$(stat -c '%s' "$image")"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${size_bytes}" >> "$GITHUB_OUTPUT"

      - name: Upload image
        if: steps.credentials.outputs.present == 'true'
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          key="${OBJECT_PREFIX}/${GITHUB_SHA}.qcow2"
          sha_key="${key}.sha256"
          latest_key="${OBJECT_PREFIX}/${GITHUB_REF_NAME}.latest.txt"

          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            "${{ steps.build.outputs.image }}" \
            "s3://${S3_BUCKET}/${key}" \
            --content-type application/octet-stream \
            --metadata "sha256=${{ steps.build.outputs.sha256 }},git_sha=${GITHUB_SHA},flake_output=${IMAGE_OUTPUT}"

          printf '%s  %s\n' "${{ steps.build.outputs.sha256 }}" "$key" | \
            aws --endpoint-url "$S3_ENDPOINT" s3 cp - "s3://${S3_BUCKET}/${sha_key}" \
              --content-type text/plain

          printf '%s\n' "$key" | \
            aws --endpoint-url "$S3_ENDPOINT" s3 cp - "s3://${S3_BUCKET}/${latest_key}" \
              --content-type text/plain

          aws --endpoint-url "$S3_ENDPOINT" s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$key" \
            --query '{ContentLength:ContentLength,Metadata:Metadata}'

          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.credentials.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### VM image"
            echo "- Output: \`.#${IMAGE_OUTPUT}\`"
            echo "- Object: \`s3://${S3_BUCKET}/${{ steps.upload.outputs.key }}\`"
            echo "- SHA256: \`${{ steps.build.outputs.sha256 }}\`"
            echo "- Size: \`${{ steps.build.outputs.size_bytes }}\` bytes"
          } >> "$GITHUB_STEP_SUMMARY"
