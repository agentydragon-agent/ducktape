# Nix flake evaluation and cache push reusable workflow
#
# Build NixOS and home-manager configurations, push closures to Attic cache.
name: Nix flake evaluation

on:
  workflow_call:

jobs:
  nix-flake-check:
    name: Nix flake build & cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Attic client
        run: nix profile install nixpkgs#attic-client

      - name: Configure Attic cache
        run: attic login ducktape https://cache.allegedly.works "${{ secrets.ATTIC_TOKEN }}"

      - name: Build and push all configurations
        run: |
          drvs=()
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            drvs+=(".#nixosConfigurations.$host.config.system.build.toplevel")
          done
          for host in $(nix eval --impure --json .#homeConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            drvs+=(".#homeConfigurations.$host.activationPackage")
          done
          echo "Building ${#drvs[@]} configurations in parallel..."
          nix build --impure "${drvs[@]}" --no-link --print-out-paths | xargs attic push main

      - name: Generate summary
        if: always()
        run: |
          echo "### Nix Flake Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All configurations built and pushed to cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some configurations failed" >> $GITHUB_STEP_SUMMARY
          fi
