# Nix flake evaluation and cache push reusable workflow
#
# Build NixOS and home-manager configurations, push closures to Attic cache.
name: Nix flake evaluation

on:
  workflow_call:

jobs:
  nix-flake-check:
    name: Nix flake build & cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Attic cache
        run: |
          nix run nixpkgs#attic-client -- login ducktape \
            https://cache.allegedly.works "${{ secrets.ATTIC_TOKEN }}"

      - name: Build and push NixOS configurations
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::Building nixosConfigurations.$host"
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --no-link --print-out-paths | \
              xargs nix run nixpkgs#attic-client -- push main
            echo "::endgroup::"
          done

      - name: Build and push home-manager configurations
        run: |
          for host in $(nix eval --impure --json .#homeConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::Building homeConfigurations.$host"
            nix build --impure ".#homeConfigurations.$host.activationPackage" --no-link --print-out-paths | \
              xargs nix run nixpkgs#attic-client -- push main
            echo "::endgroup::"
          done

      - name: Generate summary
        if: always()
        run: |
          echo "### Nix Flake Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All configurations built and pushed to cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some configurations failed" >> $GITHUB_STEP_SUMMARY
          fi
