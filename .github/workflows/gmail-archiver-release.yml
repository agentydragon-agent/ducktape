# Build and release gmail-archiver wheel
#
# Builds the wheel on push to devel/main, uploads to GitHub Releases
# with a fixed filename so Nix flake can fetch latest.
name: gmail-archiver Release

on:
  push:
    branches: [devel, main]
    paths:
      - "gmail_archiver/**"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Needed for creating releases

jobs:
  build-and-release:
    name: Build wheel and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-wheel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt') }}
          restore-keys: |
            bazel-wheel-${{ runner.os }}-

      - name: Build wheel
        run: bazel build //gmail_archiver:gmail_archiver_wheel

      - name: Prepare wheel with fixed filename
        run: |
          mkdir -p dist
          # Copy wheel with fixed name for stable URL
          cp bazel-bin/gmail_archiver/gmail_archiver-*.whl dist/gmail_archiver-latest-py3-none-any.whl

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gmail-archiver-latest
          name: gmail-archiver (latest)
          body: |
            Latest build of gmail-archiver wheel.

            Built from: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Install via:
            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/gmail-archiver-latest/gmail_archiver-latest-py3-none-any.whl
            ```
          files: dist/gmail_archiver-latest-py3-none-any.whl
          prerelease: true
          make_latest: false
