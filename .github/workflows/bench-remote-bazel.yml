name: Remote Bazel Benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    name: Benchmark (bb remote)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install bb CLI
        run: |
          curl -fsSL https://www.buildbuddy.io/cli/latest/bb-linux-amd64 -o /usr/local/bin/bb
          chmod +x /usr/local/bin/bb
          bb version

      - name: bb remote build -k //...
        id: build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          START=$SECONDS
          bb remote build -k //... 2>&1 | tee /tmp/build.log
          echo "elapsed=$((SECONDS - START))" >> "$GITHUB_OUTPUT"

      - name: bb remote test -k //...
        id: test
        if: always()
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          START=$SECONDS
          bb remote test -k //... --test_tag_filters=-live_openai_api 2>&1 | tee /tmp/test.log
          echo "elapsed=$((SECONDS - START))" >> "$GITHUB_OUTPUT"

      - name: Write results
        if: always()
        run: |
          BUILD_S=${{ steps.build.outputs.elapsed }}
          TEST_S=${{ steps.test.outputs.elapsed }}
          cat > results.md << EOF
          # Remote Bazel Benchmark Results

          | Command | Time |
          |---------|------|
          | \`bb remote build -k //...\` | ${BUILD_S}s ($(( BUILD_S / 60 ))m $(( BUILD_S % 60 ))s) |
          | \`bb remote test -k //...\`  | ${TEST_S}s ($(( TEST_S / 60 ))m $(( TEST_S % 60 ))s) |

          Run: ${{ github.run_id }}
          EOF
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            results.md
            /tmp/build.log
            /tmp/test.log
