# Build and push the ActivityWatch server (aw-server-rust) image to Harbor.
#
# Triggers:
#   - push to devel changing docker/activitywatch/** (tags :latest too)
#   - workflow_dispatch: manual trigger (tags :latest too)
#   - workflow_call (from ci.yml): tags :<sha> + :<timestamp>-<sha7>
name: ActivityWatch Image

on:
  push:
    branches: [devel]
    paths: ["docker/activitywatch/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: activitywatch-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/harbor-build-push
        with:
          image: registry.allegedly.works/activitywatch/aw-server
          context: docker/activitywatch
          harbor_robot_username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          harbor_robot_token: ${{ secrets.HARBOR_ROBOT_TOKEN }}
