# Build and push the ActivityWatch server (aw-server-rust) image to Harbor.
#
# Triggers:
#   - workflow_call (from ci.yml, always on push): updates :latest only if digest changed
#   - workflow_dispatch: manual trigger
name: ActivityWatch Image

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: activitywatch-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/harbor-build-push
        with:
          image: registry.allegedly.works/ducktape/aw-server
          context: docker/activitywatch
          harbor_robot_username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          harbor_robot_token: ${{ secrets.HARBOR_ROBOT_TOKEN }}
