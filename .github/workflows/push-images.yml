# Push OCI images to GHCR via bb remote (parallel matrix).
#
# Each image is pushed independently — a broken build doesn't block others.
# Images with unchanged digests are skipped (ghcr_push_lib deduplicates).
name: Push Images

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  push:
    name: Push ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - //airlock:push_ghcr
          - //airlock/auth_proxy:push_ghcr
          - //cluster/k8s/agents/claude-token-rotation:push_ghcr
          - //cluster/k8s/inventree/token-provisioner:push_ghcr
          - //devinfra/firecracker/manager:push_ghcr
          - //devinfra/firecracker/vm_pod:push_ghcr
          - //homeassistant/proxy:push_ghcr
          - //inventree_utils/rai_plugin:push_ghcr
          - //mcp_infra/exec:push_ghcr
          - //openclaw/exec:push_ghcr
          - //props/backend:push_ghcr
          - //tana/token_broker:push_ghcr
          - //third_party/activitywatch:push_ghcr
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Push image
        uses: ./.github/actions/bb-remote
        with:
          args: run --remote_download_toplevel ${{ matrix.target }}
          env_overrides: |
            GHCR_TOKEN=${{ env.GHCR_TOKEN }}
            GHCR_USERNAME=${{ env.GHCR_USERNAME }}
