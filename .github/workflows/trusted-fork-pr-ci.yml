# BuildBuddy CI for fork pull requests. Revisions authored from the dedicated
# agent fork run automatically because that agent already owns the BuildBuddy
# credential; every other fork is gated by the protected trusted-pr-ci GitHub
# Environment. pull_request_target intentionally loads this workflow and the
# called reusable workflows from the base branch before executing PR code.
name: Trusted fork PR CI
run-name: >-
  Trusted PR #${{ github.event.pull_request.number }} @
  ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    branches: [devel]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: trusted-fork-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-ci:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      !github.event.pull_request.draft
    uses: ./.github/workflows/bazel-ci.yml
    with:
      # The exact agent fork/author already owns the only injected capability.
      # All other forks wait for a trusted-pr-ci environment review.
      environment: >-
        ${{
          !(github.event.pull_request.head.repo.full_name == 'agentydragon-agent/ducktape' &&
            github.event.pull_request.user.login == 'agentydragon-agent') &&
          'trusted-pr-ci' || ''
        }}
      # GitHub can emit pull_request_target with a current head SHA but a stale
      # merge_commit_sha. Resolve the live merge ref after the trust decision;
      # the called workflow verifies its second parent against pr_head_sha.
      source_ref: refs/pull/${{ github.event.pull_request.number }}/merge
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      # actions/checkout v6 refuses fork code under pull_request_target unless
      # explicitly opted in. The called job either recognizes the exact agent
      # fork or blocks on trusted-pr-ci before runner assignment.
      allow_unsafe_pr_checkout: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  nix-wheel-check:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      !github.event.pull_request.draft
    uses: ./.github/workflows/nix-wheel-check.yml
    with:
      environment: >-
        ${{
          !(github.event.pull_request.head.repo.full_name == 'agentydragon-agent/ducktape' &&
            github.event.pull_request.user.login == 'agentydragon-agent') &&
          'trusted-pr-ci' || ''
        }}
      source_ref: refs/pull/${{ github.event.pull_request.number }}/merge
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      allow_unsafe_pr_checkout: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
