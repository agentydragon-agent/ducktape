name: Sync artifact pins
# Periodically sync npins/sources.json with the latest GitHub Releases.
# Replaces per-commit dispatch from bb_release.sh — one commit per cycle
# regardless of how many releases landed since the last sync.
"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-pins
  cancel-in-progress: true
permissions:
  contents: write
  statuses: write
jobs:
  sync:
    name: Sync pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: devel
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Sync pins with latest releases
        run: devinfra/ci/sync_pins.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json
          if git diff --cached --quiet; then
            echo "No pin changes"
            exit 0
          fi
          git commit -m "chore: sync artifact pins"
          git pull --rebase origin devel
          git push origin "HEAD:devel"
