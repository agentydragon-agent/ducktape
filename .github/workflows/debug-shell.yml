name: Bazel Benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: bazel build -k //...
        id: build
        run: |
          START=$SECONDS
          bazel build -k //... 2>&1 | tee /tmp/build.log
          echo "elapsed=$((SECONDS - START))" >> "$GITHUB_OUTPUT"

      - name: bazel test -k //...
        id: test
        if: always()
        run: |
          START=$SECONDS
          bazel test -k //... --test_tag_filters=-live_openai_api 2>&1 | tee /tmp/test.log
          echo "elapsed=$((SECONDS - START))" >> "$GITHUB_OUTPUT"

      - name: Write results
        if: always()
        run: |
          BUILD_S=${{ steps.build.outputs.elapsed }}
          TEST_S=${{ steps.test.outputs.elapsed }}
          cat > results.md << EOF
          # Bazel Benchmark Results

          | Command | Time |
          |---------|------|
          | \`bazel build -k //...\` | ${BUILD_S}s ($(( BUILD_S / 60 ))m $(( BUILD_S % 60 ))s) |
          | \`bazel test -k //...\`  | ${TEST_S}s ($(( TEST_S / 60 ))m $(( TEST_S % 60 ))s) |

          Run: ${{ github.run_id }}
          EOF
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            results.md
            /tmp/build.log
            /tmp/test.log
