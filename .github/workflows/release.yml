# Release artifacts to GitHub via per-artifact bazel targets.
# Each target builds its artifact (as a dep), computes SHA, and creates
# a GitHub Release if the content changed.
name: Release

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - //:release_claude_hooks
          - //util:release_ducktape_util
          - //:release_ducktape
          - //gterm_theme:release_gterm_theme
          - //skills:release_skills
          - //devinfra/buildbuddy_cli:release_bbapi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Install devtools
        run: nix profile install .#devtools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Release
        run: bbr run ${{ matrix.target }}
