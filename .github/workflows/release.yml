# Release artifacts to GitHub via per-artifact build + gh release.
# Each matrix entry builds its artifact on RBE, computes SHA, and creates
# a GitHub Release if the content changed.
name: Release

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  release:
    name: Release ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: claude-hooks
            target: //:claude_hooks_wheel
            filename: claude_hooks-0.1.0-py3-none-any.whl
          - pkg: ducktape-util
            target: //util:wheel
            filename: ducktape_util-0.1.0-py3-none-any.whl
          - pkg: ducktape
            target: //:wheel
            filename: ducktape-0.1.0-py3-none-any.whl
          - pkg: gterm-theme
            target: //gterm_theme:wheel
            filename: gterm_theme-0.1.0-py3-none-any.whl
          - pkg: skills
            target: //skills:all_skills_tar
            filename: skills.tar
          - pkg: bbapi
            target: //devinfra/buildbuddy_cli:bbapi
            filename: bbapi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: ./.github/actions/release-artifact
        with:
          pkg: ${{ matrix.pkg }}
          bazel_target: ${{ matrix.target }}
          filename: ${{ matrix.filename }}
          rbe_image: ${{ inputs.rbe_image }}
