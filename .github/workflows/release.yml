name: Release
# Triggered by BB Workflows "Release" action after artifacts are uploaded to GitHub Releases.
# Only does nix-pin + attic push + git commit — no Bazel.
"on":
  workflow_dispatch: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pin-and-push:
    name: Update flake pins and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Update flake.lock pins
        run: |
          nix flake update \
            claude-hooks-wheel ducktape-wheel gterm-theme-wheel \
            bbapi-binary skills-tar

      - name: Build and push Nix packages to attic
        env:
          ATTIC_JWT_TOKEN: ${{ secrets.ATTIC_JWT_TOKEN }}
        run: |
          claude_hooks=$(nix build --no-link --print-out-paths \
            .#packages.x86_64-linux.claude-hooks)
          bbapi=$(nix build --no-link --print-out-paths \
            .#packages.x86_64-linux.bbapi)
          skills=$(nix build --no-link --print-out-paths \
            .#packages.x86_64-linux.skills)

          nix run nixpkgs#attic-client -- login main \
            https://cache.allegedly.works "$ATTIC_JWT_TOKEN"
          nix run nixpkgs#attic-client -- push main "$claude_hooks" "$bbapi" "$skills"

      - name: Commit and push updated pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump release artifacts [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
