# Build wheels and create GitHub releases via bb-remote.
# Replaces the BuildBuddy Workflows "Release" action.
name: Release

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Install devtools
        run: nix profile install .#devtools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Install system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y \
            libcairo2-dev libgirepository-2.0-dev libdbus-1-dev libxcb1-dev pkg-config

      - name: Build wheels and artifacts
        run: |
          devinfra/bb_remote.sh build --remote_download_toplevel \
            //:wheel \
            //:claude_hooks_wheel \
            //util:wheel \
            //gterm_theme:wheel \
            //skills:all_skills_tar \
            //devinfra/buildbuddy_cli:bbapi

      - name: Create GitHub releases
        run: bazel run //devinfra/ci:bb_release_bin
