# Build wheels and create GitHub releases via bb-remote.
# Replaces the BuildBuddy Workflows "Release" action.
name: Release

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Install devtools
        run: nix profile install .#devtools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build wheels and artifacts
        run: |
          # Use RBE worker image as runner (has system deps for pycairo etc.)
          # Can't use bb_remote.sh here because --container_image is a bb flag
          # that must come before the bazel command.
          # TODO: teach bb_remote.sh to accept --container_image so all
          # bb remote invocations go through the wrapper (secret forwarding, etc.)
          RBE_IMAGE=$(python3 -c "import json; d=json.load(open('devinfra/image_pins.json'))['rbe_worker']; print(d['image']+'@'+d['digest'])")
          bb remote \
            --runner_exec_properties=EstimatedFreeDiskBytes=50000000000 \
            --runner_exec_properties=workload-isolation-type=firecracker \
            --container_image="docker://${RBE_IMAGE}" \
            build --remote_download_toplevel --config=rbe \
            //:wheel \
            //:claude_hooks_wheel \
            //util:wheel \
            //gterm_theme:wheel \
            //skills:all_skills_tar \
            //devinfra/buildbuddy_cli:bbapi

      - name: Create GitHub releases
        run: bazel run //devinfra/ci:bb_release_bin
