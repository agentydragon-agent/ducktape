name: Release
# Triggered by BB Workflows "Release" action after artifacts are uploaded to GitHub Releases.
# Updates npins with new artifact hashes and commits. Attic push happens automatically
# via nix-attic-push workflow on the resulting commit.
#
# Dispatched with --ref devel (GitHub workflow_dispatch requires a branch/tag name,
# not a bare SHA). The exact triggering commit is passed as inputs.sha so we check
# out the right code regardless of how far devel has advanced since the BB run.
#
# Concurrency: serialized so concurrent releases don't race on git push to devel.
# Each run pins different packages (inputs.changed) from different SHAs, so we
# can't cancel earlier runs — every run must complete.
"on":
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to check out (exact triggering commit)
        required: true
      changed:
        description: Space-separated packages with new releases (e.g. "claude-hooks bbapi")
        required: true
concurrency:
  group: release-devel
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  pin-and-push:
    name: Update flake pins and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post pending status on triggering commit
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ inputs.sha }}" \
            -f state=pending \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Updating npins" \
            -f context="release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Update artifact pins
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          read -ra changed_pkgs <<< "${{ inputs.changed }}"
          devinfra/ci/update_pins.sh "$SHORT_SHA" "${changed_pkgs[@]}"

      - name: Commit and push updated pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump release artifacts (${{ inputs.changed }})"
          # Retry rebase+push up to 3 times in case a concurrent release
          # pushed between our commit and our push attempt.
          for attempt in 1 2 3; do
            if git pull --rebase origin devel && git push origin "HEAD:devel"; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in ${attempt}s..."
            sleep "$attempt"
            git rebase --abort 2>/dev/null || true
            # Re-apply our change on top of fresh devel
            git fetch origin devel
            git rebase origin/devel
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Post success status
        if: success()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ inputs.sha }}" \
            -f state=success \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Release complete" \
            -f context="release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post failure status
        if: failure()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ inputs.sha }}" \
            -f state=failure \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Release failed" \
            -f context="release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
