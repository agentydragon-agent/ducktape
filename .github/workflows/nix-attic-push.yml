# Build all Nix flake outputs and push closures to Attic binary cache.
#
# Runs on every push to devel. attic push deduplicates — unchanged outputs
# are a cheap no-op (evaluate flake + check store paths against server).
name: Nix Attic push

on:
  workflow_call:

jobs:
  nix-attic-push:
    name: Build & push to Attic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Attic client
        run: nix profile install nixpkgs#attic-client

      - name: Configure Attic cache
        run: attic login ducktape https://cache.allegedly.works "${{ secrets.ATTIC_TOKEN }}"

      - name: Create gaffer-private stub
        run: |
          # gaffer-private is a private repo. CI doesn't need access — we
          # stub it out with a no-op module so Nix doesn't try to fetch it.
          mkdir -p /tmp/gaffer-stub
          cat > /tmp/gaffer-stub/flake.nix << 'STUB'
          {
            outputs = { ... }: {
              homeManagerModules.google-drive = { lib, ... }: {
                options.services.google-drive.enable = lib.mkEnableOption "stub";
              };
            };
          }
          STUB
          git -C /tmp/gaffer-stub init -q
          git -C /tmp/gaffer-stub add .
          git -C /tmp/gaffer-stub -c user.email=ci@localhost -c user.name=CI commit -qm stub

      - name: Build and push all flake outputs
        run: |
          OVERRIDE="--override-input gaffer-private path:/tmp/gaffer-stub"
          out_paths=$(mktemp)

          # NixOS configurations
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames $OVERRIDE | jq -r '.[]'); do
            nix build --impure $OVERRIDE \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --no-link --print-out-paths >> "$out_paths"
          done

          # Home configurations (google-drive disabled via extendModules +
          # gaffer-private stubbed out so the private binary is never fetched)
          for host in $(nix eval --impure --json .#homeConfigurations --apply builtins.attrNames $OVERRIDE | jq -r '.[]'); do
            nix build --impure $OVERRIDE --expr "
              let flake = builtins.getFlake \"path:\$(pwd)\";
              in (flake.homeConfigurations.$host.extendModules {
                modules = [{ services.google-drive.enable = false; }];
              }).activationPackage
            " --no-link --print-out-paths >> "$out_paths"
          done

          # Other outputs
          nix build --impure $OVERRIDE \
            .#packages.x86_64-linux.web-session \
            .#devShells.x86_64-linux.default.inputDerivation \
            --no-link --print-out-paths >> "$out_paths"

          echo "Pushing $(wc -l < "$out_paths") paths to Attic..."
          xargs attic push main < "$out_paths"

      - name: Generate summary
        if: always()
        run: |
          echo "### Nix Attic Push" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "All flake outputs built and pushed to cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some outputs failed to build" >> $GITHUB_STEP_SUMMARY
          fi
