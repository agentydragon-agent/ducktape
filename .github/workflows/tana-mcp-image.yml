# Build and push the Tana MCP Desktop image to Harbor.
#
# Triggers:
#   - push to devel changing docker/tana-mcp/** (tags :latest too)
#   - workflow_dispatch: manual trigger (tags :latest too)
#   - workflow_call (from ci.yml): tags :<sha> + :<timestamp>-<sha7>
name: Tana MCP Image

on:
  push:
    branches: [devel]
    paths: ["docker/tana-mcp/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tana-mcp-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.allegedly.works/tana-mcp/tana-desktop

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          SEMVER_TAG="${TS}-${SHA:0:7}"
          TAGS="${{ env.IMAGE }}:$SHA,${{ env.IMAGE }}:$SEMVER_TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/tana-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
