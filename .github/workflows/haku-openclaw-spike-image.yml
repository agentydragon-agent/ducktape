name: Haku OpenClaw Spike Image

on:
  pull_request:
    paths:
      - "haku/openclaw_spike/**"
      - "openclaw/proxy-setup.mjs"
      - ".github/workflows/haku-openclaw-spike-image.yml"
  push:
    branches: [devel]
    paths:
      - "haku/openclaw_spike/**"
      - "openclaw/proxy-setup.mjs"
      - ".github/workflows/haku-openclaw-spike-image.yml"
  workflow_dispatch:

concurrency:
  group: haku-openclaw-spike-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-only:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: haku/openclaw_spike/Dockerfile
          push: false

  build-and-push:
    name: Build and Push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: git.allegedly.works/ducktape-ci/haku-openclaw-spike
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Login to Forgejo registry
        run: echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Build and push
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          REF="$IMAGE:${GITHUB_REF_NAME}-${TS}-${GITHUB_SHA:0:7}"
          docker build -f haku/openclaw_spike/Dockerfile -t "$REF" .
          docker push "$REF"
          echo "pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
