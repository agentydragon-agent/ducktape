# Build, test, and release kubespand static binary
#
# Runs on:
# - Every push to devel/main (tests always run, release only if changes detected)
# - PRs that touch kubespand files (tests only)
# - Manual workflow_dispatch
name: kubespand CI

on:
  push:
    branches: [devel, main]
  pull_request:
    paths:
      - "cluster/kubespand/**"
      - ".github/workflows/kubespand-release.yml"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if no changes detected"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-release:
    name: Check if release needed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Check if release needed
        id: check
        uses: ./.github/actions/check-release-needed
        with:
          package_prefix: kubespand
          bazel_target: //cluster/kubespand:kubespand
          latest_release_tag: kubespand-latest

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run tests
        run: |
          bazel test --keep_going \
            --test_output=all \
            --nocache_test_results \
            --test_env=CI=true \
            //cluster/kubespand/...

      - uses: ./.github/actions/collect-test-logs
        if: always()
        with:
          artifact-name: kubespand-test-logs

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always() && hashFiles('bazel-testlogs/**/test.xml') != ''
        with:
          name: kubespand Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

  release:
    name: Release
    needs: [check-release, test]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && needs.check-release.outputs.release_needed == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.force_release == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Build kubespand
        run: bazel build --remote_download_toplevel //cluster/kubespand:kubespand

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Prepare binary for release
        run: |
          mkdir -p dist
          cp bazel-bin/cluster/kubespand/kubespand_/kubespand dist/

      - name: Create commit-tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kubespand-${{ env.SHORT_SHA }}
          name: kubespand (${{ env.SHORT_SHA }})
          body: |
            kubespand — standalone KubeSpan daemon for non-Talos Linux.

            Static x86_64 binary. See `cluster/kubespand/README.md` for usage.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: dist/kubespand

      - uses: ./.github/actions/update-latest-release
        with:
          package_prefix: kubespand
          latest_tag: kubespand-latest
          title: "kubespand (latest)"
          body: |
            kubespand — standalone KubeSpan daemon for non-Talos Linux.

            Static x86_64 binary. See `cluster/kubespand/README.md` for usage.
          files: dist/kubespand

  update-flake:
    name: Update flake inputs
    needs: release
    if: needs.release.result == 'success'
    uses: ./.github/workflows/nix-flake-update.yml
    permissions:
      contents: write
