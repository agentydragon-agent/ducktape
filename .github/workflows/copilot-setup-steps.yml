name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
#
# This workflow mirrors the setup performed by Claude Code hooks (tools/claude_hooks/session_start.py)
# but adapted for GitHub Actions environment:
#   - BuildBuddy remote cache + RBE (via setup-bazel action, using tools/setup-buildbuddy.sh)
#   - Bazel toolchain auto-detection (enabled in bazel-repo-cache action)
#   - Pre-commit hooks (installed directly in this workflow)
#   - Props environment variables (specific to GitHub Actions networking)
#
# Key differences from Claude hooks:
#   - No auth proxy needed (GitHub Actions has direct internet access)
#   - No Podman setup (uses Docker directly)
#   - Props uses 'props-agents' Docker network instead of 'host' network
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Clone the repository to set up the environment
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Bazel
        # Configures Bazel with BuildBuddy remote cache and RBE if BUILDBUDDY_API_KEY is available.
        # This uses the same setup-buildbuddy.sh script as Claude Code hooks.
        # The script writes to ~/.config/bazel/buildbuddy.bazelrc and adds a try-import to ~/.bazelrc.
        uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install pre-commit
        run: |
          pip install --user pre-commit==4.0.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pre-commit git hooks
        run: |
          pre-commit install
          pre-commit install --hook-type commit-msg

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
        continue-on-error: true

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0
        continue-on-error: true

      - name: Verify environment
        run: |
          echo "=== Environment Setup Complete ==="
          echo "Python version: $(python --version)"
          echo "Bazel version: $(bazel version | head -1)"
          echo "Pre-commit version: $(pre-commit --version)"
          which tofu && echo "OpenTofu version: $(tofu --version | head -1)" || echo "OpenTofu: not installed"
          which tflint && echo "tflint version: $(tflint --version)" || echo "tflint: not installed"

          # Verify BuildBuddy remote cache configuration
          if [[ -f ~/.config/bazel/buildbuddy.bazelrc ]]; then
            echo "BuildBuddy: configured (remote cache + RBE enabled)"
            grep -q "remote_executor" ~/.config/bazel/buildbuddy.bazelrc && echo "  - Remote execution: enabled"
            grep -q "remote_cache" ~/.config/bazel/buildbuddy.bazelrc && echo "  - Remote cache: enabled"
          else
            echo "BuildBuddy: not configured (BUILDBUDDY_API_KEY not available)"
          fi

          # Verify Bazel toolchain auto-detection
          if grep -q "BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0" ~/.bazelrc 2>/dev/null; then
            echo "Bazel toolchain: auto-detection enabled"
          else
            echo "Bazel toolchain: using default configuration"
          fi

      - name: Set up Props environment variables
        run: |
          # Props E2E test environment variables
          # These mirror the setup used by Claude code hooks
          # (tools/claude_hooks/bazelisk_setup.py)
          # but simplified for GitHub Actions (no HTTP proxy needed, using
          # docker networking)

          PROPS_ROOT="${{ github.workspace }}/props/testing/fixtures/testdata/specimens"
          echo "ADGN_PROPS_SPECIMENS_ROOT=$PROPS_ROOT" >> $GITHUB_ENV

          # PostgreSQL connection (for props database operations)
          echo "PGHOST=127.0.0.1" >> $GITHUB_ENV
          echo "PGPORT=5433" >> $GITHUB_ENV
          echo "PGUSER=postgres" >> $GITHUB_ENV
          echo "PGDATABASE=eval_results" >> $GITHUB_ENV

          # Agent containers connect to host PostgreSQL
          echo "AGENT_PGHOST=127.0.0.1" >> $GITHUB_ENV

          # Props registry proxy configuration
          echo "PROPS_REGISTRY_PROXY_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "PROPS_REGISTRY_PROXY_PORT=5051" >> $GITHUB_ENV

          # Docker network for agent containers
          # Claude hooks uses "host" network, GitHub Actions uses "props-agents" network
          echo "PROPS_DOCKER_NETWORK=props-agents" >> $GITHUB_ENV

          # Host network address for agent containers to reach host services
          echo "PROPS_E2E_HOST_HOSTNAME=172.17.0.1" >> $GITHUB_ENV

          echo "Props environment variables configured"
