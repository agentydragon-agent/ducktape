# Main CI pipeline — dependency chain for Bazel builds, releases, and image pushes.
#
# Container images (rbe-worker, freecad-test) are built by container-images.yml
# independently. CI uses the pinned image from image_pins.json.
#
# Independent workflows (pre-commit, ansible-lint, nix-attic-push, openclaw-image,
# container-images) have their own triggers and run separately.
name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  bazel-ci:
    # GitHub never exposes repository secrets to pull_request workflows from
    # forks. Those revisions use trusted-fork-pr-ci.yml, which automatically
    # trusts the dedicated agent fork and requires environment review for any
    # other fork while preserving this check context.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/bazel-ci.yml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  release:
    needs: [bazel-ci]
    if: always() && !cancelled() && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    secrets: inherit

  push-images:
    needs: [bazel-ci]
    if: always() && !cancelled() && github.event_name == 'push'
    uses: ./.github/workflows/push-images.yml
    secrets: inherit
