# Main CI pipeline — dependency chain for Bazel builds, releases, and image pushes.
#
# Independent workflows (pre-commit, ansible-lint, nix-attic-push, openclaw-image)
# have their own triggers and run separately.
name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rbe_image: ${{ steps.filter.outputs.rbe_image }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rbe_image:
              - 'devinfra/rbe_image/**'
              - '.github/workflows/rbe-image.yml'

  rbe-image:
    needs: [changes]
    if: needs.changes.outputs.rbe_image == 'true'
    uses: ./.github/workflows/rbe-image.yml
    secrets: inherit

  bazel-ci:
    needs: [rbe-image]
    if: always() && !cancelled() && !failure()
    uses: ./.github/workflows/bazel-ci.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit

  release:
    needs: [bazel-ci, rbe-image]
    if: always() && !cancelled() && !failure() && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit

  push-images:
    needs: [bazel-ci, rbe-image]
    if: always() && !cancelled() && !failure() && github.event_name == 'push'
    uses: ./.github/workflows/push-images.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit

  props-images:
    needs: [bazel-ci, rbe-image]
    if: always() && !cancelled() && !failure() && github.event_name == 'push'
    uses: ./.github/workflows/props-images.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit
