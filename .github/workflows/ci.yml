# Main CI pipeline — dependency chain for Bazel builds, releases, and image pushes.
#
# Independent workflows (pre-commit, ansible-lint, nix-attic-push, openclaw-image)
# have their own triggers and run separately.
name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  container-images:
    uses: ./.github/workflows/container-images.yml
    secrets: inherit

  bazel-ci:
    needs: [container-images]
    if: always() && !cancelled() && !failure()
    uses: ./.github/workflows/bazel-ci.yml
    with:
      rbe_image: ${{ needs.container-images.outputs.rbe_image }}
    secrets: inherit

  release:
    needs: [bazel-ci, container-images]
    if: always() && !cancelled() && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    with:
      rbe_image: ${{ needs.container-images.outputs.rbe_image }}
    secrets: inherit

  push-images:
    needs: [bazel-ci, container-images]
    if: always() && !cancelled() && github.event_name == 'push'
    uses: ./.github/workflows/push-images.yml
    with:
      rbe_image: ${{ needs.container-images.outputs.rbe_image }}
    secrets: inherit

  props-images:
    needs: [bazel-ci, container-images]
    if: always() && !cancelled() && !failure() && github.event_name == 'push'
    uses: ./.github/workflows/props-images.yml
    with:
      rbe_image: ${{ needs.container-images.outputs.rbe_image }}
    secrets: inherit
