# CI workflow with consolidated Bazel aspect-based linting
#
# Jobs:
# - pre-commit: Safety checks + Bazel aspects (lint, typecheck, format)
# - bazel-build: Comprehensive linting (Python, JS/TS, Rust) + build + test
# - props-frontend-build: Frontend-specific build + svelte-check
# - visual-regression: Puppeteer visual tests
# - ansible-lint-full: Ansible validation
#
# Linting via Bazel aspects (run in both pre-commit and bazel-build):
# - Python: ruff (lint), mypy (types), ruff format (formatting)
# - JS/TS: ESLint (lint), prettier (formatting)
# - Rust: clippy (lint), rustfmt (formatting)
# - Shell: shfmt (formatting)
# - Bazel: buildifier (formatting)
name: CI

on:
  push:
  pull_request:

# Cancel outdated workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions
permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache Ansible Galaxy downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.ansible
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-${{ runner.os }}-

      - name: Bootstrap Ansible Galaxy dependencies
        run: |
          pip install "ansible-core>=2.18"
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install and run pre-commit
        run: |
          # Version synced with flake.nix (nixpkgs.pre-commit)
          # Update both when bumping pre-commit version
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  ansible-lint-full:
    name: Ansible-lint (full, all playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for change detection

      - name: Check if ansible files changed
        id: ansible-changes
        run: |
          # Check if ansible/ directory changed using git diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            diff_range="HEAD~1 HEAD"
          fi

          # Check for changes in ansible/ directory
          if git diff --name-only $diff_range 2>/dev/null | grep -q '^ansible/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${PIPESTATUS[0]}" -ne 0 ]; then
            # git diff failed (e.g., first commit) - run ansible-lint
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Ansible Galaxy
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-full-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-full-${{ runner.os }}-

      - name: Install ansible and ansible-lint
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          pip install "ansible-core>=2.18" ansible-lint

      - name: Install Ansible Galaxy dependencies
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Run ansible-lint (thorough mode)
        if: steps.ansible-changes.outputs.changed == 'true'
        run: .github/scripts/run-ansible-lint.sh

      - name: Generate ansible-lint summary
        if: always() && steps.ansible-changes.outputs.changed == 'true'
        run: |
          echo "### Ansible-lint Results (Full Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Full validation with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Flags**: No NODEPS, no --offline (complete checking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All playbooks passed ansible-lint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Ansible-lint found issues" >> $GITHUB_STEP_SUMMARY
          fi

  props-frontend-build:
    name: Props frontend build (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-nix-direnv

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          # Unified cache key includes all dependency files
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt', 'props/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build and test frontend
        run: |
          bazel build //props/frontend:bundle
          # Type checking: svelte-check
          bazel test //props/frontend:svelte_check_test
          # Note: ESLint and Prettier are now run via aspects in bazel-build job

      - name: Generate build summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Frontend build and type checking successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend build or type checking failed" >> $GITHUB_STEP_SUMMARY
          fi

  visual-regression:
    name: Visual regression tests (Bazel + Puppeteer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-nix-direnv

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt', 'props/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run visual regression tests
        run: bazel test //props/frontend:visual_test --test_output=errors

      - name: Generate test summary
        if: always()
        run: |
          echo "### Visual Regression Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All visual tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Visual regression tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  bazel-build:
    name: Bazel build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL service for tests that need it
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Free up disk space
        run: |
          # Remove unnecessary software to free ~15GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-nix-direnv

      - name: Install system dependencies for native Python packages
        run: |
          sudo apt-get update
          # libdbus-1-dev: required for dbus-python
          # libgirepository-2.0-dev: required for PyGObject (girepository-2.0 API)
          # libcairo2-dev: required for pycairo (PyGObject dependency)
          sudo apt-get install -y libdbus-1-dev libgirepository-2.0-dev libcairo2-dev

      - name: Install gitstatusd for wt tests
        run: |
          wget -qO- \
            https://github.com/romkatv/gitstatus/releases/download/v1.5.4/gitstatusd-linux-x86_64.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/gitstatusd-linux-x86_64 /usr/local/bin/gitstatusd

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          # Unified cache key includes all dependency files
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt', 'props/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build, lint, and test
        run: |
          # Limit resource usage to reduce disk space consumption
          # --jobs=2: Limit parallel builds to reduce peak memory/disk usage
          # --repository_cache: Cap external repository cache at 2GB
          export BAZEL_OPTS="--jobs=2 --experimental_repository_cache_hardlinks"

          bazel build //... $BAZEL_OPTS
          # Comprehensive linting via aspects:
          # - Python: ruff (lint) + mypy (types)
          # - JS/TS: ESLint (lint)
          # - Rust: clippy (lint) + rustfmt (format check)
          bazel build --config=check //... $BAZEL_OPTS        # Python: ruff + mypy
          bazel build --config=lint //... $BAZEL_OPTS         # Python + JS/TS: ruff + ESLint
          bazel build --config=rust-check //... $BAZEL_OPTS   # Rust: clippy + rustfmt
          bazel test //... --test_output=errors $BAZEL_OPTS

      - name: Generate test summary
        if: always()
        run: |
          echo "### Bazel Build & Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All targets built, linted, and tested" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Checks run**:" >> $GITHUB_STEP_SUMMARY
            echo "- Python: ruff (lint), mypy (types)" >> $GITHUB_STEP_SUMMARY
            echo "- JS/TS: ESLint (lint)" >> $GITHUB_STEP_SUMMARY
            echo "- Rust: clippy (lint), rustfmt (format)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build, lint, or tests failed" >> $GITHUB_STEP_SUMMARY
          fi
