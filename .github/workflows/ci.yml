# This workflow is compatible with both GitHub Actions and Gitea Actions
# It runs pre-commit hooks and pytest for all Python projects with pyproject.toml
name: CI

on:
  push:
  pull_request:

# Cancel outdated workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions
permissions:
  contents: read

jobs:
  discover:
    name: Discover Python projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find-projects.outputs.projects }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find projects with pyproject.toml
        id: find-projects
        run: |
          projects=$(find . -name 'pyproject.toml' -not -path '*/\.*' | \
            sed 's|^\./||' | \
            sed 's|/pyproject.toml$||' | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> $GITHUB_OUTPUT
          echo "Found projects: $projects"

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache Ansible Galaxy downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.ansible
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-${{ runner.os }}-

      - name: Bootstrap Ansible Galaxy dependencies
        run: |
          pip install "ansible-core>=2.18"
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install and run pre-commit
        run: |
          # Version synced with flake.nix (nixpkgs.pre-commit)
          # Update both when bumping pre-commit version
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  ansible-lint-full:
    name: Ansible-lint (full, all playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Check if ansible files changed
        id: ansible-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: check if ansible/ changed vs base branch
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^ansible/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            # Push: check if ansible/ changed in this commit
            if git diff --name-only HEAD~1 HEAD | grep -q '^ansible/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              # On main branch or first commit, always run
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Python
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Ansible Galaxy
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-full-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-full-${{ runner.os }}-

      - name: Install ansible and ansible-lint
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          pip install "ansible-core>=2.18" ansible-lint

      - name: Install Ansible Galaxy dependencies
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Run ansible-lint (thorough mode)
        if: steps.ansible-changes.outputs.changed == 'true'
        working-directory: ansible
        run: |
          # Full thorough check - no NODEPS, no --offline
          # This validates module parameters, dependencies, etc.
          export ANSIBLE_LINT_SKIP_VAULT=1

          # List all playbooks to lint
          playbooks=$(find . -maxdepth 1 -name "*.yaml" -type f ! -name "galaxy.yaml")

          echo "Running full ansible-lint on playbooks:"
          echo "$playbooks"
          echo ""

          # Run on all playbooks
          ansible-lint --config-file ../.ansible-lint.yaml $playbooks

      - name: Generate ansible-lint summary
        if: always() && steps.ansible-changes.outputs.changed == 'true'
        run: |
          echo "### Ansible-lint Results (Full Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Full validation with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Flags**: No NODEPS, no --offline (complete checking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All playbooks passed ansible-lint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Ansible-lint found issues" >> $GITHUB_STEP_SUMMARY
          fi

  pytest:
    name: Pytest (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    # PostgreSQL service for gatelet tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gatelet
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: >-
            ${{ runner.os }}-pip-uv-${{ matrix.project }}-${{
            hashFiles(format('{0}/pyproject.toml', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-pip-uv-${{ matrix.project }}-
            ${{ runner.os }}-pip-uv-

      - name: Install gitstatusd for wt tests
        if: matrix.project == 'wt'
        run: |
          wget -qO- https://github.com/romkatv/gitstatus/archive/refs/heads/master.tar.gz | tar xz -C /tmp
          sudo install -m 755 /tmp/gitstatus-master/usrbin/gitstatusd-linux-x86_64 /usr/local/bin/gitstatusd
          which gitstatusd

      - name: Install dependencies and run tests
        id: pytest
        working-directory: ${{ matrix.project }}
        run: |
          # UV version synced with flake.nix / .envrc
          pip install uv==0.5.11

          # Check if project needs dbus-python system dependencies
          if grep -q "dbus-python" pyproject.toml 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev libgirepository1.0-dev
          fi

          # Install project dependencies
          uv pip install --system -e ".[dev]" || uv pip install --system -e .

          # Install Playwright browsers if playwright is installed
          if uv pip show playwright >/dev/null 2>&1; then
            playwright install --with-deps chromium
          fi

          # Run tests if pytest is available
          if uv pip show pytest >/dev/null 2>&1; then
            pytest -v
          else
            echo "pytest not installed in this project, skipping tests"
          fi

      - name: Generate test summary
        if: always()
        run: |
          echo "### Test Results: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or skipped" >> $GITHUB_STEP_SUMMARY
          fi
