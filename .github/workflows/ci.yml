# This workflow is compatible with both GitHub Actions and Gitea Actions
# It runs pre-commit hooks and pytest for all Python projects with pyproject.toml
name: CI

on:
  push:
  pull_request:

# Cancel outdated workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions
permissions:
  contents: read

jobs:
  discover:
    name: Discover Python projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find-projects.outputs.projects }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find projects with pyproject.toml
        id: find-projects
        run: |
          projects=$(find . -name 'pyproject.toml' -not -path '*/\.*' -not -path './pyproject.toml' | \
            sed 's|^\./||' | \
            sed 's|/pyproject.toml$||' | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> $GITHUB_OUTPUT
          echo "Found projects: $projects"

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache Ansible Galaxy downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.ansible
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-${{ runner.os }}-

      - name: Bootstrap Ansible Galaxy dependencies
        run: |
          pip install "ansible-core>=2.18"
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install and run pre-commit
        run: |
          # Version synced with flake.nix (nixpkgs.pre-commit)
          # Update both when bumping pre-commit version
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  ansible-lint-full:
    name: Ansible-lint (full, all playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for change detection

      - name: Check if ansible files changed
        id: ansible-changes
        run: |
          result=$(.github/scripts/check-ansible-changes.sh "${{ github.event_name }}" "${{ github.base_ref }}")
          echo "$result" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Ansible Galaxy
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-full-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-full-${{ runner.os }}-

      - name: Install ansible and ansible-lint
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          pip install "ansible-core>=2.18" ansible-lint

      - name: Install Ansible Galaxy dependencies
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Run ansible-lint (thorough mode)
        if: steps.ansible-changes.outputs.changed == 'true'
        run: .github/scripts/run-ansible-lint.sh

      - name: Generate ansible-lint summary
        if: always() && steps.ansible-changes.outputs.changed == 'true'
        run: |
          echo "### Ansible-lint Results (Full Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Full validation with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Flags**: No NODEPS, no --offline (complete checking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All playbooks passed ansible-lint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Ansible-lint found issues" >> $GITHUB_STEP_SUMMARY
          fi

  props-frontend-build:
    name: Props frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('props/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: props/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: props/frontend
        run: pnpm build

      - name: Check TypeScript types
        working-directory: props/frontend
        run: pnpm check

      - name: Generate build summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Frontend build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend build failed" >> $GITHUB_STEP_SUMMARY
          fi

  pytest:
    name: Pytest (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    # PostgreSQL service for gatelet and props/core tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # PostgreSQL connection settings for props/core tests
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: >-
            ${{ runner.os }}-pip-uv-${{ matrix.project }}-${{
            hashFiles(format('{0}/pyproject.toml', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-pip-uv-${{ matrix.project }}-
            ${{ runner.os }}-pip-uv-

      - name: Install gitstatusd for wt tests
        if: matrix.project == 'wt'
        run: |
          wget -qO- \
            https://github.com/romkatv/gitstatus/releases/download/v1.5.4/gitstatusd-linux-x86_64.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/gitstatusd-linux-x86_64 /usr/local/bin/gitstatusd
          which gitstatusd

      - name: Install dependencies and run tests
        id: pytest
        run: .github/scripts/run-pytest.sh "${{ matrix.project }}"

      - name: Generate test summary
        if: always()
        run: |
          echo "### Test Results: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or skipped" >> $GITHUB_STEP_SUMMARY
          fi
