# This workflow runs Bazel build/lint/test, pre-commit (for non-Bazel linters), and other checks
# Bazel handles: Python (ruff, mypy), buildifier
# Pre-commit handles: yamllint, ansible-syntax-check, alejandra (nix), eslint/prettier (JS/TS)
name: CI

on:
  push:
  pull_request:

# Cancel outdated workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions
permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Cache Ansible Galaxy downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.ansible
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-${{ runner.os }}-

      - name: Bootstrap Ansible Galaxy dependencies
        run: |
          pip install "ansible-core>=2.18"
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install and run pre-commit
        run: |
          # Version synced with flake.nix (nixpkgs.pre-commit)
          # Update both when bumping pre-commit version
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  ansible-lint-full:
    name: Ansible-lint (full, all playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Check if ansible files changed
        id: ansible-changes
        run: |
          result=$(.github/scripts/check-ansible-changes.sh "${{ github.event_name }}" "${{ github.base_ref }}")
          echo "$result" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Ansible Galaxy
        if: steps.ansible-changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-full-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: |
            ansible-galaxy-full-${{ runner.os }}-

      - name: Install ansible and ansible-lint
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          pip install "ansible-core>=2.18" ansible-lint

      - name: Install Ansible Galaxy dependencies
        if: steps.ansible-changes.outputs.changed == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
          ansible-galaxy collection install -r requirements.yaml

      - name: Run ansible-lint (thorough mode)
        if: steps.ansible-changes.outputs.changed == 'true'
        run: .github/scripts/run-ansible-lint.sh

      - name: Generate ansible-lint summary
        if: always() && steps.ansible-changes.outputs.changed == 'true'
        run: |
          echo "### Ansible-lint Results (Full Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Full validation with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Flags**: No NODEPS, no --offline (complete checking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All playbooks passed ansible-lint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Ansible-lint found issues" >> $GITHUB_STEP_SUMMARY
          fi

  props-frontend-build:
    name: Props frontend build (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-frontend-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'props/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            bazel-frontend-${{ runner.os }}-

      - name: Build frontend bundle
        run: bazel build //props/frontend:bundle

      - name: Check TypeScript types (svelte-check)
        run: bazel test //props/frontend:svelte_check_test

      - name: Check formatting (prettier)
        run: bazel test //props/frontend:prettier_test

      - name: Generate build summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Frontend build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend build failed" >> $GITHUB_STEP_SUMMARY
          fi

  bazel-build:
    name: Bazel build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL service for tests that need it
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install system dependencies for native Python packages
        run: |
          sudo apt-get update
          # libdbus-1-dev: required for dbus-python
          # libgirepository-2.0-dev: required for PyGObject (girepository-2.0 API)
          # libcairo2-dev: required for pycairo (PyGObject dependency)
          sudo apt-get install -y libdbus-1-dev libgirepository-2.0-dev libcairo2-dev

      - name: Install gitstatusd for wt tests
        run: |
          wget -qO- \
            https://github.com/romkatv/gitstatus/releases/download/v1.5.4/gitstatusd-linux-x86_64.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/gitstatusd-linux-x86_64 /usr/local/bin/gitstatusd

      - name: Cache Bazel repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build all targets
        run: bazel build //...

      - name: Lint (ruff)
        run: bazel lint //...

      - name: Run tests
        run: bazel test //... --test_output=errors

      - name: Generate test summary
        if: always()
        run: |
          echo "### Bazel Build & Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All targets built and tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build or tests failed" >> $GITHUB_STEP_SUMMARY
          fi
