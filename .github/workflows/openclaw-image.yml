# Build and push the custom OpenClaw+matrix container image to GHCR.
#
# Derives from upstream ghcr.io/openclaw/openclaw with the matrix channel
# plugin and its native crypto binary pre-installed.
#
# Triggers:
#   - workflow_dispatch: manual trigger (tags :latest too)
#   - workflow_call (from ci.yml): tags :<sha> + :<timestamp>-<sha7>
name: OpenClaw Image

on:
  push:
    branches: [main, devel]
    paths:
      - "openclaw/**"
      - "airlock/openclaw/**"
      - ".github/workflows/openclaw-image.yml"
  workflow_dispatch:

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build airlock plugin tar
        run: bazel build //airlock/openclaw:plugin_tar

      - name: Stage plugin tar for Docker
        run: cp bazel-bin/airlock/openclaw/plugin_tar.tar openclaw/airlock-plugin.tar

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/openclaw-matrix
          context: .
          file: openclaw/Dockerfile
          cache_from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw-matrix:buildcache
          cache_to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw-matrix:buildcache,mode=max
