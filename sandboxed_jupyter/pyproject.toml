[project]
name = "sandboxed-jupyter"
version = "0.1.0"
description = "Sandboxed Jupyter execution with seatbelt and Docker modes"
requires-python = ">=3.13"
dependencies = [
    "net-util",          # for pick_free_port, wait_for_port
    "mcp-infra",         # seatbelt policy compilation
    "pydantic>=2.0",
    "PyYAML",
    "ipykernel>=6",
    "jupyter-mcp-server>=0.11.0",
    "jupyter-server",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.0",
]

[project.scripts]
sandbox-jupyter = "sandboxed_jupyter.wrapper:main"
sandboxed-jupyter = "sandboxed_jupyter.sandboxer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxed_jupyter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
