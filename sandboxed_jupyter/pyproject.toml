[project]
name = "sandboxed-jupyter"
version = "0.1.0"
description = "Sandboxed Jupyter execution with seatbelt and Docker modes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.0",
    "PyYAML",
    "ipykernel>=6",
    "jupyter-mcp-server>=0.11.0",
    "jupyter-server",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
